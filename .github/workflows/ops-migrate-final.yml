name: 'ops: migrar restantes - passo 2 (copiar ficheiros e emails)'

on:
  workflow_dispatch: {}

jobs:
  copiar-restaurar:
    runs-on: ubuntu-latest
    steps:
      - name: Preparar chaves SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hetzner_key
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/contabo_key
          chmod 600 ~/.ssh/hetzner_key ~/.ssh/contabo_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Extrair do Hetzner e copiar para o Contabo
        run: |
          ssh -i ~/.ssh/hetzner_key -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
            "tar czf - -C /home/oshercollective/domains/elimservicos.com public_html" > /tmp/elim_site.tar.gz
          ssh -i ~/.ssh/hetzner_key -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
            "tar czf - -C /home/oshercollective/domains/shalomdeco.com public_html" > /tmp/shalom_site.tar.gz
          ssh -i ~/.ssh/hetzner_key -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
            "tar czf - -C /home/oshercollective/imap elimservicos.com" > /tmp/elim_mail.tar.gz
          ls -la /tmp/elim_site.tar.gz /tmp/shalom_site.tar.gz /tmp/elim_mail.tar.gz
          scp -i ~/.ssh/contabo_key /tmp/elim_site.tar.gz /tmp/shalom_site.tar.gz /tmp/elim_mail.tar.gz root@${{ secrets.CONTABO_HOST }}:/tmp/

      - name: Restaurar no Hestia
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          script: |
            # Sites (placeholders)
            rm -rf /home/oshercollective/web/elimservicos.com/public_html
            mkdir -p /home/oshercollective/web/elimservicos.com
            tar xzf /tmp/elim_site.tar.gz -C /home/oshercollective/web/elimservicos.com
            chown -R oshercollective:oshercollective /home/oshercollective/web/elimservicos.com

            rm -rf /home/oshercollective/web/shalomdeco.com/public_html
            mkdir -p /home/oshercollective/web/shalomdeco.com
            tar xzf /tmp/shalom_site.tar.gz -C /home/oshercollective/web/shalomdeco.com
            chown -R oshercollective:oshercollective /home/oshercollective/web/shalomdeco.com

            # Emails de elimservicos.com
            rm -rf /tmp/mailrestore
            mkdir -p /tmp/mailrestore
            tar xzf /tmp/elim_mail.tar.gz -C /tmp/mailrestore
            for boxdir in /tmp/mailrestore/elimservicos.com/*/; do
              box=$(basename "$boxdir")
              dest="/home/oshercollective/mail/elimservicos.com/$box"
              if [ -d "${boxdir}Maildir" ] && [ -d "$dest" ]; then
                cp -a "${boxdir}Maildir/." "$dest/"
                chown -R oshercollective:mail "$dest"
                echo "copiado: $box@elimservicos.com"
              else
                echo "IGNORADO: $box@elimservicos.com"
              fi
            done

            rm -rf /tmp/mailrestore /tmp/elim_site.tar.gz /tmp/shalom_site.tar.gz /tmp/elim_mail.tar.gz
            echo "----- confirmação -----"
            du -sh /home/oshercollective/mail/elimservicos.com/admin 2>/dev/null
