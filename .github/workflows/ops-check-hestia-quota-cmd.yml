name: 'ops: verificar comando de quota de email no Hestia (so-leitura)'

on:
  workflow_dispatch: {}

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          script: |
            ls /usr/local/hestia/bin/ | grep -i "mail-account\|mail-domain"
            echo "----- help do comando quota se existir -----"
            /usr/local/hestia/bin/v-change-mail-account-quota 2>&1 | head -5
