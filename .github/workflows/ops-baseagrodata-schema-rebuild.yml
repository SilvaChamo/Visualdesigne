name: Ops — reconstruir schema do baseagrodata.com (Supabase apagado)

# Execução manual só. O projecto Supabase Cloud original do baseagrodata.com
# foi apagado (DNS já nem resolve); os dados reais perderam-se, mas a
# estrutura foi reconstruída a partir do código (scripts/baseagrodata-schema-rebuild.sql)
# — ver auditoria de 2026-08-09. Este site passa a usar o Supabase self-hosted
# do painel VisualDesign, num schema Postgres dedicado ("baseagrodata"), para
# nunca se misturar com as tabelas do painel (colisões reais confirmadas:
# profiles, notifications, email_campaigns, newsletter_subscribers).
#
# Dois jobs:
# 1) expor-schema-postgrest: adiciona "baseagrodata" à lista de schemas que o
#    PostgREST serve — implica reiniciar o serviço "rest" do Supabase
#    partilhado com o painel (poucos segundos de interrupção, autorizado
#    pelo utilizador em 2026-08-09).
# 2) aplicar-schema-sql: cria o schema, todas as tabelas, RLS e dados iniciais.
on:
  workflow_dispatch:

jobs:
  expor-schema-postgrest:
    name: Adicionar "baseagrodata" ao PostgREST e reiniciar o serviço
    runs-on: ubuntu-latest
    steps:
      - name: Editar .env e recriar o serviço rest
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            ENV_FILE="/opt/supabase-aamihe/docker/.env"
            cp "$ENV_FILE" "${ENV_FILE}.bak-baseagrodata-$(date +%s)"

            if grep -q "^PGRST_DB_SCHEMAS=.*baseagrodata" "$ENV_FILE"; then
              echo "baseagrodata já estava exposto, não mexi."
            else
              sed -i 's/^PGRST_DB_SCHEMAS=.*/&,baseagrodata/' "$ENV_FILE"
              echo "Adicionado. Nova linha:"
              grep '^PGRST_DB_SCHEMAS=' "$ENV_FILE"
            fi

            cd /opt/supabase-aamihe/docker
            docker compose up -d rest

            sleep 5
            echo "--- Confirmar que o painel continua a responder ---"
            curl -sk -o /dev/null -w "supabase.visualdesignmoz.com (auth health) -> HTTP %{http_code}\n" https://supabase.visualdesignmoz.com/auth/v1/health
            curl -sk -o /dev/null -w "visualdesignmoz.com -> HTTP %{http_code}\n" https://visualdesignmoz.com

  aplicar-schema-sql:
    name: Criar schema, tabelas, RLS e dados iniciais
    runs-on: ubuntu-latest
    needs: expor-schema-postgrest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copiar o ficheiro SQL para o servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          source: "scripts/baseagrodata-schema-rebuild.sql"
          target: "/root/"
          strip_components: 1

      - name: Aplicar a migração via psql
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            CONTAINER=$(docker ps --format '{{.Names}}' | grep -iE 'supabase.*db|supabase-db|postgres' | head -n1)
            if [ -z "$CONTAINER" ]; then
              echo "Não encontrei nenhum container de Postgres/Supabase a correr:" >&2
              docker ps --format '{{.Names}}'
              exit 1
            fi
            DB_USER=$(docker exec "$CONTAINER" printenv POSTGRES_USER 2>/dev/null || echo postgres)
            DB_NAME=$(docker exec "$CONTAINER" printenv POSTGRES_DB 2>/dev/null || echo postgres)

            cat /root/baseagrodata-schema-rebuild.sql | docker exec -i "$CONTAINER" psql -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1

            echo "--- Confirmação: tabelas criadas no schema baseagrodata ---"
            docker exec "$CONTAINER" psql -U "$DB_USER" -d "$DB_NAME" -t -c \
              "select count(*) from pg_tables where schemaname = 'baseagrodata';"
            docker exec "$CONTAINER" psql -U "$DB_USER" -d "$DB_NAME" -t -c \
              "select tablename from pg_tables where schemaname = 'baseagrodata' order by tablename;"

            rm -f /root/baseagrodata-schema-rebuild.sql

            echo "--- Reload do cache de schema do PostgREST ---"
            docker exec "$CONTAINER" psql -U "$DB_USER" -d "$DB_NAME" -c "NOTIFY pgrst, 'reload schema';"
