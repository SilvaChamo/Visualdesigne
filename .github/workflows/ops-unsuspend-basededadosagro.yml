name: ops - unsuspend basededadosagro.com in DirectAdmin

on:
  workflow_dispatch: {}

jobs:
  unsuspend:
    runs-on: ubuntu-latest
    steps:
      - name: SSH unsuspend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            echo "=== before ==="
            grep -i "suspend\|active=" /usr/local/directadmin/data/users/admin/domains/basededadosagro.com.conf
            echo ""
            echo "=== running da unsuspend-domain ==="
            da unsuspend-domain --domain=basededadosagro.com 2>&1
            echo ""
            echo "=== after ==="
            grep -i "suspend\|active=" /usr/local/directadmin/data/users/admin/domains/basededadosagro.com.conf
