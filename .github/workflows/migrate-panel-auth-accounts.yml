name: Migração pontual — panel_auth_accounts.reseller_tier

# Corrige em produção o bug descrito em scripts/migrate-panel-auth-accounts.sql:
# a coluna reseller_tier nunca foi criada na tabela panel_auth_accounts, o que
# fazia upsertPanelAuthAccount() falhar sempre com "Could not find the
# 'reseller_tier' column ... in the schema cache" (visto ao aprovisionar
# hospedagem no checkout). Execução manual só — não corre em cada deploy.
on:
  workflow_dispatch:

jobs:
  migrate:
    name: Aplicar ALTER TABLE via SSH
    runs-on: ubuntu-latest
    steps:
      - name: Adicionar reseller_tier e recarregar o cache de schema do PostgREST
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            CONTAINER=$(docker ps --format '{{.Names}}' | grep -iE 'supabase.*db|supabase-db|postgres' | head -n1)
            if [ -z "$CONTAINER" ]; then
              echo "Não encontrei nenhum container de Postgres/Supabase a correr:" >&2
              docker ps --format '{{.Names}}'
              exit 1
            fi
            echo "A usar container: $CONTAINER"
            DB_USER=$(docker exec "$CONTAINER" printenv POSTGRES_USER 2>/dev/null || echo postgres)
            DB_NAME=$(docker exec "$CONTAINER" printenv POSTGRES_DB 2>/dev/null || echo postgres)
            echo "DB user=$DB_USER db=$DB_NAME"
            docker exec "$CONTAINER" psql -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 -c \
              "ALTER TABLE public.panel_auth_accounts ADD COLUMN IF NOT EXISTS reseller_tier TEXT;"
            docker exec "$CONTAINER" psql -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 -c \
              "NOTIFY pgrst, 'reload schema';"
            echo "--- Confirmação da coluna ---"
            docker exec "$CONTAINER" psql -U "$DB_USER" -d "$DB_NAME" -c "\d public.panel_auth_accounts" | grep reseller_tier
