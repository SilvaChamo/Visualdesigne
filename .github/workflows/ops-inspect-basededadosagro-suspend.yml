name: ops - inspect why basededadosagro.com stays alive after DA suspend (read-only)

on:
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: SSH inspect
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            echo "=== DA domain conf (admin/basededadosagro.com) ==="
            cat /usr/local/directadmin/data/users/admin/domains/basededadosagro.com.conf 2>&1
            echo ""
            echo "=== is it flagged suspended in DA? ==="
            grep -i "suspend" /usr/local/directadmin/data/users/admin/domains/basededadosagro.com.conf 2>&1
            echo ""
            echo "=== Apache vhost include for this domain ==="
            find /etc/httpd -iname "*basededadosagro*" 2>/dev/null
            find /usr/local/directadmin/data -iname "*basededadosagro*" 2>/dev/null
            echo ""
            echo "=== httpd vhost content (if found) ==="
            for f in $(find /etc/httpd -iname "*basededadosagro*" 2>/dev/null); do echo "--- $f ---"; cat "$f"; done
            echo ""
            echo "=== does the vhost proxy to PM2 3010? ==="
            grep -rl "3010" /etc/httpd/ 2>/dev/null
            echo ""
            echo "=== PM2 process status ==="
            su - admin -c "pm2 list" 2>&1 || pm2 list 2>&1 || echo "pm2 not runnable as this user"
            echo ""
            echo "=== live curl test (Host header, ignoring suspend) ==="
            curl -s -o /dev/null -w "HTTP %{http_code}\n" -H "Host: basededadosagro.com" https://127.0.0.1/ -k
            curl -s https://basededadosagro.com/ -o /tmp/bda.html -w "HTTP %{http_code}\n"
            head -c 500 /tmp/bda.html
            echo ""
            echo "=== is httpd config actually reloaded/in sync? ==="
            ls -la /etc/httpd/conf/extra/httpd-vhosts.conf 2>/dev/null
            systemctl status httpd --no-pager 2>&1 | head -10
