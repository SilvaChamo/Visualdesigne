name: "Ops - Fase 67. Porque o link wp-da-sso continua Forbidden apos o htaccess limpo"

on:
  workflow_dispatch:

jobs:
  hetzner:
    name: hetzner
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Investiga
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 3m
          script: |
            set +e
            ROOT=/home/admin/domains/aamihe.com/public_html

            echo "===== o ficheiro do token existe mesmo no disco? ====="
            ls -la "$ROOT"/wp-da-sso-*.php 2>&1

            echo ""
            echo "===== htaccess actual da raiz (deve estar limpo, sem FilesMatch) ====="
            cat "$ROOT/.htaccess" 2>&1

            echo ""
            echo "===== outros .htaccess algures no site que possam ter regras antigas ====="
            find "$ROOT" -maxdepth 2 -iname ".htaccess" -exec echo "--- {} ---" \; -exec cat {} \; 2>&1

            echo ""
            echo "===== log de erros mais recente para este pedido exacto ====="
            tail -n 50 /var/log/httpd/domains/aamihe.com.error.log 2>&1 | grep -i "sso\|forbidden\|denied" | tail -20

            echo ""
            echo "===== ha mod_security activo neste dominio? ====="
            grep -ril "aamihe" /etc/httpd/conf/extra/*.conf 2>/dev/null | xargs grep -il "modsecurity\|SecRule" 2>/dev/null
            find / -maxdepth 5 -iname "modsec*aamihe*" 2>/dev/null

            echo ""
            echo "===== o teu IP proprio esta banido pelo fail2ban? ====="
            fail2ban-client status 2>&1 | grep -i "jail list"
            for j in $(fail2ban-client status 2>&1 | grep "Jail list" | sed 's/.*://; s/,//g'); do
              echo "--- jail: $j ---"
              fail2ban-client status "$j" 2>&1 | grep -i "banned"
            done

            echo ""
            echo "===== teste directo curl como se fosse agora, com verbose minimo ====="
            curl -sS -o /dev/null -w "HTTP:%{http_code}\n" --max-time 10 "https://aamihe.com/wp-da-sso-k8ZRgIWc-Oz_YgM1nurVYJnatanPAGra.php" 2>&1
