name: "Ops - Fase 2e. Copia os ficheiros reais do storage (Hetzner so leitura)"

on:
  workflow_dispatch:

jobs:
  copy_files:
    name: rsync via runner (relay), Hetzner nunca escreve
    runs-on: ubuntu-latest
    steps:
      - name: Setup chaves SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hetzner_key
          chmod 600 ~/.ssh/hetzner_key
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/contabo_key
          chmod 600 ~/.ssh/contabo_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 1. Confirma caminho real e tamanho no Hetzner (so leitura)
        run: |
          ssh -i ~/.ssh/hetzner_key -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" '
            find /opt -maxdepth 3 -iname "storage" -type d 2>/dev/null
            echo "---"
            du -sh /opt/supabase-aamihe/docker/volumes/storage 2>&1 || echo "caminho nao existe, preciso de outro"
          '
