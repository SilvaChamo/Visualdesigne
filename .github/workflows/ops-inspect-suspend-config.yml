name: "Ops - Fase 21a. Verifica onde entrecamposblog.com deveria aparecer no painel (so leitura)"

on:
  workflow_dispatch:

jobs:
  contabo:
    name: contabo
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Verifica
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 5m
          script: |
            set +e
            SQL() { docker exec -i supabase-db psql -U postgres -d postgres -t -A -F' | ' -c "$1"; }

            echo "===== panel_sites: linha de entrecamposblog.com ====="
            SQL "select id, domain, owner, status, package, wp_installed, synced_at from panel_sites where domain ilike '%entrecampos%';"

            echo ""
            echo "===== panel_sites: todos os sites do owner vdadmin ====="
            SQL "select domain, owner, status from panel_sites where owner = 'vdadmin';"

            echo ""
            echo "===== domain_renewals: linha de entrecamposblog.com ====="
            SQL "select user_id, domain_name, status, dns_status from domain_renewals where domain_name = 'entrecamposblog.com';"

            echo ""
            echo "===== panel_auth_accounts: contas do user_id 78dac824 ====="
            SQL "select user_id, da_username, provider from panel_auth_accounts where user_id = '78dac824-ff02-4deb-bdea-b537eeacad99';"

            echo ""
            echo "===== panel_users: linha vdadmin ====="
            SQL "select username, hosting_provider from panel_users where username = 'vdadmin';"
