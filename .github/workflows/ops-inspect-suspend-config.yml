name: "Ops - Fase 14b. Compara Google OAuth: Hetzner (producao) vs Contabo (so leitura)"

on:
  workflow_dispatch:

jobs:
  verify:
    name: verifica gotrue google oauth no hetzner
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Verifica
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 2m
          script: |
            ENV_FILE=/opt/supabase-aamihe/docker/.env
            echo "===== ficheiro existe? ====="
            ls -la "$ENV_FILE" 2>&1 || find /opt -maxdepth 3 -iname ".env" 2>/dev/null

            echo ""
            echo "===== variaveis GOTRUE_EXTERNAL_GOOGLE_* (so nomes + tamanho, nunca valores) ====="
            if [ -f "$ENV_FILE" ]; then
              for k in GOTRUE_EXTERNAL_GOOGLE_ENABLED GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID GOTRUE_EXTERNAL_GOOGLE_SECRET GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI; do
                val=$(grep "^$k=" "$ENV_FILE" | cut -d'=' -f2-)
                if [ -z "$val" ]; then echo "$k = (vazio ou ausente)"; else echo "$k = (tem valor, ${#val} caracteres)"; fi
              done
            fi

            echo ""
            echo "===== outros providers externos activos no Hetzner (para comparar) ====="
            grep -E "^GOTRUE_EXTERNAL_[A-Z]+_ENABLED=true" "$ENV_FILE" 2>/dev/null || echo "nenhum"
