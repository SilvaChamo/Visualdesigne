name: "Ops - Fase 14d. Confirma saude pos-restart (so leitura)"

on:
  workflow_dispatch:

jobs:
  verify:
    name: confirma saude
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Verifica
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 2m
          script: |
            echo "===== processo: uptime e restarts ====="
            pm2 describe visualdesign-site-teste 2>&1 | grep -E "status|restarts|uptime"

            echo ""
            echo "===== erros desde o ultimo restart (manifest / 500 / invariant) ====="
            pm2 logs visualdesign-site-teste --lines 200 --nostream --err 2>&1 | grep -iE "client reference manifest|invariant|failed to load static" | tail -20 || echo "nenhum encontrado nas ultimas 200 linhas"

            echo ""
            echo "===== ultimas 15 linhas de erro (cru, para ver se ha algo novo) ====="
            pm2 logs visualdesign-site-teste --lines 15 --nostream --err 2>&1
