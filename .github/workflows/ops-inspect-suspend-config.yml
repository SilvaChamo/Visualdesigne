name: "Ops - Fase 86. Repoe as imagens/uploads a partir do backup de junho 2025"

on:
  workflow_dispatch:

jobs:
  hetzner:
    name: hetzner
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Repoe uploads
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 3m
          script: |
            set +e
            ROOT=/home/admin/domains/aamihe.com/public_html
            TMPDIR=/root/aamihe-restore/extract

            echo "===== descompacta para pasta temporaria primeiro (nao mexe em nada ainda) ====="
            mkdir -p "$TMPDIR"
            unzip -oq /root/aamihe-restore/uploads.zip -d "$TMPDIR" 2>&1
            echo "extraido, total de ficheiros:"
            find "$TMPDIR" -type f | wc -l

            echo ""
            echo "===== confirma se o logo esta la dentro ====="
            find "$TMPDIR" -iname "*logo*" 2>&1 | head -10

            echo ""
            echo "===== copia para dentro do site, sem apagar nada que ja exista (so acrescenta o que falta) ====="
            cp -rn "$TMPDIR/uploads/." "$ROOT/wp-content/uploads/" 2>&1
            chown -R admin:admin "$ROOT/wp-content/uploads"
            find "$ROOT/wp-content/uploads" -type d -exec chmod 755 {} \;
            find "$ROOT/wp-content/uploads" -type f -exec chmod 644 {} \;

            echo ""
            echo "===== confirma quantos ficheiros de imagem existem agora ====="
            find "$ROOT/wp-content/uploads" -type f \( -iname "*.jpg" -o -iname "*.png" -o -iname "*.webp" \) 2>/dev/null | wc -l

            echo ""
            echo "===== testa o logo directamente ====="
            curl -sSI --max-time 10 "https://aamihe.com/wp-content/uploads/2021/09/Logo-Small.png" 2>&1 | head -3

            echo ""
            echo "===== limpa a pasta temporaria ====="
            rm -rf "$TMPDIR"
