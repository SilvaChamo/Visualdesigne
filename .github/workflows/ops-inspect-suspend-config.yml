name: Ops - Hestia (Contabo) - testa chamada real v-list-user-packages

on:
  workflow_dispatch:

jobs:
  test:
    name: Confirma se a API do Hestia responde bem a partir do proprio servidor
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Testa v-list-user-packages via API real do Hestia
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 2m
          script: |
            cd /opt/visualdesign-site-teste
            set -a
            source .env.local
            set +a
            HOST="${HESTIA_HOST}"
            PORT="${HESTIA_PORT:-8083}"
            USERN="${HESTIA_USER:-vdadmin}"
            echo "===== v-list-user-packages (json) via API ====="
            curl -sk -w "\nHTTP_STATUS:%{http_code}\n" -X POST "https://${HOST}:${PORT}/api/" \
              --data-urlencode "user=${USERN}" \
              --data-urlencode "password=${HESTIA_PASSWORD}" \
              --data-urlencode "cmd=v-list-user-packages" \
              --data-urlencode "arg1=json"
