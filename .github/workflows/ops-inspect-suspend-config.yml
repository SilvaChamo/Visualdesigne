name: "Ops - Fase 105. SO LEITURA - procura configuracao duplicada/antiga para estes dominios"

on:
  workflow_dispatch:

jobs:
  hetzner:
    name: hetzner
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Investiga
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 2m
          script: |
            set +e
            echo "===== o vhost 'default server' da porta 443, qual certificado usa? ====="
            sed -n '35,55p' /etc/httpd/conf/extra/httpd-vhosts.conf 2>&1

            echo ""
            echo "===== procura QUALQUER ficheiro de config que mencione oshercollective.com (fora da pasta normal da conta) ====="
            grep -rl "oshercollective.com\|msdn-moz.org\|lirandzojewelry.com" /etc/httpd/ 2>/dev/null
            grep -rl "oshercollective.com\|msdn-moz.org\|lirandzojewelry.com" /usr/local/directadmin/data/users/*/httpd.conf 2>/dev/null

            echo ""
            echo "===== confirma a ordem de inclusao dos ficheiros de vhost no httpd principal ====="
            grep -n "Include" /etc/httpd/conf/httpd.conf 2>&1 | head -20
            grep -n "Include" /etc/httpd/conf/extra/httpd-vhosts.conf 2>&1 | head -20

            echo ""
            echo "===== erro/aviso do apache relacionado com ssl na ultima recarga ====="
            tail -n 60 /var/log/httpd/error_log 2>&1 | grep -i "ssl\|oshercollective\|msdn\|lirandzo" | tail -20
