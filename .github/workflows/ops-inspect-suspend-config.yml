name: Ops - Hestia firewall - ver bloqueios e regras de acesso

on:
  workflow_dispatch:

jobs:
  check:
    name: Lista banidos e regras de firewall do Hestia
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Inspecciona firewall/bloqueios do Hestia
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 3m
          script: |
            echo "===== v-list-firewall-bans (json) ====="
            /usr/local/hestia/bin/v-list-firewall-bans json 2>&1 || echo "(comando nao existe ou vazio)"
            echo ""
            echo "===== v-list-firewall (regras gerais) ====="
            /usr/local/hestia/bin/v-list-firewall json 2>&1 || echo "(comando nao existe ou vazio)"
            echo ""
            echo "===== fail2ban status (porta 8083, API) ====="
            fail2ban-client status 2>&1 || echo "(fail2ban nao instalado/activo)"
            echo ""
            echo "===== log de autenticacao recente do hestia (ultimas 40 linhas) ====="
            tail -n 40 /var/log/hestia/auth.log 2>/dev/null || tail -n 40 /usr/local/hestia/log/auth.log 2>/dev/null || echo "(nao encontrado)"
