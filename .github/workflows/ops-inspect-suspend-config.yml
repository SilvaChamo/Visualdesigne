name: "Ops - Fase 13a. Estado real de entrecamposorg.com (so leitura)"

on:
  workflow_dispatch:

jobs:
  verify:
    name: consulta supabase contabo
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Consulta
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 2m
          script: |
            PG="docker exec -i supabase-db psql -U postgres -d postgres -t -A -F' | '"

            echo "===== domain_renewals: entrecamposorg.com ====="
            $PG -c "select id, user_id, domain_name, status, dns_status, registration_date, expiration_date, notes from domain_renewals where domain_name ilike '%entrecamposorg%';"

            echo ""
            echo "===== payment_proofs / pagamentos pendentes relacionados (se existir a tabela) ====="
            $PG -c "select table_name from information_schema.tables where table_schema='public' and table_name ilike '%payment%' or table_name ilike '%pagamento%' or table_name ilike '%comprovativo%';"

            echo ""
            echo "===== carrinho/checkout: procurar por 'entrecampos' em tabelas relevantes ====="
            $PG -c "select table_name from information_schema.tables where table_schema='public' and (table_name ilike '%cart%' or table_name ilike '%checkout%' or table_name ilike '%carrinho%' or table_name ilike '%pedido%' or table_name ilike '%order%');"
