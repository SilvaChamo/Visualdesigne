name: "Ops - Fase 56. O wp-content actual (plugins/temas/uploads) ainda esta intacto?"

on:
  workflow_dispatch:

jobs:
  hetzner:
    name: hetzner
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Verifica
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 3m
          script: |
            set +e
            ROOT=/home/admin/domains/aamihe.com/public_html
            echo "===== wp-content existe? o que tem la dentro ====="
            ls -la "$ROOT/wp-content/" 2>&1

            echo ""
            echo "===== uploads: tamanho total e ficheiro mais recente ====="
            du -sh "$ROOT/wp-content/uploads/" 2>&1
            find "$ROOT/wp-content/uploads/" -type f 2>/dev/null | sort | tail -5
            find "$ROOT/wp-content/uploads/" -type f -newermt "2026-01-01" 2>/dev/null | wc -l

            echo ""
            echo "===== plugins instalados agora ====="
            ls "$ROOT/wp-content/plugins/" 2>&1

            echo ""
            echo "===== tema activo (pasta themes) ====="
            ls "$ROOT/wp-content/themes/" 2>&1

            echo ""
            echo "===== confirma que nenhum ficheiro core do wordpress (wp-admin/wp-includes) sobrou ====="
            ls "$ROOT/" 2>&1
