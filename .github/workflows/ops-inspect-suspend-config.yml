name: "Ops - Fase 18b. Investiga backup + conta hestia entrecampos (so leitura)"

on:
  workflow_dispatch:

jobs:
  contabo:
    name: contabo
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Investiga
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            echo "===== domain_renewals: quem comprou entrecamposblog.com ====="
            docker exec -i supabase-db psql -U postgres -d postgres -t -A -F' | ' -c "select user_id, domain_name, status, dns_status, brevo_verified, created_at from domain_renewals where domain_name ilike '%entrecampos%';"

            echo ""
            echo "===== panel_sites: sites deste dominio ou de 'entrecampos' ====="
            docker exec -i supabase-db psql -U postgres -d postgres -t -A -F' | ' -c "select owner, domain, provider, status from panel_sites where domain ilike '%entrecampos%';"

            echo ""
            echo "===== panel_backup_files: ficheiros relacionados a entrecampos ====="
            docker exec -i supabase-db psql -U postgres -d postgres -t -A -F' | ' -c "select owner, domain, filename, scope, source, bucket_path, backup_date from panel_backup_files where domain ilike '%entrecampos%' or filename ilike '%entrecampos%';"

            echo ""
            echo "===== hestia: lista de contas (v-list-users) ====="
            /usr/local/hestia/bin/v-list-users plain 2>/dev/null | head -20 || echo "(hestia bin nao encontrado neste caminho)"

            echo ""
            echo "===== procura dominio em qualquer conta hestia ====="
            grep -ril "entrecampos" /home/*/conf/web/ 2>/dev/null || echo "(nao encontrado em conf/web)"
            find /home -maxdepth 4 -iname "*entrecampos*" 2>/dev/null || echo "(nenhuma pasta com esse nome em /home)"
