name: "Ops - Fase 103. Recarrega o Apache (le os certificados corretos) e testa"

on:
  workflow_dispatch:

jobs:
  hetzner:
    name: hetzner
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Recarrega e testa
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 2m
          script: |
            set +e
            echo "===== testa a configuracao antes de recarregar (nao aplica nada se tiver erro) ====="
            apachectl -t 2>&1

            echo ""
            echo "===== recarrega ====="
            systemctl reload httpd 2>&1
            echo "resultado: $?"

            echo ""
            sleep 2
            echo "===== testa outra vez qual certificado cada dominio mostra agora ====="
            for d in oshercollective.com msdn-moz.org lirandzojewelry.com; do
              echo "--- $d ---"
              echo | openssl s_client -connect 127.0.0.1:443 -servername "$d" 2>/dev/null | openssl x509 -noout -subject -dates 2>&1
            done
