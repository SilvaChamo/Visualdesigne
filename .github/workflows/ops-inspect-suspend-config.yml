name: "Ops - Fase 15e. Confirma API_EXTERNAL_URL (so leitura)"

on:
  workflow_dispatch:

jobs:
  verify:
    name: verifica
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Verifica
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 2m
          script: |
            grep "^API_EXTERNAL_URL=" /opt/supabase-contabo/docker/.env
            echo "---"
            sed -n '150,190p' /opt/supabase-contabo/docker/docker-compose.yml
