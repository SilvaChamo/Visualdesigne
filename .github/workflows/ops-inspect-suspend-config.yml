name: "Ops - Fase 112. SO LEITURA - confirma se as contas hestia tem pacote atribuido"

on:
  workflow_dispatch:

jobs:
  contabo:
    name: contabo
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Confirma pacotes (so leitura)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 2m
          script: |
            set +e
            echo "===== lista de utilizadores reais no hestia, com o pacote atribuido ====="
            /usr/local/hestia/bin/v-list-users json 2>&1 | head -c 4000

            echo ""
            echo ""
            echo "===== lista de pacotes disponiveis ====="
            /usr/local/hestia/bin/v-list-user-packages 2>&1
