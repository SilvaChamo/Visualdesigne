name: "Ops - Fase 1l. Restart docker daemon + sobe envoy/pooler que faltavam"

on:
  workflow_dispatch:

jobs:
  finish:
    name: restart docker + up -d final
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Finaliza
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 6m
          script: |
            set -e
            echo "===== Estado antes ====="
            docker ps -a --format "table {{.Names}}\t{{.Status}}"

            echo ""
            echo "===== Reinicia o docker daemon (liberta portas presas) ====="
            systemctl restart docker
            sleep 8

            echo ""
            echo "===== Confirma portas livres ====="
            ss -tln | grep -E ':5432|:6543|:8000' || echo "tudo livre"

            cd /opt/supabase-contabo/docker
            echo ""
            echo "===== docker compose up -d (dados ja existem, so completa o que falta) ====="
            docker compose up -d

            echo ""
            echo "===== Espera 60s ====="
            sleep 60

            echo ""
            echo "===== Estado final ====="
            docker ps -a --format "table {{.Names}}\t{{.Status}}"

            echo ""
            echo "===== supabase_auth_admin existe agora? ====="
            docker exec supabase-db psql -U supabase_admin -d postgres -c "\du" 2>&1 | grep -i auth

            echo ""
            echo "===== teste real: curl ao gateway local ====="
            curl -s -o /dev/null -w "gateway HTTP %{http_code}\n" http://127.0.0.1:8000/rest/v1/ || echo "gateway nao responde"
