name: "Ops - Fase 62. Reactiva o tema real (oceanwp) e confirma a homepage"

on:
  workflow_dispatch:

jobs:
  hetzner:
    name: hetzner
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Reactiva
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 3m
          script: |
            set +e
            ROOT=/home/admin/domains/aamihe.com/public_html
            echo "===== estado actual (antes) ====="
            /usr/local/bin/wp --allow-root --path="$ROOT" option get template 2>&1
            /usr/local/bin/wp --allow-root --path="$ROOT" option get stylesheet 2>&1
            /usr/local/bin/wp --allow-root --path="$ROOT" theme list 2>&1

            echo ""
            echo "===== activa oceanwp (o tema real do site) ====="
            /usr/local/bin/wp --allow-root --path="$ROOT" theme activate oceanwp 2>&1

            echo ""
            echo "===== confirma ====="
            /usr/local/bin/wp --allow-root --path="$ROOT" theme list --status=active 2>&1

      - name: Confirma a homepage a sério
        run: |
          sleep 3
          curl -sSL -o /tmp/check.html --max-time 15 https://aamihe.com/
          echo "tamanho: $(wc -c < /tmp/check.html) bytes"
          grep -io "<title>.*</title>" /tmp/check.html | head -1
