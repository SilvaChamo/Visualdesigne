name: "Ops - Fase 99. Ve prefixo das tabelas em cada site (so leitura no Contabo)"

on:
  workflow_dispatch:

jobs:
  contabo:
    name: contabo
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Ve prefixo (so leitura)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 2m
          script: |
            set +e
            for d in oshercollective.com msdn-moz.org lirandzojewelry.com; do
              echo "--- $d ---"
              grep "table_prefix" "/home/oshercollective/web/$d/public_html/wp-config.php" 2>&1
            done
