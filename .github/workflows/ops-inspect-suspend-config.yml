name: "Ops - Fase 3e. Teste real a partir de fora (runner, nao dos servidores)"

on:
  workflow_dispatch:

jobs:
  test:
    name: curl publico real ao dominio novo
    runs-on: ubuntu-latest
    steps:
      - name: Teste externo real
        env:
          ANON_KEY: ${{ secrets.SUPABASE_CONTABO_ANON_KEY }}
        run: |
          echo "===== REST: panel_sites via HTTPS publico ====="
          curl -s -w "\nHTTP %{http_code}\n" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY" \
            "https://supabase-contabo.visualdesignmoz.com/rest/v1/panel_sites?select=domain&limit=3"

          echo ""
          echo "===== Auth health ====="
          curl -s -w "\nHTTP %{http_code}\n" \
            -H "apikey: $ANON_KEY" \
            "https://supabase-contabo.visualdesignmoz.com/auth/v1/health"

          echo ""
          echo "===== Certificado SSL real (emissor e validade) ====="
          echo | openssl s_client -servername supabase-contabo.visualdesignmoz.com -connect supabase-contabo.visualdesignmoz.com:443 2>/dev/null | openssl x509 -noout -issuer -dates
