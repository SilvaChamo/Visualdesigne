name: "Ops - Fase 26. Emite SSL real para entrecamposblog.com agora que o DNS ja aponta certo"

on:
  workflow_dispatch:

jobs:
  contabo:
    name: contabo
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Emite SSL
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 3m
          script: |
            set +e
            echo "===== emitindo Let's Encrypt para entrecamposblog.com ====="
            /usr/local/hestia/bin/v-add-letsencrypt-domain vdadmin entrecamposblog.com 2>&1
            echo "exit: $?"
            echo ""
            echo "===== confirma ====="
            sleep 3
            curl -sSk -o /dev/null -w "HTTPS local: %{http_code}\n" --max-time 8 -H "Host: entrecamposblog.com" https://127.0.0.1/ --resolve entrecamposblog.com:443:127.0.0.1
