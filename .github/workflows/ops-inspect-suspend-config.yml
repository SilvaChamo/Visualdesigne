name: "Ops - Fase 107. SO LEITURA - elimservicos.com e shalomdeco.com sao wordpress?"

on:
  workflow_dispatch:

jobs:
  hetzner:
    name: hetzner
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Investiga (so leitura)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 2m
          script: |
            set +e
            echo "===== conteudo completo da pasta do elimservicos.com no hetzner ====="
            ls -la /home/oshercollective/domains/elimservicos.com/public_html/ 2>&1

            echo ""
            echo "===== e no Contabo, elimservicos.com tem wp-content? ====="
            echo "(vamos ver isso a seguir no job contabo)"

            echo ""
            echo "===== ha alguma base de dados que mencione elim ====="
            mysql -e "SHOW DATABASES;" 2>&1 | grep -i "elim"

  contabo:
    name: contabo
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Investiga no Contabo (so leitura)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 2m
          script: |
            set +e
            echo "===== elimservicos.com no Contabo ====="
            ls -la /home/oshercollective/web/elimservicos.com/public_html/ 2>&1 | head -15

            echo ""
            echo "===== shalomdeco.com no Contabo ====="
            ls -la /home/oshercollective/web/shalomdeco.com/public_html/ 2>&1 | head -15
