name: "Ops - Fase 15d. Diagnostica porque google nao aparece no container (so leitura)"

on:
  workflow_dispatch:

jobs:
  verify:
    name: diagnostica
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Verifica
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 2m
          script: |
            echo "===== .env tem as linhas? (so nomes) ====="
            grep -n "^GOTRUE_EXTERNAL_GOOGLE_" /opt/supabase-contabo/docker/.env | sed -E 's/=.*$/=<definido>/'

            echo ""
            echo "===== docker-compose.yml: como o servico auth trata GOOGLE ====="
            grep -n -i "google" /opt/supabase-contabo/docker/docker-compose.yml || echo "nao encontrado no docker-compose.yml"

            echo ""
            echo "===== docker-compose.yml: o servico auth usa env_file ou environment explicito? ====="
            sed -n '/^  auth:/,/^  [a-z]/p' /opt/supabase-contabo/docker/docker-compose.yml | grep -E "env_file|environment:|image:" 

            echo ""
            echo "===== container auth: quando foi criado, esta a correr? ====="
            docker inspect supabase-auth --format 'Created: {{.Created}} | State: {{.State.Status}} | StartedAt: {{.State.StartedAt}}'

            echo ""
            echo "===== container auth: TEM mesmo GOTRUE_EXTERNAL_GOOGLE agora? ====="
            docker inspect supabase-auth --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -c "GOTRUE_EXTERNAL_GOOGLE" || echo "0 - nao tem nenhuma"
            docker inspect supabase-auth --format '{{range .Config.Env}}{{println .}}{{end}}' | grep "GOTRUE_EXTERNAL_GOOGLE" | sed -E 's/=.*$/=<definido>/'
