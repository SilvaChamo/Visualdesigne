name: "Ops - Fase 115. Verifica quem usa Osher/VisualDESIGN e remove os 2 pacotes antigos"

on:
  workflow_dispatch:

jobs:
  contabo:
    name: contabo
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Verifica e remove
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 2m
          script: |
            set +e
            echo "===== alguma conta usa estes 2 pacotes agora? ====="
            docker exec supabase-db psql -U postgres -d postgres -c "SELECT username, package_name FROM panel_users WHERE package_name IN ('Osher','VisualDESIGN');" 2>&1
            docker exec supabase-db psql -U postgres -d postgres -c "SELECT domain, package FROM panel_sites WHERE package IN ('Osher','VisualDESIGN');" 2>&1

            echo ""
            echo "===== remove os 2 pacotes antigos ====="
            docker exec supabase-db psql -U postgres -d postgres -c "DELETE FROM panel_packages WHERE package_name IN ('Osher','VisualDESIGN');" 2>&1

            echo ""
            echo "===== confirma o que ficou ====="
            docker exec supabase-db psql -U postgres -d postgres -c "SELECT package_name FROM panel_packages ORDER BY package_name;" 2>&1
