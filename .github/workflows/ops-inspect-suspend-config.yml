name: "Ops - Fase 19c. Verifica API/IP allowlist do vdadmin no Hestia (so leitura)"

on:
  workflow_dispatch:

jobs:
  contabo:
    name: contabo
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Verifica
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 5m
          script: |
            set +e
            echo "===== user.conf do vdadmin (sem mostrar hash da password) ====="
            grep -v -i "^PASSWORD\|^MD5\|^SALT" /usr/local/hestia/data/users/vdadmin/user.conf 2>&1

            echo ""
            echo "===== procura por API_ALLOWED_IP ou similar em qualquer conf ====="
            grep -rn "API" /usr/local/hestia/data/users/vdadmin/user.conf 2>&1

            echo ""
            echo "===== ultimas linhas do log de auth do hestia (sem passwords) ====="
            tail -30 /usr/local/hestia/log/auth.log 2>&1 | grep -v -i password

            echo ""
            echo "===== quando foi a ultima alteracao a password do vdadmin (mtime do ficheiro) ====="
            stat -c '%y %n' /usr/local/hestia/data/users/vdadmin/user.conf 2>&1

            echo ""
            echo "===== quando foi a ultima escrita do HESTIA_PASSWORD no .env.local (git blame no workflow) ====="
            cd /opt/visualdesign-site-teste
            date -r .env.local 2>&1
