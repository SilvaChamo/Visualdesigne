name: "Ops - Fase 11a. Confirma app sem erros pos-fix DNS/WP-install Hestia"

on:
  workflow_dispatch:

jobs:
  verify:
    name: pm2 logs + processo saudavel
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Verifica
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 2m
          script: |
            echo "===== Ultimas 60 linhas de erro desde o restart ====="
            pm2 logs visualdesign-site-teste --lines 60 --nostream --err 2>&1 | grep -iE "Unsupported state|TypeError|ReferenceError|is not a function|is not defined|Cannot read propert|hestiaAdapter|resolveDnsProvider|wp-cli" || echo "sem erros relevantes nos logs"

            echo ""
            echo "===== Confirma processo saudavel ====="
            pm2 describe visualdesign-site-teste 2>&1 | grep -E "status|restarts"
