name: Ops - Fase 1a. Instala Docker e clona Supabase no Contabo

on:
  workflow_dispatch:

jobs:
  provision:
    name: Docker + clone supabase/docker no Contabo
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Instala Docker e clona o repo oficial
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            echo "===== Instalar Docker (script oficial) ====="
            if ! command -v docker >/dev/null 2>&1; then
              curl -fsSL https://get.docker.com -o /tmp/get-docker.sh
              sh /tmp/get-docker.sh
            else
              echo "docker ja instalado"
            fi
            docker --version
            docker compose version

            echo ""
            echo "===== Clonar supabase/supabase (so a pasta docker/, sparse) ====="
            mkdir -p /opt/supabase-contabo
            if [ ! -d /opt/supabase-contabo/.git ]; then
              cd /opt
              git clone --depth 1 --filter=blob:none --sparse https://github.com/supabase/supabase supabase-contabo
              cd supabase-contabo
              git sparse-checkout set docker
            else
              echo "repo ja clonado"
            fi

            echo ""
            echo "===== Conteudo real do .env.example (para eu ver os campos exactos) ====="
            cat /opt/supabase-contabo/docker/.env.example

            echo ""
            echo "===== docker-compose.yml (portas expostas, para confirmar sem colisao) ====="
            grep -n "ports:" -A2 /opt/supabase-contabo/docker/docker-compose.yml | head -60
