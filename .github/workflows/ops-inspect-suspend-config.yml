name: "Ops - Fase 53. Leva os ficheiros do Contabo para o Hetzner (relay pelo runner)"

on:
  workflow_dispatch:

jobs:
  relay:
    name: relay
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH keys (Contabo + Hetzner)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/contabo_key
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hetzner_key
          chmod 600 ~/.ssh/contabo_key ~/.ssh/hetzner_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Descarrega do Contabo para o runner
        run: |
          scp -i ~/.ssh/contabo_key root@${{ secrets.CONTABO_HOST }}:/root/aamihe-restore/db.sql ./db.sql
          scp -i ~/.ssh/contabo_key root@${{ secrets.CONTABO_HOST }}:/root/aamihe-restore/uploads.zip ./uploads.zip
          ls -la db.sql uploads.zip

      - name: Envia do runner para o Hetzner
        run: |
          ssh -i ~/.ssh/hetzner_key -p ${{ secrets.HETZNER_PORT }} ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} "mkdir -p /root/aamihe-restore"
          scp -i ~/.ssh/hetzner_key -P ${{ secrets.HETZNER_PORT }} ./db.sql ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}:/root/aamihe-restore/db.sql
          scp -i ~/.ssh/hetzner_key -P ${{ secrets.HETZNER_PORT }} ./uploads.zip ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}:/root/aamihe-restore/uploads.zip
          ssh -i ~/.ssh/hetzner_key -p ${{ secrets.HETZNER_PORT }} ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} "ls -la /root/aamihe-restore/"
