name: "Ops - Fase 1h. Diagnostico direto: quem tem a porta 5432"

on:
  workflow_dispatch:

jobs:
  diag:
    name: ss -p e docker ps -a completos
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Diagnostico
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 3m
          script: |
            echo "===== ss -tlnp porta 5432 exacta (com processo dono) ====="
            ss -tlnp | grep ':5432' || echo "ss nao mostra nada em 5432"

            echo ""
            echo "===== lsof na porta 5432, se existir ====="
            lsof -i :5432 2>&1 || echo "sem lsof ou nada encontrado"

            echo ""
            echo "===== TODOS os containers docker, incluindo outros projectos ====="
            docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            echo ""
            echo "===== docker network ls ====="
            docker network ls

            echo ""
            echo "===== iptables NAT rules com 5432 (docker costuma la deixar regras orfas) ====="
            iptables -t nat -L -n 2>&1 | grep -i "5432" || echo "sem regras iptables NAT para 5432"

            echo ""
            echo "===== reinicia o proprio docker daemon, ultimo recurso conhecido para isto ====="
            systemctl restart docker
            sleep 5
            ss -tlnp | grep ':5432' || echo "apos restart do docker: 5432 livre"
