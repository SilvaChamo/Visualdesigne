name: "Ops - Fase 2g. Teste real de ponta a ponta (REST com chave real)"

on:
  workflow_dispatch:

jobs:
  test:
    name: docker ps + curl real ao REST com anon key
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Teste
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 3m
          envs: ANON_KEY
          script: |
            echo "===== Estado de TODOS os containers ====="
            docker ps -a --format "table {{.Names}}\t{{.Status}}"

            echo ""
            echo "===== Teste real: pede panel_sites via REST, com a anon key real ====="
            curl -s -w "\nHTTP %{http_code}\n" \
              -H "apikey: $ANON_KEY" \
              -H "Authorization: Bearer $ANON_KEY" \
              "http://127.0.0.1:8000/rest/v1/panel_sites?select=domain&limit=3"

            echo ""
            echo "===== Teste de login (auth health) ====="
            curl -s -w "\nHTTP %{http_code}\n" \
              -H "apikey: $ANON_KEY" \
              "http://127.0.0.1:8000/auth/v1/health"
        env:
          ANON_KEY: ${{ secrets.SUPABASE_CONTABO_ANON_KEY }}
