name: "Ops - Fase 19a. Confirma DEFAULT_HOSTING_PROVIDER e HESTIA_USER no Contabo (so leitura)"

on:
  workflow_dispatch:

jobs:
  contabo:
    name: contabo
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Verifica
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 5m
          script: |
            set +e
            cd /opt/visualdesign-site-teste
            echo "DEFAULT_HOSTING_PROVIDER=$(grep '^DEFAULT_HOSTING_PROVIDER=' .env.local)"
            echo "HESTIA_USER=$(grep '^HESTIA_USER=' .env.local)"
