name: "Ops - Fase 5b. Copia elimservicos+shalomdeco e localiza entrecampos/anap/matolario"

on:
  workflow_dispatch:

jobs:
  copy_and_find:
    name: rsync via runner (Hetzner so leitura) + find addon domains
    runs-on: ubuntu-latest
    steps:
      - name: Setup chaves SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hetzner_key
          chmod 600 ~/.ssh/hetzner_key
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/contabo_key
          chmod 600 ~/.ssh/contabo_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 1. Localiza addon domains (entrecampos/anap/matolario/suregrowth) no Hetzner (so leitura)
        run: |
          ssh -i ~/.ssh/hetzner_key -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" '
            echo "===== find por nome, em qualquer sitio dentro de /home ====="
            find /home -maxdepth 5 -iname "*entrecampos*" 2>/dev/null
            find /home -maxdepth 5 -iname "*anap*" 2>/dev/null
            find /home -maxdepth 5 -iname "*matolario*" 2>/dev/null
            find /home -maxdepth 5 -iname "*suregrowth*" 2>/dev/null

            echo ""
            echo "===== DirectAdmin: ficheiro de dominios extra (addon) da conta admin ====="
            cat /usr/local/directadmin/data/users/admin/domains.list 2>/dev/null
            echo "---"
            find /usr/local/directadmin/data/users/admin -iname "*entrecampos*" -o -iname "*anap*" -o -iname "*matolario*" 2>/dev/null
          '

      - name: 2. Copia elimservicos.com e shalomdeco.com para o runner (Hetzner so leitura)
        run: |
          mkdir -p ./elim-copy ./shalom-copy
          rsync -az -e "ssh -i ~/.ssh/hetzner_key -p ${{ secrets.HETZNER_PORT }}" \
            "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}:/home/oshercollective/domains/elimservicos.com/public_html/" ./elim-copy/
          rsync -az -e "ssh -i ~/.ssh/hetzner_key -p ${{ secrets.HETZNER_PORT }}" \
            "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}:/home/oshercollective/domains/shalomdeco.com/public_html/" ./shalom-copy/
          du -sh ./elim-copy ./shalom-copy

      - name: 3. Envia para o Contabo (dentro da conta oshercollective do Hestia)
        run: |
          rsync -az -e "ssh -i ~/.ssh/contabo_key" \
            ./elim-copy/ "root@${{ secrets.CONTABO_HOST }}:/home/oshercollective/web/elimservicos.com/public_html/"
          rsync -az -e "ssh -i ~/.ssh/contabo_key" \
            ./shalom-copy/ "root@${{ secrets.CONTABO_HOST }}:/home/oshercollective/web/shalomdeco.com/public_html/"

      - name: 4. Confirma no Contabo
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 2m
          script: |
            echo "===== Tamanho real copiado ====="
            du -sh /home/oshercollective/web/elimservicos.com/public_html
            du -sh /home/oshercollective/web/shalomdeco.com/public_html

            echo ""
            echo "===== Acerta o dono dos ficheiros (Hestia exige dono = utilizador do site) ====="
            chown -R oshercollective:oshercollective /home/oshercollective/web/elimservicos.com/public_html
            chown -R oshercollective:oshercollective /home/oshercollective/web/shalomdeco.com/public_html
            echo "ok"
