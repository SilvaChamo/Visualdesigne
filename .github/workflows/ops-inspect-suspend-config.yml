name: "Ops - Fase 21d. Investiga por que hestia-sync devolve users:0"

on:
  workflow_dispatch:

jobs:
  contabo:
    name: contabo
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Investiga
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 5m
          script: |
            set +e
            cd /opt/visualdesign-site-teste

            echo "===== confirma que o codigo novo esta mesmo no servidor ====="
            grep -n "liveUsernames.add((process.env.HESTIA_USER" .next/server/chunks/*.js 2>/dev/null | head -3
            grep -rn "propria conta principal" src/lib/hestia-sync-engine.ts 2>/dev/null

            HOST="teste.visualdesignmoz.com"
            PORT="8083"
            USR=$(grep '^HESTIA_USER=' .env.local | cut -d= -f2- | tr -d "'\"")
            PASS=$(grep '^HESTIA_PASSWORD=' .env.local | cut -d= -f2- | tr -d "'\"")
            echo "::add-mask::$PASS"

            echo ""
            echo "===== testa v-list-users directamente (comando exacto que listUsers() usa) ====="
            curl -sS -k -w "\nHTTP_STATUS:%{http_code}\n" -X POST "https://${HOST}:${PORT}/api/" \
              --data-urlencode "user=${USR}" \
              --data-urlencode "password=${PASS}" \
              --data-urlencode "cmd=v-list-users" \
              --data-urlencode "arg1=json"

            echo ""
            echo "===== testa v-list-web-domains vdadmin directamente ====="
            curl -sS -k -w "\nHTTP_STATUS:%{http_code}\n" -X POST "https://${HOST}:${PORT}/api/" \
              --data-urlencode "user=${USR}" \
              --data-urlencode "password=${PASS}" \
              --data-urlencode "cmd=v-list-web-domains" \
              --data-urlencode "arg1=vdadmin" \
              --data-urlencode "arg2=json"
