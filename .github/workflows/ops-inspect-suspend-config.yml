name: Ops - Fase 1b. Nomes dos servicos no docker-compose (so leitura)

on:
  workflow_dispatch:

jobs:
  inspect:
    name: Nomes de servicos e portas
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Lista servicos
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 3m
          script: |
            cd /opt/supabase-contabo/docker
            echo "===== Lista de servicos (nomes) ====="
            docker compose config --services

            echo ""
            echo "===== Servico dono da porta 8000 (gateway) ====="
            grep -n "^  [a-z-]*:$" docker-compose.yml | awk -F: '{print $1}' > /tmp/svc_lines.txt
            awk '/ports:/{print NR": "$0; found=1} found && /8000/{print "  -> "prev; found=0} {prev=$0}' docker-compose.yml | head -20
            grep -n "container_name" docker-compose.yml

            echo ""
            echo "===== kong.yml existe? ====="
            find . -iname "kong.yml" -o -iname "*.yml" | grep -i kong || echo "sem kong.yml"
