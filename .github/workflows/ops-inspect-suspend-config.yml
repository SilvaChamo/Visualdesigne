name: "Ops - Fase 106. Testa SSL via o IP publico real, nao localhost"

on:
  workflow_dispatch:

jobs:
  hetzner:
    name: hetzner
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Testa via IP publico
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 2m
          script: |
            set +e
            MYIP=$(curl -s https://api.ipify.org)
            echo "IP publico deste servidor confirmado"

            for d in oshercollective.com msdn-moz.org lirandzojewelry.com; do
              echo "--- $d (via IP publico) ---"
              echo | openssl s_client -connect "$MYIP:443" -servername "$d" 2>/dev/null | openssl x509 -noout -subject -dates 2>&1
            done

            echo ""
            echo "===== confirma tambem que vhost usa que IP exactamente ====="
            grep -B2 "ServerName www.oshercollective.com" /usr/local/directadmin/data/users/oshercollective/httpd.conf 2>&1 | head -10
