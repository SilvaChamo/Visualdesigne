name: "Ops - Fase 1f. Diagnostico: onde foi o supavisor/pooler"

on:
  workflow_dispatch:

jobs:
  diag:
    name: Estado real de todos os containers
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Diagnostico
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 3m
          script: |
            cd /opt/supabase-contabo/docker

            echo "===== TODOS os containers docker (qualquer estado, qualquer projecto) ====="
            docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            echo ""
            echo "===== docker compose ps -a (dentro do projecto) ====="
            docker compose ps -a

            echo ""
            echo "===== Ultimas linhas do log do pooler, se existir ====="
            docker logs supabase-pooler --tail 40 2>&1 || echo "container supabase-pooler nao existe"

            echo ""
            echo "===== Portas em escuta agora ====="
            ss -tlnp | grep -E ':8000|:5432|:6543' || echo "nenhuma das 3 em escuta"

            echo ""
            echo "===== Conteudo actual do override ====="
            cat docker-compose.override.yml

            echo ""
            echo "===== docker compose config (portas resolvidas, so grep) ====="
            docker compose config 2>&1 | grep -B3 "published\|8000\|5432\|6543" | head -60
