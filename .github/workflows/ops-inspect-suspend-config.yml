name: "Ops - Fase 8a. Espaco em disco + Hestia (emails e pacotes) - so leitura"

on:
  workflow_dispatch:

jobs:
  verify:
    name: espaco + hestia mail/packages
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Inspeciona
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 3m
          script: |
            echo "===== ESPACO EM DISCO (visao geral) ====="
            df -h /

            echo ""
            echo "===== MEMORIA RAM ====="
            free -h

            echo ""
            echo "===== DOCKER: espaco usado (imagens/containers/volumes) ====="
            docker system df

            echo ""
            echo "===== DOCKER: containers activos ====="
            docker ps --format 'table {{.Names}}\t{{.Status}}'

            echo ""
            echo "===== MAIORES CONSUMIDORES DE DISCO ====="
            echo "-- Stack Supabase (bd + storage) --"
            du -sh /opt/supabase-contabo/docker/volumes 2>/dev/null || echo "n/d"
            echo "-- Sites Hestia (todas as contas) --"
            du -sh /home/*/web 2>/dev/null
            echo "-- Backups Hestia --"
            du -sh /backup 2>/dev/null || echo "sem pasta de backups"
            echo "-- Caixas de correio --"
            du -sh /home/*/mail 2>/dev/null

            echo ""
            echo "===== HESTIA: versao instalada ====="
            cat /usr/local/hestia/data/hestia.conf 2>/dev/null | grep -i version || (dpkg -l 2>/dev/null | grep -i hestia) || echo "n/d"

            echo ""
            echo "===== HESTIA: todas as contas e o que cada uma tem (users/dominios/emails/bds) ====="
            /usr/local/hestia/bin/v-list-users

            echo ""
            echo "===== HESTIA: detalhe da conta admin (para confirmar privilegios) ====="
            /usr/local/hestia/bin/v-list-user admin

            echo ""
            echo "===== HESTIA: dominios de email por conta ====="
            for u in admin vdadmin oshercollective aamihe provisualcorporate; do
              echo "--- conta: $u ---"
              /usr/local/hestia/bin/v-list-mail-domains "$u" 2>&1 || echo "(conta nao existe ou sem dominios de email)"
            done

            echo ""
            echo "===== HESTIA: contas de email criadas, por dominio ====="
            for u in admin vdadmin oshercollective aamihe; do
              domains=$(/usr/local/hestia/bin/v-list-mail-domains "$u" plain 2>/dev/null | awk '{print $1}')
              for d in $domains; do
                echo "--- $u / $d ---"
                /usr/local/hestia/bin/v-list-mail-accounts "$u" "$d" 2>&1
              done
            done

            echo ""
            echo "===== HESTIA: pacotes existentes (lista) ====="
            /usr/local/hestia/bin/v-list-packages admin 2>&1

            echo ""
            echo "===== HESTIA: ficheiros de pacotes disponiveis ====="
            ls -la /usr/local/hestia/data/packages/ 2>&1

            echo ""
            echo "===== HESTIA: conteudo de cada pacote (limites reais) ====="
            for f in /usr/local/hestia/data/packages/*.pkg; do
              echo "--- $f ---"
              cat "$f" 2>&1
              echo ""
            done
