name: "Ops - Fase 80. Activa os restantes plugins um a um"

on:
  workflow_dispatch:

jobs:
  hetzner:
    name: hetzner
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Activa um a um
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 3m
          script: |
            set +e
            ROOT=/home/admin/domains/aamihe.com/public_html
            WP="/usr/local/bin/wp --allow-root --path=$ROOT"

            for slug in translatepress-multilingual wp-optimize loginpress honeypot icon-element auto-image-download-button automatic-translate-addon-for-translatepress drag-and-drop-file-upload-for-elementor-forms pro-elements; do
              echo "--- activa $slug ---"
              $WP plugin activate "$slug" 2>&1 | tail -3
            done

            echo ""
            echo "===== estado final ====="
            $WP plugin list 2>&1

            echo ""
            echo "===== confirma homepage ====="
            curl -sS -o /tmp/check3.html --max-time 15 https://aamihe.com/ 2>&1
            echo "tamanho: $(wc -c < /tmp/check3.html) bytes"
            grep -io "<title>.*</title>" /tmp/check3.html | head -1
