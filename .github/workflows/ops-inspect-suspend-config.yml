name: "Ops - Fase 104. SO LEITURA - quem trata mesmo da porta 443 no Hetzner"

on:
  workflow_dispatch:

jobs:
  hetzner:
    name: hetzner
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Investiga
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 2m
          script: |
            set +e
            echo "===== quem ouve na porta 443? ====="
            ss -tlnp 2>&1 | grep ":443"

            echo ""
            echo "===== nginx esta instalado/activo neste servidor? ====="
            systemctl is-active nginx 2>&1
            which nginx 2>&1

            echo ""
            echo "===== onde esta o certificado host.visualdesignmoz.com definido (para saber quem o esta a usar por defeito) ====="
            grep -rl "host.visualdesignmoz.com" /usr/local/directadmin/data/users/*/httpd.conf 2>/dev/null
            find /etc/nginx -iname "*.conf" 2>/dev/null | xargs grep -l "host.visualdesignmoz.com\|SSLCertificate\|ssl_certificate" 2>/dev/null | head -10

            echo ""
            echo "===== qual e o PRIMEIRO vhost ssl carregado (o que vira o default quando SNI nao bate certo) ====="
            apachectl -S 2>&1 | grep -B1 "is a NameVirtualHost\|default server" | head -20
