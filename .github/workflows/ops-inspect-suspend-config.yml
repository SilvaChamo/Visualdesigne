name: "Ops - Fase 94. SO LEITURA - estado real da conta oshercollective no Hetzner"

on:
  workflow_dispatch:

jobs:
  hetzner:
    name: hetzner
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: So leitura, nada e alterado
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 2m
          script: |
            set +e
            echo "===== a conta directadmin oshercollective ainda existe? esta suspensa? ====="
            cat /usr/local/directadmin/data/users/oshercollective/user.conf 2>&1 | grep -iE "^suspended|^usertype"

            echo ""
            echo "===== dominios listados nesta conta ====="
            cat /usr/local/directadmin/data/users/oshercollective/domains.list 2>&1

            echo ""
            echo "===== pasta de ficheiros do site ainda existe? ====="
            for d in oshercollective.com msdn-moz.org lirandzojewelry.com elimservicos.com shalomdeco.com; do
              echo "--- $d ---"
              ls -la "/home/oshercollective/domains/$d/public_html/" 2>&1 | head -5
            done

            echo ""
            echo "===== o httpd.conf desta conta esta a ser incluido na config activa do apache? ====="
            httpd -S 2>&1 | grep -i oshercollective
            apachectl -S 2>&1 | grep -i oshercollective

            echo ""
            echo "===== bases de dados desta conta ainda existem no mysql? ====="
            mysql -e "SHOW DATABASES LIKE 'oshercollective%';" 2>&1
            mysql -e "SHOW DATABASES;" 2>&1 | grep -i "osher\|msdn\|lirandzo\|elimservicos\|shalomdeco"

            echo ""
            echo "===== espaco em disco ainda ocupado por esta conta (indica se ficheiros ainda la estao) ====="
            du -sh /home/oshercollective/ 2>&1
