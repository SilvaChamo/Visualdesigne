name: "Ops - Fase 1e. Retry: recria api-gw isolado (race condition anterior)"

on:
  workflow_dispatch:

jobs:
  retry:
    name: Para, espera, sobe api-gw de novo
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Retry
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            cd /opt/supabase-contabo/docker

            echo "===== Estado actual das portas ====="
            ss -tlnp | grep -E ':8000|:5432|:6543' || echo "nenhuma das 3 em escuta"

            echo ""
            echo "===== COMPOSE_FILE ====="
            grep "^COMPOSE_FILE=" .env

            echo ""
            echo "===== Para api-gw, confirma que a porta 8000 fica livre, sobe de novo ====="
            docker compose stop api-gw
            sleep 5
            ss -tlnp | grep ':8000' || echo "porta 8000 livre agora"
            docker compose up -d api-gw
            sleep 8

            echo ""
            echo "===== Estado final ====="
            docker compose ps
            echo ""
            ss -tlnp | grep -E ':8000|:5432|:6543'
