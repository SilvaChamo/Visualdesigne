name: "Ops - Fase 93. Ve se o nginx do contabo tem vhost para estes dominios"

on:
  workflow_dispatch:

jobs:
  contabo:
    name: contabo
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Investiga config web
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 2m
          script: |
            set +e
            echo "===== nginx esta mesmo a ouvir na porta 443/80? ====="
            ss -tlnp 2>&1 | grep -E ":443|:80"

            echo ""
            echo "===== existe vhost nginx para oshercollective.com? ====="
            find /etc/nginx -iname "*oshercollective*" 2>&1
            find /usr/local/hestia -iname "*oshercollective.com*" -maxdepth 4 2>&1 | grep -v "/ssl/\|/mail/"

            echo ""
            echo "===== teste directo via http (porta 80, sem ssl) ====="
            curl -sSI --max-time 8 --resolve "oshercollective.com:80:127.0.0.1" "http://oshercollective.com/" 2>&1 | head -6

            echo ""
            echo "===== estado geral da conta no hestia (resumo v-list-user) ====="
            /usr/local/hestia/bin/v-list-user oshercollective 2>&1 | head -20

            echo ""
            echo "===== pasta do site existe fisicamente? ====="
            ls -la /home/oshercollective/web/oshercollective.com/public_html/ 2>&1 | head -10
