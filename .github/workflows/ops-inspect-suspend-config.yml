name: "Ops - Fase 41. Estado real da firewall no Contabo + aamihe la tem a mesma infeccao"

on:
  workflow_dispatch:

jobs:
  contabo:
    name: contabo
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Verifica firewall e conta aamihe
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 3m
          script: |
            set +e
            echo "===== firewall do sistema (iptables/ufw) ====="
            ufw status verbose 2>&1
            echo "--- iptables ---"
            iptables -L -n 2>&1 | head -30

            echo ""
            echo "===== firewall do Hestia (o proprio painel) ====="
            /usr/local/hestia/bin/v-list-firewall plain 2>&1 | head -20
            echo "(vazio acima = sem nenhuma regra configurada no Hestia)"

            echo ""
            echo "===== fail2ban a correr? ====="
            systemctl is-active fail2ban 2>&1
            fail2ban-client status 2>&1

            echo ""
            echo "===== a conta aamihe existe aqui, tem sites? ====="
            /usr/local/hestia/bin/v-list-web-domains aamihe plain 2>&1

            echo ""
            echo "===== aamihe.com tem a mesma infeccao aqui no Contabo? ====="
            find /home/aamihe/web/aamihe.com/public_html/ -iname "05a0wp" -o -iname "*.b26_sed_bak*" -o -path "*spLlo*" 2>/dev/null
            echo "(vazio acima = nao tem esta infeccao aqui)"
            ls -la /home/aamihe/web/ 2>&1
