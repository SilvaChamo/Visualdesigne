name: "Ops - Fase 72. Mesmo fix (htaccess na pasta pai) na copia Contabo"

on:
  workflow_dispatch:

jobs:
  contabo:
    name: contabo
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Isola htaccess da pasta pai
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 3m
          script: |
            set +e
            PARENT=/home/aamihe/web/aamihe.com
            QDIR="/root/security-quarantine/aamihe.com-contabo-parent-$(date +%Y%m%d-%H%M%S)"
            mkdir -p "$QDIR"

            echo "===== conteudo actual (para confirmar se tem o padrao malicioso) ====="
            head -c 500 "$PARENT/.htaccess" 2>&1

            echo ""
            echo "===== isola se tiver o padrao malicioso ====="
            if grep -q "filefuns\|chtmlfuns\|cjfuns" "$PARENT/.htaccess" 2>/dev/null; then
              mv "$PARENT/.htaccess" "$QDIR/htaccess-pasta-pai.bak"
              echo "isolado: $PARENT/.htaccess"
            else
              echo "nao tinha o padrao malicioso (ou nao existe), nao mexi"
            fi

            echo ""
            echo "===== confirma ====="
            ls -la "$PARENT/" | grep htaccess
