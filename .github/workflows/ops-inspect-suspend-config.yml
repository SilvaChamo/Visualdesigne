name: "Ops - Fase 59. Confirma utilizadores admin reais + visual final do site"

on:
  workflow_dispatch:

jobs:
  hetzner:
    name: hetzner
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Confirma utilizadores admin
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 3m
          script: |
            set +e
            ROOT=/home/admin/domains/aamihe.com/public_html
            echo "===== todos os administradores reais do site ====="
            /usr/local/bin/wp --allow-root --path="$ROOT" user list --role=administrator --fields=ID,user_login,user_email,user_registered 2>&1

            echo ""
            echo "===== plugins activos agora (confirma que nada estranho ficou activo) ====="
            /usr/local/bin/wp --allow-root --path="$ROOT" plugin list --status=active --fields=name,version,update 2>&1

            echo ""
            echo "===== confirma se ha algum utilizador criado nos ultimos 30 dias (suspeito) ====="
            /usr/local/bin/wp --allow-root --path="$ROOT" user list --fields=ID,user_login,user_registered --format=csv 2>&1 | awk -F, 'NR==1 || $3 > "2026-08-01"'

            echo ""
            echo "===== estado geral: erros php recentes ====="
            /usr/local/bin/wp --allow-root --path="$ROOT" core verify-checksums 2>&1 | head -20
