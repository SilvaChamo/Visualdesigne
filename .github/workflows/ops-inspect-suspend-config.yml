name: "Ops - Fase 6b. Como aamihe.com liga a base de dados (nao e WordPress)"

on:
  workflow_dispatch:

jobs:
  inspect:
    name: so leitura
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Inspecciona filefuns.php e index.php (aamihe)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 2m
          script: |
            echo "===== grep por ligacao a base de dados em aamihe.com ====="
            grep -rn "mysqli_connect\|new PDO\|new mysqli\|DB_HOST\|DB_NAME\|DB_USER\|getenv\|\$_ENV" \
              /home/admin/domains/aamihe.com/public_html/*.php 2>&1 | head -30

            echo ""
            echo "===== ficheiros .php na raiz (nomes, para ver se ha config.php escondido) ====="
            find /home/admin/domains/aamihe.com/public_html -maxdepth 2 -iname "*.php" 2>&1

            echo ""
            echo "===== o mesmo para provisualcorporate (para confirmar se a BD ainda e usada) ====="
            grep -rn "mysqli_connect\|new PDO\|new mysqli\|DB_HOST\|DB_NAME" \
              /home/admin/domains/provisualcorporate.co.mz/public_html/*.php 2>&1 | head -10
