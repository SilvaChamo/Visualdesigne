name: "Ops - Fase 92. Confirma se o Contabo serve bem o oshercollective (antes de mudar DNS)"

on:
  workflow_dispatch:

jobs:
  contabo:
    name: contabo
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Testa localmente no Contabo
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 2m
          script: |
            set +e
            echo "===== testa cada dominio via localhost, forcando o host header (ignora dns) ====="
            for d in oshercollective.com msdn-moz.org lirandzojewelry.com elimservicos.com shalomdeco.com; do
              echo "--- $d ---"
              curl -sSI --max-time 8 -k --resolve "$d:443:127.0.0.1" "https://$d/" 2>&1 | head -4
            done

            echo ""
            echo "===== ssl real gerado para estes dominios no contabo (letsencrypt) ====="
            ls -la /usr/local/hestia/data/users/oshercollective/ssl/ 2>&1 | head -20
