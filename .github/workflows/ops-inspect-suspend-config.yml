name: "Ops - Fase 13c. Detalhe do checkout pendente entrecamposblog.com (so leitura)"

on:
  workflow_dispatch:

jobs:
  verify:
    name: consulta supabase contabo
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Consulta
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 2m
          script: |
            SQL() { docker exec -i supabase-db psql -U postgres -d postgres -t -A -c "$1"; }

            echo "===== colunas de checkout_sessions ====="
            SQL "select column_name, data_type from information_schema.columns where table_name='checkout_sessions' order by ordinal_position;"

            echo ""
            echo "===== a sessao inteira (entrecamposblog.com) ====="
            SQL "select row_to_json(t) from (select * from checkout_sessions where id = '56b560c0-eb8c-4205-b008-22f3d5bf531b') t;"

            echo ""
            echo "===== renewal_payment_requests ligados a este user (se houver) ====="
            SQL "select rpr.* from renewal_payment_requests rpr, checkout_sessions cs where cs.id = '56b560c0-eb8c-4205-b008-22f3d5bf531b' and rpr.user_id = cs.user_id order by rpr.created_at desc limit 5;"

            echo ""
            echo "===== pagamentos deste user (5 mais recentes) ====="
            SQL "select p.* from pagamentos p, checkout_sessions cs where cs.id = '56b560c0-eb8c-4205-b008-22f3d5bf531b' and p.user_id = cs.user_id order by p.created_at desc limit 5;"
