name: "Ops - Fase 27. Porque o SSL emitido nao esta a servir (cert errado)"

on:
  workflow_dispatch:

jobs:
  contabo:
    name: contabo
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Investiga e corrige
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 3m
          script: |
            set +e
            echo "===== certificado real emitido (ficheiro) ====="
            ls -la /home/vdadmin/conf/web/entrecamposblog.com/ 2>&1
            echo ""
            echo "===== validade/domínios do cert ssl.pem ====="
            openssl x509 -in /home/vdadmin/conf/web/entrecamposblog.com/ssl/entrecamposblog.com.crt -noout -subject -dates -ext subjectAltName 2>&1

            echo ""
            echo "===== nginx.forcessl.conf (o que o vhost usa mesmo) ====="
            cat /home/vdadmin/conf/web/entrecamposblog.com/nginx.forcessl.conf* 2>&1 | head -30

            echo ""
            echo "===== testa nginx config e recarrega ====="
            nginx -t 2>&1
            systemctl reload nginx 2>&1
            echo "reload exit: $?"

            echo ""
            echo "===== confirma via SNI directo à IP ====="
            sleep 2
            curl -sSk -o /dev/null -w "HTTP %{http_code}\n" --max-time 8 --resolve entrecamposblog.com:443:127.0.0.1 https://entrecamposblog.com/ -v 2>&1 | grep -i "subject\|issuer\|HTTP"
