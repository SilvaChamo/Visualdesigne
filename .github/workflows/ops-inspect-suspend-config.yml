name: Ops - verifica conta real elimservicos no DirectAdmin

on:
  workflow_dispatch:

jobs:
  check:
    name: CMD_API_SHOW_USER_CONFIG (leitura)
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Consulta directa ao DirectAdmin
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 2m
          script: |
            cd /opt/visualdesign-site-teste
            set -a
            source .env.local
            set +a
            AUTH_USER="admin"
            AUTH_PASS="${DIRECTADMIN_LOGIN_KEY:-$DIRECTADMIN_PASSWORD}"
            echo "===== user config elimservicos ====="
            curl -sk -w "\nHTTP_STATUS:%{http_code}\n" --connect-timeout 15 -m 30 -u "${AUTH_USER}:${AUTH_PASS}" \
              "${DIRECTADMIN_PROTOCOL}://${DIRECTADMIN_HOST}:${DIRECTADMIN_PORT}/CMD_API_SHOW_USER_CONFIG?user=elimservicos"
            echo ""
            echo "===== domain owner elimservicos.com ====="
            curl -sk -w "\nHTTP_STATUS:%{http_code}\n" --connect-timeout 15 -m 30 -u "${AUTH_USER}:${AUTH_PASS}" \
              "${DIRECTADMIN_PROTOCOL}://${DIRECTADMIN_HOST}:${DIRECTADMIN_PORT}/CMD_API_SHOW_USER_DOMAINS?user=elimservicos"
