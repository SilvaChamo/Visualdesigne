name: "Ops - Fase 114. SO LEITURA - ve a tabela panel_packages no supabase do contabo"

on:
  workflow_dispatch:

jobs:
  contabo:
    name: contabo
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Ve panel_packages (so leitura)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 2m
          script: |
            set +e
            echo "===== onde esta o container do postgres do supabase ====="
            docker ps --format '{{.Names}}' 2>&1 | grep -i "db\|postgres"

            echo ""
            echo "===== conteudo real da tabela panel_packages ====="
            docker exec supabase-db psql -U postgres -d postgres -c "SELECT package_name, updated_at FROM panel_packages ORDER BY package_name;" 2>&1
