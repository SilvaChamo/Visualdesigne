name: "Ops - Fase 1p. Como o Hestia gere a firewall (so leitura)"

on:
  workflow_dispatch:

jobs:
  check:
    name: firewall do Hestia + nome real do servico gateway
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Verifica
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 3m
          script: |
            echo "===== CSF instalado? (firewall que o Hestia costuma usar) ====="
            which csf 2>&1 || echo "sem csf"
            systemctl is-active csf 2>&1 || echo "csf nao e servico activo"

            echo ""
            echo "===== iptables-legacy existe como alternativa? ====="
            update-alternatives --list iptables 2>&1 || echo "sem alternatives para iptables"

            echo ""
            echo "===== Quantas regras reais tem a tabela iptables agora (grandeza) ====="
            iptables -L -n | wc -l
            iptables -t nat -L -n | wc -l

            echo ""
            echo "===== nome real do servico do gateway no compose ====="
            cd /opt/supabase-contabo/docker
            docker compose config --services
