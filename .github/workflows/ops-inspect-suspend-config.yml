name: Ops - verifica se ha Supabase real a correr no Contabo

on:
  workflow_dispatch:

jobs:
  check:
    name: Docker/Postgres no Contabo
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Verifica containers Docker e dados reais
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 2m
          script: |
            echo "===== Containers Docker a correr no Contabo ====="
            docker ps -a 2>&1 || echo "docker nao instalado ou sem permissao"

            echo ""
            echo "===== Procura por qualquer coisa 'supabase' no sistema ====="
            find / -maxdepth 4 -iname "*supabase*" -type d 2>/dev/null

            echo ""
            echo "===== Portas a escutar (3000, 5432, 8000, 8443, 54321 tipicas do Supabase) ====="
            ss -tlnp 2>&1 | grep -E ':3000|:5432|:8000|:8443|:54321' || echo "nenhuma dessas portas em escuta"

            echo ""
            echo "===== Se houver postgres local, lista bases de dados ====="
            docker exec -i $(docker ps --filter "name=postgres" --format "{{.Names}}" | head -1) psql -U postgres -c '\l' 2>&1 || echo "sem container postgres para consultar"

            echo ""
            echo "===== Confirma se supabase.visualdesignmoz.com aponta para este servidor (curl local) ====="
            curl -s -o /dev/null -w "HTTP %{http_code}\n" http://localhost:3000 2>&1 || echo "porta 3000 nao responde localmente"
            curl -s -o /dev/null -w "HTTP %{http_code}\n" http://localhost:8000 2>&1 || echo "porta 8000 nao responde localmente"

            echo ""
            echo "===== IP publico deste servidor Contabo ====="
            curl -s https://api.ipify.org 2>&1
            echo ""
