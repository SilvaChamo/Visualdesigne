name: "Ops - Fase 116. SO LEITURA - elimservicos e conta hestia real separada, ou so resto no painel?"

on:
  workflow_dispatch:

jobs:
  contabo:
    name: contabo
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Investiga (so leitura)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 2m
          script: |
            set +e
            echo "===== 'elimservicos' existe como utilizador real do hestia? ====="
            /usr/local/hestia/bin/v-list-users 2>&1 | grep -i "elimservicos\|USER"

            echo ""
            echo "===== se existir, que dominios tem essa conta (deve estar vazia) ====="
            /usr/local/hestia/bin/v-list-web-domains elimservicos 2>&1

            echo ""
            echo "===== confirma que elimservicos.com esta mesmo dentro da conta oshercollective ====="
            /usr/local/hestia/bin/v-list-web-domains oshercollective 2>&1 | grep -i "DOMAIN\|elimservicos"

            echo ""
            echo "===== o que a tabela panel_users guarda para 'elimservicos' (o resto no painel) ====="
            docker exec supabase-db psql -U postgres -d postgres -c "SELECT username, email, acl, status, package_name FROM panel_users WHERE username='elimservicos';" 2>&1

            echo ""
            echo "===== 'elimservicos.com' aparece como site separado em panel_sites, com que dono? ====="
            docker exec supabase-db psql -U postgres -d postgres -c "SELECT domain, owner, package FROM panel_sites WHERE domain ILIKE '%elimservicos%';" 2>&1
