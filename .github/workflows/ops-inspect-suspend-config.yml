name: "Ops - Fase 10b. Testa convencao de nomes DNS Hestia (zona descartavel)"

on:
  workflow_dispatch:

jobs:
  verify:
    name: teste zona dns descartavel
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Testa
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 2m
          script: |
            BIN=/usr/local/hestia/bin
            TEST_DOMAIN="claude-dns-test.invalid"

            echo "===== limpa qualquer resto de teste anterior ====="
            "$BIN/v-delete-dns-domain" vdadmin "$TEST_DOMAIN" 2>&1 || true

            echo ""
            echo "===== cria zona de teste descartavel (.invalid = RFC2606, nunca e real) ====="
            "$BIN/v-add-dns-domain" vdadmin "$TEST_DOMAIN" 169.58.148.144 2>&1

            echo ""
            echo "===== registos default criados automaticamente (formato JSON) ====="
            "$BIN/v-list-dns-records" vdadmin "$TEST_DOMAIN" json 2>&1

            echo ""
            echo "===== adiciona um registo 'www' A para ver convencao ====="
            "$BIN/v-add-dns-record" vdadmin "$TEST_DOMAIN" www A 169.58.148.144 2>&1

            echo ""
            echo "===== adiciona um registo apex (@) A para ver convencao ====="
            "$BIN/v-add-dns-record" vdadmin "$TEST_DOMAIN" "$TEST_DOMAIN" A 169.58.148.144 2>&1

            echo ""
            echo "===== lista final (json) ====="
            "$BIN/v-list-dns-records" vdadmin "$TEST_DOMAIN" json 2>&1

            echo ""
            echo "===== template default usado (para referencia futura) ====="
            find /usr/local/hestia/data/templates/dns -iname "*default*" 2>&1
            cat /usr/local/hestia/data/templates/dns/default.tpl 2>&1 || echo "sem template default.tpl"

            echo ""
            echo "===== limpa a zona de teste ====="
            "$BIN/v-delete-dns-domain" vdadmin "$TEST_DOMAIN" 2>&1

            echo ""
            echo "===== confirma que ficou mesmo limpo ====="
            "$BIN/v-list-dns-domains" vdadmin 2>&1
