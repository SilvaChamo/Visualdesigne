name: "Ops - Fase 1i. Logs de auth, rest e storage (crash loop)"

on:
  workflow_dispatch:

jobs:
  logs:
    name: docker logs dos 3 servicos com problema
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Logs
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 3m
          script: |
            echo "===== supabase-auth (ultimas 40 linhas) ====="
            docker logs --tail 40 supabase-auth 2>&1

            echo ""
            echo "===== supabase-rest (ultimas 40 linhas) ====="
            docker logs --tail 40 supabase-rest 2>&1

            echo ""
            echo "===== supabase-storage (ultimas 40 linhas) ====="
            docker logs --tail 40 supabase-storage 2>&1

            echo ""
            echo "===== estado actual de todos os containers ====="
            docker ps -a --format "table {{.Names}}\t{{.Status}}"
