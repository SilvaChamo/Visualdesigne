name: "Ops - Fase 45. Confirma conteudo real do backup aamihe.com (23 junho)"

on:
  workflow_dispatch:

jobs:
  hetzner:
    name: hetzner
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Inspecciona
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 3m
          script: |
            set +e
            echo "===== estrutura da pasta aamihe.com dentro do backup ====="
            find /home/admin/backups/backup/aamihe.com/ -maxdepth 4 2>&1

            echo ""
            echo "===== se houver um .tar.gz dos ficheiros, ve o conteudo ====="
            find /home/admin/backups/backup/aamihe.com/ -iname "*.tar.gz" 2>&1 | while read -r f; do
              echo "--- $f ---"
              tar -tzf "$f" 2>&1 | head -30
              echo "total de ficheiros no tar:"
              tar -tzf "$f" 2>&1 | wc -l
            done

            echo ""
            echo "===== confirma que o dump sql tem mesmo dados reais (nao esta vazio/corrompido) ====="
            head -c 500 /home/admin/backups/backup/admin_aamihe_bd.sql
            echo ""
            echo "..."
            grep -c "INSERT INTO" /home/admin/backups/backup/admin_aamihe_bd.sql
