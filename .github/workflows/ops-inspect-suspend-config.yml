name: "Ops - Fase 17a. Adiciona coluna brevo_verified (Hetzner + Contabo)"

on:
  workflow_dispatch:

jobs:
  hetzner:
    name: hetzner
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Migra
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 2m
          script: |
            docker exec -i supabase-db psql -U postgres -d postgres -c "ALTER TABLE domain_renewals ADD COLUMN IF NOT EXISTS brevo_verified boolean NOT NULL DEFAULT false;"
            docker exec -i supabase-db psql -U postgres -d postgres -c "\d domain_renewals" | grep brevo_verified

  contabo:
    name: contabo
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Migra
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 2m
          script: |
            docker exec -i supabase-db psql -U postgres -d postgres -c "ALTER TABLE domain_renewals ADD COLUMN IF NOT EXISTS brevo_verified boolean NOT NULL DEFAULT false;"
            docker exec -i supabase-db psql -U postgres -d postgres -c "\d domain_renewals" | grep brevo_verified
