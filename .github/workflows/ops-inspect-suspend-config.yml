name: "Ops - Fase 48. Confirma se o DirectAdmin tem backup automatico semanal configurado"

on:
  workflow_dispatch:

jobs:
  hetzner:
    name: hetzner
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Verifica agendamento e todas as copias existentes
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 3m
          script: |
            set +e
            echo "===== ha algum backup automatico agendado no DirectAdmin (admin level)? ====="
            cat /usr/local/directadmin/data/admin/backup.conf 2>&1
            cat /usr/local/directadmin/data/users/admin/backup.conf 2>&1

            echo ""
            echo "===== crontab do sistema/root - procura tarefas de backup ====="
            crontab -l 2>&1
            cat /etc/cron.d/* 2>&1 | grep -i backup

            echo ""
            echo "===== fila de tarefas do DirectAdmin - historico recente de backups ====="
            grep -il "backup" /usr/local/directadmin/data/task.queue.* 2>/dev/null
            ls -la /usr/local/directadmin/data/admin/ 2>&1 | grep -i backup

            echo ""
            echo "===== procura QUALQUER coisa no servidor todo que pareça um backup completo (ficheiros, nao so BD) do aamihe, ultimos 90 dias ====="
            find / -xdev -maxdepth 6 \( -iname "*aamihe*.tar*" -o -iname "*aamihe*.zip" -o -iname "*aamihe*backup*" \) 2>/dev/null

            echo ""
            echo "===== opcoes de backup deste utilizador reseller/admin no proprio DA ====="
            find /usr/local/directadmin/data -iname "*.conf" 2>/dev/null | xargs grep -l "aamihe" 2>/dev/null | head -10
