name: "Ops - Fase 74. Inspecciona plugins com nomes fora do padrao (Backup/Back-Up/imunify-security)"

on:
  workflow_dispatch:

jobs:
  hetzner:
    name: hetzner
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Inspecciona
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 3m
          script: |
            set +e
            PLUGDIR=/home/admin/domains/aamihe.com/public_html/wp-content/plugins

            for name in "Backup" "Back-Up" "imunify-security"; do
              echo "===== $name ====="
              ls -la "$PLUGDIR/$name/" 2>&1 | head -15
              echo "--- ficheiros .php dentro, com data ---"
              find "$PLUGDIR/$name" -iname "*.php" 2>/dev/null | xargs stat -c '%y %n' 2>&1 | sort | head -10
              echo ""
            done

            echo "===== conteudo do modulo updater do pro-elements (para onde ele liga?) ====="
            find "$PLUGDIR/pro-elements/updater" -type f 2>&1
            grep -rEo "https?://[a-zA-Z0-9./_-]+" "$PLUGDIR/pro-elements/updater" 2>/dev/null | sort -u | head -20

            echo ""
            echo "===== pasta license do pro-elements (mexida hoje) ====="
            find "$PLUGDIR/pro-elements/license" -type f 2>&1
