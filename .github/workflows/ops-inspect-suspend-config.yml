name: "Ops - Fase 3b. Le o nginx.ssl.conf real (padrao proxy a copiar)"

on:
  workflow_dispatch:

jobs:
  inspect:
    name: conteudo do template nodejs usado por teste.visualdesignmoz.com
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Inspecciona
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 3m
          script: |
            echo "===== v-list-web-domain vdadmin teste.visualdesignmoz.com (template usado) ====="
            /usr/local/hestia/bin/v-list-web-domain vdadmin teste.visualdesignmoz.com json

            echo ""
            echo "===== nginx.ssl.conf real (o que faz o proxy) ====="
            cat /home/vdadmin/conf/web/teste.visualdesignmoz.com/nginx.ssl.conf

            echo ""
            echo "===== nginx.conf (porta 80, redireciona para ssl) ====="
            cat /home/vdadmin/conf/web/teste.visualdesignmoz.com/nginx.conf
