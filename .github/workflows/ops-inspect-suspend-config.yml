name: "Ops - Fase 18a. Investiga zona Cloudflare + nameservers entrecamposblog.com (so leitura)"

on:
  workflow_dispatch:

jobs:
  contabo:
    name: contabo
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Investiga
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            cd /opt/visualdesign-site-teste
            CF_EMAIL=$(grep '^CLOUDFLARE_EMAIL=' .env.local | cut -d= -f2-)
            CF_KEY=$(grep '^CLOUDFLARE_GLOBAL_API_KEY=' .env.local | cut -d= -f2-)
            echo "::add-mask::$CF_KEY"
            DYN_KEY=$(grep '^DYNADOT_API_KEY=' .env.local | cut -d= -f2-)
            DYN_SECRET=$(grep '^DYNADOT_SECRET_KEY=' .env.local | cut -d= -f2-)
            echo "::add-mask::$DYN_KEY"
            echo "::add-mask::$DYN_SECRET"

            echo "===== ZONA CLOUDFLARE (procura por nome) ====="
            ZONE_JSON=$(curl -sS -H "X-Auth-Email: $CF_EMAIL" -H "X-Auth-Key: $CF_KEY" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/zones?name=entrecamposblog.com")
            echo "$ZONE_JSON"
            ZONE_ID=$(echo "$ZONE_JSON" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const j=JSON.parse(d);console.log(j.result && j.result[0] ? j.result[0].id : '');}catch(e){console.log('');}})")
            echo ""
            echo "ZONE_ID=$ZONE_ID"

            if [ -n "$ZONE_ID" ]; then
              echo ""
              echo "===== REGISTOS DNS NA ZONA ====="
              curl -sS -H "X-Auth-Email: $CF_EMAIL" -H "X-Auth-Key: $CF_KEY" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?per_page=100"
            fi

            echo ""
            echo ""
            echo "===== NAMESERVERS REAIS NO DYNADOT (registador) ====="
            curl -sS "https://api.dynadot.com/restful/v1/domains/entrecamposblog.com/nameservers?key=${DYN_KEY}"

            echo ""
            echo ""
            echo "===== dig NS PUBLICO ====="
            dig +short NS entrecamposblog.com
            echo "===== dig A PUBLICO ====="
            dig +short A entrecamposblog.com
