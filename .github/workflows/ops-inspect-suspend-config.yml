name: "Ops - Fase 75. Aplica bloqueios de seguranca seguros (nao apaga nada)"

on:
  workflow_dispatch:

jobs:
  hetzner:
    name: hetzner
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Aplica bloqueios
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 3m
          script: |
            set +e
            ROOT=/home/admin/domains/aamihe.com/public_html

            echo "===== impede editar plugins/temas pelo wp-admin (mesmo que um admin seja comprometido, nao pode injectar codigo por ali) ====="
            if ! grep -q "DISALLOW_FILE_EDIT" "$ROOT/wp-config.php" 2>/dev/null; then
              cp "$ROOT/wp-config.php" "/root/security-quarantine/wp-config-antes-hardening-$(date +%Y%m%d-%H%M%S).bak"
              sed -i "/\/\* That's all, stop editing/i define( 'DISALLOW_FILE_EDIT', true );" "$ROOT/wp-config.php"
              echo "adicionado"
            else
              echo "ja tinha"
            fi
            grep -i "DISALLOW_FILE_EDIT" "$ROOT/wp-config.php"

            echo ""
            echo "===== impede executar php dentro da pasta uploads (onde ficam imagens, nao deviam la existir programas) ====="
            if ! grep -q "Deny from all" "$ROOT/wp-content/uploads/.htaccess" 2>/dev/null; then
              printf '\n%s\n' "# Bloqueia execucao de PHP dentro de uploads (seguranca)" >> "$ROOT/wp-content/uploads/.htaccess"
              printf '%s\n' "<FilesMatch \"\.(php|phtml|php3|php4|php5|php7|pl|py|cgi)\$\">" >> "$ROOT/wp-content/uploads/.htaccess"
              printf '%s\n' "Order Allow,Deny" >> "$ROOT/wp-content/uploads/.htaccess"
              printf '%s\n' "Deny from all" >> "$ROOT/wp-content/uploads/.htaccess"
              printf '%s\n' "</FilesMatch>" >> "$ROOT/wp-content/uploads/.htaccess"
              echo "adicionado"
            else
              echo "ja tinha"
            fi

            echo ""
            echo "===== confirma se ha algum ficheiro .php escondido dentro de uploads (nao deveria existir nenhum) ====="
            find "$ROOT/wp-content/uploads" -iname "*.php" 2>&1

            echo ""
            echo "===== confirma versao do WordPress e do PHP (para saberes se estao actualizados) ====="
            /usr/local/bin/wp --allow-root --path="$ROOT" core version 2>&1
            php83 -v 2>&1 | head -1
