name: "Ops - Fase 18d. Investiga bucket real + servidor Hetzner por entrecampos (so leitura)"

on:
  workflow_dispatch:

jobs:
  contabo:
    name: contabo
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Investiga bucket Contabo
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 5m
          script: |
            set +e
            echo "===== buckets existentes no Contabo ====="
            docker exec -i supabase-db psql -U postgres -d postgres -t -A -c "select id, name from storage.buckets;"

            echo ""
            echo "===== objectos no storage com 'entrecampos' no nome ====="
            docker exec -i supabase-db psql -U postgres -d postgres -t -A -F' | ' -c "select bucket_id, name, created_at from storage.objects where name ilike '%entrecampos%' order by created_at desc;"

            echo ""
            echo "===== todos os objectos de qualquer bucket de backups (amostra 30) ====="
            docker exec -i supabase-db psql -U postgres -d postgres -t -A -F' | ' -c "select bucket_id, name from storage.objects where bucket_id ilike '%backup%' order by created_at desc limit 30;"

  hetzner:
    name: hetzner
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Investiga servidor Hetzner/DA
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set +e
            echo "===== backup sql em /home/admin/backups ====="
            ls -la /home/admin/backups/backup/ 2>&1 | grep -i entrecampos
            find / -maxdepth 6 -iname "*entrecampos*" 2>/dev/null

            echo ""
            echo "===== dominios da conta admin no DirectAdmin ====="
            ls -la /home/admin/domains/ 2>&1

            echo ""
            echo "===== buckets/objectos no storage do Hetzner com entrecampos ====="
            docker exec -i supabase-db psql -U postgres -d postgres -t -A -F' | ' -c "select bucket_id, name, created_at from storage.objects where name ilike '%entrecampos%' order by created_at desc;" 2>&1
