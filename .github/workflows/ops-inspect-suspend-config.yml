name: "Ops - Fase 33. Porque a lista Sites continua vazia mesmo apos a correcao"

on:
  workflow_dispatch:

jobs:
  contabo:
    name: contabo
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Investiga
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 3m
          script: |
            set +e
            echo "===== o build publicado tem mesmo a correcao? ====="
            grep -rl "O admin gere contas em mais" /opt/visualdesign-site-teste/.next/server/ 2>/dev/null
            echo "(vazio acima = a correcao NAO esta no build publicado)"

            echo ""
            echo "===== data/hora do build actual ====="
            date -r /opt/visualdesign-site-teste/.next/BUILD_ID 2>&1
            cat /opt/visualdesign-site-teste/.next/BUILD_ID 2>&1
            echo ""
            date

            echo ""
            echo "===== panel_sites completo (todos os dominios e donos) ====="
            docker exec -i supabase-db psql -U postgres -d postgres -t -A -F' | ' -c "select domain, owner, status from panel_sites order by domain;"

            echo ""
            echo "===== logs recentes do pm2 - procura por erros no wp-update ====="
            pm2 logs visualdesign-site-teste --lines 500 --nostream 2>&1 | grep -i "wp-update\|Conta de revenda\|panel-mirror\|listWebsites\|Erro ao listar\|resolvePanelWpScope\|role" | tail -40
