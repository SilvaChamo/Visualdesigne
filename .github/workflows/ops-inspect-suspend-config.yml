name: "Ops - Fase 19e. Confirma se o dominio ja foi criado apesar do timeout (so leitura)"

on:
  workflow_dispatch:

jobs:
  contabo:
    name: contabo
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Verifica
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 5m
          script: |
            set +e
            echo "===== dominios da conta vdadmin no Hestia ====="
            /usr/local/hestia/bin/v-list-web-domains vdadmin plain 2>&1

            echo ""
            echo "===== pasta do site (se existir) ====="
            ls -la /home/vdadmin/web/entrecamposblog.com/ 2>&1

            echo ""
            echo "===== ultimas linhas do log de sistema do hestia (nginx/apache reload, letsencrypt) ====="
            tail -60 /var/log/hestia/nginx-error.log 2>&1 | tail -20
            tail -20 /usr/local/hestia/log/system.log 2>&1

            echo ""
            echo "===== processos hestia ainda a correr (bloqueados?) ====="
            ps aux | grep -i "v-add\|letsencrypt\|certbot" | grep -v grep
