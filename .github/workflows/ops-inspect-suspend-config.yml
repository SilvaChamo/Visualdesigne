name: "Ops - Fase 66. Mesma limpeza (filefuns.php + htaccess) na copia aamihe do Contabo"

on:
  workflow_dispatch:

jobs:
  contabo:
    name: contabo
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Localiza, isola e repoe
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 3m
          script: |
            set +e
            echo "===== localiza a pasta do site aamihe.com no Contabo ====="
            CANDIDATES=$(find /home -maxdepth 4 -type d -iname "aamihe.com" 2>/dev/null)
            echo "$CANDIDATES"
            ROOT=""
            for d in $CANDIDATES; do
              if [ -d "$d/public_html" ]; then ROOT="$d/public_html"; break; fi
            done
            echo "ROOT escolhido: $ROOT"
            if [ -z "$ROOT" ]; then echo "NAO ENCONTREI a pasta - parar aqui"; exit 0; fi

            QDIR="/root/security-quarantine/aamihe.com-contabo-$(date +%Y%m%d-%H%M%S)"
            mkdir -p "$QDIR"
            FOUNDLIST=/tmp/aamihe_found_c_$$.txt
            rm -f "$FOUNDLIST"
            touch "$FOUNDLIST"

            echo "===== .htaccess actual na raiz (para ver se e' o mesmo padrao malicioso) ====="
            head -c 500 "$ROOT/.htaccess" 2>&1

            echo ""
            echo "===== procura os mesmos nomes suspeitos ====="
            NAMES="filefuns.php chtmlfuns.php cjfuns.php classsmtps.php classfuns.php comfunctions.php comdofuns.php connects.php copypaths.php delpaths.php doiconvs.php epinyins.php gdftps.php hinfofuns.php hplfuns.php memberfuns.php moddofuns.php onclickfuns.php phpzipincs.php qfunctions.php qinfofuns.php schallfuns.php tempfuns.php userfuns.php siteheads.php termps.php txets.php thoms.php postnews.php system_log.php inputs.php adminfuns.php"
            for n in $NAMES; do find "$ROOT" -type f -iname "$n" 2>/dev/null >> "$FOUNDLIST"; done
            cat "$FOUNDLIST"

            echo "===== isola os ficheiros encontrados ====="
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              rel=$(echo "$f" | sed "s#^$ROOT/##")
              destdir="$QDIR/$(dirname "$rel")"
              mkdir -p "$destdir"
              mv "$f" "$QDIR/$rel"
              echo "isolado: $f"
            done < "$FOUNDLIST"

            echo "===== se o .htaccess tiver o mesmo padrao malicioso (FilesMatch com filefuns/chtmlfuns), substitui por um limpo ====="
            if grep -q "filefuns\|chtmlfuns\|cjfuns" "$ROOT/.htaccess" 2>/dev/null; then
              cp "$ROOT/.htaccess" "$QDIR/htaccess-raiz.bak"
              printf '%s\n' "# BEGIN WordPress" > "$ROOT/.htaccess"
              printf '%s\n' "<IfModule mod_rewrite.c>" >> "$ROOT/.htaccess"
              printf '%s\n' "RewriteEngine On" >> "$ROOT/.htaccess"
              printf '%s\n' "RewriteBase /" >> "$ROOT/.htaccess"
              printf '%s\n' "RewriteRule ^index\.php$ - [L]" >> "$ROOT/.htaccess"
              printf '%s\n' "RewriteCond %{REQUEST_FILENAME} !-f" >> "$ROOT/.htaccess"
              printf '%s\n' "RewriteCond %{REQUEST_FILENAME} !-d" >> "$ROOT/.htaccess"
              printf '%s\n' "RewriteRule . /index.php [L]" >> "$ROOT/.htaccess"
              printf '%s\n' "</IfModule>" >> "$ROOT/.htaccess"
              printf '%s\n' "# END WordPress" >> "$ROOT/.htaccess"
              chmod 644 "$ROOT/.htaccess"
              echo "htaccess da raiz substituido"
            else
              echo "htaccess da raiz nao tem o padrao malicioso, nao mexi"
            fi

            if [ -f "$ROOT/wp-admin/.htaccess" ] && grep -q "filefuns\|chtmlfuns\|cjfuns" "$ROOT/wp-admin/.htaccess" 2>/dev/null; then
              mkdir -p "$QDIR/wp-admin"
              mv "$ROOT/wp-admin/.htaccess" "$QDIR/wp-admin/.htaccess"
              echo "wp-admin/.htaccess isolado"
            fi

            echo "===== confirma quarentena ====="
            find "$QDIR" -type f 2>&1
            rm -f "$FOUNDLIST"
