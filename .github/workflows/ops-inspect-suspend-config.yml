name: "Ops - Fase 5a. Inventario real: dominios da oshercollective e da admin no Hetzner"

on:
  workflow_dispatch:

jobs:
  inspect:
    name: so leitura no Hetzner
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Inventario (so leitura)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 3m
          script: |
            echo "===== Utilizadores DirectAdmin reais no servidor ====="
            ls /usr/local/directadmin/data/users/ 2>/dev/null || ls /home/ 2>/dev/null

            echo ""
            echo "===== Dominios do utilizador admin (sites proprios da VisualDesign) ====="
            ls -la /home/admin/domains/ 2>&1

            echo ""
            echo "===== Tamanho de cada um ====="
            du -sh /home/admin/domains/*/public_html 2>&1

            echo ""
            echo "===== Dominios do utilizador oshercollective ====="
            ls -la /home/oshercollective/domains/ 2>&1

            echo ""
            echo "===== Tamanho de elimservicos.com e shalomdeco.com (os que faltam no Hestia) ====="
            du -sh /home/oshercollective/domains/elimservicos.com/public_html 2>&1
            du -sh /home/oshercollective/domains/shalomdeco.com/public_html 2>&1

            echo ""
            echo "===== Bases de dados MySQL de cada conta (para saber se precisam de copiar tambem) ====="
            mysql -u root -e "SHOW DATABASES;" 2>&1 || echo "sem acesso directo ao mysql root"
