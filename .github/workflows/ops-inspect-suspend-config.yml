name: "Ops - Fase 88. Porque as noticias/blog nao aparecem + estado real do jet-engine"

on:
  workflow_dispatch:

jobs:
  hetzner:
    name: hetzner
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Investiga
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 3m
          script: |
            set +e
            ROOT=/home/admin/domains/aamihe.com/public_html
            WP="/usr/local/bin/wp --allow-root --path=$ROOT"

            echo "===== estado REAL do jet-engine/jet-elements agora (pastas no disco) ====="
            ls -la "$ROOT/wp-content/plugins/" 2>&1 | grep -i jet
            find "$ROOT/wp-content/plugins/jet-engine" -maxdepth 1 -iname "*.php" 2>&1
            find "$ROOT/wp-content/plugins/jet-elements" -maxdepth 1 -iname "*.php" 2>&1

            echo ""
            echo "===== todos os plugins reconhecidos pelo wordpress agora ====="
            $WP plugin list 2>&1

            echo ""
            echo "===== quantas noticias/posts existem, e com que estado ====="
            $WP post list --post_type=post --format=count 2>&1
            $WP post list --post_type=post --fields=ID,post_title,post_status,post_date --format=table 2>&1 | head -15

            echo ""
            echo "===== testa a pagina de blog directamente ====="
            curl -sSL --max-time 15 https://aamihe.com/blog/ -o /tmp/blog.html 2>&1
            echo "tamanho: $(wc -c < /tmp/blog.html) bytes"
            grep -c "post-" /tmp/blog.html 2>&1

            echo ""
            echo "===== erro php ao carregar a pagina de blog agora ====="
            tail -n 30 /var/log/httpd/domains/aamihe.com.error.log 2>&1 | tail -20
