name: "Ops - Fase 14a. Verifica config Google OAuth no Supabase Contabo (so leitura)"

on:
  workflow_dispatch:

jobs:
  verify:
    name: verifica gotrue google oauth
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Verifica
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 2m
          script: |
            ENV_FILE=/opt/supabase-contabo/docker/.env
            echo "===== variaveis GOTRUE_EXTERNAL_GOOGLE_* (so nomes + presente/vazio, nunca valores) ====="
            if [ -f "$ENV_FILE" ]; then
              grep -E "^GOTRUE_EXTERNAL_GOOGLE_" "$ENV_FILE" | sed -E 's/=.*/=<definido>/; s/^([A-Z_]+)=<definido>$/\1=<definido>/' | while IFS='=' read -r k v; do
                val=$(grep "^$k=" "$ENV_FILE" | cut -d'=' -f2-)
                if [ -z "$val" ]; then echo "$k = (vazio)"; else echo "$k = (tem valor, ${#val} caracteres)"; fi
              done
            else
              echo "ficheiro .env nao encontrado em $ENV_FILE"
            fi

            echo ""
            echo "===== container auth: variaveis de ambiente reais a correr (so nomes) ====="
            docker inspect supabase-auth --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null | grep -i google | sed -E 's/=.*/=<oculto>/'

            echo ""
            echo "===== outros providers externos activos, para comparar ====="
            grep -E "^GOTRUE_EXTERNAL_[A-Z]+_ENABLED=" "$ENV_FILE" 2>/dev/null
