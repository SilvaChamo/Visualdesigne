name: "Ops - Fase 95. SO LEITURA - confirma se as bases de dados do hetzner tem conteudo"

on:
  workflow_dispatch:

jobs:
  hetzner:
    name: hetzner
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: So leitura
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 2m
          script: |
            set +e
            for db in oshercollective_wp_oshercollective_com oshercollective_wp_msdn-moz_org oshercollective_wp_lirandzojewelry_com; do
              echo "===== $db ====="
              mysql "$db" -e "SELECT COUNT(*) AS posts FROM wp_posts WHERE post_status='publish';" 2>&1
              mysql "$db" -e "SELECT option_value FROM wp_options WHERE option_name='siteurl';" 2>&1
              mysql "$db" -e "SELECT MAX(post_modified) FROM wp_posts;" 2>&1
            done
