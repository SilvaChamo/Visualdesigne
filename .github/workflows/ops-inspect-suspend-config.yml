name: "Ops - Fase 21f. Corrige .env.local de novo e confirma sync do entrecamposblog"

on:
  workflow_dispatch:

jobs:
  contabo:
    name: contabo
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Corrige e confirma
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 5m
          script: |
            set +e
            NEWPASS='Administrador-hest2026'
            echo "::add-mask::$NEWPASS"

            cd /opt/visualdesign-site-teste
            if grep -q '^HESTIA_PASSWORD=' .env.local; then
              sed -i "s|^HESTIA_PASSWORD=.*|HESTIA_PASSWORD=${NEWPASS}|" .env.local
            else
              echo "HESTIA_PASSWORD=${NEWPASS}" >> .env.local
            fi
            echo "===== .env.local corrigido de novo ====="

            pm2 restart visualdesign-site-teste
            sleep 4

            CRON_SECRET_VALUE=$(grep '^CRON_SECRET=' .env.local | cut -d= -f2-)
            echo "::add-mask::$CRON_SECRET_VALUE"

            echo ""
            echo "===== dispara hestia-sync ====="
            curl -sS -w "\nHTTP_STATUS:%{http_code}\n" --max-time 60 -H "Host: teste.visualdesignmoz.com" -H "Authorization: Bearer ${CRON_SECRET_VALUE}" http://127.0.0.1:3002/api/cron/hestia-sync

            echo ""
            echo "===== panel_sites: sites do vdadmin ====="
            docker exec -i supabase-db psql -U postgres -d postgres -t -A -F' | ' -c "select domain, owner, status, package from panel_sites where owner = 'vdadmin' order by domain;"
