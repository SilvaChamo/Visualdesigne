name: "Ops - Fase 55. Descobre o prefixo real das tabelas e avalia se a bd actual e boa"

on:
  workflow_dispatch:

jobs:
  hetzner:
    name: hetzner
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Verifica
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 3m
          script: |
            set +e
            echo "===== todas as tabelas da base actual ====="
            mysql -u root admin_aamihe_bd -e "show tables;" 2>&1

            echo ""
            echo "===== procura a tabela de posts, seja qual for o prefixo ====="
            mysql -u root admin_aamihe_bd -e "select table_name from information_schema.tables where table_schema='admin_aamihe_bd' and table_name like '%posts%';" 2>&1
            mysql -u root admin_aamihe_bd -e "select table_name from information_schema.tables where table_schema='admin_aamihe_bd' and table_name like '%users%';" 2>&1
            mysql -u root admin_aamihe_bd -e "select table_name from information_schema.tables where table_schema='admin_aamihe_bd' and table_name like '%options%';" 2>&1
