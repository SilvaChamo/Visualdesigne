name: "Ops - Fase 39. Aamihe.com - testa https com SNI certo + php-fpm logs"

on:
  workflow_dispatch:

jobs:
  hetzner:
    name: hetzner
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Testa via HTTPS/SNI certo
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 3m
          script: |
            set +e
            echo "===== https directo, com SNI certo ====="
            curl -sSk --max-time 10 --resolve aamihe.com:443:127.0.0.1 https://aamihe.com/ -o /tmp/body.html -w "HTTP %{http_code} | bytes: %{size_download}\n"
            echo "--- primeiros 1000 bytes do corpo ---"
            head -c 1000 /tmp/body.html
            echo ""

            echo ""
            echo "===== index real do site (o que existe) ====="
            ls -la /home/admin/domains/aamihe.com/public_html/ 2>&1 | head -20

            echo ""
            echo "===== versao do php desta conta ====="
            cat /home/admin/domains/aamihe.com/private/php_version 2>&1
            find /etc/php* -maxdepth 1 -type d 2>/dev/null

            echo ""
            echo "===== erro php mais recente, sem filtro de data ====="
            tail -n 40 /var/log/httpd/domains/aamihe.com.error.log 2>&1 | tail -15

            echo ""
            echo "===== teste directo do php-cli para ver o erro real ====="
            cd /home/admin/domains/aamihe.com/public_html/ && sudo -u admin php index.php 2>&1 | head -c 2000
