name: "Ops - Fase 85. Confirma backup de uploads ainda no servidor e repoe imagens"

on:
  workflow_dispatch:

jobs:
  hetzner:
    name: hetzner
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Confirma backup
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 3m
          script: |
            set +e
            echo "===== ainda existe o backup de uploads que transferi antes? ====="
            ls -la /root/aamihe-restore/ 2>&1

            echo ""
            echo "===== o que tem la dentro (sem descompactar ainda) ====="
            unzip -l /root/aamihe-restore/uploads.zip 2>&1 | head -20
            unzip -l /root/aamihe-restore/uploads.zip 2>&1 | tail -5
