name: Ops - verifica integridade do .env.local no Contabo

on:
  workflow_dispatch:

jobs:
  check:
    name: Procura linhas corrompidas/concatenadas no .env.local
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Inspecciona .env.local
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 2m
          script: |
            cd /opt/visualdesign-site-teste
            echo "===== total de linhas ====="
            wc -l .env.local
            echo ""
            echo "===== linhas com HESTIA (nomes de chave e comprimento do valor, sem mostrar o valor) ====="
            grep -n "^HESTIA_" .env.local | sed -E 's/=(.*)$/=<\1_LEN:'"'"'&'"'"'>/' | awk -F= '{print $1, "len="length($2)}'
            echo ""
            echo "===== linhas suspeitas (mais que uma chave=valor na mesma linha, ou linha sem = logo a seguir a uma var) ====="
            grep -nE "=[^=]*[A-Z_]{3,}=" .env.local | grep -v "^[0-9]*:#"
            echo ""
            echo "===== ultimos 3 bytes do ficheiro em hex (para ver se acaba em newline) ====="
            tail -c 3 .env.local | xxd
            echo ""
            echo "===== conta quantas vezes cada chave HESTIA aparece (deve ser 1x cada) ====="
            grep -oE "^[A-Z_]+=" .env.local | sort | uniq -c | sort -rn | grep -i hestia
