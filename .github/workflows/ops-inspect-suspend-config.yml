name: "Ops - Fase 1m. Logs do pooler + confirma o que esta na porta 8000"

on:
  workflow_dispatch:

jobs:
  diag:
    name: pooler logs + ss real
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Diagnostico
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 3m
          script: |
            echo "===== docker logs supabase-pooler (ultimas 40) ====="
            docker logs --tail 40 supabase-pooler 2>&1

            echo ""
            echo "===== ss -tlnp real, 5432/6543/8000 ====="
            ss -tlnp | grep -E ':5432|:6543|:8000'

            echo ""
            echo "===== curl outra vez, com mais espera ====="
            sleep 10
            curl -sv -o /dev/null http://127.0.0.1:8000/rest/v1/ 2>&1 | tail -20

            echo ""
            echo "===== docker logs supabase-envoy (ultimas 20) ====="
            docker logs --tail 20 supabase-envoy 2>&1
