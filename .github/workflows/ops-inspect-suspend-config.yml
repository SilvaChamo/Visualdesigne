name: "Ops - Fase 71. Isola o .htaccess malicioso na pasta pai (fora do public_html)"

on:
  workflow_dispatch:

jobs:
  hetzner:
    name: hetzner
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Isola htaccess da pasta pai
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 3m
          script: |
            set +e
            PARENT=/home/admin/domains/aamihe.com
            QDIR="/root/security-quarantine/aamihe.com-hetzner-parent-$(date +%Y%m%d-%H%M%S)"
            mkdir -p "$QDIR"

            echo "===== isola o .htaccess da pasta pai (fora do public_html, nao precisa de nenhum) ====="
            if [ -f "$PARENT/.htaccess" ]; then
              mv "$PARENT/.htaccess" "$QDIR/htaccess-pasta-pai.bak"
              echo "isolado: $PARENT/.htaccess"
            else
              echo "ja nao existe (alguem ja tratou?)"
            fi

            echo ""
            echo "===== confirma que ja nao ha .htaccess nenhum nesta pasta pai ====="
            ls -la "$PARENT/" | grep htaccess

            echo ""
            echo "===== testa o link real de SSO outra vez ====="
            sleep 2
            curl -sS -o /dev/null -w "HTTP:%{http_code}\n" --max-time 10 "https://aamihe.com/wp-da-sso-k8ZRgIWc-Oz_YgM1nurVYJnatanPAGra.php" 2>&1

            echo ""
            echo "===== testa tambem um ficheiro real do wp-includes que estava a ser negado antes ====="
            curl -sS -o /dev/null -w "HTTP:%{http_code}\n" --max-time 10 "https://aamihe.com/wp-admin/" 2>&1
            curl -sS -o /dev/null -w "HTTP:%{http_code}\n" --max-time 10 "https://aamihe.com/wp-login.php" 2>&1
