name: "Ops - Fase 1n. Recria containers com --force-recreate (sem tocar em dados)"

on:
  workflow_dispatch:

jobs:
  fix:
    name: force-recreate envoy e pooler
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Force recreate
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 4m
          script: |
            set -e
            cd /opt/supabase-contabo/docker

            echo "===== force-recreate de todos os containers (dados do postgres ficam intactos) ====="
            docker compose up -d --force-recreate

            echo ""
            echo "===== Espera 45s ====="
            sleep 45

            echo ""
            echo "===== Estado final ====="
            docker ps -a --format "table {{.Names}}\t{{.Status}}"

            echo ""
            echo "===== curl ao gateway ====="
            curl -s -o /dev/null -w "gateway HTTP %{http_code}\n" http://127.0.0.1:8000/rest/v1/ || echo "gateway nao responde"

            echo ""
            echo "===== logs do pooler, se ainda falhar ====="
            docker logs --tail 15 supabase-pooler 2>&1
