name: "Ops - Fase 87. Investiga secoes vazias na pagina conferencia"

on:
  workflow_dispatch:

jobs:
  hetzner:
    name: hetzner
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Investiga
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 3m
          script: |
            set +e
            ROOT=/home/admin/domains/aamihe.com/public_html
            WP="/usr/local/bin/wp --allow-root --path=$ROOT"

            echo "===== estado actual dos plugins jet (o utilizador instalou agora) ====="
            $WP plugin list 2>&1 | grep -i "jet"

            echo ""
            echo "===== id e dados basicos da pagina conferencia ====="
            $WP post list --name=conferencia --post_type=page --fields=ID,post_title,post_status 2>&1

            echo ""
            echo "===== erros php recentes (ultimos 2 min, deve apanhar o carregamento desta pagina) ====="
            tail -n 60 /var/log/httpd/domains/aamihe.com.error.log 2>&1 | grep -i "fatal\|jet-engine\|jet-elements\|conferencia" | tail -20

            echo ""
            echo "===== widgets usados nessa pagina (que tipo de conteudo e) ====="
            PAGEID=$($WP post list --name=conferencia --post_type=page --field=ID 2>&1 | head -1)
            echo "page id: $PAGEID"
            $WP post meta get "$PAGEID" _elementor_data 2>&1 | grep -oE '"widgetType":"[^"]*"' | sort -u | head -20
