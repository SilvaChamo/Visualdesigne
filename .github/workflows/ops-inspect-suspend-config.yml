name: "Ops - Fase 20b. Diagnostica tela branca no site (so leitura)"

on:
  workflow_dispatch:

jobs:
  contabo:
    name: contabo
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Verifica
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 5m
          script: |
            set +e
            echo "===== PM2 status ====="
            pm2 jlist | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8'));for(const p of d) console.log(p.name,'| status:',p.pm2_env.status,'| restarts:',p.pm2_env.restart_time,'| unstable:',p.pm2_env.unstable_restarts,'| uptime desde:',new Date(p.pm2_env.pm_uptime).toISOString())"

            echo ""
            echo "===== ultimas 40 linhas do log de erro ====="
            pm2 logs visualdesign-site-teste --lines 40 --nostream --err 2>&1 | tail -50

            echo ""
            echo "===== resposta real da homepage (primeiros 300 caracteres do HTML) ====="
            curl -sS https://teste.visualdesignmoz.com/ --max-time 15 | head -c 300
            echo ""

            echo ""
            echo "===== estado do build (.next existe? quando foi feito?) ====="
            cd /opt/visualdesign-site-teste
            ls -la .next/BUILD_ID 2>&1
            date -r .next/BUILD_ID 2>&1
