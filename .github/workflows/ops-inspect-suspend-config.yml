name: "Ops - Fase 90. Confirma os IPs reais dos dois servidores"

on:
  workflow_dispatch:

jobs:
  hetzner:
    name: hetzner
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: IP do Hetzner
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 2m
          script: |
            echo "HETZNER_HOST configurado como: ${{ secrets.HETZNER_HOST }}"
            hostname -I 2>&1
            curl -s https://api.ipify.org 2>&1
            echo ""
            echo "--- vhosts que respondem a oshercollective neste servidor ---"
            grep -ril "oshercollective" /usr/local/directadmin/data/users/*/httpd.conf 2>/dev/null

  contabo:
    name: contabo
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: IP do Contabo
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 2m
          script: |
            echo "CONTABO_HOST configurado como: ${{ secrets.CONTABO_HOST }}"
            hostname -I 2>&1
            curl -s https://api.ipify.org 2>&1
            echo ""
            echo "--- dominios reais desta conta oshercollective ---"
            cat /usr/local/hestia/data/users/oshercollective/web.conf 2>&1 | grep -oE "DOMAIN='[^']*'"
