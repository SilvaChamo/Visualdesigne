name: "Ops - Fase 31. Instala wp-cli e instala WordPress a serio em entrecamposblog.com"

on:
  workflow_dispatch:

jobs:
  contabo:
    name: contabo
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Instala wp-cli e WordPress
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 5m
          script: |
            set +e
            WP_PASS='BIVrY4JrpOWMytn9bp'
            DB_PASS='cdp8v0rOjtQSno4vx0'
            echo "::add-mask::$WP_PASS"
            echo "::add-mask::$DB_PASS"

            echo "===== 1. instala wp-cli (ferramenta oficial wp-cli.org) ====="
            if [ ! -f /usr/local/bin/wp ]; then
              curl -sS -o /usr/local/bin/wp https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
              chmod +x /usr/local/bin/wp
            fi
            /usr/local/bin/wp --version --allow-root

            echo ""
            echo "===== 2. limpa a página placeholder do Hestia ====="
            rm -f /home/vdadmin/web/entrecamposblog.com/public_html/index.html
            rm -f /home/vdadmin/web/entrecamposblog.com/public_html/robots.txt

            echo ""
            echo "===== 3. cria a base de dados no Hestia ====="
            /usr/local/hestia/bin/v-add-database vdadmin entrecampos_wp entrecampos_wp "$DB_PASS" mysql 2>&1
            echo "exit: $?"

            echo ""
            echo "===== 4. instala o WordPress a sério (wp-cli) ====="
            WPPATH=/home/vdadmin/web/entrecamposblog.com/public_html
            sudo -u vdadmin /usr/local/bin/wp --path="$WPPATH" core download --locale=pt_PT 2>&1
            sudo -u vdadmin /usr/local/bin/wp --path="$WPPATH" config create --dbname=vdadmin_entrecampos_wp --dbuser=vdadmin_entrecampos_wp --dbpass="$DB_PASS" --dbhost=localhost --skip-check 2>&1
            sudo -u vdadmin /usr/local/bin/wp --path="$WPPATH" core install --url="https://entrecamposblog.com" --title="Entre Campos Blog" --admin_user=vdwpadmin --admin_password="$WP_PASS" --admin_email="silva.chamo@gmail.com" --skip-email 2>&1

            echo ""
            echo "===== 5. confirma ====="
            sudo -u vdadmin /usr/local/bin/wp --path="$WPPATH" core version 2>&1
            chown -R vdadmin:vdadmin "$WPPATH"

      - name: Confirma o site real (fora da SSH, via HTTPS público)
        run: |
          sleep 3
          curl -sSL -o /dev/null -w "https://entrecamposblog.com -> HTTP %{http_code}\n" --max-time 15 https://entrecamposblog.com/
          curl -sSL --max-time 15 https://entrecamposblog.com/ 2>&1 | grep -io "<title>.*</title>" | head -1
