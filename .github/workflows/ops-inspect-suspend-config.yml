name: "Ops - Fase 69. Ve o bloco completo do Directory/FilesMatch no vhost do aamihe"

on:
  workflow_dispatch:

jobs:
  hetzner:
    name: hetzner
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Ve bloco completo
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 3m
          script: |
            set +e
            echo "===== linhas 240 a 280 do httpd.conf (primeiro vhost aamihe) ====="
            sed -n '240,280p' /usr/local/directadmin/data/users/admin/httpd.conf 2>&1

            echo ""
            echo "===== procura o ficheiro de configuracao custom por dominio (DA custom httpd) ====="
            find /usr/local/directadmin/data/users/admin -iname "*httpd*aamihe*" -o -iname "*custom*aamihe*" 2>/dev/null
            ls -la /usr/local/directadmin/data/users/admin/domains/ 2>&1 | grep -i aamihe

            echo ""
            echo "===== conteudo de um eventual ficheiro custom_httpd.conf para aamihe ====="
            find /usr/local/directadmin -iname "*aamihe*" 2>/dev/null | grep -i "conf\|custom"
