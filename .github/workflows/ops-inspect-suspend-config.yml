name: "Ops - Fase 44. Inspecciona o backup de 23 junho (antes da infeccao)"

on:
  workflow_dispatch:

jobs:
  hetzner:
    name: hetzner
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Inspecciona
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 3m
          script: |
            set +e
            echo "===== conteudo da pasta de backup ====="
            ls -la /home/admin/backups/backup/ 2>&1

            echo ""
            echo "===== procura ficheiros com aamihe no nome, em qualquer lado dessa pasta ====="
            find /home/admin/backups/backup/ -iname "*aamihe*" 2>&1

            echo ""
            echo "===== se for so um ficheiro tar/tar.gz por dominio, lista o conteudo de qualquer um relacionado com aamihe ====="
            for f in /home/admin/backups/backup/*aamihe*; do
              echo "--- $f ---"
              tar -tzf "$f" 2>&1 | head -20
            done
