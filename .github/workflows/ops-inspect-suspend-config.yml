name: "Ops - Fase 3a. Ve como o proprio teste.visualdesignmoz.com esta configurado (proxy)"

on:
  workflow_dispatch:

jobs:
  inspect:
    name: nginx config real do dominio teste (padrao a copiar)
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Inspecciona
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 3m
          script: |
            echo "===== Qual utilizador Hestia serve teste.visualdesignmoz.com ====="
            grep -rl "teste.visualdesignmoz.com" /home/*/conf/web/*/nginx*.conf 2>/dev/null

            echo ""
            echo "===== Lista de templates nginx disponiveis no Hestia ====="
            ls /usr/local/hestia/data/templates/web/nginx/

            echo ""
            echo "===== Conteudo do nginx.conf real do dominio teste (o SSL, que importa) ====="
            find /home -path "*conf/web/teste.visualdesignmoz.com*" -name "*.conf" 2>/dev/null

            echo ""
            echo "===== v-list-web-domains do utilizador admin, para ver o template usado ====="
            /usr/local/hestia/bin/v-list-web-domain admin teste.visualdesignmoz.com json 2>&1 || echo "nao esta no admin"
