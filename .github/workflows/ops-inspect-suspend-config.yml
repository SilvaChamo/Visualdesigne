name: "Ops - Fase 49. Inspecciona o backup semanal automatico da-backup-to-s3"

on:
  workflow_dispatch:

jobs:
  hetzner:
    name: hetzner
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Inspecciona o script e o destino
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 3m
          script: |
            set +e
            SCRIPT=$(find / -maxdepth 4 -iname "da-backup-to-s3.sh" 2>/dev/null | head -1)
            echo "===== onde esta o script ====="
            echo "$SCRIPT"

            echo ""
            echo "===== conteudo do script (sem mostrar chaves/segredos) ====="
            cat "$SCRIPT" 2>&1 | grep -v -i "key\|secret\|password\|token"

            echo ""
            echo "===== ultimas linhas do log deste backup ====="
            tail -60 /var/log/da-backup-s3.log 2>&1

            echo ""
            echo "===== backup_crons.list (o que esta agendado a nivel admin) ====="
            cat /usr/local/directadmin/data/admin/backup_crons.list 2>&1
