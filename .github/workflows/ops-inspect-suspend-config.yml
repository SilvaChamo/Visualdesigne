name: "Ops - Fase 111. SO LEITURA - investigacao a fundo do oshercollective.com"

on:
  workflow_dispatch:

jobs:
  hetzner:
    name: hetzner
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Investiga a fundo
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 3m
          script: |
            set +e
            WP="/usr/local/bin/wp --allow-root"
            ROOT="/home/oshercollective/domains/oshercollective.com/public_html"

            echo "===== ha processos httpd antigos (de antes do reinicio)? ====="
            date
            ps -eo pid,etimes,cmd 2>&1 | grep "[h]ttpd"

            echo ""
            echo "===== siteurl e home no wordpress ====="
            $WP option get siteurl --path="$ROOT" 2>&1
            $WP option get home --path="$ROOT" 2>&1

            echo ""
            echo "===== .htaccess na raiz deste site ====="
            cat "$ROOT/.htaccess" 2>&1

            echo ""
            echo "===== plugins activos neste site (podem ter vindo do contabo com configuracao diferente) ====="
            $WP plugin list --status=active --path="$ROOT" 2>&1

            echo ""
            echo "===== teste com verbose completo, ve a cadeia toda de redireccionamentos ====="
            curl -vL --max-time 15 --max-redirs 8 "https://oshercollective.com/" -o /dev/null 2>&1 | grep -iE "> GET|> Host|< HTTP|< location|Trying|Connected"
