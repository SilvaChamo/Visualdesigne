name: "Ops - Fase 6d. Confirma dono real de aamihe.com e provisualcorporate.co.mz"

on:
  workflow_dispatch:

jobs:
  inspect:
    name: so leitura
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Confirma
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 2m
          script: |
            echo "===== onde estao estes 2 dominios de facto (grep em todos os users) ====="
            grep -rl "aamihe.com" /usr/local/hestia/data/users/*/web.conf 2>/dev/null
            grep -rl "provisualcorporate.co.mz" /usr/local/hestia/data/users/*/web.conf 2>/dev/null

            echo ""
            echo "===== conteudo real, disco usado, template ====="
            find /home -maxdepth 3 -iname "aamihe.com" -type d 2>/dev/null
            find /home -maxdepth 3 -iname "provisualcorporate.co.mz" -type d 2>/dev/null
