name: Ops - reproduz chamadas repetidas ao Hestia (v-list-users)

on:
  workflow_dispatch:

jobs:
  test:
    name: Chama v-list-users 6 vezes seguidas e regista cada resposta
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Chama a API do Hestia repetidamente
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 3m
          script: |
            cd /opt/visualdesign-site-teste
            set -a
            source .env.local
            set +a
            HOST="${HESTIA_HOST}"
            PORT="${HESTIA_PORT:-8083}"
            USERN="${HESTIA_USER:-vdadmin}"
            for i in 1 2 3 4 5 6; do
              echo "===== tentativa $i ====="
              curl -sk -w "\nHTTP_STATUS:%{http_code} TIME:%{time_total}s\n" -X POST "https://${HOST}:${PORT}/api/" \
                --data-urlencode "user=${USERN}" \
                --data-urlencode "password=${HESTIA_PASSWORD}" \
                --data-urlencode "cmd=v-list-users" \
                --data-urlencode "arg1=json" | head -c 300
              echo ""
            done
            echo ""
            echo "===== ultimas 10 linhas do log de auth apos o teste ====="
            tail -n 10 /var/log/hestia/auth.log
