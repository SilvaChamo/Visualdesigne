name: "Ops - Fase 52. Aumenta limite de upload do Supabase Storage (Contabo) temporariamente"

on:
  workflow_dispatch:

jobs:
  contabo:
    name: contabo
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Aumenta limite e reinicia
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 3m
          script: |
            set +e
            echo "===== localiza o .env da stack supabase ====="
            ENVFILE=$(find /opt -maxdepth 3 -path "*supabase*/docker/.env" 2>/dev/null | head -1)
            echo "$ENVFILE"

            echo ""
            echo "===== valor actual ====="
            grep "FILE_SIZE_LIMIT" "$ENVFILE"

            echo ""
            echo "===== aumenta para 500MB (era so 50MB, a linha nem existia no .env) ====="
            if grep -q "^FILE_SIZE_LIMIT=" "$ENVFILE"; then
              sed -i "s|^FILE_SIZE_LIMIT=.*|FILE_SIZE_LIMIT=524288000|" "$ENVFILE"
            else
              echo "FILE_SIZE_LIMIT=524288000" >> "$ENVFILE"
            fi
            grep "FILE_SIZE_LIMIT" "$ENVFILE"

            echo ""
            echo "===== confirma que o docker-compose.yml referencia esta variavel ====="
            grep -n "FILE_SIZE_LIMIT" "$(dirname "$ENVFILE")/docker-compose.yml" 2>&1

            echo ""
            echo "===== reinicia o container de storage ====="
            COMPOSE_DIR=$(dirname "$ENVFILE")
            cd "$COMPOSE_DIR" && docker compose up -d storage 2>&1

            echo ""
            sleep 3
            echo "===== confirma no container ====="
            docker inspect supabase-storage --format '{{range .Config.Env}}{{println .}}{{end}}' 2>&1 | grep FILE_SIZE
