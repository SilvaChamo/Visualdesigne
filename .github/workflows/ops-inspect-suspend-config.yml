name: "Ops - Fase 32. Desfaz a instalacao WordPress de teste em entrecamposblog.com"

on:
  workflow_dispatch:

jobs:
  contabo:
    name: contabo
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Limpa tudo
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 3m
          script: |
            set +e
            echo "===== bases de dados reais da conta vdadmin ====="
            /usr/local/hestia/bin/v-list-databases vdadmin plain 2>&1

            echo ""
            echo "===== apaga a base de dados de teste ====="
            /usr/local/hestia/bin/v-delete-database vdadmin vdadmin_entrecampos_wp 2>&1
            echo "exit: $?"
            /usr/local/hestia/bin/v-delete-database vdadmin vdadmin_entrecamposblog_wpdb 2>&1
            echo "exit: $?"

            echo ""
            echo "===== apaga os ficheiros do WordPress ====="
            rm -rf /home/vdadmin/web/entrecamposblog.com/public_html/*
            rm -rf /home/vdadmin/web/entrecamposblog.com/public_html/.[!.]*

            echo ""
            echo "===== repõe a página placeholder por omissão do Hestia ====="
            cp -r /usr/local/hestia/data/templates/web/skel/public_html/. /home/vdadmin/web/entrecamposblog.com/public_html/ 2>&1
            chown -R vdadmin:vdadmin /home/vdadmin/web/entrecamposblog.com/public_html/

            echo ""
            echo "===== confirma limpo ====="
            ls -la /home/vdadmin/web/entrecamposblog.com/public_html/
            test -f /home/vdadmin/web/entrecamposblog.com/public_html/wp-config.php && echo "AINDA TEM wp-config.php!" || echo "limpo, sem wp-config.php"

      - name: Confirma via HTTPS público
        run: |
          sleep 3
          curl -sSL --max-time 15 https://entrecamposblog.com/ 2>&1 | grep -io "<title>.*</title>" | head -1
