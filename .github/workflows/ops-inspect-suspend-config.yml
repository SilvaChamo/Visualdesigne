name: "Ops - Fase 34. Porque entrecamposblog.com desapareceu da lista de sites"

on:
  workflow_dispatch:

jobs:
  contabo:
    name: contabo
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Investiga
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 3m
          script: |
            set +e
            echo "===== entrecamposblog.com ainda existe no Hestia? ====="
            /usr/local/hestia/bin/v-list-web-domain vdadmin entrecamposblog.com 2>&1

            echo ""
            echo "===== linha em panel_sites ====="
            docker exec -i supabase-db psql -U postgres -d postgres -t -A -F' | ' -c "select domain, owner, status, site_type, updated_at from panel_sites where domain = 'entrecamposblog.com';"

            echo ""
            echo "===== (se vazio acima, procura em maiúsculas/variações) ====="
            docker exec -i supabase-db psql -U postgres -d postgres -t -A -F' | ' -c "select domain, owner, status from panel_sites where domain ilike '%entrecampos%';"
