name: "Ops - Fase 13b. Estado real de entrecamposorg.com (so leitura, corrige aspas)"

on:
  workflow_dispatch:

jobs:
  verify:
    name: consulta supabase contabo
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Consulta
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 2m
          script: |
            SQL() { docker exec -i supabase-db psql -U postgres -d postgres -t -A -c "$1"; }

            echo "===== domain_renewals: qualquer coisa com 'entrecampos' ====="
            SQL "select id, user_id, domain_name, status, dns_status, created_at, expiration_date, notes from domain_renewals where domain_name ilike '%entrecampos%' order by created_at desc nulls last;"

            echo ""
            echo "===== domain_renewals: 5 mais recentes (qualquer dominio) ====="
            SQL "select domain_name, status, dns_status, created_at from domain_renewals order by created_at desc nulls last limit 5;"

            echo ""
            echo "===== checkout_sessions: mais recentes com 'entrecampos' ====="
            SQL "select id, status, created_at, items::text from checkout_sessions where items::text ilike '%entrecampos%' order by created_at desc limit 5;"

            echo ""
            echo "===== pagamentos: mais recentes com 'entrecampos' ====="
            SQL "select id, status, created_at, descricao from pagamentos where descricao ilike '%entrecampos%' order by created_at desc limit 5;"
