name: "Ops - Fase 3c. Sintaxe exacta dos comandos Hestia (so leitura)"

on:
  workflow_dispatch:

jobs:
  inspect:
    name: v-add-web-domain e v-change-web-domain-tpl --help
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Inspecciona
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 3m
          script: |
            echo "===== v-add-web-domain --help ====="
            /usr/local/hestia/bin/v-add-web-domain 2>&1 | head -20

            echo ""
            echo "===== v-change-web-domain-tpl --help ====="
            /usr/local/hestia/bin/v-change-web-domain-tpl 2>&1 | head -20

            echo ""
            echo "===== v-add-letsencrypt-domain --help ====="
            /usr/local/hestia/bin/v-add-letsencrypt-domain 2>&1 | head -20

            echo ""
            echo "===== Conteudo do template nodejs.tpl (para ver as variaveis de porta) ====="
            cat /usr/local/hestia/data/templates/web/nginx/nodejs.tpl

            echo ""
            echo "===== nodejs.stpl (versao SSL) ====="
            cat /usr/local/hestia/data/templates/web/nginx/nodejs.stpl
