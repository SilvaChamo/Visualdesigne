name: "Ops - Fase 51. Confirma limite de tamanho de upload do Supabase Storage (Contabo)"

on:
  workflow_dispatch:

jobs:
  contabo:
    name: contabo
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Verifica limite
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 3m
          script: |
            set +e
            docker inspect supabase-storage --format '{{range .Config.Env}}{{println .}}{{end}}' 2>&1 | grep -i "FILE_SIZE\|UPLOAD"
            echo ""
            df -h /var/lib/docker 2>&1
