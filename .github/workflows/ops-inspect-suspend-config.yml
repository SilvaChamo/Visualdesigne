name: Ops - verifica se oshercollective ja existe no Hestia (leitura)

on:
  workflow_dispatch:

jobs:
  check:
    name: v-list-users / v-list-user (so leitura)
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Diagnostico Hestia
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 2m
          script: |
            cd /opt/visualdesign-site-teste
            set -a
            source .env.local
            set +a
            HESTIA_PORT="${HESTIA_PORT:-8083}"
            HESTIA_USER="${HESTIA_USER:-vdadmin}"

            echo "===== Todos os utilizadores reais no Hestia ====="
            curl -sk -X POST "https://${HESTIA_HOST}:${HESTIA_PORT}/api/" \
              -d "user=${HESTIA_USER}" -d "password=${HESTIA_PASSWORD}" \
              -d "cmd=v-list-users" -d "arg1=json"
            echo ""

            echo "===== oshercollective existe? ====="
            curl -sk -X POST "https://${HESTIA_HOST}:${HESTIA_PORT}/api/" \
              -d "user=${HESTIA_USER}" -d "password=${HESTIA_PASSWORD}" \
              -d "cmd=v-list-user" -d "arg1=oshercollective" -d "arg2=json"
