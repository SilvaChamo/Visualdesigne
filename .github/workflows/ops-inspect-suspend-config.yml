name: Ops - inventario real do Hestia via SSH (leitura, sem API)

on:
  workflow_dispatch:

jobs:
  check:
    name: v-list-users / v-list-user-packages directo por SSH
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Inventario Hestia (comandos v-* directos no servidor, sem HTTP API)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 2m
          script: |
            echo "===== Todos os utilizadores Hestia reais no servidor ====="
            /usr/local/hestia/bin/v-list-users json

            echo ""
            echo "===== oshercollective existe como utilizador? ====="
            /usr/local/hestia/bin/v-list-user oshercollective json || echo "NAO EXISTE: oshercollective"

            echo ""
            echo "===== Sites/dominios dentro da conta oshercollective (se existir) ====="
            /usr/local/hestia/bin/v-list-web-domains oshercollective json || echo "SEM DOMINIOS OU CONTA NAO EXISTE"

            echo ""
            echo "===== Dominios de cada um dos 5 dominios da oshercollective, individualmente ====="
            for u in msdn-moz elimservicos lirandzojewelry shalomdeco; do
              echo "--- utilizador $u ---"
              /usr/local/hestia/bin/v-list-user "$u" json || echo "NAO EXISTE: $u"
            done

            echo ""
            echo "===== Todos os pacotes reais configurados no servidor ====="
            /usr/local/hestia/bin/v-list-user-packages json

            echo ""
            echo "===== Ficheiros de definicao dos pacotes (nomes) ====="
            ls -la /usr/local/hestia/data/packages/
