name: "Ops - Fase 2a. Inspecciona a base real no Hetzner antes de copiar (so leitura)"

on:
  workflow_dispatch:

jobs:
  inspect:
    name: bases de dados e tabelas reais no Hetzner
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Inspecciona (so leitura, nada e alterado)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 3m
          script: |
            echo "===== Nome real do container do postgres no Hetzner ====="
            docker ps --format "{{.Names}}" | grep -i "db\|postgres"

            echo ""
            echo "===== Bases de dados existentes ====="
            docker exec supabase-db psql -U postgres -c "\l" 2>&1 | head -20

            echo ""
            echo "===== Tabelas no schema public (onde vive panel_sites etc) ====="
            docker exec supabase-db psql -U postgres -d postgres -c "\dt public.*" 2>&1 | head -60

            echo ""
            echo "===== Contagem de linhas de 3 tabelas grandes, para comparar depois ====="
            docker exec supabase-db psql -U postgres -d postgres -c "SELECT 'panel_sites' t, count(*) FROM public.panel_sites UNION ALL SELECT 'panel_users', count(*) FROM public.panel_users UNION ALL SELECT 'panel_auth_accounts', count(*) FROM public.panel_auth_accounts;" 2>&1

            echo ""
            echo "===== Quantos utilizadores reais em auth.users ====="
            docker exec supabase-db psql -U postgres -d postgres -c "SELECT count(*) FROM auth.users;" 2>&1

            echo ""
            echo "===== Tamanho real da base postgres (a que interessa) ====="
            docker exec supabase-db psql -U postgres -d postgres -c "SELECT pg_size_pretty(pg_database_size('postgres'));" 2>&1
