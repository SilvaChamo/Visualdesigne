name: "Ops - Fase 1j. Verifica scripts de init do Postgres (roles supabase)"

on:
  workflow_dispatch:

jobs:
  diag:
    name: volumes/db e migrations
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Diagnostico
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 3m
          script: |
            cd /opt/supabase-contabo/docker

            echo "===== ficheiros em volumes/db/ (scripts de init esperados) ====="
            ls -la volumes/db/ 2>&1

            echo ""
            echo "===== secção 'db:' do docker-compose.yml (servico completo, incl. volumes) ====="
            awk '/^  db:$/{f=1} f{print} f && /^  [a-z]/ && !/^  db:$/{if(NR>1)exit}' docker-compose.yml | head -60

            echo ""
            echo "===== supabase_auth_admin existe no postgres? ====="
            docker exec supabase-db psql -U supabase_admin -d postgres -c "\du" 2>&1 | head -30

            echo ""
            echo "===== logs completos do arranque do supabase-db (procurar erros de init script) ====="
            docker logs supabase-db 2>&1 | grep -iE "error|role|fatal|already exists|permission denied" | head -40
