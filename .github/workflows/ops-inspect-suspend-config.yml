name: Ops - verifica caracteres especiais na HESTIA_PASSWORD

on:
  workflow_dispatch:

jobs:
  check:
    name: Compara leitura via bash source vs leitura crua da linha
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Verifica a linha HESTIA_PASSWORD
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 2m
          script: |
            cd /opt/visualdesign-site-teste
            echo "===== linha crua (comprimento e presenca de caracteres especiais, sem mostrar o valor) ====="
            RAW_LINE=$(grep "^HESTIA_PASSWORD=" .env.local)
            RAW_VALUE="${RAW_LINE#HESTIA_PASSWORD=}"
            echo "comprimento bruto: ${#RAW_VALUE}"
            echo "contem \$ : $(echo "$RAW_VALUE" | grep -c '\$' || true)"
            echo "contem backtick : $(echo "$RAW_VALUE" | grep -c '\`' || true)"
            echo "contem aspas simples : $(echo "$RAW_VALUE" | grep -c "'" || true)"
            echo "contem aspas duplas : $(echo "$RAW_VALUE" | grep -c '"' || true)"
            echo "contem barra invertida : $(echo "$RAW_VALUE" | grep -c '\\\\' || true)"
            echo "contem espaco : $(echo "$RAW_VALUE" | grep -c ' ' || true)"
            echo ""
            echo "===== apos 'source' (o que o bash realmente fica com) ====="
            set -a
            source .env.local
            set +a
            echo "comprimento apos source: ${#HESTIA_PASSWORD}"
            echo ""
            echo "===== iguais? ====="
            if [ "$RAW_VALUE" = "$HESTIA_PASSWORD" ]; then echo "SIM, identicos"; else echo "NAO, DIFERENTES!"; fi
