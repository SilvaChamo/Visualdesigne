name: Ops - ve logs do da-sync mais recente

on:
  workflow_dispatch:

jobs:
  logs:
    name: Ultimas linhas do log de erro e out
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Le os logs
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 3m
          script: |
            echo "===== error log (ultimas 100 linhas) ====="
            tail -n 100 /root/.pm2/logs/visualdesign-site-teste-error.log
            echo ""
            echo "===== out log (ultimas 60 linhas) ====="
            tail -n 60 /root/.pm2/logs/visualdesign-site-teste-out.log
