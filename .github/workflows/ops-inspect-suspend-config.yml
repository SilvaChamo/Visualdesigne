name: "Ops - Fase 23. Confirma NEXT_PUBLIC_SERVER_IP no Contabo + aponta DNS entrecamposblog"

on:
  workflow_dispatch:

jobs:
  contabo:
    name: contabo
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Confirma IP configurado
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 3m
          script: |
            set +e
            echo "===== IP público real deste servidor (Contabo) ====="
            curl -sS --max-time 5 https://api.ipify.org
            echo ""
            echo "===== NEXT_PUBLIC_SERVER_IP no .env.local ====="
            grep '^NEXT_PUBLIC_SERVER_IP=' /opt/visualdesign-site-teste/.env.local || echo "(não definido)"
