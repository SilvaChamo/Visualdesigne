name: "Ops - Fase 47. Verifica os backups admin_backups (hoje) e user_backups"

on:
  workflow_dispatch:

jobs:
  hetzner:
    name: hetzner
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Inspecciona
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 3m
          script: |
            set +e
            echo "===== admin_backups (hoje 05:00) ====="
            ls -la /home/admin/admin_backups/ 2>&1
            find /home/admin/admin_backups/ -iname "*aamihe*" 2>&1

            echo ""
            echo "===== user_backups ====="
            ls -la /home/admin/user_backups/ 2>&1
            find /home/admin/user_backups/ -iname "*aamihe*" 2>&1

            echo ""
            echo "===== procura wp-config.php em qualquer sitio dentro dos backups do servidor ====="
            find /home/admin/admin_backups/ /home/admin/user_backups/ /home/admin/backups/ -iname "wp-config.php" 2>&1 | head -10

            echo ""
            echo "===== docroot actual, confirma mesmo que falta o wp-config.php ====="
            ls -la /home/admin/domains/aamihe.com/public_html/ | head -5
            test -f /home/admin/domains/aamihe.com/public_html/wp-config.php && echo "existe" || echo "NAO EXISTE"
