name: "Ops - Fase 89. Verifica porque a oshercollective parece offline"

on:
  workflow_dispatch:

jobs:
  contabo:
    name: contabo
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Investiga
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 3m
          script: |
            set +e
            echo "===== conta oshercollective existe no hestia? estado? ====="
            v-list-user oshercollective 2>&1

            echo ""
            echo "===== dominios desta conta ====="
            v-list-web-domains oshercollective 2>&1

            echo ""
            echo "===== a conta esta suspensa? ====="
            grep -i "SUSPENDED" /usr/local/hestia/data/users/oshercollective/user.conf 2>&1

            echo ""
            echo "===== nginx/apache deste utilizador esta a correr? ====="
            systemctl is-active nginx 2>&1
            systemctl is-active httpd 2>&1
            systemctl is-active apache2 2>&1

            echo ""
            echo "===== teste directo aos dominios (se conseguir adivinhar pelo nome) ====="
            for d in oshercollective.com oshercollective.co.mz osher.co.mz; do
              echo "--- $d ---"
              curl -sSI --max-time 8 "https://$d/" 2>&1 | head -3
            done
