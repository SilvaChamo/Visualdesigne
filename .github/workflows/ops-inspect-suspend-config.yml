name: "Ops - Fase 1s. Remove referencia ao override apagado e sobe tudo"

on:
  workflow_dispatch:

jobs:
  fix:
    name: corrige COMPOSE_FILE no .env + up final
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Corrige
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            cd /opt/supabase-contabo/docker

            echo "===== COMPOSE_FILE actual no .env ====="
            grep "^COMPOSE_FILE=" .env

            echo ""
            echo "===== Corrige para so o ficheiro principal ====="
            sed -i 's|^COMPOSE_FILE=.*|COMPOSE_FILE=docker-compose.yml|' .env
            grep "^COMPOSE_FILE=" .env

            echo ""
            echo "===== Sobe tudo de novo, limpo ====="
            docker compose up -d --force-recreate

            echo ""
            echo "===== Espera 60s ====="
            sleep 60

            echo ""
            echo "===== Estado final ====="
            docker ps -a --format "table {{.Names}}\t{{.Status}}"

            echo ""
            echo "===== curl ao gateway ====="
            curl -s -o /dev/null -w "gateway HTTP %{http_code}\n" http://127.0.0.1:8000/rest/v1/ || echo "gateway nao responde"

            echo ""
            echo "===== confirma que 5432/6543/8000 SO aparecem em 127.0.0.1 ====="
            ss -tln | grep -E ':5432|:6543|:8000'
