name: "Ops - Fase 57. Limpeza final + recria wp-config.php para a bd real e intacta"

on:
  workflow_dispatch:

jobs:
  hetzner:
    name: hetzner
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Limpa e confirma dono real da bd
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 3m
          script: |
            set +e
            ROOT=/home/admin/domains/aamihe.com/public_html
            QDIR=/root/security-quarantine/aamihe.com-hetzner-final-$(date +%Y%m%d-%H%M%S)
            mkdir -p "$QDIR"

            echo "===== isola as ultimas pastas maliciosas na raiz do wp-content ====="
            for p in "wp-content/fZULFNr" "wp-content/mIXxS" "wp-content/pwDqN" "gs-pkg"; do
              if [ -e "$ROOT/$p" ]; then
                mv "$ROOT/$p" "$QDIR/$(echo "$p" | tr '/' '_')"
                echo "isolado: $p"
              fi
            done

            echo ""
            echo "===== confirma limpo (nomes repetidos + nomes aleatorios conhecidos) ====="
            find "$ROOT" -type d 2>/dev/null | awk -F/ '{if ($NF==$(NF-1)) print}'
            echo "(vazio acima = limpo)"

            echo ""
            echo "===== utilizador real da base de dados (MySQL grants) ====="
            mysql -u root -e "select user, host from mysql.db where db='admin_aamihe_bd';" 2>&1

            echo ""
            echo "===== confirma users MySQL existentes que comecam por admin_ ====="
            mysql -u root -e "select User from mysql.user where User like 'admin%';" 2>&1
