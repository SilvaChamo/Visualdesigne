name: "Ops - Fase 18c. Investiga backup + conta hestia entrecampos v2 (so leitura)"

on:
  workflow_dispatch:

jobs:
  contabo:
    name: contabo
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Investiga
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 5m
          script: |
            set +e
            echo "===== panel_sites: colunas ====="
            docker exec -i supabase-db psql -U postgres -d postgres -t -A -c "select column_name from information_schema.columns where table_name = 'panel_sites' order by ordinal_position;"

            echo ""
            echo "===== panel_sites: linhas de entrecampos ====="
            docker exec -i supabase-db psql -U postgres -d postgres -t -A -F' | ' -c "select * from panel_sites where domain ilike '%entrecampos%';"

            echo ""
            echo "===== panel_backup_files: colunas ====="
            docker exec -i supabase-db psql -U postgres -d postgres -t -A -c "select column_name from information_schema.columns where table_name = 'panel_backup_files' order by ordinal_position;"

            echo ""
            echo "===== panel_backup_files: linhas de entrecampos ====="
            docker exec -i supabase-db psql -U postgres -d postgres -t -A -F' | ' -c "select * from panel_backup_files where domain ilike '%entrecampos%' or filename ilike '%entrecampos%';"

            echo ""
            echo "===== hestia: lista de contas (v-list-users) ====="
            /usr/local/hestia/bin/v-list-users plain 2>&1 | head -20

            echo ""
            echo "===== procura dominio em qualquer conta hestia ====="
            grep -ril "entrecampos" /home/*/conf/web/ 2>&1
            find /home -maxdepth 4 -iname "*entrecampos*" 2>&1

            echo ""
            echo "===== quem e o owner 78dac824 no supabase auth ====="
            docker exec -i supabase-db psql -U postgres -d postgres -t -A -F' | ' -c "select id, email from auth.users where id = '78dac824-ff02-4deb-bdea-b537eeacad99';"

            echo ""
            echo "===== panel_users: qual username/owner esta associado a este user_id ====="
            docker exec -i supabase-db psql -U postgres -d postgres -t -A -F' | ' -c "select * from panel_users where user_id = '78dac824-ff02-4deb-bdea-b537eeacad99';" 2>&1 | head -5
