name: "Ops - Fase 1q. Muda para iptables-legacy e sobe a stack toda"

on:
  workflow_dispatch:

jobs:
  fix:
    name: iptables-legacy + restart docker + up completo
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Corrige
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 6m
          script: |
            set -e
            echo "===== Muda para iptables-legacy (correcao padrao do Docker para nftables) ====="
            update-alternatives --set iptables /usr/sbin/iptables-legacy
            update-alternatives --set ip6tables /usr/sbin/ip6tables-legacy 2>&1 || echo "sem ip6tables-legacy, ok"
            iptables --version

            echo ""
            echo "===== Reinicia o docker para aplicar ====="
            systemctl restart docker
            sleep 8

            echo ""
            echo "===== Confirma que os sites Hestia continuam a responder (nao mexemos neles, so confirmar) ====="
            curl -s -o /dev/null -w "porta 443 local: HTTP %{http_code}\n" -k https://127.0.0.1:443 --max-time 5 || echo "sem resposta em 443 (pode ser normal sem SNI)"
            systemctl is-active apache2 2>&1
            systemctl is-active nginx 2>&1

            echo ""
            echo "===== Sobe a stack Supabase toda de novo ====="
            cd /opt/supabase-contabo/docker
            docker compose up -d --force-recreate

            echo ""
            echo "===== Espera 60s ====="
            sleep 60

            echo ""
            echo "===== Estado final ====="
            docker ps -a --format "table {{.Names}}\t{{.Status}}"

            echo ""
            echo "===== curl ao gateway (servico certo: api-gw, porta 8000) ====="
            curl -s -o /dev/null -w "gateway HTTP %{http_code}\n" http://127.0.0.1:8000/rest/v1/ || echo "gateway nao responde"
