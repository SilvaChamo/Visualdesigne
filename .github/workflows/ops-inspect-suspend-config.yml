name: "Ops - Fase 110. Reinicio completo do Apache (nao so recarregar) e testa"

on:
  workflow_dispatch:

jobs:
  hetzner:
    name: hetzner
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Reinicia e testa
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 2m
          script: |
            set +e
            echo "===== confirma processos httpd antigos (antes) ====="
            ps -eo pid,lstart,cmd | grep "[h]ttpd" | wc -l

            echo ""
            echo "===== testa a configuracao ====="
            apachectl -t 2>&1

            echo ""
            echo "===== reinicio completo (nao graceful) ====="
            systemctl restart httpd 2>&1
            echo "resultado: $?"
            sleep 3

            echo ""
            echo "===== confirma que so ha processos novos agora ====="
            ps -eo pid,lstart,cmd | grep "[h]ttpd" | wc -l
            systemctl is-active httpd 2>&1

            echo ""
            echo "===== testa os 3 dominios varias vezes seguidas, para apanhar qualquer inconsistencia ====="
            for i in 1 2 3 4 5; do
              for d in oshercollective.com msdn-moz.org lirandzojewelry.com; do
                cert=$(echo | timeout 5 openssl s_client -connect "$d:443" -servername "$d" 2>/dev/null | openssl x509 -noout -subject 2>&1)
                echo "tentativa $i - $d - $cert"
              done
            done
