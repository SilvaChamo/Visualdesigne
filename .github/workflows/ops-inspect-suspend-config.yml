name: "Ops - Fase 58. Recria wp-config.php do aamihe.com para a base de dados real"

on:
  workflow_dispatch:

jobs:
  hetzner:
    name: hetzner
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Recria wp-config.php e reinicia password da bd
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 3m
          script: |
            set +e
            ROOT=/home/admin/domains/aamihe.com/public_html
            NEWDBPASS=$(openssl rand -base64 24 | tr -dc 'a-zA-Z0-9' | head -c 24)
            echo "::add-mask::$NEWDBPASS"

            echo "===== 1. nova password para o utilizador real da bd ====="
            mysql -u root -e "ALTER USER 'admin_aamihe_user'@'localhost' IDENTIFIED BY '$NEWDBPASS'; FLUSH PRIVILEGES;" 2>&1
            echo "exit: $?"

            echo ""
            echo "===== 2. gera wp-config.php com wp-cli (se existir) ou manualmente ====="
            command -v wp >/dev/null 2>&1 || curl -sS -o /usr/local/bin/wp https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar && chmod +x /usr/local/bin/wp
            /usr/local/bin/wp --allow-root --path="$ROOT" config create \
              --dbname=admin_aamihe_bd --dbuser=admin_aamihe_user --dbpass="$NEWDBPASS" \
              --dbhost=localhost --dbprefix=Aimes_ --skip-check --force 2>&1
            chown admin:admin "$ROOT/wp-config.php"
            chmod 640 "$ROOT/wp-config.php"

            echo ""
            echo "===== 3. confirma que liga mesmo a base de dados real ====="
            /usr/local/bin/wp --allow-root --path="$ROOT" db check 2>&1

            echo ""
            echo "===== 4. confirma dados reais (titulo do site, contagem de posts) ====="
            /usr/local/bin/wp --allow-root --path="$ROOT" option get blogname 2>&1
            /usr/local/bin/wp --allow-root --path="$ROOT" post list --post_status=publish --format=count 2>&1

      - name: Confirma o site ao vivo
        run: |
          sleep 3
          curl -sSL --max-time 15 https://aamihe.com/ 2>&1 | grep -io "<title>.*</title>" | head -1
          curl -sSL -o /dev/null -w "HTTP %{http_code}\n" --max-time 15 https://aamihe.com/
