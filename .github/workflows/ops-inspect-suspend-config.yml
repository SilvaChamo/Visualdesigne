name: Ops - confirma se HESTIA_USER e vdadmin

on:
  workflow_dispatch:

jobs:
  check:
    name: Compara HESTIA_USER com 'vdadmin' sem mostrar valores
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Compara
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 2m
          script: |
            cd /opt/visualdesign-site-teste
            set -a
            source .env.local
            set +a
            if [ "$HESTIA_USER" = "vdadmin" ]; then
              echo "RESULTADO: HESTIA_USER e exactamente 'vdadmin' (a mesma conta que o utilizador usa no painel real)"
            else
              echo "RESULTADO: HESTIA_USER e DIFERENTE de 'vdadmin' (comprimento: ${#HESTIA_USER})"
            fi
