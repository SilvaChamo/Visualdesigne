name: "Ops - Fase 15f. Corrige de vez o Google OAuth no Contabo (nomes certos + descomenta compose)"

on:
  workflow_dispatch:

jobs:
  fix:
    name: corrige google oauth
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH keys
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hetzner_key
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/contabo_key
          chmod 600 ~/.ssh/hetzner_key ~/.ssh/contabo_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Corrige (valores nunca impressos no log)
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
        run: |
          set -euo pipefail

          CLIENT_ID=$(ssh -i ~/.ssh/hetzner_key -p "$HETZNER_PORT" "$HETZNER_USER@$HETZNER_HOST" "docker inspect supabase-auth --format '{{range .Config.Env}}{{println .}}{{end}}' | grep '^GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID=' | cut -d= -f2-")
          CLIENT_SECRET=$(ssh -i ~/.ssh/hetzner_key -p "$HETZNER_PORT" "$HETZNER_USER@$HETZNER_HOST" "docker inspect supabase-auth --format '{{range .Config.Env}}{{println .}}{{end}}' | grep '^GOTRUE_EXTERNAL_GOOGLE_SECRET=' | cut -d= -f2-")

          echo "::add-mask::$CLIENT_ID"
          echo "::add-mask::$CLIENT_SECRET"

          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
            echo "ERRO: nao consegui ler client id/secret do Hetzner"
            exit 1
          fi
          echo "Lido do Hetzner com sucesso (valores ocultos)."

          REMOTE_SCRIPT='set -e
          CLIENT_ID="$1"
          CLIENT_SECRET="$2"
          COMPOSE_FILE=/opt/supabase-contabo/docker/docker-compose.yml
          ENV_FILE=/opt/supabase-contabo/docker/.env

          cp "$COMPOSE_FILE" "$COMPOSE_FILE.bak-google-$(date +%s)"
          cp "$ENV_FILE" "$ENV_FILE.bak-google-$(date +%s)"

          sed -i \
            -e "s|# GOTRUE_EXTERNAL_GOOGLE_ENABLED: \${GOOGLE_ENABLED}|GOTRUE_EXTERNAL_GOOGLE_ENABLED: \${GOOGLE_ENABLED}|" \
            -e "s|# GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: \${GOOGLE_CLIENT_ID}|GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: \${GOOGLE_CLIENT_ID}|" \
            -e "s|# GOTRUE_EXTERNAL_GOOGLE_SECRET: \${GOOGLE_SECRET}|GOTRUE_EXTERNAL_GOOGLE_SECRET: \${GOOGLE_SECRET}|" \
            -e "s|# GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: \${API_EXTERNAL_URL}/callback|GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: \${API_EXTERNAL_URL}/callback|" \
            "$COMPOSE_FILE"

          sed -i "/^GOTRUE_EXTERNAL_GOOGLE_/d; /^GOOGLE_ENABLED=/d; /^GOOGLE_CLIENT_ID=/d; /^GOOGLE_SECRET=/d" "$ENV_FILE"
          {
            echo "GOOGLE_ENABLED=true"
            echo "GOOGLE_CLIENT_ID=$CLIENT_ID"
            echo "GOOGLE_SECRET=$CLIENT_SECRET"
          } >> "$ENV_FILE"

          cd /opt/supabase-contabo/docker
          docker compose up -d auth
          sleep 5

          echo "Confirmacao (so nomes, sem valores):"
          docker inspect supabase-auth --format "{{range .Config.Env}}{{println .}}{{end}}" | grep "GOTRUE_EXTERNAL_GOOGLE_" | sed -E "s/=.*$/=<definido>/"
          '

          ssh -i ~/.ssh/contabo_key root@"$CONTABO_HOST" bash -s -- "$CLIENT_ID" "$CLIENT_SECRET" <<< "$REMOTE_SCRIPT"

          echo "Concluido."
