name: Ops - verificacao urgente (so leitura) - username no DirectAdmin real

on:
  workflow_dispatch:

jobs:
  check:
    name: Confirma se 'elimservicos' ja existe no DirectAdmin de producao
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Consulta ao DirectAdmin real (a partir do Contabo, so leitura)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 2m
          script: |
            cd /opt/visualdesign-site-teste
            set -a
            source .env.local
            set +a
            HOST="${DIRECTADMIN_HOST}"
            echo "===== CMD_API_SHOW_USERS (procura elimservicos) ====="
            curl -sk -u "${DIRECTADMIN_USER}:${DIRECTADMIN_PASSWORD}" \
              "https://${HOST}:2222/CMD_API_SHOW_USERS" | tr '&' '\n' | grep -i "elimservicos" || echo "NAO ENCONTRADO na lista de utilizadores"
            echo ""
            echo "===== CMD_API_SHOW_USER_CONFIG especifico ====="
            curl -sk -w "\nHTTP_STATUS:%{http_code}\n" -u "${DIRECTADMIN_USER}:${DIRECTADMIN_PASSWORD}" \
              "https://${HOST}:2222/CMD_API_SHOW_USER_CONFIG?user=elimservicos"
