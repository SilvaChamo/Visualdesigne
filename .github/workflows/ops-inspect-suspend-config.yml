name: "Ops - Fase 102. SO LEITURA - verifica certificados ssl reais no Hetzner"

on:
  workflow_dispatch:

jobs:
  hetzner:
    name: hetzner
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Verifica certificados
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 2m
          script: |
            set +e
            for d in oshercollective.com msdn-moz.org lirandzojewelry.com; do
              echo "===== $d ====="
              CERT="/usr/local/directadmin/data/users/oshercollective/domains/$d.cert.combined"
              ls -la "$CERT" 2>&1
              openssl x509 -in "$CERT" -noout -subject -dates 2>&1
              echo ""
            done

            echo "===== o que o apache serve mesmo, testando via localhost com SNI certo ====="
            for d in oshercollective.com msdn-moz.org lirandzojewelry.com; do
              echo "--- $d ---"
              echo | openssl s_client -connect 127.0.0.1:443 -servername "$d" 2>/dev/null | openssl x509 -noout -subject -dates 2>&1
            done
