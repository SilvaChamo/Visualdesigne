name: "Ops - Fase 14c. Procura Internal Server Error nos registos (so leitura)"

on:
  workflow_dispatch:

jobs:
  verify:
    name: procura erro recente
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Verifica
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 2m
          script: |
            echo "===== ultimas 80 linhas de erro do app (visualdesign-site-teste) ====="
            pm2 logs visualdesign-site-teste --lines 80 --nostream --err 2>&1

            echo ""
            echo "===== processo saudavel? ====="
            pm2 describe visualdesign-site-teste 2>&1 | grep -E "status|restarts"

            echo ""
            echo "===== auth container: ultimas linhas com 'error' ====="
            docker logs supabase-auth --tail 100 2>&1 | grep -i error | tail -20
