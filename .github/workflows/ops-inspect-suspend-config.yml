name: "Ops - Fase 4a. Liga a oshercollective ao Hestia (so na base nova do Contabo)"

on:
  workflow_dispatch:

jobs:
  switch:
    name: UPDATE provider na base propria do Contabo (isolado do Hetzner)
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Muda o provider
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 2m
          script: |
            echo "===== Estado antes (na base propria do Contabo, nao a do Hetzner) ====="
            docker exec supabase-db psql -U postgres -d postgres -c "SELECT da_username, provider FROM public.panel_auth_accounts WHERE da_username = 'oshercollective';"

            echo ""
            echo "===== Muda para hestia ====="
            docker exec supabase-db psql -U postgres -d postgres -c "UPDATE public.panel_auth_accounts SET provider = 'hestia' WHERE da_username = 'oshercollective';"

            echo ""
            echo "===== Confirma ====="
            docker exec supabase-db psql -U postgres -d postgres -c "SELECT da_username, provider FROM public.panel_auth_accounts WHERE da_username = 'oshercollective';"

            echo ""
            echo "===== Confirma que o Hetzner NAO foi tocado (isto e so informativo, nao muda nada) ====="
            echo "Esta base e so a do Contabo (supabase-db local); o Hetzner tem o seu proprio container separado, nunca acedido aqui."
