name: "Ops - Fase 10a. Verifica comandos DNS do Hestia (so leitura)"

on:
  workflow_dispatch:

jobs:
  verify:
    name: comandos dns hestia
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Inspeciona
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 2m
          script: |
            BIN=/usr/local/hestia/bin
            echo "===== binarios dns existentes ====="
            ls "$BIN" | grep -i dns

            echo ""
            echo "===== uso: v-add-dns-domain ====="
            "$BIN/v-add-dns-domain" 2>&1 || true
            echo "===== uso: v-add-dns-record ====="
            "$BIN/v-add-dns-record" 2>&1 || true
            echo "===== uso: v-delete-dns-record ====="
            "$BIN/v-delete-dns-record" 2>&1 || true
            echo "===== uso: v-list-dns-records ====="
            "$BIN/v-list-dns-records" 2>&1 || true
            echo "===== uso: v-list-dns-domains ====="
            "$BIN/v-list-dns-domains" 2>&1 || true
            echo "===== uso: v-delete-dns-domain ====="
            "$BIN/v-delete-dns-domain" 2>&1 || true

            echo ""
            echo "===== oshercollective ja tem zonas dns no hestia? ====="
            "$BIN/v-list-dns-domains" oshercollective 2>&1 || echo "sem zonas"

            echo ""
            echo "===== registos reais de oshercollective.com (se existir zona) ====="
            "$BIN/v-list-dns-records" oshercollective oshercollective.com 2>&1 || echo "sem zona para este dominio"

            echo ""
            echo "===== vdadmin tambem tem zonas (referencia) ====="
            "$BIN/v-list-dns-domains" vdadmin 2>&1 || echo "sem zonas"
