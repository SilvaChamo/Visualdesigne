name: "Ops - Fase 25. Porque entrecamposblog.com mostra Coming Soon em vez do WordPress"

on:
  workflow_dispatch:

jobs:
  contabo:
    name: contabo
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Inspecciona docroot real e vhost
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 3m
          script: |
            set +e
            echo "===== conteúdo real do docroot ====="
            ls -la /home/vdadmin/web/entrecamposblog.com/public_html/ 2>&1

            echo ""
            echo "===== wp-config.php existe? ====="
            test -f /home/vdadmin/web/entrecamposblog.com/public_html/wp-config.php && echo "SIM" || echo "NAO"

            echo ""
            echo "===== vhost nginx configurado para este domínio ====="
            grep -rl "entrecamposblog.com" /etc/nginx/conf.d/domains/ 2>/dev/null
            cat /etc/nginx/conf.d/domains/entrecamposblog.com.conf 2>/dev/null | head -40

            echo ""
            echo "===== onde está o texto 'Coming Soon' no servidor ====="
            grep -rl "Coming Soon" /home/vdadmin/web/entrecamposblog.com/ 2>/dev/null
            grep -rl "Coming Soon" /var/www/ 2>/dev/null | head -5
            grep -rl "Coming Soon" /usr/local/hestia/data/templates/web/ 2>/dev/null | head -5

            echo ""
            echo "===== teste directo local no servidor (127.0.0.1 com Host correcto) ====="
            curl -sS -o /dev/null -w "HTTP %{http_code}\n" --max-time 5 -H "Host: entrecamposblog.com" http://127.0.0.1/
