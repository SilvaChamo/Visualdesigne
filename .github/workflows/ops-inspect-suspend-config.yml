name: "Ops - Fase 28. Lista todos os registos A da zona entrecamposblog.com"

on:
  workflow_dispatch:

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Lista registos
        run: |
          set +e
          EMAIL="${{ secrets.CLOUDFLARE_EMAIL }}"
          GKEY="${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}"
          ZONE_ID="c91fd14533ea44b5b5626d37225e039c"
          CONTABO_IP="${{ secrets.CONTABO_HOST }}"

          curl -sS -H "X-Auth-Email: $EMAIL" -H "X-Auth-Key: $GKEY" -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?per_page=100" > /tmp/records.json

          CONTABO_IP="$CONTABO_IP" python3 -c "import json,os; d=json.load(open('/tmp/records.json')); cip=os.environ['CONTABO_IP']; [print(r.get('type'),'|',r.get('name'),'|',r.get('content'),'| proxied:',r.get('proxied'),'| id:',r.get('id'), '<-- CONTABO' if r.get('content')==cip else '') for r in d.get('result', [])]"
