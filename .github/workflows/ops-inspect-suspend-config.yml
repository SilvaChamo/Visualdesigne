name: "Ops - Fase 20c. Reinicia app (bug conhecido do Next.js) e confirma saude"

on:
  workflow_dispatch:

jobs:
  contabo:
    name: contabo
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Reinicia
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 5m
          script: |
            set +e
            pm2 restart visualdesign-site-teste
            sleep 5

            echo "===== PM2 status apos reinicio ====="
            pm2 jlist | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8'));for(const p of d) console.log(p.name,'| status:',p.pm2_env.status,'| restarts:',p.pm2_env.restart_time,'| unstable:',p.pm2_env.unstable_restarts)"

            echo ""
            echo "===== testa varias rotas reais ====="
            for path in / /dashboard /login /favicon.ico; do
              CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 15 "https://teste.visualdesignmoz.com${path}")
              echo "$path -> HTTP $CODE"
            done

            echo ""
            echo "===== ultimas 15 linhas do log de erro (apos reinicio) ====="
            sleep 3
            pm2 logs visualdesign-site-teste --lines 15 --nostream --err 2>&1 | tail -20
