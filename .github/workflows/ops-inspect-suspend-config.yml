name: Ops - Hestia - config de fail2ban/rate-limit da API

on:
  workflow_dispatch:

jobs:
  check:
    name: Ve a config do jail hestia-iptables e limite de pedidos
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Inspecciona jail e crontab
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 2m
          script: |
            echo "===== jail.local / hestia jail config ====="
            grep -A 10 "\[hestia-iptables\]" /etc/fail2ban/jail.local 2>/dev/null
            grep -A 10 "\[hestia-iptables\]" /etc/fail2ban/jail.d/*.conf 2>/dev/null
            echo ""
            echo "===== fail2ban status do jail hestia-iptables ====="
            fail2ban-client status hestia-iptables 2>&1
            echo ""
            echo "===== crontab actual (root) ====="
            crontab -l 2>&1
            echo ""
            echo "===== algum outro processo/cron a mexer no hestia? ====="
            grep -rl "hestia\|8083" /etc/cron.d/ 2>/dev/null
            ls -la /etc/cron.d/ 2>/dev/null
