name: "Ops - Fase 81. Encontra o gancho dos avisos do WP Armour para os calar"

on:
  workflow_dispatch:

jobs:
  hetzner:
    name: hetzner
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Investiga o gancho
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 3m
          script: |
            set +e
            PLUG=/home/admin/domains/aamihe.com/public_html/wp-content/plugins/honeypot

            echo "===== onde regista os avisos admin_notices ====="
            grep -rn "admin_notices\|admin_footer_text\|donation\|rating" "$PLUG" --include="*.php" 2>/dev/null | grep -i "add_action\|add_filter" | head -20

            echo ""
            echo "===== nome da classe/funcao principal do plugin (para o remove_action apontar certo) ====="
            grep -rn "class .*Honeypot\|class .*WP_Armour\|class .*wp_armour" "$PLUG" --include="*.php" 2>/dev/null | head -5
