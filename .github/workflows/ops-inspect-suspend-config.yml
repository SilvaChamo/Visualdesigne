name: Ops - Hestia (Contabo) - cria pacote VD-Host-Pro em falta

on:
  workflow_dispatch:

jobs:
  fix:
    name: Ver pacotes existentes e criar VD-Host-Pro
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Inspecciona pacotes existentes no Hestia
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 3m
          script: |
            echo "===== pacotes existentes ====="
            ls -la /usr/local/hestia/data/packages/ 2>/dev/null || ls -la /usr/local/vesta/data/packages/ 2>/dev/null
            echo ""
            echo "===== conteudo de um pacote existente (default) ====="
            cat /usr/local/hestia/data/packages/default.pkg 2>/dev/null || cat /usr/local/vesta/data/packages/default.pkg 2>/dev/null
