name: "Ops - Fase 1k. Apaga dados antigos do Postgres a serio e recria"

on:
  workflow_dispatch:

jobs:
  reset:
    name: down + rm -rf dados reais + up limpo de verdade
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Reset a serio
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 8m
          script: |
            set -e
            cd /opt/supabase-contabo/docker

            echo "===== Para tudo ====="
            docker compose down -v

            echo ""
            echo "===== Apaga a pasta de dados REAL do Postgres (bind mount, nao e volume Docker) ====="
            rm -rf ./volumes/db/data
            echo "apagado."

            echo ""
            echo "===== Apaga tambem estado de storage/functions, para ficarem consistentes com o Postgres novo ====="
            rm -rf ./volumes/storage/*
            echo "storage limpo."

            echo ""
            echo "===== Confirma que nao ha nada em 5432/6543/8000 antes de subir ====="
            ss -tln | grep -E ':5432|:6543|:8000' || echo "tudo livre"

            echo ""
            echo "===== docker compose up -d (agora sim, dados a zero) ====="
            docker compose up -d

            echo ""
            echo "===== Espera 90s para o Postgres correr os scripts de init e os outros arrancarem ====="
            sleep 90

            echo ""
            echo "===== Logs do arranque do supabase-db: confirma criacao de roles ====="
            docker logs supabase-db 2>&1 | grep -iE "CREATE ROLE|supabase_auth_admin|supabase_storage_admin|error|fatal" | head -30

            echo ""
            echo "===== Estado final de todos os containers ====="
            docker ps -a --format "table {{.Names}}\t{{.Status}}"
