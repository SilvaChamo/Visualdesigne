name: "Ops - Fase 21e. Investiga porque a autenticacao Hestia voltou a falhar"

on:
  workflow_dispatch:

jobs:
  contabo:
    name: contabo
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Investiga
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 5m
          script: |
            set +e
            echo "===== ultimas 25 linhas do auth.log do Hestia ====="
            tail -25 /usr/local/hestia/log/auth.log 2>&1

            echo ""
            echo "===== mtime do user.conf do vdadmin agora ====="
            stat -c '%y %n' /usr/local/hestia/data/users/vdadmin/user.conf 2>&1

            echo ""
            echo "===== ha algum ban/firewall a bloquear localhost/IP proprio? ====="
            iptables -L -n 2>&1 | grep -i "drop\|reject" | head -20

            echo ""
            echo "===== fail2ban: jails activas e bans actuais ====="
            fail2ban-client status 2>&1
            fail2ban-client status hestia 2>&1

            echo ""
            echo "===== confirma codigo novo no ficheiro fonte (grep simples) ====="
            cd /opt/visualdesign-site-teste
            grep -c "HESTIA_USER" src/lib/hestia-sync-engine.ts 2>&1
            git log -1 --oneline 2>&1
