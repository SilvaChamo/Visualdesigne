name: Ops - Fase 1d. Corrige exposicao de portas (so localhost)

on:
  workflow_dispatch:

jobs:
  fix-ports:
    name: Aplica o override de portas e recria os containers afectados
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Corrige COMPOSE_FILE e recria api-gw + supavisor
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            cd /opt/supabase-contabo/docker

            echo "===== COMPOSE_FILE actual (motivo do override nao ter sido aplicado) ====="
            grep "^COMPOSE_FILE=" .env

            grep -v "^COMPOSE_FILE=" .env > .env.tmp
            mv .env.tmp .env
            echo "COMPOSE_FILE=docker-compose.yml:docker-compose.override.yml" >> .env

            echo ""
            echo "===== Recria so os 2 containers afectados com o novo binding ====="
            docker compose up -d --force-recreate api-gw supavisor

            sleep 8
            echo ""
            echo "===== Confirma portas agora (deve mostrar 127.0.0.1, nao 0.0.0.0) ====="
            docker compose ps
            echo ""
            ss -tlnp | grep -E ':8000|:5432|:6543'
