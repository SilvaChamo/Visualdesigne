name: "Ops - Fase 17e. Verifica se crons do Hetzner sofrem do mesmo 308 (so leitura)"

on:
  workflow_dispatch:

jobs:
  hetzner:
    name: hetzner
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Verifica
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            echo "===== CRONTAB ACTUAL ====="
            crontab -l | grep visualdesign || echo "(nenhuma)"

            cd /opt/visualdesign-site
            CRON_SECRET_VALUE=$(grep '^CRON_SECRET=' .env.local | cut -d= -f2-)
            echo "::add-mask::$CRON_SECRET_VALUE"

            echo ""
            echo "===== dns-retry SEM Host header ====="
            curl -sS -w "\nHTTP_STATUS:%{http_code}\n" -H "Authorization: Bearer ${CRON_SECRET_VALUE}" http://127.0.0.1:3003/api/cron/dns-retry

            echo ""
            echo "===== renewal-check SEM Host header ====="
            curl -sS -w "\nHTTP_STATUS:%{http_code}\n" "http://127.0.0.1:3003/api/cron/renewal-check?secret=${CRON_SECRET_VALUE}"

            echo ""
            echo "===== da-sync SEM Host header ====="
            curl -sS -w "\nHTTP_STATUS:%{http_code}\n" -H "Authorization: Bearer ${CRON_SECRET_VALUE}" http://127.0.0.1:3003/api/cron/da-sync
