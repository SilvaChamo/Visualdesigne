name: "Ops - Fase 5c. Verifica colunas reais antes de reencriptar credenciais"

on:
  workflow_dispatch:

jobs:
  inspect:
    name: so leitura na base do Contabo
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Inspecciona
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 2m
          script: |
            echo "===== Colunas de panel_users com 'da_' no nome ====="
            docker exec supabase-db psql -U postgres -d postgres -c "\d public.panel_users" 2>&1 | grep -i "da_\|id\b\|username"

            echo ""
            echo "===== Colunas de profiles com 'da_' no nome ====="
            docker exec supabase-db psql -U postgres -d postgres -c "\d public.profiles" 2>&1 | grep -i "da_\|id\b"

            echo ""
            echo "===== Quantas linhas tem valor v1: em cada tabela (sem mostrar o valor) ====="
            docker exec supabase-db psql -U postgres -d postgres -c "SELECT count(*) FROM public.panel_users WHERE da_password_encrypted LIKE 'v1:%';"
            docker exec supabase-db psql -U postgres -d postgres -c "SELECT count(*) FROM public.profiles WHERE da_password_encrypted LIKE 'v1:%';"

            echo ""
            echo "===== node instalado? versao ====="
            node --version
