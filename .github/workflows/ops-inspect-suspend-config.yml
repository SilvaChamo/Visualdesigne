name: "Ops - Fase 38. Le logs reais do aamihe.com no Hetzner (so leitura)"

on:
  workflow_dispatch:

jobs:
  hetzner:
    name: hetzner
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Le logs (so leitura)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 3m
          script: |
            set +e
            echo "===== conteudo real servido agora (bypassa cloudflare) ====="
            curl -sS --max-time 8 -H "Host: aamihe.com" http://127.0.0.1/ 2>&1 | head -c 3000

            echo ""
            echo ""
            echo "===== onde vive o site aamihe.com (pasta owner) ====="
            find /home -maxdepth 3 -iname "aamihe.com" 2>/dev/null

            echo ""
            echo "===== ultimas linhas do error log (varias localizacoes possiveis) ====="
            tail -80 /var/log/httpd/domains/aamihe.com.error.log 2>&1
            tail -80 /home/*/domains/aamihe.com/private/error.log 2>&1
            find /home -maxdepth 5 -iname "*aamihe.com*error*" 2>/dev/null

            echo ""
            echo "===== php error log do sistema (ultimas 40 linhas com aamihe) ====="
            find /var/log -iname "php*" -maxdepth 2 2>/dev/null
            grep -i "aamihe" /var/log/php*/error.log 2>/dev/null | tail -40
