name: "Ops - Fase 108. Testa oshercollective.com a partir de maquina limpa e neutra"

on:
  workflow_dispatch:

jobs:
  teste-limpo:
    name: teste-limpo
    runs-on: ubuntu-latest
    steps:
      - name: Testa tal como um visitante real veria
        run: |
          echo "===== resolucao dns real, deste ponto neutro ====="
          getent hosts oshercollective.com

          echo ""
          echo "===== pedido https normal, sem truques ====="
          curl -v --max-time 15 "https://oshercollective.com/" -o /dev/null 2>&1 | grep -iE "Trying|Connected to|subject:|SSL certificate|HTTP/|< location"

          echo ""
          echo "===== o mesmo, mas seguindo redireccionamentos, ate 5 ====="
          curl -sSIL --max-time 20 --max-redirs 5 "https://oshercollective.com/" 2>&1 | grep -iE "^HTTP|^location"
