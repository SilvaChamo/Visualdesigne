name: Ops — desactivar cookie NEXT_LOCALE em basededadosagro.com

# Execução manual só. Continuação de ops-basededadosagro-fix-cache.yml: a
# Cache Rule criada no Cloudflare (via API, 2026-08-11) faz cache elegível e
# respeita o Cache-Control da origem, mas o Cloudflare NUNCA guarda em cache
# nenhuma resposta com Set-Cookie — e o next-intl define automaticamente
# NEXT_LOCALE em todas as páginas. Como este site já usa o próprio URL
# (/pt/..., /en/...) para saber o idioma, o cookie é dispensável — desactivá-lo
# (localeCookie: false) desbloqueia a cache em todo o site, não só nas
# páginas do padrão usado no Cache-Control do next.config.ts.
on:
  workflow_dispatch:

jobs:
  fix-and-restart:
    name: Desactivar localeCookie, rebuild e reiniciar
    runs-on: ubuntu-latest
    steps:
      - name: Aplicar correcção via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /opt/basededadosagro-site
            STAMP=$(date +%Y%m%d-%H%M%S)
            F="middleware.ts"
            cp "$F" "$F.bak-cookiefix-$STAMP"

            if grep -q "localeCookie" "$F"; then
              echo "localeCookie já configurado, nada a fazer."
            else
              perl -i -pe "s/(  defaultLocale: 'pt')\n/\$1,\n  localeCookie: false,\n/" "$F"
            fi

            echo "--- ficheiro corrigido ---"
            cat "$F"

            if ! grep -q "localeCookie: false" "$F"; then
              echo "ERRO: a correcção não apanhou o padrão esperado." >&2
              exit 1
            fi

            echo "--- rebuild ---"
            npm ci
            npm run build

            echo "--- restart ---"
            pm2 restart basededadosagro-site
            pm2 save

      - name: Verificar ao vivo — Set-Cookie deve desaparecer e cache passar a HIT
        run: |
          sleep 5
          echo "--- 1º pedido ---"
          curl -sk -D - -o /dev/null --max-time 20 "https://basededadosagro.com/pt/mercado" | grep -iE "set-cookie|cache-control|cf-cache-status"
          sleep 2
          echo "--- 2º pedido (mesma URL) ---"
          curl -sk -D - -o /dev/null --max-time 20 "https://basededadosagro.com/pt/mercado" | grep -iE "set-cookie|cache-control|cf-cache-status"
