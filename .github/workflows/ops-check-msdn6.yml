name: 'ops: ver log exim do msdn-moz.org (só-leitura)'

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Ler mainlog e rejectlog do exim
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            echo "===== rejectlog (últimas 40 linhas relacionadas com msdn) ====="
            grep -i "msdn" /var/log/exim/rejectlog 2>&1 | tail -40
            echo ""
            echo "===== mainlog (últimas 40 linhas relacionadas com msdn) ====="
            grep -i "msdn" /var/log/exim/mainlog 2>&1 | tail -40
            echo ""
            echo "===== ficheiros relacionados com limite de envio ====="
            find /usr/local/directadmin -iname "*send_limit*" -o -iname "*email_limit*" 2>&1
