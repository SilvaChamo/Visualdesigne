name: "Ops - Recon para afinacao Supabase + copiador de email (SO LEITURA)"

# ============================================================================
# SO LEITURA. Recolhe o que e preciso saber antes de:
#  (a) afinar a stack Supabase do Contabo (baixar a carga)
#  (b) montar o copiador automatico de email Hetzner -> Contabo (doveadm sync)
# Nenhum comando altera/cria/apaga nada. Ver conversa 2026-09-05.
# ============================================================================

on:
  workflow_dispatch:

jobs:
  contabo:
    name: contabo (so leitura)
    runs-on: ubuntu-latest
    steps:
      - name: "Supabase stack + dovecot + layout de email do Contabo"
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          password: ${{ secrets.CONTABO_ROOT_PASSWORD }}
          command_timeout: 10m
          script: |
            set +e
            echo "############ CONTABO - RECON ############"
            echo
            echo "===== onde vive a stack Supabase (compose) ====="
            ls -la /opt/supabase-contabo/docker/ 2>&1 | head -40
            find /opt -maxdepth 3 -name 'docker-compose*.yml' 2>/dev/null
            echo
            echo "===== containers a correr + estado de saude ====="
            docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' 2>&1
            echo
            echo "===== healthcheck configurado por container (intervalo/retries) ====="
            for c in $(docker ps --format '{{.Names}}'); do
              echo "--- $c ---"
              docker inspect "$c" --format '{{json .Config.Healthcheck}}' 2>/dev/null
            done
            echo
            echo "===== o compose define intervalos de healthcheck? (grep) ====="
            grep -nE 'healthcheck:|interval:|timeout:|retries:|start_period:' /opt/supabase-contabo/docker/docker-compose.yml 2>/dev/null | head -80
            echo
            echo "===== servicos studio/analytics/vector/imgproxy no compose ====="
            grep -nE '^\s*(studio|analytics|vector|imgproxy|supavisor|pooler):' /opt/supabase-contabo/docker/docker-compose.yml 2>/dev/null
            echo
            echo "===== a app usa transformacao de imagem do Supabase (imgproxy)? ====="
            grep -rInE 'imgproxy|/render/image|transform.*width|supabase.*image' /opt/visualdesign-site-teste/src 2>/dev/null | head -10
            grep -rInE 'IMGPROXY|IMAGE_TRANSFORMATION' /opt/supabase-contabo/docker/.env 2>/dev/null
            echo
            echo "===== pooler/envoy: logs recentes (procurar reconecta em loop) ====="
            docker logs --tail 25 supabase-pooler 2>&1 | tail -25
            echo "--- envoy ---"
            docker logs --tail 15 supabase-envoy 2>&1 | tail -15
            echo
            echo "===== DOVECOT: versao + mail_location + layout ====="
            dovecot --version 2>&1
            doveadm --version 2>&1
            doveconf -n 2>&1 | grep -E 'mail_location|mail_home|mail_uid|mail_gid|first_valid|auth_|passdb|userdb|ssl ' | head -40
            echo
            echo "===== onde estao as caixas no disco (Hestia) ====="
            ls -la /home/oshercollective/mail/ 2>&1
            find /home/oshercollective/mail/oshercollective.com -maxdepth 2 2>/dev/null | head -20
            echo
            echo "===== formato do ficheiro de passwords de email (Hestia/exim) ====="
            for d in oshercollective.com elimservicos.com; do
              echo "--- $d ---"
              ls -la /etc/exim4/domains/$d/ 2>/dev/null
              head -2 /etc/exim4/domains/$d/passwd 2>/dev/null | sed -E 's/(:[^:]{6})[^:]*/\1***/g'
            done
            echo
            echo "===== comandos Hestia para email disponiveis ====="
            ls /usr/local/hestia/bin/ | grep -E 'v-(add|list)-mail' 2>&1
            echo
            echo "===== chave SSH publica do root do Contabo (para o Hetzner poder empurrar) ====="
            ls -la /root/.ssh/ 2>&1
            cat /root/.ssh/id_*.pub 2>/dev/null
            cat /root/.ssh/authorized_keys 2>/dev/null | sed -E 's/(ssh-[a-z0-9]+ [A-Za-z0-9+/]{12})[A-Za-z0-9+/=]*/\1.../g'

  hetzner:
    name: hetzner (so leitura)
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: "Dovecot + layout + hashes de password do Hetzner"
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 10m
          script: |
            set +e
            echo "############ HETZNER - RECON ############"
            echo
            echo "===== DOVECOT: versao + mail_location + layout ====="
            dovecot --version 2>&1
            doveadm --version 2>&1
            doveconf -n 2>&1 | grep -E 'mail_location|mail_home|mail_uid|mail_gid|first_valid|auth_|passdb|userdb|ssl ' | head -40
            echo
            echo "===== onde estao as caixas no disco (DirectAdmin) ====="
            ls -la /home/admin/imap/ 2>&1 | head
            find /home/admin/imap/visualdesignmoz.com -maxdepth 2 2>/dev/null | head -20
            find /home/admin/imap/aamihe.com -maxdepth 2 2>/dev/null | head -15
            echo
            echo "===== formato do ficheiro de passwords (/etc/virtual/<dominio>/passwd) ====="
            for d in visualdesignmoz.com aamihe.com mltmark.com basededadosagro.com provisualcorporate.co.mz files.visualdesignmoz.com shalomdeco.com; do
              echo "--- $d ---"
              sed -E 's/(:[^:]{8})[^:]*/\1***REDACTED***/' /etc/virtual/$d/passwd 2>/dev/null
            done
            echo
            echo "===== quota por caixa (se existir) ====="
            for d in visualdesignmoz.com aamihe.com; do
              echo "--- $d ---"; cat /etc/virtual/$d/quota 2>/dev/null; cat /etc/virtual/$d/user_limit 2>/dev/null
            done
            echo
            echo "===== doveadm consegue listar/contar mensagens de uma caixa? (teste read-only) ====="
            doveadm mailbox status -u admin@files.visualdesignmoz.com 'messages vsize' '*' 2>&1 | head
            doveadm mailbox status -u geral@aamihe.com 'messages vsize' '*' 2>&1 | head
            echo
            echo "===== dsync/backup: sintaxe suportada nesta versao ====="
            doveadm backup 2>&1 | head -5
            doveadm sync 2>&1 | head -5
            echo
            echo "===== o Hetzner ja tem chave SSH para ligar ao Contabo? ====="
            ls -la /root/.ssh/ 2>&1
            for k in /root/.ssh/id_ed25519 /root/.ssh/id_rsa /root/.ssh/contabo* /root/.ssh/deploy*; do
              [ -f "$k" ] && echo "existe: $k"
            done
            echo "--- known_hosts tem o IP do Contabo? ---"
            grep -c '169.58.148.144' /root/.ssh/known_hosts 2>/dev/null
