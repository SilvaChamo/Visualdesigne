name: Ops — corrigir notícias/artigos que não aparecem em basededadosagro.com

# Execução manual só. "As notícias não aparecem" — investigado com o projecto
# sincronizado localmente (rsync do servidor). Causa: app/[locale]/artigos/page.tsx
# filtra a query inicial com .eq('type', 'article'), mas os dados reais (já
# migrados do Supabase Cloud, 11 linhas confirmadas) usam categorias em
# português ("Notícia", "Guia", "Relatório", "Legislação", etc.) — nunca
# "article" (esse valor só existe nos 3 itens FALLBACK_ARTICLES hardcoded,
# usados de propósito quando a query real não devolve nada). Resultado: a
# query real nunca bate certo, cai sempre no fallback de demonstração,
# escondendo o conteúdo real em silêncio. O resto do componente já está
# preparado para mostrar qualquer "type" como categoria (linha ~447:
# category={article.type || 'Artigo'}) — a única correcção necessária é
# remover o filtro indevido.
on:
  workflow_dispatch:

jobs:
  fix-and-restart:
    name: Remover filtro type='article', rebuild e reiniciar
    runs-on: ubuntu-latest
    steps:
      - name: Aplicar correcção via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /opt/basededadosagro-site
            STAMP=$(date +%Y%m%d-%H%M%S)
            F="app/[locale]/artigos/page.tsx"
            cp "$F" "$F.bak-noticiasfix-$STAMP"

            perl -i -pe "s/\Q                    .eq('type', 'article')\E\n//" "$F"

            if grep -q "\.eq('type', 'article')" "$F"; then
              echo "ERRO: filtro ainda presente, o padrão não bateu certo." >&2
              exit 1
            fi
            echo "--- ficheiro corrigido (secção da query) ---"
            grep -n -A5 "from('articles')" "$F"

            echo "--- rebuild ---"
            npm ci
            npm run build

            echo "--- restart ---"
            pm2 restart basededadosagro-site
            pm2 save

      - name: Verificar ao vivo que /artigos deixou de dar 404/erro
        run: |
          sleep 5
          code=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 20 "https://basededadosagro.com/pt/artigos")
          echo "/pt/artigos -> HTTP $code"
