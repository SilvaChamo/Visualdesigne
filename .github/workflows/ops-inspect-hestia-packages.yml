name: ops - inspect Hestia packages on Contabo (read-only)

# Diagnóstico do bug "pacote atribuído não é o comprado" — usa exactamente
# as credenciais HESTIA_* já escritas em /opt/visualdesign-site-teste/.env.local
# pelo deploy-contabo.yml (não recebe segredos próprios), para confirmar se
# os pacotes VD-Host-Basico/Pro/Business/Enterprise existem mesmo no Hestia
# com esse nome exacto, e se a API responde autenticada. Não altera nada.

on:
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: SSH inspect
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          script: |
            set -e
            cd /opt/visualdesign-site-teste
            HOST=$(grep '^HESTIA_HOST=' .env.local | cut -d= -f2-)
            PORT=$(grep '^HESTIA_PORT=' .env.local | cut -d= -f2-)
            USER=$(grep '^HESTIA_USER=' .env.local | cut -d= -f2-)
            PASS=$(grep '^HESTIA_PASSWORD=' .env.local | cut -d= -f2-)
            PROVIDER=$(grep '^DEFAULT_HOSTING_PROVIDER=' .env.local | cut -d= -f2-)
            echo "=== DEFAULT_HOSTING_PROVIDER no .env.local ao vivo ==="
            echo "${PROVIDER:-<vazio>}"
            echo ""
            echo "=== HESTIA_HOST/PORT/USER configurados (sem mostrar password) ==="
            echo "host=${HOST} port=${PORT} user=${USER}"
            echo ""
            echo "=== chamada real v-list-user-packages (mesmo formato do hestia-client.ts) ==="
            OUT=$(curl -sk -D /tmp/hh.txt \
              "https://${HOST}:${PORT}/api/" \
              --data-urlencode "user=${USER}" \
              --data-urlencode "password=${PASS}" \
              --data-urlencode "cmd=v-list-user-packages" \
              --data-urlencode "arg1=json")
            echo "--- Hestia-Exit-Code ---"
            grep -i "hestia-exit-code" /tmp/hh.txt || echo "(cabeçalho não encontrado)"
            echo "--- nomes de pacotes devolvidos ---"
            echo "$OUT" | python3 -c "import json,sys; d=json.load(sys.stdin); print('\n'.join(k for k in d.keys() if k!='system'))" 2>&1 || echo "$OUT" | head -c 500
