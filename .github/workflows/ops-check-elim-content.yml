name: 'ops: verificar conteudo real do elimservicos.com no Hestia (so-leitura)'

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar ficheiros e emails no Contabo (Hestia)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          script: |
            echo "===== Conteudo do public_html (elimservicos.com) ====="
            find /home/elimservicos/web/elimservicos.com/public_html -maxdepth 2 2>&1
            echo ""
            echo "===== Tamanho total ====="
            du -sh /home/elimservicos/web/elimservicos.com 2>&1
            echo ""
            echo "===== Contas de email reais no Hestia para este dominio ====="
            v-list-mail-accounts elimservicos elimservicos.com 2>&1 || echo "(comando falhou ou sem contas)"
            echo ""
            echo "===== Dominio listado no Hestia para o user elimservicos ====="
            v-list-web-domains elimservicos 2>&1
