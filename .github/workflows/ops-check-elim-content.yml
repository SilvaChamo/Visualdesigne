name: 'ops: verificar conteudo real do elimservicos.com no Hestia v2 (so-leitura)'

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar com caminho completo do Hestia
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          script: |
            echo "===== utilizadores existentes no Hestia ====="
            /usr/local/hestia/bin/v-list-users 2>&1 | head -20
            echo ""
            echo "===== domínios do user elimservicos (se existir) ====="
            /usr/local/hestia/bin/v-list-web-domains elimservicos 2>&1
            echo ""
            echo "===== procurar pasta home real ====="
            find /home -maxdepth 1 2>&1
            echo ""
            echo "===== emails do dominio (se existir) ====="
            /usr/local/hestia/bin/v-list-mail-accounts elimservicos elimservicos.com 2>&1
