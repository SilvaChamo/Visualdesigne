name: Ops — remover podcast duplicado e corrigir titulos <br/> em basededadosagro.com

# Execução manual só. basededadosagro.com é uma app Next.js separada deste
# repositório (PM2 "basededadosagro-site", porta 3010, /opt/basededadosagro-site
# no Hetzner, sem .git no servidor) — ver ops-basededadosagro-fix-links.yml
# para o mesmo padrão.
#
# Alterações já feitas e testadas localmente (commit 54c9ffb no repo
# SilvaChamo/basededadosagro, mas o servidor não faz git pull, só rsync
# manual — por isso replicamos aqui via patch directo + rebuild):
# 1) app/[locale]/page.tsx: a home renderizava <AgroCastSection /> duas vezes
#    (uma via <CommunityBanner />, antes de <WhyChooseUs />, outra logo a
#    seguir) — remove a segunda instância e o import agora não usado.
# 2) messages/pt.json e messages/en.json: os titulos de WhyChooseUs usavam
#    a tag auto-fechada <br/>, que o next-intl (t.rich) não reconhece —
#    só aceita <br></br> — por isso apareciam literalmente com "<br/>" no
#    meio do texto. Troca simples de sintaxe, mesmo texto.
on:
  workflow_dispatch:

jobs:
  fix-and-restart:
    name: Corrigir podcast duplicado + titulos, rebuild e reiniciar basededadosagro-site
    runs-on: ubuntu-latest
    steps:
      - name: Aplicar correcções via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /opt/basededadosagro-site
            STAMP=$(date +%Y%m%d-%H%M%S)

            F="app/[locale]/page.tsx"
            cp "$F" "$F.bak-podcastfix-$STAMP"
            perl -ni -e 'print unless (/^import \{ AgroCastSection \} from "\@\/components\/AgroCastSection";$/ || /^\s*<AgroCastSection \/>\s*$/)' "$F"

            F="messages/pt.json"
            cp "$F" "$F.bak-podcastfix-$STAMP"
            sed -i 's#<br/>#<br></br>#g' "$F"

            F="messages/en.json"
            cp "$F" "$F.bak-podcastfix-$STAMP"
            sed -i 's#<br/>#<br></br>#g' "$F"

            echo "--- confirmação: nada por corrigir sobrou ---"
            if grep -n "AgroCastSection" "app/[locale]/page.tsx" | grep -v CommunityBanner; then
              echo "ainda ha referencia inesperada a AgroCastSection em page.tsx"; exit 1
            fi
            if grep -l "<br/>" messages/pt.json messages/en.json; then
              echo "ainda ha <br/> por corrigir"; exit 1
            fi
            echo "OK, tudo corrigido."

            echo "--- rebuild ---"
            npm ci
            npm run build

            echo "--- restart ---"
            pm2 restart basededadosagro-site
            pm2 save

      - name: Verificar ao vivo
        run: |
          sleep 5
          code=$(curl -sk -o /tmp/home.html -w "%{http_code}" --max-time 20 "https://basededadosagro.com/pt")
          echo "GET /pt -> HTTP $code"
          echo "ocorrencias de 'Carregando episódios' na home:"
          grep -o "Carregando epis[^<]*" /tmp/home.html | sort | uniq -c || true
          echo "ocorrencias de <br/> literal na home:"
          grep -c "&lt;br/&gt;\|<br/>" /tmp/home.html || true
