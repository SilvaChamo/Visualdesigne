name: "Ops - Auditoria de prontidao para corte Hetzner -> Contabo (SO LEITURA)"

# ============================================================================
# NADA NESTE WORKFLOW ESCREVE, CRIA, COPIA OU ALTERA seja o que for em nenhum
# dos servidores. Todos os comandos sao de listar/ler (v-list-*, ls, cat, du,
# df, SELECT count(*), dig, curl -I). Objectivo: produzir um retrato lado-a-lado
# Hetzner (DirectAdmin) vs Contabo (Hestia) para saber exactamente o que falta
# copiar antes de trocar DNS. Ver conversa de 2026-09-05.
# ============================================================================

on:
  workflow_dispatch:

jobs:
  # --------------------------------------------------------------------------
  hetzner:
    name: hetzner (DirectAdmin - so leitura)
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: "A) Sites web + SSL + bases de dados"
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 12m
          script: |
            set +e
            DA=/usr/local/directadmin/data/users
            echo "############ HETZNER - A) SITES WEB + SSL + BD ############"
            echo
            echo "===== contas DirectAdmin ====="
            ls "$DA"/ 2>/dev/null
            echo
            echo "===== dominios + subdominios + PHP + docroot por conta ====="
            for u in $(ls "$DA"/ 2>/dev/null); do
              echo "---------- conta: $u ----------"
              echo "[dominios]"; cat "$DA/$u/domains.list" 2>/dev/null
              for d in $(cat "$DA/$u/domains.list" 2>/dev/null); do
                echo "  ### $d"
                echo -n "    php: "; grep -E '^php._select=|^php_ver' "$DA/$u/domains/$d.conf" 2>/dev/null | tr '\n' ' '; echo
                echo -n "    subdominios: "; cat "$DA/$u/domains/$d.subdomains" 2>/dev/null | tr '\n' ' '; echo
                echo -n "    tamanho public_html: "; du -sh "/home/$u/domains/$d/public_html" 2>/dev/null | cut -f1
                echo -n "    SSL cert validade: "
                if [ -f "$DA/$u/domains/$d.cert" ]; then
                  openssl x509 -in "$DA/$u/domains/$d.cert" -noout -enddate -subject 2>/dev/null | tr '\n' ' '; echo
                else
                  echo "(sem ficheiro .cert)"
                fi
              done
            done
            echo
            echo "===== pointers / aliases de dominio ====="
            for u in $(ls "$DA"/ 2>/dev/null); do
              for f in "$DA/$u"/domains/*.pointers; do
                [ -f "$f" ] && { echo "--- $f ---"; cat "$f"; }
              done
            done
            echo
            echo "===== bases de dados por conta (databases.list - nao precisa de password) ====="
            for u in $(ls "$DA"/ 2>/dev/null); do
              echo "--- $u ---"; cat "$DA/$u/databases.list" 2>/dev/null
            done
            echo
            echo "===== tamanhos/contagem de tabelas MySQL (melhor esforco, pode falhar sem creds) ====="
            mysql -N -e "SELECT table_schema, COUNT(*) AS tabelas, ROUND(SUM(data_length+index_length)/1024/1024,1) AS mb FROM information_schema.tables GROUP BY table_schema ORDER BY table_schema;" 2>&1 | head -80
            echo
            echo "===== versoes de PHP instaladas ====="
            ls /usr/local/ 2>/dev/null | grep -E '^php[0-9]'
            update-alternatives --list php 2>/dev/null

      - name: "B) Email (contas, tamanhos, reencaminhamentos, DKIM) + DNS do painel"
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 12m
          script: |
            set +e
            echo "############ HETZNER - B) EMAIL + DNS ############"
            echo
            echo "===== todos os dominios de email (/etc/virtual/domains) ====="
            cat /etc/virtual/domains 2>/dev/null
            echo
            echo "===== dono de cada dominio de email (/etc/virtual/domainowners) ====="
            cat /etc/virtual/domainowners 2>/dev/null
            echo
            echo "===== detalhe por dominio de email ====="
            while IFS= read -r line; do
              dom=$(echo "$line" | cut -d: -f1 | tr -d ' ')
              own=$(echo "$line" | cut -d: -f2 | tr -d ' ')
              [ -z "$dom" ] && continue
              echo "################ $dom  (dono: $own) ################"
              echo "-- contas de email (nomes) --"
              cut -d: -f1 "/etc/virtual/$dom/passwd" 2>/dev/null
              echo "-- nº de contas --"
              grep -c . "/etc/virtual/$dom/passwd" 2>/dev/null
              echo "-- reencaminhamentos / aliases (/etc/virtual/$dom/aliases) --"
              cat "/etc/virtual/$dom/aliases" 2>/dev/null
              echo "-- catch-all (/etc/virtual/$dom/catchall) --"
              cat "/etc/virtual/$dom/catchall" 2>/dev/null
              echo "-- respostas automaticas (reply/*.msg) --"
              ls "/etc/virtual/$dom/reply/" 2>/dev/null
              echo "-- tamanho de cada caixa (/home/$own/imap/$dom/*) --"
              du -sh /home/$own/imap/$dom/*/ 2>/dev/null
              echo "-- ficheiros DKIM presentes --"
              ls -la "/etc/virtual/$dom/" 2>/dev/null | grep -iE 'dkim'
              echo "-- selector DKIM (dkim.conf se existir) --"
              cat "/etc/virtual/$dom/dkim.conf" 2>/dev/null
            done < /etc/virtual/domainowners
            echo
            echo "===== zonas DNS geridas localmente (/var/named/*.db) ====="
            ls /var/named/*.db 2>/dev/null
            echo
            echo "===== registos-chave de cada zona local (A / MX / TXT SPF-DKIM-DMARC) ====="
            for z in /var/named/*.db; do
              [ -f "$z" ] || continue
              echo "---------- $z ----------"
              grep -E 'IN[[:space:]]+(A|AAAA|MX|CNAME)[[:space:]]|IN[[:space:]]+TXT' "$z" 2>/dev/null | grep -viE 'ns[12]\.|localhost' | head -40
            done

      - name: "C) pm2 + cron + FTP + Supabase/Postgres + sistema + HTTP ao vivo"
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 12m
          script: |
            set +e
            DA=/usr/local/directadmin/data/users
            echo "############ HETZNER - C) PM2 / CRON / FTP / DB / SISTEMA ############"
            echo
            echo "===== processos pm2 (apps fora do painel: visualdesign, basededadosagro) ====="
            pm2 list 2>&1
            pm2 jlist 2>/dev/null | tr ',' '\n' | grep -E '"name"|"pm_cwd"|"exec_interpreter"|"NODE_ENV"|"status"|"restart_time"' | head -60
            echo
            echo "===== crontab do root ====="
            crontab -l 2>&1
            echo
            echo "===== /etc/cron.d ====="
            ls /etc/cron.d/ 2>/dev/null
            for f in /etc/cron.d/*; do [ -f "$f" ] && { echo "--- $f ---"; cat "$f"; }; done
            echo
            echo "===== crontab por conta DirectAdmin ====="
            for u in $(ls "$DA"/ 2>/dev/null); do
              echo "--- $u ---"; crontab -l -u "$u" 2>/dev/null
            done
            echo
            echo "===== contas FTP por conta (ftp.passwd - so nomes) ====="
            for u in $(ls "$DA"/ 2>/dev/null); do
              echo "--- $u ---"; cut -d: -f1 "$DA/$u/ftp.passwd" 2>/dev/null
            done
            echo
            echo "===== Supabase original: schemas ====="
            docker exec supabase-db psql -U postgres -d postgres -c "\dn" 2>&1
            echo "===== contagens tabelas-chave do painel ====="
            for t in public.panel_sites public.panel_users public.panel_auth_accounts auth.users auth.identities storage.objects storage.buckets; do
              echo -n "$t: "; docker exec supabase-db psql -U postgres -d postgres -t -c "SELECT count(*) FROM $t;" 2>&1
            done
            echo "===== schema basededados: tamanho + nº tabelas ====="
            docker exec supabase-db psql -U postgres -d postgres -t -c "SELECT count(*) FROM pg_tables WHERE schemaname='basededados';" 2>&1
            docker exec supabase-db psql -U postgres -d postgres -t -c "SELECT pg_size_pretty(sum(pg_total_relation_size(schemaname||'.'||tablename))::bigint) FROM pg_tables WHERE schemaname='basededados';" 2>&1
            echo
            echo "===== disco / RAM / uptime ====="
            df -h / ; echo ; free -h ; echo ; uptime
            echo -n "node: "; node -v 2>/dev/null
            echo
            echo "===== HTTP ao vivo (cada dominio, primeira linha da resposta) ====="
            for d in $(cat /etc/virtual/domains 2>/dev/null); do
              echo -n "$d -> "; curl -sSI --max-time 8 "https://$d/" 2>&1 | head -1
            done

  # --------------------------------------------------------------------------
  contabo:
    name: contabo (Hestia - so leitura)
    runs-on: ubuntu-latest
    steps:
      - name: "A) Sites web + SSL + bases de dados"
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          password: ${{ secrets.CONTABO_ROOT_PASSWORD }}
          command_timeout: 12m
          script: |
            set +e
            HB=/usr/local/hestia/bin
            echo "############ CONTABO - A) SITES WEB + SSL + BD ############"
            echo
            echo "===== contas Hestia ====="
            $HB/v-list-users list 2>&1
            echo
            echo "===== dominios web por conta (json: docroot, SSL, LETSENCRYPT, aliases, backend) ====="
            for u in $($HB/v-list-users list 2>/dev/null); do
              echo "---------- conta: $u ----------"
              $HB/v-list-web-domains "$u" json 2>&1
              echo
              echo "[SSL detalhado por dominio]"
              for d in $($HB/v-list-web-domains "$u" list 2>/dev/null); do
                echo "  ### $d"
                $HB/v-list-web-domain-ssl "$u" "$d" 2>&1 | grep -iE 'subject|not after|issuer|alt'
              done
            done
            echo
            echo "===== bases de dados por conta ====="
            for u in $($HB/v-list-users list 2>/dev/null); do
              echo "--- $u ---"
              $HB/v-list-databases "$u" json 2>&1
            done
            echo
            echo "===== tamanhos/contagem tabelas MySQL (melhor esforco) ====="
            mysql -N -e "SELECT table_schema, COUNT(*) AS tabelas, ROUND(SUM(data_length+index_length)/1024/1024,1) AS mb FROM information_schema.tables GROUP BY table_schema ORDER BY table_schema;" 2>&1 | head -80

      - name: "B) Email (contas, tamanhos, reencaminhamentos, DKIM) + DNS"
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          password: ${{ secrets.CONTABO_ROOT_PASSWORD }}
          command_timeout: 12m
          script: |
            set +e
            HB=/usr/local/hestia/bin
            echo "############ CONTABO - B) EMAIL + DNS ############"
            for u in $($HB/v-list-users list 2>/dev/null); do
              echo "################ conta: $u ################"
              echo "-- dominios de email --"
              $HB/v-list-mail-domains "$u" json 2>&1
              for d in $($HB/v-list-mail-domains "$u" list 2>/dev/null); do
                echo "======== $d ========"
                echo "-- contas (json: quota, uso em disco, aliases, fwd, autoreply) --"
                $HB/v-list-mail-accounts "$u" "$d" json 2>&1
                echo "-- DKIM (registo/selector) --"
                $HB/v-list-mail-domain-dkim "$u" "$d" 2>&1
              done
            done
            echo
            echo "===== tamanho real das caixas em disco (/home/*/mail/*) ====="
            du -sh /home/*/mail/*/*/ 2>/dev/null
            echo
            echo "===== zonas DNS por conta ====="
            for u in $($HB/v-list-users list 2>/dev/null); do
              echo "--- $u ---"
              $HB/v-list-dns-domains "$u" json 2>&1
              for d in $($HB/v-list-dns-domains "$u" list 2>/dev/null); do
                echo "   ### $d"
                $HB/v-list-dns-records "$u" "$d" 2>&1 | grep -viE '^\s*$' | head -40
              done
            done

      - name: "C) pm2 + cron + FTP + Supabase/Postgres + sistema + HTTP ao vivo"
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          password: ${{ secrets.CONTABO_ROOT_PASSWORD }}
          command_timeout: 12m
          script: |
            set +e
            HB=/usr/local/hestia/bin
            echo "############ CONTABO - C) PM2 / CRON / FTP / DB / SISTEMA ############"
            echo
            echo "===== processos pm2 (visualdesign-site-teste, basededadosagro-site-teste) ====="
            pm2 list 2>&1
            pm2 jlist 2>/dev/null | tr ',' '\n' | grep -E '"name"|"pm_cwd"|"exec_interpreter"|"NODE_ENV"|"status"|"restart_time"' | head -60
            echo
            echo "===== crontab do root ====="
            crontab -l 2>&1
            echo
            echo "===== /etc/cron.d ====="
            ls /etc/cron.d/ 2>/dev/null
            for f in /etc/cron.d/*; do [ -f "$f" ] && { echo "--- $f ---"; cat "$f"; }; done
            echo
            echo "===== cron por conta Hestia ====="
            for u in $($HB/v-list-users list 2>/dev/null); do
              echo "--- $u ---"; $HB/v-list-cron-jobs "$u" json 2>&1
            done
            echo
            echo "===== FTP / utilizadores por conta (v-list-user json: FTP, pacote, uso disco) ====="
            for u in $($HB/v-list-users list 2>/dev/null); do
              echo "--- $u ---"; $HB/v-list-user "$u" json 2>&1
            done
            echo
            echo "===== Supabase proprio: schemas ====="
            docker exec supabase-db psql -U postgres -d postgres -c "\dn" 2>&1
            echo "===== contagens tabelas-chave do painel ====="
            for t in public.panel_sites public.panel_users public.panel_auth_accounts auth.users auth.identities storage.objects storage.buckets; do
              echo -n "$t: "; docker exec supabase-db psql -U postgres -d postgres -t -c "SELECT count(*) FROM $t;" 2>&1
            done
            echo "===== schema basededados: tamanho + nº tabelas ====="
            docker exec supabase-db psql -U postgres -d postgres -t -c "SELECT count(*) FROM pg_tables WHERE schemaname='basededados';" 2>&1
            docker exec supabase-db psql -U postgres -d postgres -t -c "SELECT pg_size_pretty(sum(pg_total_relation_size(schemaname||'.'||tablename))::bigint) FROM pg_tables WHERE schemaname='basededados';" 2>&1
            echo
            echo "===== disco / RAM / uptime ====="
            df -h / ; echo ; free -h ; echo ; uptime
            echo -n "node: "; node -v 2>/dev/null
            echo
            echo "===== HTTP ao vivo (dominios Hestia, primeira linha) ====="
            for u in $($HB/v-list-users list 2>/dev/null); do
              for d in $($HB/v-list-web-domains "$u" list 2>/dev/null); do
                echo -n "$d -> "; curl -sSI --max-time 8 "https://$d/" 2>&1 | head -1
              done
            done

  # --------------------------------------------------------------------------
  dns_externo:
    name: dns externo (dig - nao toca em nenhum servidor)
    runs-on: ubuntu-latest
    steps:
      - name: "Nameservers + A + MX + SPF/DMARC publicos de cada dominio"
        run: |
          set +e
          DOMS="visualdesignmoz.com files.visualdesignmoz.com teste.visualdesignmoz.com \
                supabase.visualdesignmoz.com supabase-contabo.visualdesignmoz.com \
                aamihe.com mltmark.com basededadosagro.com provisualcorporate.co.mz \
                oshercollective.com elimservicos.com lirandzojewelry.com msdn-moz.org \
                shalomdeco.com entrecamposblog.com"
          for d in $DOMS; do
            echo "################ $d ################"
            echo -n "  NS : "; dig +short NS "$d" | tr '\n' ' '; echo
            echo -n "  A  : "; dig +short A "$d" | tr '\n' ' '; echo
            echo -n "  MX : "; dig +short MX "$d" | tr '\n' ' '; echo
            echo -n "  SPF: "; dig +short TXT "$d" | grep -i spf | tr '\n' ' '; echo
            echo -n "  DMARC: "; dig +short TXT "_dmarc.$d" | tr '\n' ' '; echo
          done
          echo
          echo "IP Hetzner conhecido: 37.27.17.25 | IP Contabo conhecido: 169.58.148.144"
