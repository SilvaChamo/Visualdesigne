name: Ops — nomes alternativos (SEO) em basededadosagro.com

# Execução manual só. basededadosagro.com é uma app Next.js separada deste
# repositório (PM2 "basededadosagro-site", porta 3010, /opt/basededadosagro-site
# no Hetzner, sem .git no servidor) — ver memória project_basededadosagro_ops.
#
# Pedido: o site só aparece no Google quando se pesquisa o nome completo.
# Adiciona um bloco de dados estruturados (JSON-LD "Organization") com
# alternateName ["BaseDeDadosAgro", "Base de Dados", "Base", "Dados", "Agro"],
# mais metadataBase + <meta name="keywords"> no layout — mesmo padrão já
# aplicado em visualdesignmoz.com neste repo
# (src/components/seo/OrganizationJsonLd.tsx + src/app/layout.tsx).
#
# app/[locale]/layout.tsx é substituído por inteiro (conteúdo final conhecido,
# sem regex/sed linha-a-linha) depois de confirmar que o ficheiro remoto ainda
# tem a forma esperada. Backup fica em layout.tsx.bak-seo-YYYYMMDD-HHMMSS.
on:
  workflow_dispatch:

jobs:
  patch-and-restart:
    name: Adicionar JSON-LD + keywords, rebuild e reiniciar basededadosagro-site
    runs-on: ubuntu-latest
    steps:
      - name: Aplicar alteração via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /opt/basededadosagro-site
            STAMP=$(date +%Y%m%d-%H%M%S)
            F="app/[locale]/layout.tsx"

            if grep -qF "OrganizationJsonLd" "$F"; then
              echo "Já aplicado anteriormente (OrganizationJsonLd já existe em $F) — nada a fazer."
              exit 0
            fi

            echo "--- confirmar que o ficheiro está no estado esperado antes de tocar ---"
            grep -qF 'title: "Base de Dados Agro",' "$F" || { echo "ANCHOR title não encontrado, a abortar sem alterar nada"; exit 1; }
            grep -qF 'description: "O seu repositório agrário",' "$F" || { echo "ANCHOR description não encontrado, a abortar sem alterar nada"; exit 1; }
            grep -qF 'manifest: "/manifest.json",' "$F" || { echo "ANCHOR manifest não encontrado, a abortar sem alterar nada"; exit 1; }
            grep -qF "import { getMessages } from 'next-intl/server';" "$F" || { echo "ANCHOR import não encontrado, a abortar sem alterar nada"; exit 1; }
            grep -qF '<html lang={locale} suppressHydrationWarning>' "$F" || { echo "ANCHOR html não encontrado, a abortar sem alterar nada"; exit 1; }

            cp "$F" "$F.bak-seo-$STAMP"

            mkdir -p components/seo
            cat > components/seo/OrganizationJsonLd.tsx <<'JSONLD'
            const ORGANIZATION_JSON_LD = {
              "@context": "https://schema.org",
              "@type": "Organization",
              name: "Base de Dados Agro",
              alternateName: ["BaseDeDadosAgro", "Base de Dados", "Base", "Dados", "Agro"],
              url: "https://basededadosagro.com",
            };

            export function OrganizationJsonLd() {
              return (
                <script
                  type="application/ld+json"
                  dangerouslySetInnerHTML={{ __html: JSON.stringify(ORGANIZATION_JSON_LD) }}
                />
              );
            }
            JSONLD

            cat > "$F" <<'LAYOUT'
            import type { Metadata } from "next";
            import { Montserrat, Maven_Pro } from "next/font/google";
            import Scripts from "next/script";
            import "../globals.css";
            import NavFooterToggle from "./components/NavFooterToggle";

            import { ThemeProvider } from "@/components/theme-provider";
            import { LanguageProvider } from "@/contexts/LanguageContext";
            import { FloatingChatButton } from "@/components/FloatingChatButton";
            import { PWAInstallPrompt } from "@/components/PWAInstallPrompt";
            import { Toaster } from "sonner";
            import { NextIntlClientProvider } from 'next-intl';
            import { getMessages } from 'next-intl/server';
            import { OrganizationJsonLd } from "@/components/seo/OrganizationJsonLd";

            const montserrat = Montserrat({
              subsets: ["latin"],
              variable: "--font-montserrat",
            });

            const mavenPro = Maven_Pro({
              subsets: ["latin"],
              variable: "--font-maven-pro",
            });

            export const metadata: Metadata = {
              metadataBase: new URL("https://basededadosagro.com"),
              title: "Base de Dados Agro",
              description: "O seu repositório agrário",
              keywords: ["Base de Dados Agro", "BaseDeDadosAgro", "Base de Dados", "Base", "Dados", "Agro"],
              manifest: "/manifest.json",
            };

            export function generateViewport() {
              return {
                themeColor: "#059669",
                width: "device-width",
                initialScale: 1,
                maximumScale: 1,
              };
            }

            export default async function RootLayout({
              children,
              params
            }: Readonly<{
              children: React.ReactNode;
              params: Promise<{ locale: string }>;
            }>) {
              const { locale } = await params;
              const messages = await getMessages();

              return (
                <html lang={locale} suppressHydrationWarning>
                  <head>
                    <OrganizationJsonLd />
                  </head>
                  <body
                    className={`${montserrat.variable} ${mavenPro.variable} font-sans antialiased bg-background min-h-screen flex flex-col`}
                    suppressHydrationWarning
                  >
                    {/* Global Identification Bar - 6px Green */}
                    <div className="fixed top-0 left-0 w-full h-[6px] bg-[#22c55e] z-[99999]" />

                    <NextIntlClientProvider messages={messages} locale={locale}>
                      <ThemeProvider
                        defaultTheme="system"
                        enableSystem
                        disableTransitionOnChange
                      >
                        <LanguageProvider>
                          <NavFooterToggle>
                            <main className="flex-1 flex flex-col">
                              {children}
                            </main>
                          </NavFooterToggle>
                        </LanguageProvider>
                        <Toaster position="bottom-right" richColors closeButton />
                      </ThemeProvider>
                    </NextIntlClientProvider>
                  </body>
                </html>
              );
            }
            LAYOUT

            echo "--- confirmação: todas as alterações ficaram aplicadas ---"
            OK=1
            grep -qF 'import { OrganizationJsonLd } from "@/components/seo/OrganizationJsonLd";' "$F" || OK=0
            grep -qF 'metadataBase: new URL("https://basededadosagro.com")' "$F" || OK=0
            grep -qF 'keywords: ["Base de Dados Agro"' "$F" || OK=0
            grep -qF '<OrganizationJsonLd />' "$F" || OK=0
            if [ "$OK" != "1" ]; then
              echo "Alguma alteração falhou, a repor backup e a abortar."
              cp "$F.bak-seo-$STAMP" "$F"
              exit 1
            fi

            echo "--- diff aplicado ---"
            diff -u "$F.bak-seo-$STAMP" "$F" || true

            echo "--- rebuild ---"
            npm ci
            npm run build

            echo "--- restart ---"
            pm2 restart basededadosagro-site
            pm2 save

      - name: Verificar ao vivo que o JSON-LD aparece na página
        run: |
          sleep 5
          code=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 20 "https://basededadosagro.com/pt")
          echo "/pt -> HTTP $code"
          curl -sk --max-time 20 "https://basededadosagro.com/pt" | grep -o '"alternateName":\[[^]]*\]' || echo "AVISO: alternateName não encontrado na resposta"
