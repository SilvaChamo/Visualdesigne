name: 'ops: migrar emails — ver mail_location do dovecot no Hestia (so-leitura)'

on:
  workflow_dispatch: {}

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          script: |
            grep -r "mail_location" /etc/dovecot/ 2>/dev/null
