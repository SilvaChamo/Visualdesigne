name: 'ops: migrar emails — inspeccionar estrutura Maildir antes de copiar (so-leitura)'

on:
  workflow_dispatch: {}

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            echo "----- estrutura de uma caixa (Hetzner) -----"
            find /home/oshercollective/imap/msdn-moz.org/secretary -maxdepth 2
            echo "----- dono/permissões -----"
            ls -la /home/oshercollective/imap/msdn-moz.org/
