name: 'ops: migrar emails — passo 2 (copiar conteudo real das 26 caixas)'

on:
  workflow_dispatch: {}

jobs:
  copiar-restaurar:
    runs-on: ubuntu-latest
    steps:
      - name: Preparar chaves SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hetzner_key
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/contabo_key
          chmod 600 ~/.ssh/hetzner_key ~/.ssh/contabo_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Extrair todo o correio do Hetzner (só-leitura) e copiar para o Contabo
        run: |
          ssh -i ~/.ssh/hetzner_key -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
            "tar czf - -C /home/oshercollective imap" > /tmp/all_mail.tar.gz
          ls -la /tmp/all_mail.tar.gz
          scp -i ~/.ssh/contabo_key /tmp/all_mail.tar.gz root@${{ secrets.CONTABO_HOST }}:/tmp/

      - name: Restaurar cada caixa no local exacto do Hestia
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          script: |
            rm -rf /tmp/mailrestore
            mkdir -p /tmp/mailrestore
            tar xzf /tmp/all_mail.tar.gz -C /tmp/mailrestore
            for domain in msdn-moz.org lirandzojewelry.com oshercollective.com; do
              for boxdir in /tmp/mailrestore/imap/$domain/*/; do
                box=$(basename "$boxdir")
                dest="/home/oshercollective/mail/$domain/$box"
                if [ -d "${boxdir}Maildir" ] && [ -d "$dest" ]; then
                  cp -a "${boxdir}Maildir/." "$dest/"
                  chown -R oshercollective:mail "$dest"
                  echo "copiado: $box@$domain"
                else
                  echo "IGNORADO (sem pasta correspondente): $box@$domain"
                fi
              done
            done
            rm -rf /tmp/mailrestore /tmp/all_mail.tar.gz
            echo "----- confirmação: tamanho de um exemplo -----"
            du -sh /home/oshercollective/mail/msdn-moz.org/secretary
