name: 'ops: migrar emails — ver estrutura Hestia recem-criada (so-leitura)'

on:
  workflow_dispatch: {}

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          script: |
            find /home/oshercollective/mail/msdn-moz.org/secretary -maxdepth 3
            echo "----- dono -----"
            ls -la /home/oshercollective/mail/msdn-moz.org/secretary/
