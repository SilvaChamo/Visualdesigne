name: 'ops: ver comandos disponiveis do CLI DirectAdmin (so-leitura)'

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Ver ajuda do CLI
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            echo "===== Ajuda geral ====="
            /usr/local/directadmin/directadmin --help 2>&1 | head -60
            echo ""
            echo "===== Tentar 'user-config' ou similar ====="
            /usr/local/directadmin/directadmin --help 2>&1 | grep -i "user\|email\|limit\|config"
