name: 'ops: encontrar ficheiro exacto que gera a mensagem do limite (so-leitura)'

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Grep completo por "Daily send limit"
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            echo "===== Procura em /etc (todos os ficheiros exim*) ====="
            grep -rln "Daily send limit" /etc/ 2>/dev/null
            echo ""
            echo "===== Procura em /usr/local/directadmin ====="
            grep -rln "Daily send limit" /usr/local/directadmin/ 2>/dev/null
            echo ""
            echo "===== Versao do DirectAdmin instalada ====="
            /usr/local/directadmin/directadmin v 2>&1
            echo ""
            echo "===== max_per_email_send_limit no directadmin.conf ====="
            grep -i "max_per_email\|email_send_limit\|per_email" /usr/local/directadmin/conf/directadmin.conf 2>&1
            echo "(vazio acima = essa opcao nao existe neste directadmin.conf)"
