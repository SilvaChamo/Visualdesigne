name: Migração pontual — colunas M-Pesa em checkout_sessions

# Acrescenta as colunas mpesa_* usadas pela integração automática M-Pesa
# Sandbox (só activa na instância de teste do Contabo). Aditiva, não afecta
# nenhuma sessão de checkout existente. Execução manual só.
on:
  workflow_dispatch:

jobs:
  migrate:
    name: Aplicar ALTER TABLE via SSH
    runs-on: ubuntu-latest
    steps:
      - name: Adicionar colunas mpesa_* e recarregar o cache de schema do PostgREST
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            CONTAINER=$(docker ps --format '{{.Names}}' | grep -iE 'supabase.*db|supabase-db|postgres' | head -n1)
            if [ -z "$CONTAINER" ]; then
              echo "Não encontrei nenhum container de Postgres/Supabase a correr:" >&2
              docker ps --format '{{.Names}}'
              exit 1
            fi
            echo "A usar container: $CONTAINER"
            DB_USER=$(docker exec "$CONTAINER" printenv POSTGRES_USER 2>/dev/null || echo postgres)
            DB_NAME=$(docker exec "$CONTAINER" printenv POSTGRES_DB 2>/dev/null || echo postgres)
            docker exec "$CONTAINER" psql -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 -c \
              "ALTER TABLE checkout_sessions ADD COLUMN IF NOT EXISTS mpesa_third_party_reference TEXT, ADD COLUMN IF NOT EXISTS mpesa_transaction_id TEXT, ADD COLUMN IF NOT EXISTS mpesa_conversation_id TEXT, ADD COLUMN IF NOT EXISTS mpesa_last_response TEXT;"
            docker exec "$CONTAINER" psql -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 -c \
              "CREATE INDEX IF NOT EXISTS idx_checkout_sessions_mpesa_reference ON checkout_sessions(mpesa_third_party_reference);"
            docker exec "$CONTAINER" psql -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 -c \
              "NOTIFY pgrst, 'reload schema';"
            echo "--- Confirmação das colunas ---"
            docker exec "$CONTAINER" psql -U "$DB_USER" -d "$DB_NAME" -c "\d checkout_sessions" | grep mpesa
