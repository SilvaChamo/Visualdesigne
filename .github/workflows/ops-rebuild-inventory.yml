name: "Ops - Inventario para reconstruir aamihe/mltmark limpos (SO LEITURA)"

# SO LEITURA. Levanta o que e legitimo (plugins/tema/versoes/media/BD) e o que
# esta injectado, para reconstruir os dois sites de raiz no Contabo. Nao altera nada.

on:
  workflow_dispatch:

jobs:
  hetzner:
    name: hetzner (so leitura)
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: inventario
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 15m
          script: |
            set +e
            for D in aamihe.com mltmark.com; do
              P="/home/admin/domains/$D/public_html"
              WP="/usr/local/bin/wp --path=$P --allow-root --skip-plugins --skip-themes"
              echo "############################ $D ############################"
              echo "===== WP core: versao + verificacao de integridade ====="
              $WP core version 2>&1
              $WP core verify-checksums 2>&1 | tail -25
              echo
              echo "===== Plugins (nome, estado, versao, update) ====="
              $WP plugin list --fields=name,status,version,update 2>&1
              echo "-- integridade dos plugins (quais foram modificados / nao existem no repo) --"
              $WP plugin verify-checksums --all 2>&1 | tail -40
              echo
              echo "===== Temas ====="
              $WP theme list --fields=name,status,version 2>&1
              echo
              echo "===== Utilizadores ====="
              $WP user list --fields=ID,user_login,user_email,roles,user_registered 2>&1
              echo
              echo "===== Eventos agendados (cron do WP) ====="
              $WP cron event list --fields=hook,next_run_relative 2>&1 | head -40
              echo
              DBN=$(grep -oP "DB_NAME',\s*'\K[^']+" "$P/wp-config.php")
              DBU=$(grep -oP "DB_USER',\s*'\K[^']+" "$P/wp-config.php")
              DBP=$(grep -oP "DB_PASSWORD',\s*'\K[^']+" "$P/wp-config.php")
              PFX=$(grep -oP "table_prefix\s*=\s*'\K[^']+" "$P/wp-config.php")
              M(){ mysql -u"$DBU" -p"$DBP" "$DBN" -N -e "$1" 2>&1; }
              echo "===== BD ($DBN, prefixo $PFX): scan de conteudo injectado ====="
              echo "-- posts com <script/eval/base64/dominios spam --"
              M "SELECT ID,post_type,post_status,LEFT(post_title,50) FROM ${PFX}posts WHERE post_content REGEXP 'esenyurt|istanbulescort|<script[^>]*src|eval\\\\(|base64_decode|ms-home-gate' LIMIT 30;"
              echo "-- postmeta suspeito --"
              M "SELECT post_id,meta_key,LEFT(meta_value,80) FROM ${PFX}postmeta WHERE meta_value REGEXP 'esenyurt|<script[^>]*src|eval\\\\(|base64_decode' LIMIT 30;"
              echo "-- options autoload com eval/base64/script (nome + tamanho) --"
              M "SELECT option_name,LENGTH(option_value) FROM ${PFX}options WHERE autoload='yes' AND option_value REGEXP 'eval\\\\(|base64_decode|<script|esenyurt' LIMIT 30;"
              echo "-- opcao 'cron' do WP (agendamentos escondidos) --"
              M "SELECT LEFT(option_value,800) FROM ${PFX}options WHERE option_name='cron';"
              echo "-- usermeta capabilities (procurar admins escondidos) --"
              M "SELECT user_id,meta_value FROM ${PFX}usermeta WHERE meta_key='${PFX}capabilities';"
              echo
              echo "===== uploads: tamanho, nº ficheiros, ficheiros PHP (a remover) ====="
              du -sh "$P/wp-content/uploads" 2>&1
              find "$P/wp-content/uploads" -type f | wc -l
              find "$P/wp-content/uploads" -type f \( -name '*.php' -o -name '*.phtml' -o -name '*.pht' -o -name '*.php5' -o -name '*.suspected' \) 2>/dev/null
              echo
              echo "===== .htaccess COMPLETO (para preservar regras legitimas VD) ====="
              cat "$P/.htaccess" 2>&1
              echo
              echo "===== wp-config.php (sem segredos): constantes + qualquer codigo estranho ====="
              grep -vE "DB_PASSWORD|AUTH_KEY|SECURE_AUTH_KEY|LOGGED_IN_KEY|NONCE_KEY|AUTH_SALT|SECURE_AUTH_SALT|LOGGED_IN_SALT|NONCE_SALT" "$P/wp-config.php" 2>&1
              echo
              echo "===== offload de media / object storage (config) ====="
              grep -rElI "your-objectstorage|hel1|AS3CF|amazon-s3|WPOS3|S3_UPLOADS|provider.*s3" "$P/wp-config.php" "$P/wp-content/mu-plugins/" 2>/dev/null
              $WP option get tantan_wordpress_s3 2>&1 | head -30
            done
