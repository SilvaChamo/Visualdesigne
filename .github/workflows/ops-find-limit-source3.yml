name: 'ops: encontrar a chave exacta do limite por utilizador (so-leitura)'

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Procurar a chave usada pelo DA para o limite por utilizador
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            echo "===== Todos os ficheiros da conta oshercollective (nomes) ====="
            find /usr/local/directadmin/data/users/oshercollective/ -maxdepth 1 -type f
            echo ""
            echo "===== Procurar 'send_limit' em todo o /usr/local/directadmin/data ====="
            grep -rl "send_limit" /usr/local/directadmin/data/ 2>/dev/null
            echo ""
            echo "===== Procurar literalmente o numero 100 associado a email/limit em ficheiros da conta ====="
            grep -rn "100" /usr/local/directadmin/data/users/oshercollective/*.conf 2>/dev/null
            echo ""
            echo "===== Pasta de admin/task.queue relacionada a email limit ====="
            find /usr/local/directadmin/data -iname "*ratelimit*" -o -iname "*email*limit*" 2>/dev/null
            echo ""
            echo "===== Comando CLI do DA para consultar config de um user ====="
            /usr/local/directadmin/directadmin config-get email_send_limit 2>&1 || true
            echo "---"
            /usr/local/directadmin/directadmin config-get max_per_email_send_limit 2>&1 || true
