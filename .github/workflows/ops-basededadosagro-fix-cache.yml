name: Ops — activar cache no Cloudflare para basededadosagro.com

# Execução manual só. Auditoria de latência 2026-08-10: a app em si responde
# em 50-80ms (testado directamente no servidor), mas o tempo até à primeira
# resposta visto de fora chegava a 2.4s — porque Cloudflare não guarda
# nenhuma cópia (cache-control: no-store, cf-cache-status: DYNAMIC), então
# TODA visita paga a viagem completa até ao servidor na Alemanha. Corrige
# adicionando Cache-Control: public, s-maxage=60 só às páginas de conteúdo
# genuinamente públicas (mercado, serviços, artigos, estatísticas, etc.) —
# nunca a /usuario, /admin, /checkout ou /auth, para não arriscar mostrar
# dados de uma pessoa a outra através da cache partilhada.
on:
  workflow_dispatch:

jobs:
  fix-and-restart:
    name: Adicionar Cache-Control ao next.config.ts, rebuild e reiniciar
    runs-on: ubuntu-latest
    steps:
      - name: Aplicar correcção via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /opt/basededadosagro-site
            STAMP=$(date +%Y%m%d-%H%M%S)
            F="next.config.ts"
            cp "$F" "$F.bak-cachefix-$STAMP"

            if grep -q "s-maxage=60" "$F"; then
              echo "Cache-Control já presente, nada a fazer."
            else
              perl -i -pe "s{(async headers\(\) \{\n    return \[)}{\$1\n      {\n        source: '/:locale',\n        headers: [\n          { key: 'Cache-Control', value: 'public, s-maxage=60, stale-while-revalidate=300' },\n        ],\n      },\n      {\n        source: '/:locale/(mercado|servicos|artigos|estatisticas|sobre-nos|contactos|blog|inovacao|termos|politica-privacidade|repositorio|apresentacoes|apresentacao|ajuda|planos|carreiras|documentos|relatorios|produtos|propriedades|empresas|agrocast|destaque|parceria|forum)/:path*',\n        headers: [\n          { key: 'Cache-Control', value: 'public, s-maxage=60, stale-while-revalidate=300' },\n        ],\n      },}" -0777 "$F"
            fi

            echo "--- confirmar presença ---"
            grep -c "s-maxage=60" "$F"

            echo "--- rebuild ---"
            npm ci
            npm run build

            echo "--- restart ---"
            pm2 restart basededadosagro-site
            pm2 save

      - name: Verificar cabeçalho Cache-Control ao vivo
        run: |
          sleep 5
          echo "--- homepage ---"
          curl -sk -D - -o /dev/null --max-time 20 "https://basededadosagro.com/pt" | grep -i "cache-control\|cf-cache-status"
          echo "--- /mercado (deve ter cache) ---"
          curl -sk -D - -o /dev/null --max-time 20 "https://basededadosagro.com/pt/mercado" | grep -i "cache-control\|cf-cache-status"
          echo "--- /usuario/dashboard (NÃO deve ter cache pública) ---"
          curl -sk -D - -o /dev/null --max-time 20 "https://basededadosagro.com/pt/usuario/dashboard" | grep -i "cache-control\|cf-cache-status"
