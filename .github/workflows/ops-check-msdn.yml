name: 'ops: verificar hospedagem e estado do msdn-moz.org (só-leitura)'

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar dados do msdn-moz.org
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            echo "===== panel_sites ====="
            docker exec supabase-db psql -U postgres -d postgres -c "
              SELECT domain, provider, status, plan, created_at
              FROM public.panel_sites
              WHERE domain ILIKE '%msdn-moz%';
            " 2>&1
            echo ""
            echo "===== domain_renewals ====="
            docker exec supabase-db psql -U postgres -d postgres -c "
              SELECT domain_name, status, dns_status, notes
              FROM public.domain_renewals
              WHERE domain_name ILIKE '%msdn-moz%';
            " 2>&1
