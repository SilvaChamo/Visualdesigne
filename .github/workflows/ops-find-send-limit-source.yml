name: 'ops: encontrar onde vive o limite diario de envio (so-leitura)'

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Localizar a fonte do limite de 100 emails/dia
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            echo "===== user.conf completo do oshercollective ====="
            cat /usr/local/directadmin/data/users/oshercollective/user.conf 2>&1
            echo ""
            echo "===== ficheiro package associado (se existir) ====="
            PKG=$(grep -i "^package=" /usr/local/directadmin/data/users/oshercollective/user.conf | cut -d= -f2)
            echo "Pacote: $PKG"
            cat "/usr/local/directadmin/data/packages/${PKG}.conf" 2>&1
            echo ""
            echo "===== onde o exim le o limite (config exim) ====="
            grep -rn "Daily send limit\|email_send_limit" /etc/exim.conf 2>&1 | head -10
            echo ""
            echo "===== ficheiro global de directadmin.conf (linha email) ====="
            grep -i "email" /usr/local/directadmin/conf/directadmin.conf 2>&1
