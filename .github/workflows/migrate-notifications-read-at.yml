name: Migração pontual — notifications.read_at

# Acrescenta a coluna 'read_at' (data/hora em que a notificação foi lida) que
# o código já espera em src/app/api/notifications/{admin,user}/route.ts mas
# nunca existiu na BD (supabase-notifications.sql define-a, mas nunca foi
# aplicada) — isso fazia o "marcar como lida" falhar com 500 (PGRST204).
# Aditiva, sem DEFAULT obrigatório, não afecta nenhuma notificação existente.
# Execução manual só — não corre em cada deploy.
on:
  workflow_dispatch:

jobs:
  migrate:
    name: Aplicar ALTER TABLE via SSH
    runs-on: ubuntu-latest
    steps:
      - name: Adicionar read_at e recarregar o cache de schema do PostgREST
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            CONTAINER=$(docker ps --format '{{.Names}}' | grep -iE 'supabase.*db|supabase-db|postgres' | head -n1)
            if [ -z "$CONTAINER" ]; then
              echo "Não encontrei nenhum container de Postgres/Supabase a correr:" >&2
              docker ps --format '{{.Names}}'
              exit 1
            fi
            echo "A usar container: $CONTAINER"
            DB_USER=$(docker exec "$CONTAINER" printenv POSTGRES_USER 2>/dev/null || echo postgres)
            DB_NAME=$(docker exec "$CONTAINER" printenv POSTGRES_DB 2>/dev/null || echo postgres)
            echo "DB user=$DB_USER db=$DB_NAME"
            docker exec "$CONTAINER" psql -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 -c \
              "ALTER TABLE public.notifications ADD COLUMN IF NOT EXISTS read_at TIMESTAMPTZ;"
            docker exec "$CONTAINER" psql -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 -c \
              "NOTIFY pgrst, 'reload schema';"
            echo "--- Confirmação da coluna ---"
            docker exec "$CONTAINER" psql -U "$DB_USER" -d "$DB_NAME" -c "\d public.notifications" | grep read_at
