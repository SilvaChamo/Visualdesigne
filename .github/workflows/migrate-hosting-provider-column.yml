name: Migração pontual — panel_auth_accounts.provider

# Acrescenta a coluna 'provider' (DirectAdmin vs HestiaCP) usada para decidir
# qual servidor de hospedagem trata cada conta. Aditiva com DEFAULT, não afecta
# nenhuma conta existente. Execução manual só — não corre em cada deploy.
# Mesmo padrão de migrate-panel-auth-accounts.yml (reseller_tier).
on:
  workflow_dispatch:

jobs:
  migrate:
    name: Aplicar ALTER TABLE via SSH
    runs-on: ubuntu-latest
    steps:
      - name: Adicionar provider e recarregar o cache de schema do PostgREST
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            CONTAINER=$(docker ps --format '{{.Names}}' | grep -iE 'supabase.*db|supabase-db|postgres' | head -n1)
            if [ -z "$CONTAINER" ]; then
              echo "Não encontrei nenhum container de Postgres/Supabase a correr:" >&2
              docker ps --format '{{.Names}}'
              exit 1
            fi
            echo "A usar container: $CONTAINER"
            DB_USER=$(docker exec "$CONTAINER" printenv POSTGRES_USER 2>/dev/null || echo postgres)
            DB_NAME=$(docker exec "$CONTAINER" printenv POSTGRES_DB 2>/dev/null || echo postgres)
            echo "DB user=$DB_USER db=$DB_NAME"
            docker exec "$CONTAINER" psql -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 -c \
              "ALTER TABLE public.panel_auth_accounts ADD COLUMN IF NOT EXISTS provider TEXT NOT NULL DEFAULT 'directadmin';"
            docker exec "$CONTAINER" psql -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 -c \
              "CREATE INDEX IF NOT EXISTS idx_panel_auth_accounts_provider ON public.panel_auth_accounts (provider);"
            docker exec "$CONTAINER" psql -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 -c \
              "NOTIFY pgrst, 'reload schema';"
            echo "--- Confirmação da coluna ---"
            docker exec "$CONTAINER" psql -U "$DB_USER" -d "$DB_NAME" -c "\d public.panel_auth_accounts" | grep provider
