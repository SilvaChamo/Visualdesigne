name: 'ops: diagnosticar teste local msdn-moz.org no Contabo (so-leitura)'

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          script: |
            echo "----- portas a escutar -----"
            ss -tlnp | grep -E ":80|:443|nginx|apache" || ss -tlnp
            echo "----- vhost nginx do domínio -----"
            find /home/oshercollective/conf -iname "*msdn-moz*" 2>/dev/null
            find /etc/nginx -iname "*msdn-moz*" 2>/dev/null
            echo "----- teste https local -----"
            curl -sk -o /tmp/r2.html -w "HTTPS status: %{http_code}\n" -H "Host: msdn-moz.org" https://127.0.0.1/ || echo "curl https falhou: $?"
            echo "----- teste http verbose -----"
            curl -v -o /tmp/r1.html -H "Host: msdn-moz.org" http://127.0.0.1/ 2>&1 | tail -20
