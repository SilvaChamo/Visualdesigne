name: 'ops: migrar msdn-moz.org — passo 3 (copiar ficheiros + BD do Hetzner para o Contabo)'

on:
  workflow_dispatch: {}

jobs:
  copiar:
    runs-on: ubuntu-latest
    steps:
      - name: Preparar chaves SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hetzner_key
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/contabo_key
          chmod 600 ~/.ssh/hetzner_key ~/.ssh/contabo_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Extrair do Hetzner (só-leitura)
        run: |
          ssh -i ~/.ssh/hetzner_key -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
            "mysqldump 'oshercollective_wp_msdn-moz_org' --single-transaction | gzip" > /tmp/msdnmoz_db.sql.gz
          ssh -i ~/.ssh/hetzner_key -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
            "tar czf - -C /home/oshercollective/domains/msdn-moz.org public_html" > /tmp/msdnmoz_site.tar.gz
          ls -la /tmp/msdnmoz_db.sql.gz /tmp/msdnmoz_site.tar.gz

      - name: Copiar para /tmp no Contabo
        run: |
          scp -i ~/.ssh/contabo_key /tmp/msdnmoz_db.sql.gz /tmp/msdnmoz_site.tar.gz root@${{ secrets.CONTABO_HOST }}:/tmp/
          ssh -i ~/.ssh/contabo_key root@${{ secrets.CONTABO_HOST }} "ls -la /tmp/msdnmoz_*"
