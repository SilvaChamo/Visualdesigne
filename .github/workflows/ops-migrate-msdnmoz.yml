name: 'ops: migrar msdn-moz.org — passo 4 (restaurar ficheiros + BD e testar, sem tocar em DNS)'

on:
  workflow_dispatch: {}

jobs:
  restaurar:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          script: |
            DBPASS=$(cat /root/.osher-migration/msdnmoz-db-password.txt)
            WEBDIR="/home/oshercollective/web/msdn-moz.org/public_html"

            rm -rf "$WEBDIR"
            mkdir -p "$(dirname "$WEBDIR")"
            tar xzf /tmp/msdnmoz_site.tar.gz -C "$(dirname "$WEBDIR")"

            gunzip -c /tmp/msdnmoz_db.sql.gz | mysql -u oshercollective_msdnmoz -p"$DBPASS" oshercollective_msdnmoz

            sed -i "s/define( *'DB_NAME'.*/define( 'DB_NAME', 'oshercollective_msdnmoz' );/" "$WEBDIR/wp-config.php"
            sed -i "s/define( *'DB_USER'.*/define( 'DB_USER', 'oshercollective_msdnmoz' );/" "$WEBDIR/wp-config.php"
            sed -i "s/define( *'DB_PASSWORD'.*/define( 'DB_PASSWORD', '$DBPASS' );/" "$WEBDIR/wp-config.php"
            sed -i "s/define( *'DB_HOST'.*/define( 'DB_HOST', 'localhost' );/" "$WEBDIR/wp-config.php"

            chown -R oshercollective:oshercollective /home/oshercollective/web/msdn-moz.org
            rm -f /tmp/msdnmoz_db.sql.gz /tmp/msdnmoz_site.tar.gz

            echo "----- teste local (sem DNS, via Host header directo) -----"
            CODE=$(curl -sk -o /tmp/resposta.html -w "%{http_code}" -H "Host: msdn-moz.org" http://127.0.0.1/)
            echo "HTTP status: $CODE"
            head -c 400 /tmp/resposta.html
            echo ""
            echo "OK: msdn-moz.org restaurado e testado no Contabo"
