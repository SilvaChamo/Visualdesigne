name: 'ops: testar msdn-moz.org no Contabo via IP real (sem DNS)'

on:
  workflow_dispatch: {}

jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - name: Testar via --resolve directo ao IP do Contabo
        run: |
          echo "----- HTTP -----"
          curl -sk --resolve msdn-moz.org:80:${{ secrets.CONTABO_HOST }} \
            -o /tmp/r1.html -w "HTTP status: %{http_code}\n" http://msdn-moz.org/
          echo "----- HTTPS (sem certificado válido ainda, é esperado) -----"
          curl -sk --resolve msdn-moz.org:443:${{ secrets.CONTABO_HOST }} \
            -o /tmp/r2.html -w "HTTPS status: %{http_code}\n" https://msdn-moz.org/
          echo "----- primeiras linhas da resposta HTTP -----"
          head -c 600 /tmp/r1.html
          echo ""
          echo "----- título da página (se WordPress carregou) -----"
          grep -io "<title>.*</title>" /tmp/r1.html || echo "sem <title> encontrado"
