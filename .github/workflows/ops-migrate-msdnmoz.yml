name: 'ops: migrar msdn-moz.org — passo 2 (criar base de dados no Hestia)'

on:
  workflow_dispatch: {}

jobs:
  criar-bd:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          script: |
            H=/usr/local/hestia/bin
            DBPASS=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | cut -c1-20)
            mkdir -p /root/.osher-migration
            echo "$DBPASS" > /root/.osher-migration/msdnmoz-db-password.txt
            chmod 600 /root/.osher-migration/msdnmoz-db-password.txt

            $H/v-add-database oshercollective msdnmoz msdnmoz "$DBPASS" \
              && echo "BD criada" \
              || echo "(BD já existia, a continuar — senha guardada pode não corresponder à antiga)"

            echo "----- confirmação (sem mostrar password) -----"
            $H/v-list-databases oshercollective plain | awk '{print $1, $2, $3}'
