name: Contabo Hestia Setup

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Stage to run'
        required: true
        type: choice
        options:
          - diagnostics
          - install
          - bootstrap-key
          - test-hestia-api
          - inspect-api-ip-restriction
          - test-hestia-api-from-server

jobs:
  test-hestia-api-from-server:
    if: ${{ inputs.stage == 'test-hestia-api-from-server' }}
    runs-on: ubuntu-latest
    steps:
      - name: Call the Hestia API from inside the Contabo box itself (read-only)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          password: ${{ secrets.CONTABO_ROOT_PASSWORD }}
          script: |
            cd /opt/visualdesign-site-teste
            HOST=$(grep '^HESTIA_HOST=' .env.local | cut -d= -f2-)
            PORT=$(grep '^HESTIA_PORT=' .env.local | cut -d= -f2-)
            USER=$(grep '^HESTIA_USER=' .env.local | cut -d= -f2-)
            PASS=$(grep '^HESTIA_PASSWORD=' .env.local | cut -d= -f2-)
            echo "=== IP público que este servidor usa para se ver a si próprio ==="
            curl -s https://api.ipify.org
            echo ""
            echo ""
            echo "=== chamada v-list-user-packages, a partir do próprio servidor ==="
            OUT=$(curl -sk -D /tmp/hh.txt "https://${HOST}:${PORT}/api/" \
              --data-urlencode "user=${USER}" \
              --data-urlencode "password=${PASS}" \
              --data-urlencode "cmd=v-list-user-packages" \
              --data-urlencode "arg1=json")
            echo "--- Hestia-Exit-Code ---"
            grep -i "hestia-exit-code" /tmp/hh.txt || echo "(cabeçalho não encontrado)"
            echo "--- pacotes devolvidos ---"
            echo "$OUT" | python3 -c "import json,sys; d=json.load(sys.stdin); print('\n'.join(k for k in d.keys() if k!='system'))" 2>&1 || echo "$OUT" | head -c 500

  inspect-api-ip-restriction:
    if: ${{ inputs.stage == 'inspect-api-ip-restriction' }}
    runs-on: ubuntu-latest
    steps:
      - name: Find what blocks "IP is not allowed to connect with API" (read-only)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          password: ${{ secrets.CONTABO_ROOT_PASSWORD }}
          script: |
            echo "=== onde a mensagem de erro está definida ==="
            grep -rn "not allowed to connect with API" /usr/local/hestia/ 2>/dev/null
            echo ""
            echo "=== index.php da API — lógica de verificação de IP ==="
            grep -n -B5 -A15 "not allowed to connect" /usr/local/hestia/web/api/index.php 2>/dev/null
            echo ""
            echo "=== ficheiro de acesso à API do utilizador vdadmin ==="
            cat /usr/local/hestia/data/users/vdadmin/user.conf 2>/dev/null | grep -i "api\|ip"
            ls -la /usr/local/hestia/data/users/vdadmin/ 2>/dev/null | grep -i api
            cat /usr/local/hestia/data/users/vdadmin/api-allowed-ip 2>/dev/null
            echo ""
            echo "=== config geral do Hestia relacionada com API ==="
            grep -i "api" /usr/local/hestia/conf/hestia.conf 2>/dev/null

  test-hestia-api:
    if: ${{ inputs.stage == 'test-hestia-api' }}
    runs-on: ubuntu-latest
    steps:
      - name: Test HESTIA_USER/HESTIA_PASSWORD against the real API (read-only)
        env:
          HESTIA_HOST: ${{ secrets.HESTIA_HOST }}
          HESTIA_PORT: ${{ secrets.HESTIA_PORT }}
          HESTIA_USER: ${{ secrets.HESTIA_USER }}
          HESTIA_PASSWORD: ${{ secrets.HESTIA_PASSWORD }}
          HESTIA_ADMIN_USERNAME: ${{ secrets.HESTIA_ADMIN_USERNAME }}
        run: |
          PORT="${HESTIA_PORT:-8083}"
          echo "=== Secret HESTIA_USER (nome usado pela app) vs HESTIA_ADMIN_USERNAME (nome usado na instalação) ==="
          if [ "${HESTIA_USER}" = "${HESTIA_ADMIN_USERNAME}" ]; then
            echo "IGUAIS — não é um problema de nome de utilizador."
          else
            echo "DIFERENTES — a app está configurada para logar como '${HESTIA_USER}', mas a conta foi criada como '${HESTIA_ADMIN_USERNAME}'. Provável causa."
          fi
          echo ""
          echo "=== Chamada real v-list-user-packages com HESTIA_USER/HESTIA_PASSWORD (o que a app usa) ==="
          OUT=$(curl -sk -D /tmp/hh.txt "https://${HESTIA_HOST}:${PORT}/api/" \
            --data-urlencode "user=${HESTIA_USER}" \
            --data-urlencode "password=${HESTIA_PASSWORD}" \
            --data-urlencode "cmd=v-list-user-packages" \
            --data-urlencode "arg1=json")
          echo "--- Hestia-Exit-Code ---"
          grep -i "hestia-exit-code" /tmp/hh.txt || echo "(cabeçalho não encontrado — ligação/DNS pode ter falhado)"
          echo "--- pacotes devolvidos (se autenticação OK) ---"
          echo "$OUT" | python3 -c "import json,sys; d=json.load(sys.stdin); print('\n'.join(k for k in d.keys() if k!='system'))" 2>&1 || echo "(resposta não é JSON válido — ver abaixo)"
          echo "--- resposta crua (primeiros 500 caracteres, para diagnóstico) ---"
          echo "$OUT" | head -c 500

  bootstrap-key:
    if: ${{ inputs.stage == 'bootstrap-key' }}
    runs-on: ubuntu-latest
    steps:
      - name: Authorize dedicated SSH key for future key-based access
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          password: ${{ secrets.CONTABO_ROOT_PASSWORD }}
          envs: CONTABO_SSH_PUBKEY
          script: |
            mkdir -p /root/.ssh
            chmod 700 /root/.ssh
            touch /root/.ssh/authorized_keys
            grep -qxF "$CONTABO_SSH_PUBKEY" /root/.ssh/authorized_keys || echo "$CONTABO_SSH_PUBKEY" >> /root/.ssh/authorized_keys
            chmod 600 /root/.ssh/authorized_keys
        env:
          CONTABO_SSH_PUBKEY: ${{ secrets.CONTABO_SSH_PUBKEY }}

  diagnostics:
    if: ${{ inputs.stage == 'diagnostics' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check server OS and specs
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          password: ${{ secrets.CONTABO_ROOT_PASSWORD }}
          script: |
            hostnamectl
            echo '---'
            cat /etc/os-release
            echo '---'
            free -h
            echo '---'
            df -h /
            echo '---'
            ip -4 addr show

  install:
    if: ${{ inputs.stage == 'install' }}
    runs-on: ubuntu-latest
    steps:
      - name: Set hostname and install HestiaCP
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          password: ${{ secrets.CONTABO_ROOT_PASSWORD }}
          command_timeout: 30m
          script: |
            set -e
            hostnamectl set-hostname "${{ secrets.HESTIA_HOSTNAME }}"
            curl -sO https://raw.githubusercontent.com/hestiacp/hestiacp/release/install/hst-install.sh
            bash hst-install.sh \
              --force \
              --interactive no \
              --hostname "${{ secrets.HESTIA_HOSTNAME }}" \
              --email "${{ secrets.HESTIA_ADMIN_EMAIL }}" \
              --username "${{ secrets.HESTIA_ADMIN_USERNAME }}" \
              --password "${{ secrets.HESTIA_ADMIN_PASSWORD }}"
