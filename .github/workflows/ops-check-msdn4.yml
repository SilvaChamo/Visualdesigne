name: 'ops: consultar DirectAdmin a partir do servidor Hetzner (só-leitura)'

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Ler .env.local do servidor para credenciais DirectAdmin e consultar de lá
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            cd /opt/visualdesign-site
            DA_PROTO=$(grep '^DIRECTADMIN_PROTOCOL=' .env.local | cut -d= -f2-)
            DA_HOST=$(grep '^DIRECTADMIN_HOST=' .env.local | cut -d= -f2-)
            DA_PORT=$(grep '^DIRECTADMIN_PORT=' .env.local | cut -d= -f2-)
            DA_USER=$(grep '^DIRECTADMIN_USER=' .env.local | cut -d= -f2-)
            DA_PASS=$(grep '^DIRECTADMIN_PASSWORD=' .env.local | cut -d= -f2-)
            echo "===== CMD_API_SHOW_USER_CONFIG (oshercollective) ====="
            curl -s -u "${DA_USER}:${DA_PASS}" \
              "${DA_PROTO}://${DA_HOST}:${DA_PORT}/CMD_API_SHOW_USER_CONFIG?user=oshercollective&json=yes"
            echo ""
