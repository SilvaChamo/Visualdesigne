name: 'ops: verificar motivo real da falha de DNS do aamihe.com (só-leitura)'

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar domain_renewals para aamihe.com
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            docker exec supabase-db psql -U postgres -d postgres -c "
              SELECT domain_name, status, dns_status, notes, updated_at
              FROM public.domain_renewals
              WHERE domain_name = 'aamihe.com';
            " 2>&1
            echo ""
            echo "===== domain_transfer_requests (se existir) ====="
            docker exec supabase-db psql -U postgres -d postgres -c "
              SELECT domain_name, status, dynadot_order_id, updated_at
              FROM public.domain_transfer_requests
              WHERE domain_name = 'aamihe.com';
            " 2>&1
