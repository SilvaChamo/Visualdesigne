name: "Ops - aamihe.com Contabo: confirmar que serve paginas (SO LEITURA)"

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: acesso
        env:
          CONTABO_ROOT_PASSWORD: ${{ secrets.CONTABO_ROOT_PASSWORD }}
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          mkdir -p ~/.ssh
          printf '%s' "$CONTABO_ROOT_PASSWORD" > ~/.copw && chmod 600 ~/.copw
          ssh-keyscan "$CONTABO_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: verificar
        shell: bash --noprofile --norc {0}
        env:
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
        run: |
          set +e
          IP="$CONTABO_HOST"
          co() { sshpass -f ~/.copw ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -n "root@$IP" "$@" </dev/null; }
          D=/home/aamihe/web/aamihe.com/public_html
          WP="php /usr/local/bin/wp --path=$D --allow-root"
          echo "== vhost Hestia do aamihe.com =="
          co "/usr/local/hestia/bin/v-list-web-domain aamihe aamihe.com" 2>&1 | grep -iE 'ip|ssl|backend|proxy|tpl|suspend'
          echo
          echo "== portas a escutar =="
          co "ss -ltnp 2>/dev/null | grep -E ':(80|443|8080|8443) ' | head"
          echo
          echo "== PHP-FPM pool do aamihe a correr? =="
          co "ls /etc/php/*/fpm/pool.d/ 2>/dev/null | grep -i aamihe; systemctl is-active php8.3-fpm php8.2-fpm php8.1-fpm 2>&1 | head"
          echo
          echo "== pedido pelo IP publico com Host: aamihe.com (HTTP) =="
          co "curl -sS -m 25 -D - -o /tmp/a.html -H 'Host: aamihe.com' http://$IP/ 2>&1 | head -25; echo '---- primeiros bytes do corpo ----'; head -c 600 /tmp/a.html; echo"
          echo
          echo "== pedido HTTPS pelo IP (cert ainda self/errado, -k) =="
          co "curl -skS -m 25 -o /dev/null -w 'HTTP %{http_code}  redirect=%{redirect_url}\n' -H 'Host: aamihe.com' https://$IP/ 2>&1"
          co "curl -skS -m 25 -o /dev/null -w 'wp-login HTTP %{http_code}\n' -H 'Host: aamihe.com' https://$IP/wp-login.php 2>&1"
          echo
          echo "== home/siteurl na BD =="
          co "$WP option get home 2>&1; $WP option get siteurl 2>&1"
          echo "== tema activo =="
          co "$WP theme list --status=active --field=name 2>&1"
          echo
          echo "== erros recentes do site (log) =="
          co "tail -n 20 /var/log/apache2/domains/aamihe.com.error.log 2>/dev/null; tail -n 20 /home/aamihe/web/aamihe.com/logs/*error* 2>/dev/null" 2>&1
