name: 'ops: verificar limite de email por domínio no DirectAdmin (só-leitura)'

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Ler ficheiros de limite por domínio directamente no servidor
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            echo "===== user_config (limite geral da conta) ====="
            grep -i "email\|send" /usr/local/directadmin/data/users/oshercollective/user.conf 2>&1
            echo ""
            echo "===== domains da conta oshercollective ====="
            ls -la /usr/local/directadmin/data/users/oshercollective/domains/ 2>&1
            echo ""
            echo "===== ficheiro de config específico do msdn-moz.org (se existir) ====="
            find /usr/local/directadmin/data/users/oshercollective/domains/ -iname "*msdn*" 2>&1
            cat /usr/local/directadmin/data/users/oshercollective/domains/msdn-moz.org.conf 2>&1
