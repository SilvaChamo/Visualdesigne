name: Retry de DNS de domínios comprados

# Rede de segurança: se a configuração automática de DNS (zona Cloudflare +
# nameservers) de um domínio comprado falhar no momento da compra, esta
# tarefa vai tentando de novo periodicamente até resolver, em vez de o
# domínio ficar preso à espera de um admin reparar manualmente. Mesmo padrão
# de domain-transfer-check.yml.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar endpoint de retry de DNS
        run: |
          curl -sS -f -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://visualdesignmoz.com/api/cron/dns-retry"
