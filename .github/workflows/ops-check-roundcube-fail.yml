name: 'ops: confirmar se a conta ficou em oshercollective.com (so-leitura)'

on:
  workflow_dispatch: {}

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            echo "----- silva.chamo existe em oshercollective.com? -----"
            grep "^silva.chamo:" /etc/virtual/oshercollective.com/passwd 2>&1 | cut -d: -f1
            find /home/oshercollective/imap/oshercollective.com -maxdepth 1 -iname "silva*"
            echo "----- tentativas de login recentes para essa conta -----"
            journalctl -u dovecot --since "-3 hours" 2>/dev/null | grep -i "silva.chamo@oshercollective" | tail -10
