name: 'ops: verificar estrutura de virtual mail de elimservicos.com (so-leitura)'

on:
  workflow_dispatch: {}

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            echo "----- /etc/virtual/elimservicos.com -----"
            ls -la /etc/virtual/elimservicos.com/ 2>&1
            echo "----- nomes de contas no ficheiro passwd (sem hashes) -----"
            awk -F: '{print $1}' /etc/virtual/elimservicos.com/passwd 2>&1
            echo "----- passwd_alt existe? -----"
            ls -la /etc/virtual/elimservicos.com/passwd_alt 2>&1
            echo "----- comparar com um domínio saudável (msdn-moz.org) -----"
            ls -la /etc/virtual/msdn-moz.org/ 2>&1
            echo "----- log do painel/exim à volta da criação -----"
            grep -i "silva.chamo" /var/log/directadmin/errortaskq.log 2>/dev/null | tail -10
            grep -i "silva.chamo" /var/log/directadmin/*.log 2>/dev/null | tail -20
