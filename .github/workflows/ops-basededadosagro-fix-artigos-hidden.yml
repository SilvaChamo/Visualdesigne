name: Ops — mostrar grelha de artigos/notícias por defeito

# Execução manual só. Causa raiz final de "notícias não aparecem", achada
# com verificação real em browser (Playwright) — não só curl: a grelha de
# artigos (displayedArticles.map(...)) só é renderizada dentro do ramo
# {isSearchActive ? ... : <banner promocional>}, e isSearchActive só passa
# a true depois de o utilizador escrever algo na pesquisa (handleSearch).
# Por defeito a página mostra só o banner "O Futuro do Campo é Digital" +
# 2 caixas informativas — nunca a lista de artigos, mesmo com dados reais já
# carregados em memória. Corrige activando isSearchActive automaticamente
# assim que o fetch inicial termina (sucesso ou falha), sem tocar na
# pesquisa manual em si (continua a funcionar exactamente igual).
on:
  workflow_dispatch:

jobs:
  fix-and-restart:
    name: Activar grelha por defeito, rebuild e reiniciar
    runs-on: ubuntu-latest
    steps:
      - name: Aplicar correcção via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /opt/basededadosagro-site
            STAMP=$(date +%Y%m%d-%H%M%S)
            F="app/[locale]/artigos/page.tsx"
            cp "$F" "$F.bak-hiddenfix-$STAMP"

            perl -i -pe "s/(            \} finally \{\n                setLoading\(false\);\n)(            \}\n        \}\n        fetchInitial\(\);)/\$1                setIsSearchActive(true); \/\/ mostrar a grelha de artigos por defeito, sem exigir pesquisa\n\$2/" -0777 "$F"

            if ! grep -q "setIsSearchActive(true); // mostrar a grelha" "$F"; then
              echo "ERRO: a correcção não apanhou o padrão esperado." >&2
              exit 1
            fi
            echo "--- confirmação ---"
            grep -n -B3 "mostrar a grelha" "$F"

            echo "--- rebuild ---"
            npm ci
            npm run build

            echo "--- restart ---"
            pm2 restart basededadosagro-site
            pm2 save
