name: Ops — ligar motor de hospedagem nativo + limpar dados de teste

# Execução manual só (workflow_dispatch). Dois passos independentes:
# 1) Termina a ligação do motor de hospedagem nativo (fora da DirectAdmin) ao
#    Apache do servidor — a pasta /etc/httpd/conf/native-sites/ e o ficheiro
#    /etc/httpd/conf/extra/native-sites.conf já existiam (criados manualmente
#    a 2026-08-08); faltava só o "Include" no httpd.conf principal. Testa a
#    configuração ANTES de recarregar e reverte automaticamente se ficar
#    inválida — nunca arrisca tirar do ar os sites reais servidos pela mesma
#    instância do Apache.
# 2) Remove registos de teste identificados numa auditoria (2026-08-09):
#    3 domínios de teste (entrecampos.com, basededadosagro.com,
#    meusite-teste.com) que nunca chegaram a ter hospedagem real — só
#    hosting_renewals/checkout_sessions duplicados e uma password de
#    hospedagem falsa guardada em profiles — e 16 contas antigas de teste em
#    panel_auth_accounts (Jun 2026, nunca ligadas a um servidor real).
on:
  workflow_dispatch:

jobs:
  ligar-hospedagem-nativa:
    name: Ligar motor de hospedagem nativo ao Apache
    runs-on: ubuntu-latest
    steps:
      - name: Adicionar Include + testar + recarregar (com reversão automática)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            HTTPD_CONF="/etc/httpd/conf/httpd.conf"
            BACKUP="/etc/httpd/conf/httpd.conf.bak-native-setup-$(date +%s)"
            cp "$HTTPD_CONF" "$BACKUP"
            echo "Backup em $BACKUP"

            if grep -q "native-sites.conf" "$HTTPD_CONF"; then
              echo "Include já existia, não mexi."
            else
              echo "Include conf/extra/native-sites.conf" >> "$HTTPD_CONF"
              echo "Include adicionado."
            fi

            if ! apachectl configtest; then
              echo "ERRO: configuração do Apache ficou inválida — a reverter." >&2
              cp "$BACKUP" "$HTTPD_CONF"
              exit 1
            fi

            systemctl reload httpd
            echo "Apache recarregado com sucesso."

      - name: Confirmar que os sites reais continuam no ar
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 2m
          script: |
            set -e
            curl -sk -o /dev/null -w "visualdesignmoz.com -> HTTP %{http_code}\n" https://visualdesignmoz.com
            curl -sk -o /dev/null -w "oshercollective.com -> HTTP %{http_code}\n" https://oshercollective.com

  limpar-dados-teste:
    name: Remover registos de teste (hosting_renewals, checkout_sessions, contas antigas)
    runs-on: ubuntu-latest
    needs: ligar-hospedagem-nativa
    steps:
      - name: Apagar via psql no container Supabase
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            CONTAINER=$(docker ps --format '{{.Names}}' | grep -iE 'supabase.*db|supabase-db|postgres' | head -n1)
            if [ -z "$CONTAINER" ]; then
              echo "Não encontrei nenhum container de Postgres/Supabase a correr:" >&2
              docker ps --format '{{.Names}}'
              exit 1
            fi
            DB_USER=$(docker exec "$CONTAINER" printenv POSTGRES_USER 2>/dev/null || echo postgres)
            DB_NAME=$(docker exec "$CONTAINER" printenv POSTGRES_DB 2>/dev/null || echo postgres)
            echo "--- Antes ---"
            docker exec "$CONTAINER" psql -U "$DB_USER" -d "$DB_NAME" -t -c \
              "select count(*) from hosting_renewals where domain_name in ('entrecampos.com','basededadosagro.com','meusite-teste.com');"

            docker exec "$CONTAINER" psql -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 -c \
              "delete from hosting_renewals where domain_name in ('entrecampos.com','basededadosagro.com','meusite-teste.com');"
            docker exec "$CONTAINER" psql -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 -c \
              "delete from checkout_sessions where user_id in ('8c185359-209f-49df-99a8-c6fdd40dd30e','a148e3cd-28f4-4bd3-b499-8358d01b2be4','78dac824-ff02-4deb-bdea-b537eeacad99');"
            docker exec "$CONTAINER" psql -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 -c \
              "update profiles set da_password_encrypted = null where user_id in ('8c185359-209f-49df-99a8-c6fdd40dd30e','a148e3cd-28f4-4bd3-b499-8358d01b2be4','78dac824-ff02-4deb-bdea-b537eeacad99');"
            docker exec "$CONTAINER" psql -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 -c \
              "delete from panel_auth_accounts where server_linked = false and created_at between '2026-06-15' and '2026-06-23';"

            echo "--- Depois ---"
            docker exec "$CONTAINER" psql -U "$DB_USER" -d "$DB_NAME" -t -c \
              "select count(*) from hosting_renewals where domain_name in ('entrecampos.com','basededadosagro.com','meusite-teste.com');"
            docker exec "$CONTAINER" psql -U "$DB_USER" -d "$DB_NAME" -t -c \
              "select server_linked, count(*) from panel_auth_accounts group by server_linked;"
