name: Cron — robô de notícias do basededadosagro.com

# Chama /api/cron/news-fetch periodicamente (a cada 6h). Essa rota pesquisa
# RSS do Google News, guarda candidatos em articles_pending (nunca publica
# sozinha) e envia email de alerta se encontrar novidades. O segredo
# BASEDEDADOSAGRO_CRON_SECRET vive só aqui (o repo do basededadosagro não
# pode ter secrets novos — ver ops-basededadosagro-deploy.yml) e é
# sincronizado para o servidor a cada deploy.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  fetch:
    name: Disparar pesquisa de notícias
    runs-on: ubuntu-latest
    steps:
      - name: Chamar /api/cron/news-fetch
        run: |
          code=$(curl -sk -o /tmp/resp.json -w "%{http_code}" --max-time 60 \
            -H "Authorization: Bearer ${{ secrets.BASEDEDADOSAGRO_CRON_SECRET }}" \
            "https://basededadosagro.com/api/cron/news-fetch")
          echo "HTTP $code"
          cat /tmp/resp.json
          if [ "$code" != "200" ]; then
            echo "Pedido falhou" >&2
            exit 1
          fi
