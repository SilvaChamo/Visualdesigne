name: 'ops: estado real da conta oshercollective no DirectAdmin (só-leitura)'

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar DirectAdmin directamente
        env:
          DA_PROTO: ${{ secrets.DIRECTADMIN_PROTOCOL }}
          DA_HOST: ${{ secrets.DIRECTADMIN_HOST }}
          DA_PORT: ${{ secrets.DIRECTADMIN_PORT }}
          DA_USER: ${{ secrets.DIRECTADMIN_USER }}
          DA_PASS: ${{ secrets.DIRECTADMIN_PASSWORD }}
        run: |
          echo "===== CMD_API_SHOW_USER_CONFIG (oshercollective) ====="
          curl -s -u "${DA_USER}:${DA_PASS}" \
            "${DA_PROTO}://${DA_HOST}:${DA_PORT}/CMD_API_SHOW_USER_CONFIG?user=oshercollective&json=yes"
          echo ""
          echo ""
          echo "===== CMD_API_SHOW_USERS (estado geral, procurar suspended) ====="
          curl -s -u "${DA_USER}:${DA_PASS}" \
            "${DA_PROTO}://${DA_HOST}:${DA_PORT}/CMD_API_SHOW_USERS?user=oshercollective&json=yes"
