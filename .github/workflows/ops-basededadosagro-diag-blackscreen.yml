name: Ops — diagnóstico (só leitura) ecrã preto basededadosagro.com

# Execução manual, temporária, sem alterar nada no servidor. Investiga um
# relato de "ecrã preto com texto estranho" ao dar refresh no site — sintoma
# típico de o processo PM2 ter reiniciado/crashado a meio de um pedido.
on:
  workflow_dispatch:

jobs:
  diag:
    name: Verificar estado do processo e recursos
    runs-on: ubuntu-latest
    steps:
      - name: Diagnóstico via SSH (sem alterar nada)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 5m
          script: |
            echo "=== pm2 status (basededadosagro-site) ==="
            pm2 jlist | python3 -c "
            import json,sys
            for p in json.load(sys.stdin):
                if p['name'] == 'basededadosagro-site':
                    m = p['pm2_env']
                    print('status:', m.get('status'))
                    print('restart_time:', m.get('restart_time'))
                    print('unstable_restarts:', m.get('unstable_restarts'))
                    print('uptime desde:', m.get('pm_uptime'))
                    print('created_at:', m.get('created_at'))
                    print('memory (bytes):', p.get('monit',{}).get('memory'))
                    print('cpu:', p.get('monit',{}).get('cpu'))
                    print('exec_mode:', m.get('exec_mode'))
                    print('node_args:', m.get('node_args'))
            "

            echo ""
            echo "=== pm2 describe (raw) ==="
            pm2 describe basededadosagro-site | head -60

            echo ""
            echo "=== últimas 150 linhas de erro (pm2 error log) ==="
            ERR_LOG=$(pm2 describe basededadosagro-site | grep "error log path" | awk '{print $NF}')
            echo "ficheiro: $ERR_LOG"
            tail -n 150 "$ERR_LOG" 2>/dev/null || echo "não consegui ler o ficheiro"

            echo ""
            echo "=== últimas 80 linhas de output (pm2 out log) ==="
            OUT_LOG=$(pm2 describe basededadosagro-site | grep "out log path" | awk '{print $NF}')
            echo "ficheiro: $OUT_LOG"
            tail -n 80 "$OUT_LOG" 2>/dev/null || echo "não consegui ler o ficheiro"

            echo ""
            echo "=== memória e disco da máquina ==="
            free -h
            echo ""
            df -h /

            echo ""
            echo "=== dmesg: processos mortos por falta de memória (OOM killer) ==="
            dmesg -T 2>/dev/null | grep -i "out of memory\|oom-killer\|killed process" | tail -n 20 || echo "sem acesso a dmesg ou nada encontrado"

            echo ""
            echo "=== erro Apache (vhost basededadosagro, se existir) ==="
            find /etc/apache2 /etc/httpd -iname "*basededadosagro*" 2>/dev/null
            for f in /var/log/apache2/*basededadosagro* /var/log/httpd/*basededadosagro*; do
              if [ -f "$f" ]; then
                echo "--- $f ---"
                tail -n 60 "$f"
              fi
            done 2>/dev/null || true
