name: "Ops - Fase 1: inventário Contabo vs Hetzner para paridade total (só leitura)"

on:
  workflow_dispatch:

jobs:
  contabo:
    name: contabo
    runs-on: ubuntu-latest
    steps:
      - name: Inventaria Hestia + Supabase do Contabo (nada é alterado)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          password: ${{ secrets.CONTABO_ROOT_PASSWORD }}
          command_timeout: 5m
          script: |
            set +e
            echo "=== Contas Hestia (v-list-users) ==="
            /usr/local/hestia/bin/v-list-users json 2>&1
            echo ""
            echo "=== Domínios web por conta ==="
            for u in aamihe oshercollective provisualcorporate vdadmin; do
              echo "--- $u ---"
              /usr/local/hestia/bin/v-list-web-domains "$u" json 2>&1
            done
            echo ""
            echo "=== Schemas no Supabase próprio do Contabo ==="
            docker exec supabase-db psql -U postgres -d postgres -c "\dn" 2>&1
            echo ""
            echo "=== Contagens de tabelas-chave do painel (Contabo) ==="
            for t in public.panel_sites public.panel_users public.panel_auth_accounts auth.users storage.objects; do
              echo -n "$t: "
              docker exec supabase-db psql -U postgres -d postgres -t -c "SELECT count(*) FROM $t;" 2>&1
            done
            echo ""
            echo "=== FASE 2 - identificadores linha-a-linha (Contabo) ==="
            echo "--- panel_sites (domain) ---"
            docker exec supabase-db psql -U postgres -d postgres -t -A -c "SELECT domain FROM panel_sites ORDER BY domain;" 2>&1
            echo "--- panel_users (username) ---"
            docker exec supabase-db psql -U postgres -d postgres -t -A -c "SELECT username FROM panel_users ORDER BY username;" 2>&1
            echo "--- panel_auth_accounts (da_username|provider) ---"
            docker exec supabase-db psql -U postgres -d postgres -t -A -c "SELECT da_username || '|' || provider FROM panel_auth_accounts ORDER BY da_username;" 2>&1
            echo "--- auth.users (email) ---"
            docker exec supabase-db psql -U postgres -d postgres -t -A -c "SELECT email FROM auth.users ORDER BY email;" 2>&1
            echo "--- storage.objects (bucket_id/name) ---"
            docker exec supabase-db psql -U postgres -d postgres -t -A -c "SELECT bucket_id || '/' || name FROM storage.objects ORDER BY 1;" 2>&1

  hetzner:
    name: hetzner
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Inventaria Supabase original + localiza basededadosagro.com (nada é alterado)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set +e
            echo "=== Schemas no Supabase original (Hetzner) ==="
            docker exec supabase-db psql -U postgres -d postgres -c "\dn" 2>&1
            echo ""
            echo "=== Contagens de tabelas-chave do painel (Hetzner) ==="
            for t in public.panel_sites public.panel_users public.panel_auth_accounts auth.users storage.objects; do
              echo -n "$t: "
              docker exec supabase-db psql -U postgres -d postgres -t -c "SELECT count(*) FROM $t;" 2>&1
            done
            echo ""
            echo "=== Tamanho dos schemas basededados/baseagrodata (basededadosagro.com) ==="
            docker exec supabase-db psql -U postgres -d postgres -t -c "
              SELECT schemaname, pg_size_pretty(sum(pg_total_relation_size(schemaname||'.'||tablename))::bigint)
              FROM pg_tables WHERE schemaname IN ('basededados','baseagrodata')
              GROUP BY schemaname;" 2>&1
            echo ""
            echo "=== Contagem de tabelas por schema (basededados/baseagrodata) ==="
            docker exec supabase-db psql -U postgres -d postgres -t -c "
              SELECT schemaname, count(*) FROM pg_tables
              WHERE schemaname IN ('basededados','baseagrodata') GROUP BY schemaname;" 2>&1
            echo ""
            echo "=== Onde vive o código do basededadosagro.com no disco ==="
            ls -la /home/admin/domains/basededadosagro.com/ 2>&1
            echo "--- possível public_html ou proxy ---"
            find /home/admin/domains/basededadosagro.com -maxdepth 2 2>&1
            echo ""
            echo "=== Processos pm2 a correr (para achar o processo real da app) ==="
            pm2 list 2>&1
            echo ""
            echo "=== Procura directórios com o nome do site fora de /home (caso corra de outro sítio) ==="
            find /opt /var/www /root -maxdepth 3 -iname "*basededadosagro*" -o -iname "*baseagrodata*" 2>/dev/null
            echo ""
            echo "=== FASE 2 - identificadores linha-a-linha (Hetzner) ==="
            echo "--- panel_sites (domain) ---"
            docker exec supabase-db psql -U postgres -d postgres -t -A -c "SELECT domain FROM panel_sites ORDER BY domain;" 2>&1
            echo "--- panel_users (username) ---"
            docker exec supabase-db psql -U postgres -d postgres -t -A -c "SELECT username FROM panel_users ORDER BY username;" 2>&1
            echo "--- panel_auth_accounts (da_username|provider) ---"
            docker exec supabase-db psql -U postgres -d postgres -t -A -c "SELECT da_username || '|' || provider FROM panel_auth_accounts ORDER BY da_username;" 2>&1
            echo "--- auth.users (email) ---"
            docker exec supabase-db psql -U postgres -d postgres -t -A -c "SELECT email FROM auth.users ORDER BY email;" 2>&1
            echo "--- storage.objects (bucket_id/name) ---"
            docker exec supabase-db psql -U postgres -d postgres -t -A -c "SELECT bucket_id || '/' || name FROM storage.objects ORDER BY 1;" 2>&1

  colunas:
    name: colunas
    runs-on: ubuntu-latest
    steps:
      - name: Lista colunas exactas de auth.users, auth.identities, storage.objects
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          password: ${{ secrets.CONTABO_ROOT_PASSWORD }}
          command_timeout: 3m
          script: |
            set +e
            for t in auth.users auth.identities storage.objects; do
              echo "=== $t ==="
              docker exec supabase-db psql -U postgres -d postgres -t -A -c "
                SELECT string_agg(column_name, ',' ORDER BY ordinal_position)
                FROM information_schema.columns
                WHERE table_schema||'.'||table_name = '$t';" 2>&1
              echo "--- colunas GERADAS (não podem ir na lista de COPY/INSERT) ---"
              docker exec supabase-db psql -U postgres -d postgres -t -A -c "
                SELECT column_name FROM information_schema.columns
                WHERE table_schema||'.'||table_name = '$t' AND is_generated = 'ALWAYS';" 2>&1
            done

  localiza-ficheiros:
    name: localiza-ficheiros
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Localiza no disco os 7 ficheiros em falta + estrutura do volume storage
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 3m
          script: |
            set +e
            echo "=== onde fica o volume de storage (docker inspect) ==="
            docker inspect supabase-storage --format '{{range .Mounts}}{{.Source}} -> {{.Destination}}{{"\n"}}{{end}}' 2>&1
            echo ""
            echo "=== estrutura de pastas (2 níveis) ==="
            find /opt/supabase-aamihe/docker/volumes/storage -maxdepth 3 2>&1 | head -30
            echo ""
            echo "=== localiza os 7 ficheiros específicos ==="
            find /opt/supabase-aamihe/docker/volumes/storage -iname "*FACIm_2026*" -o -iname "*postgres-2026-09-01*" 2>&1

  copia-dados-em-falta:
    name: copia-dados-em-falta
    runs-on: ubuntu-latest
    steps:
      - name: Prepara chaves SSH para os dois servidores
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hetzner_key
          chmod 600 ~/.ssh/hetzner_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/contabo_key
          chmod 600 ~/.ssh/contabo_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          mkdir -p /tmp/transfer

      - name: Copia os 7 ficheiros do balde que só existem no Hetzner
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
        run: |
          set -e
          BASE="visualdesign-storage/stub"
          echo "--- confirma que a mesma estrutura de pastas existe no Contabo ---"
          ssh -i ~/.ssh/contabo_key "root@$CONTABO_HOST" "test -d /opt/supabase-contabo/docker/volumes/storage/$BASE && echo OK_ESTRUTURA_IGUAL || echo FALTA_ESTRUTURA"

          # Nota (4 set, 2ª tentativa): "db-backups/postgres-2026-09-01_030002.sql.gz"
          # foi removido desta lista — já não existe no disco do Hetzner (uma rotina
          # própria do servidor substituiu-o por um backup mais recente entre a
          # verificação e esta escrita). É só a cópia de segurança interna do Hetzner,
          # não é conteúdo do utilizador — fora de âmbito, não voltar a incluir aqui.
          FILES=(
            "public-assets/noticias/Ave-de-estimacao-na-gaiola-confortavel-dentro-de-casa_1788259948273.avif"
            "public-assets/noticias/FACIm_2026_1788247873233.jpeg"
            "public-assets/noticias/FAcim2026_1788261208812.jpeg"
            "public-assets/noticias/IIAM_1788259001124.jpeg"
            "public-assets/noticias/images_1788472667794.jpeg"
            "public-assets/noticias/images__1__1788473533503.jpeg"
          )
          # Descoberta (4 set, 3ª tentativa): o backend de storage do Supabase guarda
          # cada objecto como uma PASTA com o nome do objecto (ex.: ".../FACIm_2026_...jpeg/"),
          # com o ficheiro real (nome UUID) lá dentro — confirmado com `stat` isolado
          # (job verifica-noticias) e visível na listagem já existente no Contabo
          # (".../Arroz_...webp/bfa617d1-...", mesmo padrão). Por isso: test -d (não -f),
          # e rsync recursivo do conteúdo da pasta (não scp de um ficheiro).
          COPIED=()
          for f in "${FILES[@]}"; do
            REMOTE_EXISTS=$(ssh -i ~/.ssh/hetzner_key -p "$HETZNER_PORT" "$HETZNER_USER@$HETZNER_HOST" "test -d /opt/supabase-aamihe/docker/volumes/storage/$BASE/$f && echo SIM || echo NAO")
            if [ "$REMOTE_EXISTS" != "SIM" ]; then
              echo "AVISO: $f já não existe no Hetzner (mudou entretanto) — a saltar, não é erro fatal."
              continue
            fi
            mkdir -p "/tmp/transfer/$f"
            rsync -a -e "ssh -i ~/.ssh/hetzner_key -p $HETZNER_PORT" \
              "$HETZNER_USER@$HETZNER_HOST:/opt/supabase-aamihe/docker/volumes/storage/$BASE/$f/" \
              "/tmp/transfer/$f/"
            COPIED+=("$f")
          done
          echo "--- ficheiros trazidos para o runner ---"
          find /tmp/transfer -type f -exec ls -la {} \;

          echo "--- confirma o que já existe no Contabo (idempotente: salta o que já lá está) ---"
          TO_SEND=()
          for f in "${COPIED[@]}"; do
            EXISTS=$(ssh -i ~/.ssh/contabo_key "root@$CONTABO_HOST" "test -d /opt/supabase-contabo/docker/volumes/storage/$BASE/$f && echo SIM || echo NAO")
            echo "$f -> já existe no Contabo? $EXISTS"
            if [ "$EXISTS" = "SIM" ]; then
              echo "  já copiado numa tentativa anterior, não repito."
            else
              TO_SEND+=("$f")
            fi
          done

          echo "--- envia para o Contabo (só as pastas que ainda faltam) ---"
          for f in "${TO_SEND[@]}"; do
            ssh -i ~/.ssh/contabo_key "root@$CONTABO_HOST" "mkdir -p /opt/supabase-contabo/docker/volumes/storage/$BASE/$f"
            rsync -a -e "ssh -i ~/.ssh/contabo_key" \
              "/tmp/transfer/$f/" \
              "root@$CONTABO_HOST:/opt/supabase-contabo/docker/volumes/storage/$BASE/$f/"
          done
          echo "--- confirma no Contabo depois de copiar ---"
          ssh -i ~/.ssh/contabo_key "root@$CONTABO_HOST" "find /opt/supabase-contabo/docker/volumes/storage/$BASE/public-assets/noticias -mindepth 2 -type f -exec ls -la {} \;"

      - name: Copia as 3 contas de login (auth.users + auth.identities) que só existem no Hetzner
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
        run: |
          set -e
          EMAILS="'duducahamatavele@gmail.com','media@oshercollective.com','merci.chamo@gmail.com'"
          # confirmed_at excluída (2ª tentativa, 4 set): é GENERATED ALWAYS AS
          # (LEAST(email_confirmed_at, phone_confirmed_at)) STORED — Postgres
          # recusa-a em COPY/INSERT. Recalcula-se sozinha a partir das outras
          # duas colunas, que já vão na lista.
          USERS_COLS="instance_id,id,aud,role,email,encrypted_password,email_confirmed_at,invited_at,confirmation_token,confirmation_sent_at,recovery_token,recovery_sent_at,email_change_token_new,email_change,email_change_sent_at,last_sign_in_at,raw_app_meta_data,raw_user_meta_data,is_super_admin,created_at,updated_at,phone,phone_confirmed_at,phone_change,phone_change_token,phone_change_sent_at,email_change_token_current,email_change_confirm_status,banned_until,reauthentication_token,reauthentication_sent_at,is_sso_user,deleted_at,is_anonymous"
          # email excluída (3ª tentativa, 4 set): GENERATED ALWAYS AS
          # (lower(identity_data->>'email')) STORED em auth.identities — recalcula-se
          # sozinha a partir de identity_data, que já vai na lista.
          IDENT_COLS="provider_id,user_id,identity_data,provider,last_sign_in_at,created_at,updated_at,id"

          echo "--- estado actual no Contabo (idempotente: só faz o que ainda falta) ---"
          USERS_EXIST=$(ssh -i ~/.ssh/contabo_key "root@$CONTABO_HOST" "docker exec supabase-db psql -U postgres -d postgres -t -A -c \"SELECT count(*) FROM auth.users WHERE email IN ($EMAILS)\"")
          IDENT_EXIST=$(ssh -i ~/.ssh/contabo_key "root@$CONTABO_HOST" "docker exec supabase-db psql -U postgres -d postgres -t -A -c \"SELECT count(*) FROM auth.identities WHERE email IN ($EMAILS)\"")
          echo "auth.users já existentes: $USERS_EXIST (esperado 0 ou 3) | auth.identities já existentes: $IDENT_EXIST (esperado 0 ou 3)"

          if [ "$USERS_EXIST" = "0" ]; then
            echo "--- extrai e insere auth.users (ainda não existem no Contabo) ---"
            REMOTE_SQL_USERS="COPY (SELECT $USERS_COLS FROM auth.users WHERE email IN ($EMAILS)) TO STDOUT"
            ssh -i ~/.ssh/hetzner_key -p "$HETZNER_PORT" "$HETZNER_USER@$HETZNER_HOST" "docker exec supabase-db psql -U postgres -d postgres -c \"$REMOTE_SQL_USERS\"" > /tmp/transfer/auth_users.copy
            cat /tmp/transfer/auth_users.copy | ssh -i ~/.ssh/contabo_key "root@$CONTABO_HOST" "docker exec -i supabase-db psql -U postgres -d postgres -c \"COPY auth.users ($USERS_COLS) FROM STDIN\""
          elif [ "$USERS_EXIST" = "3" ]; then
            echo "auth.users: as 3 contas já foram inseridas numa tentativa anterior — não repito."
          else
            echo "ABORTAR: contagem inesperada em auth.users ($USERS_EXIST), não mexo em nada"; exit 1
          fi

          if [ "$IDENT_EXIST" = "0" ]; then
            echo "--- extrai e insere auth.identities (ainda não existem no Contabo) ---"
            REMOTE_SQL_IDENT="COPY (SELECT $IDENT_COLS FROM auth.identities WHERE email IN ($EMAILS)) TO STDOUT"
            ssh -i ~/.ssh/hetzner_key -p "$HETZNER_PORT" "$HETZNER_USER@$HETZNER_HOST" "docker exec supabase-db psql -U postgres -d postgres -c \"$REMOTE_SQL_IDENT\"" > /tmp/transfer/auth_identities.copy
            cat /tmp/transfer/auth_identities.copy | ssh -i ~/.ssh/contabo_key "root@$CONTABO_HOST" "docker exec -i supabase-db psql -U postgres -d postgres -c \"COPY auth.identities ($IDENT_COLS) FROM STDIN\""
          elif [ "$IDENT_EXIST" = "3" ]; then
            echo "auth.identities: as 3 já foram inseridas numa tentativa anterior — não repito."
          else
            echo "ABORTAR: contagem inesperada em auth.identities ($IDENT_EXIST), não mexo em nada"; exit 1
          fi

          echo "--- confirma o resultado ---"
          ssh -i ~/.ssh/contabo_key "root@$CONTABO_HOST" "docker exec supabase-db psql -U postgres -d postgres -t -A -c \"SELECT email FROM auth.users WHERE email IN ($EMAILS) ORDER BY email\""

      - name: Copia as 7 linhas de storage.objects que só existem no Hetzner
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
        run: |
          set -e
          STORAGE_COLS="id,bucket_id,name,owner,created_at,updated_at,last_accessed_at,metadata,version,owner_id,user_metadata"
          # db-backups/postgres-2026-09-01_030002.sql.gz excluído de propósito (ver
          # nota no passo anterior — ficheiro já não existe no Hetzner, rotacionado).
          VALUES="('public-assets','noticias/Ave-de-estimacao-na-gaiola-confortavel-dentro-de-casa_1788259948273.avif'),
                   ('public-assets','noticias/FACIm_2026_1788247873233.jpeg'),
                   ('public-assets','noticias/FAcim2026_1788261208812.jpeg'),
                   ('public-assets','noticias/IIAM_1788259001124.jpeg'),
                   ('public-assets','noticias/images_1788472667794.jpeg'),
                   ('public-assets','noticias/images__1__1788473533503.jpeg')"

          echo "--- estado actual no Contabo (idempotente: só faz o que ainda falta) ---"
          EXIST=$(ssh -i ~/.ssh/contabo_key "root@$CONTABO_HOST" "docker exec supabase-db psql -U postgres -d postgres -t -A -c \"SELECT count(*) FROM storage.objects WHERE (bucket_id,name) IN ($VALUES)\"")
          echo "já existentes no Contabo: $EXIST (esperado 0 ou 6)"

          if [ "$EXIST" = "0" ]; then
            echo "--- extrai e insere (ainda não existem no Contabo) ---"
            REMOTE_SQL="COPY (SELECT $STORAGE_COLS FROM storage.objects WHERE (bucket_id,name) IN ($VALUES)) TO STDOUT"
            ssh -i ~/.ssh/hetzner_key -p "$HETZNER_PORT" "$HETZNER_USER@$HETZNER_HOST" "docker exec supabase-db psql -U postgres -d postgres -c \"$REMOTE_SQL\"" > /tmp/transfer/storage_objects.copy
            echo "linhas extraídas: $(wc -l < /tmp/transfer/storage_objects.copy)"
            cat /tmp/transfer/storage_objects.copy | ssh -i ~/.ssh/contabo_key "root@$CONTABO_HOST" "docker exec -i supabase-db psql -U postgres -d postgres -c \"COPY storage.objects ($STORAGE_COLS) FROM STDIN\""
          elif [ "$EXIST" = "6" ]; then
            echo "as 6 linhas já foram inseridas numa tentativa anterior — não repito."
          else
            echo "ABORTAR: contagem inesperada ($EXIST), não mexo em nada"; exit 1
          fi

          echo "--- confirma o resultado ---"
          ssh -i ~/.ssh/contabo_key "root@$CONTABO_HOST" "docker exec supabase-db psql -U postgres -d postgres -t -A -c \"SELECT bucket_id||'/'||name FROM storage.objects WHERE (bucket_id,name) IN ($VALUES) ORDER BY 1\""

      - name: Confirma que o Hetzner não foi tocado (contagens iguais às de antes)
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
        run: |
          set -e
          for t in auth.users auth.identities storage.objects panel_sites panel_users panel_auth_accounts; do
            echo -n "$t: "
            ssh -i ~/.ssh/hetzner_key -p "$HETZNER_PORT" "$HETZNER_USER@$HETZNER_HOST" "docker exec supabase-db psql -U postgres -d postgres -t -A -c \"SELECT count(*) FROM $t\""
          done

      - name: Contagens finais no Contabo, depois de todas as escritas
        env:
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
        run: |
          set -e
          for t in auth.users auth.identities storage.objects panel_sites panel_users panel_auth_accounts; do
            echo -n "$t: "
            ssh -i ~/.ssh/contabo_key "root@$CONTABO_HOST" "docker exec supabase-db psql -U postgres -d postgres -t -A -c \"SELECT count(*) FROM $t\""
          done

  verifica-noticias:
    name: verifica-noticias
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Confirma isoladamente, com stat, se as 6 imagens ainda existem (só leitura)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 3m
          script: |
            set +e
            BASE=/opt/supabase-aamihe/docker/volumes/storage/visualdesign-storage/stub/public-assets/noticias
            echo "=== ls -la da pasta noticias agora ==="
            ls -la "$BASE" 2>&1
            echo ""
            echo "=== stat individual de cada um dos 6 ==="
            for f in "Ave-de-estimacao-na-gaiola-confortavel-dentro-de-casa_1788259948273.avif" "FACIm_2026_1788247873233.jpeg" "FAcim2026_1788261208812.jpeg" "IIAM_1788259001124.jpeg" "images_1788472667794.jpeg" "images__1__1788473533503.jpeg"; do
              echo "--- $f ---"
              stat "$BASE/$f" 2>&1
            done
