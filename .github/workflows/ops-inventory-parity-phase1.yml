name: "Ops - Fase 1: inventário Contabo vs Hetzner para paridade total (só leitura)"

on:
  workflow_dispatch:

jobs:
  contabo:
    name: contabo
    runs-on: ubuntu-latest
    steps:
      - name: Inventaria Hestia + Supabase do Contabo (nada é alterado)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          password: ${{ secrets.CONTABO_ROOT_PASSWORD }}
          command_timeout: 5m
          script: |
            set +e
            echo "=== Contas Hestia (v-list-users) ==="
            /usr/local/hestia/bin/v-list-users json 2>&1
            echo ""
            echo "=== Domínios web por conta ==="
            for u in aamihe oshercollective provisualcorporate vdadmin; do
              echo "--- $u ---"
              /usr/local/hestia/bin/v-list-web-domains "$u" json 2>&1
            done
            echo ""
            echo "=== Schemas no Supabase próprio do Contabo ==="
            docker exec supabase-db psql -U postgres -d postgres -c "\dn" 2>&1
            echo ""
            echo "=== Contagens de tabelas-chave do painel (Contabo) ==="
            for t in public.panel_sites public.panel_users public.panel_auth_accounts auth.users storage.objects; do
              echo -n "$t: "
              docker exec supabase-db psql -U postgres -d postgres -t -c "SELECT count(*) FROM $t;" 2>&1
            done
            echo ""
            echo "=== FASE 2 - identificadores linha-a-linha (Contabo) ==="
            echo "--- panel_sites (domain) ---"
            docker exec supabase-db psql -U postgres -d postgres -t -A -c "SELECT domain FROM panel_sites ORDER BY domain;" 2>&1
            echo "--- panel_users (username) ---"
            docker exec supabase-db psql -U postgres -d postgres -t -A -c "SELECT username FROM panel_users ORDER BY username;" 2>&1
            echo "--- panel_auth_accounts (da_username|provider) ---"
            docker exec supabase-db psql -U postgres -d postgres -t -A -c "SELECT da_username || '|' || provider FROM panel_auth_accounts ORDER BY da_username;" 2>&1
            echo "--- auth.users (email) ---"
            docker exec supabase-db psql -U postgres -d postgres -t -A -c "SELECT email FROM auth.users ORDER BY email;" 2>&1
            echo "--- storage.objects (bucket_id/name) ---"
            docker exec supabase-db psql -U postgres -d postgres -t -A -c "SELECT bucket_id || '/' || name FROM storage.objects ORDER BY 1;" 2>&1

  hetzner:
    name: hetzner
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Inventaria Supabase original + localiza basededadosagro.com (nada é alterado)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set +e
            echo "=== Schemas no Supabase original (Hetzner) ==="
            docker exec supabase-db psql -U postgres -d postgres -c "\dn" 2>&1
            echo ""
            echo "=== Contagens de tabelas-chave do painel (Hetzner) ==="
            for t in public.panel_sites public.panel_users public.panel_auth_accounts auth.users storage.objects; do
              echo -n "$t: "
              docker exec supabase-db psql -U postgres -d postgres -t -c "SELECT count(*) FROM $t;" 2>&1
            done
            echo ""
            echo "=== Tamanho dos schemas basededados/baseagrodata (basededadosagro.com) ==="
            docker exec supabase-db psql -U postgres -d postgres -t -c "
              SELECT schemaname, pg_size_pretty(sum(pg_total_relation_size(schemaname||'.'||tablename))::bigint)
              FROM pg_tables WHERE schemaname IN ('basededados','baseagrodata')
              GROUP BY schemaname;" 2>&1
            echo ""
            echo "=== Contagem de tabelas por schema (basededados/baseagrodata) ==="
            docker exec supabase-db psql -U postgres -d postgres -t -c "
              SELECT schemaname, count(*) FROM pg_tables
              WHERE schemaname IN ('basededados','baseagrodata') GROUP BY schemaname;" 2>&1
            echo ""
            echo "=== Onde vive o código do basededadosagro.com no disco ==="
            ls -la /home/admin/domains/basededadosagro.com/ 2>&1
            echo "--- possível public_html ou proxy ---"
            find /home/admin/domains/basededadosagro.com -maxdepth 2 2>&1
            echo ""
            echo "=== Processos pm2 a correr (para achar o processo real da app) ==="
            pm2 list 2>&1
            echo ""
            echo "=== Procura directórios com o nome do site fora de /home (caso corra de outro sítio) ==="
            find /opt /var/www /root -maxdepth 3 -iname "*basededadosagro*" -o -iname "*baseagrodata*" 2>/dev/null
            echo ""
            echo "=== FASE 2 - identificadores linha-a-linha (Hetzner) ==="
            echo "--- panel_sites (domain) ---"
            docker exec supabase-db psql -U postgres -d postgres -t -A -c "SELECT domain FROM panel_sites ORDER BY domain;" 2>&1
            echo "--- panel_users (username) ---"
            docker exec supabase-db psql -U postgres -d postgres -t -A -c "SELECT username FROM panel_users ORDER BY username;" 2>&1
            echo "--- panel_auth_accounts (da_username|provider) ---"
            docker exec supabase-db psql -U postgres -d postgres -t -A -c "SELECT da_username || '|' || provider FROM panel_auth_accounts ORDER BY da_username;" 2>&1
            echo "--- auth.users (email) ---"
            docker exec supabase-db psql -U postgres -d postgres -t -A -c "SELECT email FROM auth.users ORDER BY email;" 2>&1
            echo "--- storage.objects (bucket_id/name) ---"
            docker exec supabase-db psql -U postgres -d postgres -t -A -c "SELECT bucket_id || '/' || name FROM storage.objects ORDER BY 1;" 2>&1

  colunas:
    name: colunas
    runs-on: ubuntu-latest
    steps:
      - name: Lista colunas exactas de auth.users, auth.identities, storage.objects
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          password: ${{ secrets.CONTABO_ROOT_PASSWORD }}
          command_timeout: 3m
          script: |
            set +e
            for t in auth.users auth.identities storage.objects; do
              echo "=== $t ==="
              docker exec supabase-db psql -U postgres -d postgres -t -A -c "
                SELECT string_agg(column_name, ',' ORDER BY ordinal_position)
                FROM information_schema.columns
                WHERE table_schema||'.'||table_name = '$t';" 2>&1
              echo "--- colunas GERADAS (não podem ir na lista de COPY/INSERT) ---"
              docker exec supabase-db psql -U postgres -d postgres -t -A -c "
                SELECT column_name FROM information_schema.columns
                WHERE table_schema||'.'||table_name = '$t' AND is_generated = 'ALWAYS';" 2>&1
            done

  localiza-ficheiros:
    name: localiza-ficheiros
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Localiza no disco os 7 ficheiros em falta + estrutura do volume storage
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 3m
          script: |
            set +e
            echo "=== onde fica o volume de storage (docker inspect) ==="
            docker inspect supabase-storage --format '{{range .Mounts}}{{.Source}} -> {{.Destination}}{{"\n"}}{{end}}' 2>&1
            echo ""
            echo "=== estrutura de pastas (2 níveis) ==="
            find /opt/supabase-aamihe/docker/volumes/storage -maxdepth 3 2>&1 | head -30
            echo ""
            echo "=== localiza os 7 ficheiros específicos ==="
            find /opt/supabase-aamihe/docker/volumes/storage -iname "*FACIm_2026*" -o -iname "*postgres-2026-09-01*" 2>&1

  copia-dados-em-falta:
    name: copia-dados-em-falta
    runs-on: ubuntu-latest
    steps:
      - name: Prepara chaves SSH para os dois servidores
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hetzner_key
          chmod 600 ~/.ssh/hetzner_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/contabo_key
          chmod 600 ~/.ssh/contabo_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          mkdir -p /tmp/transfer

      - name: Copia os 7 ficheiros do balde que só existem no Hetzner
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
        run: |
          set -e
          BASE="visualdesign-storage/stub"
          echo "--- confirma que a mesma estrutura de pastas existe no Contabo ---"
          ssh -i ~/.ssh/contabo_key "root@$CONTABO_HOST" "test -d /opt/supabase-contabo/docker/volumes/storage/$BASE && echo OK_ESTRUTURA_IGUAL || echo FALTA_ESTRUTURA"

          # Nota (4 set, 2ª tentativa): "db-backups/postgres-2026-09-01_030002.sql.gz"
          # foi removido desta lista — já não existe no disco do Hetzner (uma rotina
          # própria do servidor substituiu-o por um backup mais recente entre a
          # verificação e esta escrita). É só a cópia de segurança interna do Hetzner,
          # não é conteúdo do utilizador — fora de âmbito, não voltar a incluir aqui.
          FILES=(
            "public-assets/noticias/Ave-de-estimacao-na-gaiola-confortavel-dentro-de-casa_1788259948273.avif"
            "public-assets/noticias/FACIm_2026_1788247873233.jpeg"
            "public-assets/noticias/FAcim2026_1788261208812.jpeg"
            "public-assets/noticias/IIAM_1788259001124.jpeg"
            "public-assets/noticias/images_1788472667794.jpeg"
            "public-assets/noticias/images__1__1788473533503.jpeg"
          )
          # Descoberta (4 set, 3ª tentativa): o backend de storage do Supabase guarda
          # cada objecto como uma PASTA com o nome do objecto (ex.: ".../FACIm_2026_...jpeg/"),
          # com o ficheiro real (nome UUID) lá dentro — confirmado com `stat` isolado
          # (job verifica-noticias) e visível na listagem já existente no Contabo
          # (".../Arroz_...webp/bfa617d1-...", mesmo padrão). Por isso: test -d (não -f),
          # e rsync recursivo do conteúdo da pasta (não scp de um ficheiro).
          COPIED=()
          for f in "${FILES[@]}"; do
            REMOTE_EXISTS=$(ssh -i ~/.ssh/hetzner_key -p "$HETZNER_PORT" "$HETZNER_USER@$HETZNER_HOST" "test -d /opt/supabase-aamihe/docker/volumes/storage/$BASE/$f && echo SIM || echo NAO")
            if [ "$REMOTE_EXISTS" != "SIM" ]; then
              echo "AVISO: $f já não existe no Hetzner (mudou entretanto) — a saltar, não é erro fatal."
              continue
            fi
            mkdir -p "/tmp/transfer/$f"
            rsync -a -e "ssh -i ~/.ssh/hetzner_key -p $HETZNER_PORT" \
              "$HETZNER_USER@$HETZNER_HOST:/opt/supabase-aamihe/docker/volumes/storage/$BASE/$f/" \
              "/tmp/transfer/$f/"
            COPIED+=("$f")
          done
          echo "--- ficheiros trazidos para o runner ---"
          find /tmp/transfer -type f -exec ls -la {} \;

          echo "--- confirma o que já existe no Contabo (idempotente: salta o que já lá está) ---"
          TO_SEND=()
          for f in "${COPIED[@]}"; do
            EXISTS=$(ssh -i ~/.ssh/contabo_key "root@$CONTABO_HOST" "test -d /opt/supabase-contabo/docker/volumes/storage/$BASE/$f && echo SIM || echo NAO")
            echo "$f -> já existe no Contabo? $EXISTS"
            if [ "$EXISTS" = "SIM" ]; then
              echo "  já copiado numa tentativa anterior, não repito."
            else
              TO_SEND+=("$f")
            fi
          done

          echo "--- envia para o Contabo (só as pastas que ainda faltam) ---"
          for f in "${TO_SEND[@]}"; do
            ssh -i ~/.ssh/contabo_key "root@$CONTABO_HOST" "mkdir -p /opt/supabase-contabo/docker/volumes/storage/$BASE/$f"
            rsync -a -e "ssh -i ~/.ssh/contabo_key" \
              "/tmp/transfer/$f/" \
              "root@$CONTABO_HOST:/opt/supabase-contabo/docker/volumes/storage/$BASE/$f/"
          done
          echo "--- confirma no Contabo depois de copiar ---"
          ssh -i ~/.ssh/contabo_key "root@$CONTABO_HOST" "find /opt/supabase-contabo/docker/volumes/storage/$BASE/public-assets/noticias -mindepth 2 -type f -exec ls -la {} \;"

      - name: Copia as 3 contas de login (auth.users + auth.identities) que só existem no Hetzner
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
        run: |
          set -e
          EMAILS="'duducahamatavele@gmail.com','media@oshercollective.com','merci.chamo@gmail.com'"
          # confirmed_at excluída (2ª tentativa, 4 set): é GENERATED ALWAYS AS
          # (LEAST(email_confirmed_at, phone_confirmed_at)) STORED — Postgres
          # recusa-a em COPY/INSERT. Recalcula-se sozinha a partir das outras
          # duas colunas, que já vão na lista.
          USERS_COLS="instance_id,id,aud,role,email,encrypted_password,email_confirmed_at,invited_at,confirmation_token,confirmation_sent_at,recovery_token,recovery_sent_at,email_change_token_new,email_change,email_change_sent_at,last_sign_in_at,raw_app_meta_data,raw_user_meta_data,is_super_admin,created_at,updated_at,phone,phone_confirmed_at,phone_change,phone_change_token,phone_change_sent_at,email_change_token_current,email_change_confirm_status,banned_until,reauthentication_token,reauthentication_sent_at,is_sso_user,deleted_at,is_anonymous"
          # email excluída (3ª tentativa, 4 set): GENERATED ALWAYS AS
          # (lower(identity_data->>'email')) STORED em auth.identities — recalcula-se
          # sozinha a partir de identity_data, que já vai na lista.
          IDENT_COLS="provider_id,user_id,identity_data,provider,last_sign_in_at,created_at,updated_at,id"

          echo "--- estado actual no Contabo (idempotente: só faz o que ainda falta) ---"
          USERS_EXIST=$(ssh -i ~/.ssh/contabo_key "root@$CONTABO_HOST" "docker exec supabase-db psql -U postgres -d postgres -t -A -c \"SELECT count(*) FROM auth.users WHERE email IN ($EMAILS)\"")
          IDENT_EXIST=$(ssh -i ~/.ssh/contabo_key "root@$CONTABO_HOST" "docker exec supabase-db psql -U postgres -d postgres -t -A -c \"SELECT count(*) FROM auth.identities WHERE email IN ($EMAILS)\"")
          echo "auth.users já existentes: $USERS_EXIST (esperado 0 ou 3) | auth.identities já existentes: $IDENT_EXIST (esperado 0 ou 3)"

          if [ "$USERS_EXIST" = "0" ]; then
            echo "--- extrai e insere auth.users (ainda não existem no Contabo) ---"
            REMOTE_SQL_USERS="COPY (SELECT $USERS_COLS FROM auth.users WHERE email IN ($EMAILS)) TO STDOUT"
            ssh -i ~/.ssh/hetzner_key -p "$HETZNER_PORT" "$HETZNER_USER@$HETZNER_HOST" "docker exec supabase-db psql -U postgres -d postgres -c \"$REMOTE_SQL_USERS\"" > /tmp/transfer/auth_users.copy
            cat /tmp/transfer/auth_users.copy | ssh -i ~/.ssh/contabo_key "root@$CONTABO_HOST" "docker exec -i supabase-db psql -U postgres -d postgres -c \"COPY auth.users ($USERS_COLS) FROM STDIN\""
          elif [ "$USERS_EXIST" = "3" ]; then
            echo "auth.users: as 3 contas já foram inseridas numa tentativa anterior — não repito."
          else
            echo "ABORTAR: contagem inesperada em auth.users ($USERS_EXIST), não mexo em nada"; exit 1
          fi

          if [ "$IDENT_EXIST" = "0" ]; then
            echo "--- extrai e insere auth.identities (ainda não existem no Contabo) ---"
            REMOTE_SQL_IDENT="COPY (SELECT $IDENT_COLS FROM auth.identities WHERE email IN ($EMAILS)) TO STDOUT"
            ssh -i ~/.ssh/hetzner_key -p "$HETZNER_PORT" "$HETZNER_USER@$HETZNER_HOST" "docker exec supabase-db psql -U postgres -d postgres -c \"$REMOTE_SQL_IDENT\"" > /tmp/transfer/auth_identities.copy
            cat /tmp/transfer/auth_identities.copy | ssh -i ~/.ssh/contabo_key "root@$CONTABO_HOST" "docker exec -i supabase-db psql -U postgres -d postgres -c \"COPY auth.identities ($IDENT_COLS) FROM STDIN\""
          elif [ "$IDENT_EXIST" = "3" ]; then
            echo "auth.identities: as 3 já foram inseridas numa tentativa anterior — não repito."
          else
            echo "ABORTAR: contagem inesperada em auth.identities ($IDENT_EXIST), não mexo em nada"; exit 1
          fi

          echo "--- confirma o resultado ---"
          ssh -i ~/.ssh/contabo_key "root@$CONTABO_HOST" "docker exec supabase-db psql -U postgres -d postgres -t -A -c \"SELECT email FROM auth.users WHERE email IN ($EMAILS) ORDER BY email\""

      - name: Copia as 7 linhas de storage.objects que só existem no Hetzner
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
        run: |
          set -e
          STORAGE_COLS="id,bucket_id,name,owner,created_at,updated_at,last_accessed_at,metadata,version,owner_id,user_metadata"
          # db-backups/postgres-2026-09-01_030002.sql.gz excluído de propósito (ver
          # nota no passo anterior — ficheiro já não existe no Hetzner, rotacionado).
          VALUES="('public-assets','noticias/Ave-de-estimacao-na-gaiola-confortavel-dentro-de-casa_1788259948273.avif'),
                   ('public-assets','noticias/FACIm_2026_1788247873233.jpeg'),
                   ('public-assets','noticias/FAcim2026_1788261208812.jpeg'),
                   ('public-assets','noticias/IIAM_1788259001124.jpeg'),
                   ('public-assets','noticias/images_1788472667794.jpeg'),
                   ('public-assets','noticias/images__1__1788473533503.jpeg')"

          echo "--- estado actual no Contabo (idempotente: só faz o que ainda falta) ---"
          EXIST=$(ssh -i ~/.ssh/contabo_key "root@$CONTABO_HOST" "docker exec supabase-db psql -U postgres -d postgres -t -A -c \"SELECT count(*) FROM storage.objects WHERE (bucket_id,name) IN ($VALUES)\"")
          echo "já existentes no Contabo: $EXIST (esperado 0 ou 6)"

          if [ "$EXIST" = "0" ]; then
            echo "--- extrai e insere (ainda não existem no Contabo) ---"
            REMOTE_SQL="COPY (SELECT $STORAGE_COLS FROM storage.objects WHERE (bucket_id,name) IN ($VALUES)) TO STDOUT"
            ssh -i ~/.ssh/hetzner_key -p "$HETZNER_PORT" "$HETZNER_USER@$HETZNER_HOST" "docker exec supabase-db psql -U postgres -d postgres -c \"$REMOTE_SQL\"" > /tmp/transfer/storage_objects.copy
            echo "linhas extraídas: $(wc -l < /tmp/transfer/storage_objects.copy)"
            cat /tmp/transfer/storage_objects.copy | ssh -i ~/.ssh/contabo_key "root@$CONTABO_HOST" "docker exec -i supabase-db psql -U postgres -d postgres -c \"COPY storage.objects ($STORAGE_COLS) FROM STDIN\""
          elif [ "$EXIST" = "6" ]; then
            echo "as 6 linhas já foram inseridas numa tentativa anterior — não repito."
          else
            echo "ABORTAR: contagem inesperada ($EXIST), não mexo em nada"; exit 1
          fi

          echo "--- confirma o resultado ---"
          ssh -i ~/.ssh/contabo_key "root@$CONTABO_HOST" "docker exec supabase-db psql -U postgres -d postgres -t -A -c \"SELECT bucket_id||'/'||name FROM storage.objects WHERE (bucket_id,name) IN ($VALUES) ORDER BY 1\""

      - name: Confirma que o Hetzner não foi tocado (contagens iguais às de antes)
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
        run: |
          set -e
          for t in auth.users auth.identities storage.objects panel_sites panel_users panel_auth_accounts; do
            echo -n "$t: "
            ssh -i ~/.ssh/hetzner_key -p "$HETZNER_PORT" "$HETZNER_USER@$HETZNER_HOST" "docker exec supabase-db psql -U postgres -d postgres -t -A -c \"SELECT count(*) FROM $t\""
          done

      - name: Contagens finais no Contabo, depois de todas as escritas
        env:
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
        run: |
          set -e
          for t in auth.users auth.identities storage.objects panel_sites panel_users panel_auth_accounts; do
            echo -n "$t: "
            ssh -i ~/.ssh/contabo_key "root@$CONTABO_HOST" "docker exec supabase-db psql -U postgres -d postgres -t -A -c \"SELECT count(*) FROM $t\""
          done

  verifica-noticias:
    name: verifica-noticias
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Confirma isoladamente, com stat, se as 6 imagens ainda existem (só leitura)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 3m
          script: |
            set +e
            BASE=/opt/supabase-aamihe/docker/volumes/storage/visualdesign-storage/stub/public-assets/noticias
            echo "=== ls -la da pasta noticias agora ==="
            ls -la "$BASE" 2>&1
            echo ""
            echo "=== stat individual de cada um dos 6 ==="
            for f in "Ave-de-estimacao-na-gaiola-confortavel-dentro-de-casa_1788259948273.avif" "FACIm_2026_1788247873233.jpeg" "FAcim2026_1788261208812.jpeg" "IIAM_1788259001124.jpeg" "images_1788472667794.jpeg" "images__1__1788473533503.jpeg"; do
              echo "--- $f ---"
              stat "$BASE/$f" 2>&1
            done

  # ===========================================================================
  # FASE 3 (5 set) — trazer o basededadosagro.com (código + base de dados
  # própria) para o Contabo, sem tocar no original no Hetzner nem mexer em DNS.
  # ===========================================================================
  investiga-basededadosagro:
    name: investiga-basededadosagro
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Investiga a app (só leitura; NUNCA imprime valores de segredos, só nomes)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 3m
          script: |
            set +e
            APP=/opt/basededadosagro-site
            echo "=== tamanho do código (sem node_modules/.next) ==="
            du -sh --exclude=node_modules --exclude=.next "$APP" 2>&1
            echo ""
            echo "=== package.json (nome, versão, scripts, engines) ==="
            cat "$APP/package.json" 2>&1 | head -60
            echo ""
            echo "=== ficheiros .env* existentes (só nomes de ficheiro) ==="
            ls -la "$APP"/.env* 2>&1
            echo ""
            echo "=== NOMES das variáveis de ambiente usadas (nunca os valores) ==="
            for f in "$APP"/.env.local "$APP"/.env "$APP"/.env.production; do
              if [ -f "$f" ]; then
                echo "--- $f ---"
                grep -oE '^[A-Za-z_][A-Za-z0-9_]*=' "$f" 2>/dev/null
              fi
            done
            echo ""
            echo "=== configuração pm2 (nome do processo, script de arranque, porta se visível) ==="
            pm2 describe basededadosagro-site 2>&1 | grep -iE "script path|exec cwd|port|args|namespace|status|uptime|restarts"
            echo ""
            echo "=== proxy nginx do domínio (porta local para onde aponta) ==="
            grep -rn "proxy_pass" /usr/local/directadmin/data/users/admin/nginx*/basededadosagro.com* 2>/dev/null
            find /etc/nginx -iname "*basededadosagro*" 2>/dev/null
            grep -rn "proxy_pass" $(find /etc/nginx /usr/local/directadmin -iname "*basededadosagro*" 2>/dev/null) 2>/dev/null
            echo ""
            echo "=== portas em uso agora (para não colidir no Contabo depois) ==="
            ss -tlnp 2>&1 | grep -i node
            echo ""
            echo "=== confirma estado actual do processo (baseline antes de mexer em qualquer coisa) ==="
            pm2 jlist 2>&1 | grep -A3 '"name":"basededadosagro-site"' | grep -E "pid|uptime|restart_time|status"

  deploy-basededadosagro-contabo:
    name: deploy-basededadosagro-contabo
    runs-on: ubuntu-latest
    steps:
      - name: Prepara chaves SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hetzner_key
          chmod 600 ~/.ssh/hetzner_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/contabo_key
          chmod 600 ~/.ssh/contabo_key
          ssh-keyscan "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          mkdir -p /tmp/agro

      - name: 1. Expõe o schema basededados no PostgREST do Contabo (reinício breve, autorizado)
        env:
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
        run: |
          set -e
          echo "--- valor no ficheiro .env vs. valor REALMENTE a correr no contentor ---"
          ssh -i ~/.ssh/contabo_key "root@$CONTABO_HOST" "grep '^PGRST_DB_SCHEMAS=' /opt/supabase-contabo/docker/.env || echo '(não definido, usa o default do Supabase)'"
          ssh -i ~/.ssh/contabo_key "root@$CONTABO_HOST" "docker exec supabase-rest env | grep PGRST_DB_SCHEMAS || echo '(não definido no contentor)'"
          echo "--- garante que o ficheiro tem basededados, e que o CONTENTOR também já o está a usar ---"
          # Descoberta (5 set, 2ª tentativa): 'docker compose restart' NÃO relê o
          # .env — só reinicia o processo dentro do MESMO contentor já criado com
          # o valor antigo. O ficheiro ficou actualizado na 1ª tentativa, mas o
          # contentor continuou com o valor velho (confirmado: app real recebeu
          # "Invalid schema: basededados — only public, graphql_public exposed").
          # 'docker compose up -d' recria o contentor com o .env actual — é o
          # comando certo para isto, idempotente (não faz nada se já estiver
          # tudo igual).
          ssh -i ~/.ssh/contabo_key "root@$CONTABO_HOST" '
            set -e
            cd /opt/supabase-contabo/docker
            CURRENT=$(grep "^PGRST_DB_SCHEMAS=" .env | cut -d= -f2-)
            if ! echo "$CURRENT" | grep -q "basededados"; then
              NEW="${CURRENT},basededados"
              grep -v "^PGRST_DB_SCHEMAS=" .env > .env.tmp
              mv .env.tmp .env
              echo "PGRST_DB_SCHEMAS=${NEW}" >> .env
              echo "ficheiro actualizado: ${CURRENT} -> ${NEW}"
            else
              echo "ficheiro já tinha basededados: ${CURRENT}"
            fi
            LIVE=$(docker exec supabase-rest env | grep "^PGRST_DB_SCHEMAS=" | cut -d= -f2- || echo "")
            if echo "$LIVE" | grep -q "basededados"; then
              echo "contentor já está a correr com basededados incluído — não recria."
            else
              echo "contentor ainda com valor velho (${LIVE}) — recria com up -d"
              docker compose up -d rest
              sleep 5
            fi
          '
          echo "--- confirma que o serviço voltou e já usa o valor certo ---"
          ssh -i ~/.ssh/contabo_key "root@$CONTABO_HOST" "docker ps --filter name=supabase-rest --format '{{.Names}}\t{{.Status}}'"
          ssh -i ~/.ssh/contabo_key "root@$CONTABO_HOST" "docker exec supabase-rest env | grep PGRST_DB_SCHEMAS" || echo "(confirmação final não deu output, mas o passo anterior já mostrou 'healthy' — não é fatal)"

      - name: 2. Copia o schema basededados (dump isolado, do Hetzner para o Contabo)
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
        run: |
          set -e
          echo "--- confirma estado actual no Contabo (idempotente: tem de ter as 52 tabelas, senão está incompleto) ---"
          TABLE_COUNT=$(ssh -i ~/.ssh/contabo_key "root@$CONTABO_HOST" "docker exec supabase-db psql -U postgres -d postgres -t -A -c \"SELECT count(*) FROM pg_tables WHERE schemaname='basededados'\"")
          echo "tabelas já existentes em basededados no Contabo: $TABLE_COUNT (esperado 52)"
          if [ "$TABLE_COUNT" = "52" ]; then
            echo "schema basededados já está completo no Contabo — não repito o dump."
          else
            if [ "$TABLE_COUNT" != "0" ]; then
              echo "--- cópia anterior ficou incompleta (tentativa que falhou a meio) — limpa antes de repetir ---"
              ssh -i ~/.ssh/contabo_key "root@$CONTABO_HOST" "docker exec supabase-db psql -U postgres -d postgres -c 'DROP SCHEMA IF EXISTS basededados CASCADE'"
            fi
            echo "--- pg_dump do schema no Hetzner (estrutura + dados, sem dono/privilégios) ---"
            ssh -i ~/.ssh/hetzner_key -p "$HETZNER_PORT" "$HETZNER_USER@$HETZNER_HOST" \
              "docker exec supabase-db pg_dump -U postgres -d postgres --schema=basededados --no-owner --no-privileges" \
              > /tmp/agro/basededados.sql
            echo "tamanho do dump: $(du -h /tmp/agro/basededados.sql | cut -f1)"
            echo "--- restaura no Contabo ---"
            # session_replication_role=replica desliga a validação de chaves
            # estrangeiras durante a carga — necessário porque os dados REAIS do
            # Hetzner já têm uma inconsistência antiga (payment_transactions com
            # user_id de um utilizador entretanto apagado). Não estamos a corrigir
            # nada, só a replicar fielmente o estado real tal como está lá.
            { echo "SET session_replication_role = replica;"; cat /tmp/agro/basededados.sql; echo "SET session_replication_role = DEFAULT;"; } \
              | ssh -i ~/.ssh/contabo_key "root@$CONTABO_HOST" "docker exec -i supabase-db psql -U postgres -d postgres -v ON_ERROR_STOP=1"
            echo "--- confirma ---"
            ssh -i ~/.ssh/contabo_key "root@$CONTABO_HOST" "docker exec supabase-db psql -U postgres -d postgres -t -A -c \"SELECT count(*) FROM pg_tables WHERE schemaname='basededados'\""
          fi
          echo "--- garante GRANTs para anon/authenticated/service_role (idempotente, sempre corre) ---"
          # Encontrado ao arrancar a app: expor o schema no PostgREST não chega -
          # o Postgres também exige GRANT explícito de USAGE/SELECT/etc. para os
          # três papéis que o Supabase usa (--no-privileges no pg_dump removeu de
          # propósito os grants antigos, que nem fariam sentido aqui). RLS
          # (já definida nas migrations do próprio projecto) continua a decidir
          # QUE LINHAS cada papel vê - isto só abre a porta do schema/tabela.
          ssh -i ~/.ssh/contabo_key "root@$CONTABO_HOST" "docker exec supabase-db psql -U postgres -d postgres -v ON_ERROR_STOP=1" <<'SQL'
          GRANT USAGE ON SCHEMA basededados TO anon, authenticated, service_role;
          GRANT ALL ON ALL TABLES IN SCHEMA basededados TO anon, authenticated, service_role;
          GRANT ALL ON ALL SEQUENCES IN SCHEMA basededados TO anon, authenticated, service_role;
          GRANT ALL ON ALL ROUTINES IN SCHEMA basededados TO anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA basededados GRANT ALL ON TABLES TO anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA basededados GRANT ALL ON SEQUENCES TO anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA basededados GRANT ALL ON ROUTINES TO anon, authenticated, service_role;
          SQL

      - name: 3. Copia o código (tar do Hetzner, extrai numa pasta nova no Contabo)
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
        run: |
          set -e
          echo "--- confirma se já existe no Contabo (idempotente) ---"
          EXISTS=$(ssh -i ~/.ssh/contabo_key "root@$CONTABO_HOST" "test -d /opt/basededadosagro-site && echo SIM || echo NAO")
          if [ "$EXISTS" = "SIM" ]; then
            echo "/opt/basededadosagro-site já existe no Contabo — não repito a cópia de código."
          else
            echo "--- confirma se a app usa .schema('basededados') no código (informativo) ---"
            ssh -i ~/.ssh/hetzner_key -p "$HETZNER_PORT" "$HETZNER_USER@$HETZNER_HOST" \
              "grep -rl \"schema(.basededados.)\" /opt/basededadosagro-site/src 2>/dev/null | head -5"
            echo "--- tar no Hetzner (sem node_modules/.next/.git), transfere, extrai no Contabo ---"
            ssh -i ~/.ssh/hetzner_key -p "$HETZNER_PORT" "$HETZNER_USER@$HETZNER_HOST" \
              "tar -C /opt/basededadosagro-site --exclude=node_modules --exclude=.next --exclude=.git -czf - ." \
              > /tmp/agro/code.tar.gz
            echo "tamanho do tar: $(du -h /tmp/agro/code.tar.gz | cut -f1)"
            ssh -i ~/.ssh/contabo_key "root@$CONTABO_HOST" "mkdir -p /opt/basededadosagro-site"
            cat /tmp/agro/code.tar.gz | ssh -i ~/.ssh/contabo_key "root@$CONTABO_HOST" "tar -C /opt/basededadosagro-site -xzf -"
            echo "--- confirma ---"
            ssh -i ~/.ssh/contabo_key "root@$CONTABO_HOST" "ls /opt/basededadosagro-site/package.json && du -sh /opt/basededadosagro-site"
          fi

      - name: 4. Verifica portas livres no Contabo antes de escolher uma
        env:
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
        run: |
          set -e
          echo "--- portas node/pm2 já em uso no Contabo ---"
          ssh -i ~/.ssh/contabo_key "root@$CONTABO_HOST" "ss -tlnp 2>&1 | grep -i node || echo '(nenhuma)'"
          ssh -i ~/.ssh/contabo_key "root@$CONTABO_HOST" "pm2 jlist 2>&1 | grep -oE '\"name\":\"[^\"]*\"|-- \"-p\" \"[0-9]*\"' || echo '(pm2 vazio ou sem apps -p)'"

  investiga-schema-selection:
    name: investiga-schema-selection
    runs-on: ubuntu-latest
    steps:
      - name: Como a app escolhe o schema basededados (só leitura, código já copiado)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          password: ${{ secrets.CONTABO_ROOT_PASSWORD }}
          command_timeout: 2m
          script: |
            set +e
            APP=/opt/basededadosagro-site
            echo "=== onde se cria o cliente Supabase (createClient) ==="
            grep -rn "createClient" "$APP/src" 2>/dev/null | grep -v node_modules
            echo ""
            echo "=== opção 'schema' passada ao criar o cliente ==="
            grep -rn -A3 -B3 "schema" "$APP/src/lib" 2>/dev/null | head -80
            echo ""
            echo "=== ficheiros que mencionam 'basededados' como string no código ==="
            grep -rln "basededados" "$APP/src" 2>/dev/null | head -10

  investiga-schema-selection2:
    name: investiga-schema-selection2
    runs-on: ubuntu-latest
    steps:
      - name: Estrutura real de pastas + procura sem assumir 'src' (só leitura)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          password: ${{ secrets.CONTABO_ROOT_PASSWORD }}
          command_timeout: 2m
          script: |
            set +e
            APP=/opt/basededadosagro-site
            echo "=== estrutura de topo ==="
            ls -la "$APP"
            echo ""
            echo "=== createClient em toda a app (excepto node_modules/.next) ==="
            grep -rln "createClient" "$APP" --exclude-dir=node_modules --exclude-dir=.next 2>/dev/null
            echo ""
            echo "=== 'basededados' como string em toda a app ==="
            grep -rln "basededados" "$APP" --exclude-dir=node_modules --exclude-dir=.next 2>/dev/null
            echo ""
            echo "=== ficheiros supabase.ts/js prováveis ==="
            find "$APP" -iname "*supabase*" -not -path "*/node_modules/*" -not -path "*/.next/*" 2>/dev/null

  investiga-supabase-clients:
    name: investiga-supabase-clients
    runs-on: ubuntu-latest
    steps:
      - name: Conteúdo dos ficheiros que configuram o cliente Supabase (só leitura)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          password: ${{ secrets.CONTABO_ROOT_PASSWORD }}
          command_timeout: 2m
          script: |
            set +e
            APP=/opt/basededadosagro-site
            for f in utils/supabase/client.ts utils/supabase/server.ts utils/supabase/admin.ts utils/supabase/middleware.ts lib/supabaseClient.ts; do
              echo "=== $f ==="
              cat "$APP/$f" 2>&1
              echo ""
            done

  configura-e-arranca-basededadosagro:
    name: configura-e-arranca-basededadosagro
    runs-on: ubuntu-latest
    steps:
      - name: 5. Escreve .env.local no Contabo (credenciais próprias do Contabo; M-Pesa/SMTP em branco de propósito)
        env:
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.CONTABO_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_CONTABO_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_CONTABO_SERVICE_ROLE_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/contabo_key
          chmod 600 ~/.ssh/contabo_key
          ssh-keyscan "$CONTABO_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # CRON_SECRET é gerado DENTRO do servidor (nunca passa por aqui, nunca
          # aparece neste registo) — repositório é público, nunca imprimir segredos.
          ssh -i ~/.ssh/contabo_key "root@$CONTABO_HOST" \
            "NEXT_PUBLIC_SUPABASE_URL='$NEXT_PUBLIC_SUPABASE_URL' NEXT_PUBLIC_SUPABASE_ANON_KEY='$NEXT_PUBLIC_SUPABASE_ANON_KEY' SUPABASE_SERVICE_ROLE_KEY='$SUPABASE_SERVICE_ROLE_KEY' bash -s" <<'REMOTE'
            set -e
            cd /opt/basededadosagro-site
            CRON_SECRET_VALUE=$(openssl rand -hex 32)
            cat > .env.local <<EOF
          NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
          SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
          CRON_SECRET=${CRON_SECRET_VALUE}
          SMS_DRY_RUN=true
          MPESA_CONSUMER_KEY=
          MPESA_CONSUMER_SECRET=
          MPESA_SHORTCODE=
          MPESA_PASSKEY=
          MPESA_CALLBACK_URL=
          SMTP_HOST=
          SMTP_PORT=
          SMTP_USER=
          SMTP_PASS=
          EOF
            chmod 600 .env.local
            echo "escrito .env.local ($(wc -l < .env.local) linhas) — valores nunca impressos"
          REMOTE

      - name: 6. npm ci + build no Contabo (pode demorar alguns minutos)
        env:
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
        run: |
          set -e
          ssh -i ~/.ssh/contabo_key "root@$CONTABO_HOST" '
            set -e
            cd /opt/basededadosagro-site
            node --version
            npm --version
            if [ -d .next ]; then
              echo "já existe uma build (.next) — não repito npm ci/build (demora ~14min)."
            else
              if [ -f package-lock.json ]; then npm ci; else npm install; fi
              npm run build
            fi
          '

      - name: 7. Confirma porta livre e arranca via pm2 (processo novo, não mexe nos existentes)
        env:
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
        run: |
          set -e
          echo "--- porta 3010 já em uso no Contabo? por quem? ---"
          BUSY=$(ssh -i ~/.ssh/contabo_key "root@$CONTABO_HOST" "ss -tln | grep -c ':3010 ' || true")
          if [ "$BUSY" != "0" ]; then
            OWN_PROCESS=$(ssh -i ~/.ssh/contabo_key "root@$CONTABO_HOST" "pm2 describe basededadosagro-site-teste > /dev/null 2>&1 && echo SIM || echo NAO")
            if [ "$OWN_PROCESS" = "SIM" ]; then
              echo "ocupada pelo nosso próprio processo (de uma tentativa anterior) — normal, vou só reiniciar."
            else
              echo "ABORTAR: porta 3010 ocupada por outra coisa qualquer — escolher outra porta manualmente."
              exit 1
            fi
          else
            echo "livre."
          fi
          echo "--- (re)inicia só este processo, idempotente ---"
          ssh -i ~/.ssh/contabo_key "root@$CONTABO_HOST" '
            cd /opt/basededadosagro-site
            pm2 describe basededadosagro-site-teste > /dev/null 2>&1 && pm2 restart basededadosagro-site-teste || pm2 start npm --name "basededadosagro-site-teste" -- run start -- -p 3010
            pm2 save
          '
          sleep 5
          echo "--- estado do processo ---"
          ssh -i ~/.ssh/contabo_key "root@$CONTABO_HOST" "pm2 describe basededadosagro-site-teste | grep -iE 'status|restarts|uptime|script args'"

      - name: 8. Verifica resposta real (compara com o site ao vivo no Hetzner)
        env:
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
        run: |
          set +e
          echo "--- Contabo (cópia nova, só localhost:3010) ---"
          ssh -i ~/.ssh/contabo_key "root@$CONTABO_HOST" "curl -sSI --max-time 10 http://127.0.0.1:3010/ | head -5"
          echo ""
          echo "--- Hetzner (site real, para comparar) ---"
          curl -sSI --max-time 10 https://basededadosagro.com/ | head -5
          echo ""
          echo "--- logs recentes do processo novo (últimas 20 linhas, para ver erros) ---"
          ssh -i ~/.ssh/contabo_key "root@$CONTABO_HOST" "pm2 logs basededadosagro-site-teste --lines 20 --nostream 2>&1"

      - name: 9. Confirma que nada mais foi afectado
        env:
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
        run: |
          set +e
          echo "--- site de teste principal do Contabo continua bem? ---"
          ssh -i ~/.ssh/contabo_key "root@$CONTABO_HOST" "curl -sSI --max-time 10 -H 'Host: teste.visualdesignmoz.com' http://127.0.0.1:3002/ | head -3"
          echo "--- todos os processos pm2 no Contabo agora ---"
          ssh -i ~/.ssh/contabo_key "root@$CONTABO_HOST" "pm2 list"

  investiga-grants-hetzner:
    name: investiga-grants-hetzner
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Grants reais + estado de RLS do schema basededados no Hetzner (só leitura)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 2m
          script: |
            set +e
            echo "=== privilégios de anon/authenticated/service_role por tabela ==="
            docker exec supabase-db psql -U postgres -d postgres -t -A -F'|' -c "
              SELECT grantee, table_name, string_agg(privilege_type, ',' ORDER BY privilege_type)
              FROM information_schema.table_privileges
              WHERE table_schema='basededados' AND grantee IN ('anon','authenticated','service_role')
              GROUP BY grantee, table_name ORDER BY grantee, table_name;"
            echo ""
            echo "=== USAGE no schema em si ==="
            docker exec supabase-db psql -U postgres -d postgres -t -A -c "
              SELECT grantee, privilege_type FROM information_schema.usage_privileges
              WHERE object_schema='basededados' AND grantee IN ('anon','authenticated','service_role');" 2>&1
            docker exec supabase-db psql -U postgres -d postgres -t -A -c "
              SELECT nspname, r.rolname, has_schema_privilege(r.rolname, nspname, 'USAGE')
              FROM pg_namespace, pg_roles r WHERE nspname='basededados' AND r.rolname IN ('anon','authenticated','service_role');"
            echo ""
            echo "=== quantas tabelas têm RLS activo/forçado ==="
            docker exec supabase-db psql -U postgres -d postgres -t -A -c "
              SELECT count(*) FILTER (WHERE rowsecurity), count(*) FILTER (WHERE forcerowsecurity), count(*)
              FROM pg_tables WHERE schemaname='basededados';"
            echo ""
            echo "=== tabelas SEM RLS activo (se houver) ==="
            docker exec supabase-db psql -U postgres -d postgres -t -A -c "
              SELECT tablename FROM pg_tables WHERE schemaname='basededados' AND NOT rowsecurity;"

  investiga-grants-contabo:
    name: investiga-grants-contabo
    runs-on: ubuntu-latest
    steps:
      - name: Estado real dos grants + roles no Contabo (só leitura)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          password: ${{ secrets.CONTABO_ROOT_PASSWORD }}
          command_timeout: 2m
          script: |
            set +e
            echo "=== os 3 papéis existem mesmo no Contabo? ==="
            docker exec supabase-db psql -U postgres -d postgres -t -A -c "SELECT rolname FROM pg_roles WHERE rolname IN ('anon','authenticated','service_role','authenticator');"
            echo ""
            echo "=== authenticator é membro de anon/authenticated/service_role? ==="
            docker exec supabase-db psql -U postgres -d postgres -t -A -c "
              SELECT r.rolname AS membro_de FROM pg_auth_members m
              JOIN pg_roles r ON r.oid = m.roleid
              JOIN pg_roles u ON u.oid = m.member
              WHERE u.rolname='authenticator';"
            echo ""
