name: 'ops: confirmar a quem pertence 37.27.17.25 (so-leitura)'

on:
  workflow_dispatch: {}

jobs:
  hetzner:
    runs-on: ubuntu-latest
    steps:
      - name: Ver interfaces de rede no Hetzner
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            echo "HETZNER tem 37.27.17.25 configurado?"
            ip addr show | grep -c "37.27.17.25" || echo "0"
  contabo:
    runs-on: ubuntu-latest
    steps:
      - name: Ver interfaces de rede no Contabo
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          script: |
            echo "CONTABO tem 37.27.17.25 configurado?"
            ip addr show | grep -c "37.27.17.25" || echo "0"
