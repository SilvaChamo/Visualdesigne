name: 'ops: verificar e desbloquear IP bloqueado no firewall (Contabo)'

on:
  workflow_dispatch: {}

jobs:
  unban:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          script: |
            echo "----- estado do jail HESTIA -----"
            fail2ban-client status hestia 2>/dev/null || fail2ban-client status HESTIA 2>/dev/null || fail2ban-client status
            echo "----- a tentar desbloquear 41.220.200.197 em todos os jails -----"
            for jail in $(fail2ban-client status | grep "Jail list" | sed 's/.*://; s/,//g'); do
              fail2ban-client set "$jail" unbanip 41.220.200.197 2>/dev/null && echo "removido de $jail"
            done
            echo "----- confirmação -----"
            iptables -L -n | grep "41.220.200.197" || echo "IP já não está em nenhuma regra DROP"
