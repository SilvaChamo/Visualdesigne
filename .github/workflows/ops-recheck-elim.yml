name: 'ops: reverificar panel_sites do elimservicos.com (so-leitura)'

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            docker exec supabase-db psql -U postgres -d postgres -c "SELECT domain, owner, package, status, updated_at FROM public.panel_sites WHERE domain = 'elimservicos.com';" 2>&1
