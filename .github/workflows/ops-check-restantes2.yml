name: 'ops: verificar emails de elimservicos.com e shalomdeco.com (so-leitura)'

on:
  workflow_dispatch: {}

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            for D in elimservicos.com shalomdeco.com; do
              echo "===== $D ====="
              find /home/oshercollective/imap/$D -maxdepth 1 2>/dev/null
              du -sh /home/oshercollective/imap/$D 2>/dev/null
              echo "----- tamanho public_html -----"
              du -sh /home/oshercollective/domains/$D/public_html 2>/dev/null
              echo ""
            done
