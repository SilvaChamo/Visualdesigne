name: Ops — corrigir colunas em falta no schema basededados

# Execução manual só. Ao copiar os dados reais do Supabase Cloud original de
# basededadosagro.com (reactivado em 2026-08-10 — afinal só estava pausado,
# não apagado) de volta para o schema self-hosted "basededados" no Hetzner,
# 12 tabelas revelaram colunas em falta face à estrutura real (o rebuild de
# 2026-08-09 foi feito "por arqueologia de código", sem acesso aos dados
# reais, e ficou incompleto). Aplica scripts/basededados-fix-missing-columns.sql
# — aditivo/idempotente, e remove as linhas de exemplo em forum_categories/
# services para os dados reais entrarem sem conflito de slug.
on:
  workflow_dispatch:

jobs:
  fix-columns:
    name: Aplicar correcção de colunas via psql
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copiar o ficheiro SQL para o servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          source: "scripts/basededados-fix-missing-columns.sql"
          target: "/root/"
          strip_components: 1

      - name: Aplicar a migração via psql
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            CONTAINER=$(docker ps --format '{{.Names}}' | grep -iE 'supabase.*db|supabase-db|postgres' | head -n1)
            if [ -z "$CONTAINER" ]; then
              echo "Não encontrei nenhum container de Postgres/Supabase a correr:" >&2
              docker ps --format '{{.Names}}'
              exit 1
            fi
            DB_USER=$(docker exec "$CONTAINER" printenv POSTGRES_USER 2>/dev/null || echo postgres)
            DB_NAME=$(docker exec "$CONTAINER" printenv POSTGRES_DB 2>/dev/null || echo postgres)

            cat /root/basededados-fix-missing-columns.sql | docker exec -i "$CONTAINER" psql -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1

            echo "--- Confirmação: colunas de companies após a correcção ---"
            docker exec "$CONTAINER" psql -U "$DB_USER" -d "$DB_NAME" -t -c \
              "select column_name from information_schema.columns where table_schema='basededados' and table_name='companies' order by column_name;"

            rm -f /root/basededados-fix-missing-columns.sql

            echo "--- Reload do cache de schema do PostgREST ---"
            docker exec "$CONTAINER" psql -U "$DB_USER" -d "$DB_NAME" -c "NOTIFY pgrst, 'reload schema';"
