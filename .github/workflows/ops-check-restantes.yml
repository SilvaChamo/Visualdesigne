name: 'ops: verificar lirandzojewelry.com + oshercollective.com + elimservicos.com no Hetzner (so-leitura)'

on:
  workflow_dispatch: {}

jobs:
  hetzner:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            for D in lirandzojewelry.com oshercollective.com elimservicos.com; do
              echo "===== $D ====="
              WPC=$(find /home/oshercollective/domains/$D -maxdepth 3 -iname "wp-config.php" 2>/dev/null | head -1)
              echo "wp-config: $WPC"
              [ -n "$WPC" ] && grep -E "DB_NAME|DB_USER|DB_HOST" "$WPC"
              [ -n "$WPC" ] && du -sh "$(dirname "$WPC")"
              [ -z "$WPC" ] && find /home/oshercollective/domains/$D/public_html -maxdepth 1 2>/dev/null
              echo ""
            done
