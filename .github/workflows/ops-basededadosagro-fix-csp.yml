name: Ops — corrigir CSP para permitir o Supabase self-hosted

# Execução manual só. Erro reportado ao vivo pelo utilizador: "Error fetching
# podcasts: TypeError: Failed to fetch" (e notícias continuavam sem
# aparecer, mesmo depois da correcção do filtro type='article'). Causa real:
# a Content-Security-Policy do next.config.ts só permite ligações a
# *.supabase.co, mas o site liga-se de verdade a supabase.visualdesignmoz.com
# (Hetzner self-hosted, desde a migração de dados de 2026-08-10/11) — o
# browser bloqueia por segurança TODAS as leituras client-side ao Supabase
# em qualquer página que use createClient() (podcasts, artigos/notícias,
# estatísticas, etc.), não só as notícias.
#
# Nota importante: verificações anteriores via `curl` desta sessão não
# apanharam isto porque estas páginas são "use client" — o conteúdo real só
# aparece depois do JavaScript correr no browser; curl nunca executa JS, por
# isso a ausência do conteúdo de fallback no HTML bruto não provava nada.
#
# Corrige em 3 sítios: CSP connect-src (permite a chamada à API), CSP
# img-src e next.config images.remotePatterns (permite imagens vindas do
# Storage do Supabase self-hosted).
on:
  workflow_dispatch:

jobs:
  fix-and-restart:
    name: Corrigir CSP/remotePatterns, rebuild e reiniciar
    runs-on: ubuntu-latest
    steps:
      - name: Aplicar correcção via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /opt/basededadosagro-site
            STAMP=$(date +%Y%m%d-%H%M%S)
            F="next.config.ts"
            cp "$F" "$F.bak-cspfix-$STAMP"

            if grep -q "supabase.visualdesignmoz.com" "$F"; then
              echo "Já corrigido, nada a fazer."
            else
              perl -i -pe "s/(hostname: \"ppgmtxzuaxqshipnvebl\.supabase\.co\",\n        pathname: \"\/\*\*\",\n      \},\n)(    \],)/\$1      {\n        protocol: \"https\",\n        hostname: \"supabase.visualdesignmoz.com\",\n        pathname: \"\/\*\*\",\n      },\n\$2/" -0777 "$F"
              perl -i -pe "s/connect-src 'self' \*\.supabase\.co \*\.basededadosagro\.com;/connect-src 'self' *.supabase.co *.basededadosagro.com supabase.visualdesignmoz.com;/" "$F"
              perl -i -pe "s/img-src 'self' blob: data: \*\.supabase\.co res\.cloudinary\.com images\.unsplash\.com;/img-src 'self' blob: data: *.supabase.co supabase.visualdesignmoz.com res.cloudinary.com images.unsplash.com;/" "$F"
            fi

            if ! grep -q "supabase.visualdesignmoz.com" "$F"; then
              echo "ERRO: a correcção não apanhou o padrão esperado." >&2
              exit 1
            fi
            echo "--- confirmação ---"
            grep -n "supabase.visualdesignmoz.com\|connect-src\|img-src" "$F"

            echo "--- rebuild ---"
            npm ci
            npm run build

            echo "--- restart ---"
            pm2 restart basededadosagro-site
            pm2 save

      - name: Verificar cabeçalho CSP ao vivo
        run: |
          sleep 5
          curl -sk -D - -o /dev/null --max-time 20 "https://basededadosagro.com/pt" | grep -i "content-security-policy"
