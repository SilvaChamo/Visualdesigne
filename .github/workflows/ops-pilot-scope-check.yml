name: "Ops - Scope: files.visualdesign + entrecampos + aamihe/mltmark (SO LEITURA)"

# SO LEITURA. Nenhum comando altera nada.
# 1) O que sao os ficheiros de files.visualdesignmoz.com (Hetzner + Contabo)
# 2) Estado do entrecamposblog.com no Contabo (WordPress? Elementor? tamanho)
# 3) Ambito do corte de aamihe.com e mltmark.com (SSL, docroot, BD, DNS/Cloudflare)

on:
  workflow_dispatch:

jobs:
  contabo:
    name: contabo (so leitura)
    runs-on: ubuntu-latest
    steps:
      - name: check
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          password: ${{ secrets.CONTABO_ROOT_PASSWORD }}
          command_timeout: 8m
          script: |
            set +e
            echo "############ CONTABO ############"
            echo "===== files.visualdesignmoz.com: conteudo ====="
            ls -la /home/vdadmin/web/files.visualdesignmoz.com/public_html/ 2>&1 | head -40
            find /home/vdadmin/web/files.visualdesignmoz.com/public_html/ -maxdepth 2 -type f 2>/dev/null | head -40
            du -sh /home/vdadmin/web/files.visualdesignmoz.com/public_html/ 2>&1
            echo
            echo "===== entrecamposblog.com: o que la esta ====="
            ls -la /home/vdadmin/web/entrecamposblog.com/public_html/ 2>&1 | head -40
            echo "-- wp-config? --"; test -f /home/vdadmin/web/entrecamposblog.com/public_html/wp-config.php && echo SIM || echo NAO
            echo "-- versao WP / plugins (se WP) --"
            WP="/usr/bin/wp --path=/home/vdadmin/web/entrecamposblog.com/public_html --allow-root"
            $WP core version 2>&1 | head -3
            $WP plugin list --fields=name,status,version 2>&1 | head -40
            $WP theme list --fields=name,status,version 2>&1 | head -10
            du -sh /home/vdadmin/web/entrecamposblog.com/public_html/ 2>&1
            echo
            echo "===== aamihe.com + mltmark.com no Contabo: docroot, SSL, BD ====="
            for d in aamihe.com mltmark.com; do
              U=aamihe; [ "$d" = "mltmark.com" ] && U=vdadmin
              echo "---- $d (conta $U) ----"
              /usr/local/hestia/bin/v-list-web-domain "$U" "$d" 2>&1 | grep -iE 'ssl|letsencrypt|document|alias|backend|ssl_home'
              ls /home/$U/web/$d/public_html/ 2>&1 | head -12
              test -f /home/$U/web/$d/public_html/wp-config.php && echo "  wp-config: SIM" || echo "  wp-config: NAO"
              echo "  -- BDs desta conta --"
              /usr/local/hestia/bin/v-list-databases "$U" 2>&1 | tail -8
            done
            echo
            echo "===== MariaDB: nº de tabelas por BD (para comparar com Hetzner) ====="
            mysql -N -e "SELECT table_schema, COUNT(*) tbls, ROUND(SUM(data_length+index_length)/1024/1024,1) mb FROM information_schema.tables WHERE table_schema NOT IN ('mysql','information_schema','performance_schema','sys','phpmyadmin','roundcube') GROUP BY table_schema;" 2>&1

  hetzner:
    name: hetzner (so leitura)
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: check
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 8m
          script: |
            set +e
            echo "############ HETZNER ############"
            echo "===== files.visualdesignmoz.com: conteudo real ====="
            ls -la /home/admin/domains/files.visualdesignmoz.com/public_html/ 2>&1 | head -40
            find /home/admin/domains/files.visualdesignmoz.com/public_html/ -maxdepth 2 2>/dev/null | head -50
            du -sh /home/admin/domains/files.visualdesignmoz.com/public_html/ 2>&1
            echo "-- config do dominio no DirectAdmin --"
            cat /usr/local/directadmin/data/users/admin/domains/files.visualdesignmoz.com.conf 2>&1
            echo
            echo "===== aamihe.com + mltmark.com no Hetzner: tabelas MySQL reais ====="
            mysql -N -e "SELECT table_schema, COUNT(*) tbls, ROUND(SUM(data_length+index_length)/1024/1024,1) mb FROM information_schema.tables WHERE table_schema LIKE '%aamihe%' OR table_schema LIKE '%mltmark%' GROUP BY table_schema;" 2>&1
            echo "-- docroot aamihe/mltmark --"
            for d in aamihe.com mltmark.com; do
              echo "--- $d ---"; ls /home/admin/domains/$d/public_html/ 2>&1 | head -12
              du -sh /home/admin/domains/$d/public_html/ 2>&1
            done
            echo
            echo "===== Cloudflare: como resolve aamihe/mltmark hoje (do Hetzner) ====="
            for d in aamihe.com www.aamihe.com mltmark.com www.mltmark.com; do
              echo -n "$d A: "; dig +short A "$d" | tr '\n' ' '; echo
            done
