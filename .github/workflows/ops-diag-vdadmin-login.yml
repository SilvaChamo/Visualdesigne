name: 'ops: diagnosticar falha de login do vdadmin no Hestia (so-leitura)'

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          script: |
            H=/usr/local/hestia/bin
            echo "----- estado da conta vdadmin -----"
            $H/v-list-user vdadmin plain
            echo "----- painel a escutar? -----"
            ss -tlnp | grep 8083 || echo "NADA a escutar na porta 8083"
            echo "----- firewall (CSF/iptables) para 8083 -----"
            iptables -L -n 2>/dev/null | grep -i "8083\|reject\|drop" | head -20
            [ -f /etc/csf/csf.conf ] && grep -E "^TCP_IN" /etc/csf/csf.conf
            echo "----- últimas tentativas de login no log do Hestia -----"
            tail -n 40 /usr/local/hestia/log/auth.log 2>/dev/null || tail -n 40 /var/log/hestia/auth.log 2>/dev/null || echo "log de auth não encontrado no caminho habitual"
            echo "----- versão/uptime do hestia -----"
            $H/v-list-sys-info 2>/dev/null | head -5
