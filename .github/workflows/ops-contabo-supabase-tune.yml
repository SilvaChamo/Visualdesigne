name: "Ops - Afinacao da stack Supabase do Contabo (baixar carga)"

# ============================================================================
# ESCREVE so no Contabo. Passo conservador:
#   - para o container supabase-studio (painel admin da BD; nao serve nada,
#     mas corria um processo node de healthcheck a cada 5s)
# NAO recria os outros containers (sem blip na BD). Mede a carga antes/depois.
# Reverter: docker compose -f /opt/supabase-contabo/docker/docker-compose.yml start studio
# Ver conversa 2026-09-05.
# ============================================================================

on:
  workflow_dispatch:

jobs:
  tune:
    name: afinar Supabase Contabo (parar studio)
    runs-on: ubuntu-latest
    steps:
      - name: "Parar studio + medir"
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          password: ${{ secrets.CONTABO_ROOT_PASSWORD }}
          command_timeout: 10m
          script: |
            set +e
            cd /opt/supabase-contabo/docker
            echo "===== ANTES ====="
            cat /proc/loadavg
            docker ps --format 'table {{.Names}}\t{{.Status}}'
            echo
            echo "===== parar supabase-studio ====="
            docker compose stop studio 2>&1 || docker stop supabase-studio 2>&1
            echo
            echo "===== confirmar que a BD, REST e Auth continuam de pe ====="
            docker ps --filter health=unhealthy --format '{{.Names}}'
            curl -s -o /dev/null -w "REST gateway: %{http_code}\n" http://127.0.0.1:8000/rest/v1/ -H "apikey: x"
            curl -s -o /dev/null -w "Auth gateway: %{http_code}\n" http://127.0.0.1:8000/auth/v1/health
            for i in 1 2 3; do curl -s -o /dev/null -w "  painel: %{http_code} em %{time_total}s\n" -H "Host: teste.visualdesignmoz.com" http://127.0.0.1:3002/ ; done
            curl -s -o /dev/null -w "  basededadosagro: %{http_code} em %{time_total}s\n" http://127.0.0.1:3010/
            echo
            echo "===== esperar 3 min e medir a carga ====="
            sleep 180
            cat /proc/loadavg
            uptime
            echo "-- top 12 CPU --"
            ps -eo pcpu,pmem,comm --sort=-pcpu | head -13
            echo "-- docker stats --"
            docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}'
            echo "===== FEITO (studio parado) ====="
