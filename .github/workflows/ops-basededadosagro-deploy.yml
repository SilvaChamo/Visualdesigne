name: Ops — publicar basededadosagro.com no Hetzner

# basededadosagro.com é uma app Next.js separada (repo público
# SilvaChamo/basededadosagro), PM2 "basededadosagro-site", porta 3010,
# /opt/basededadosagro-site no Hetzner, sem .git no servidor (deploy sempre
# por rsync). Esse repo não tem CI própria (criar secrets novos lá é
# bloqueado pelo classifier de segurança do Claude Code — ver
# project_basededadosagro-audit-2026-08-10.md), por isso este workflow vive
# aqui e reaproveita os secrets HETZNER_* já aprovados neste repo.
#
# Uso: workflow_dispatch manual. Faz checkout do HEAD actual de
# SilvaChamo/basededadosagro, sincroniza para o servidor (preserva o
# .env.local que já lá está) e reconstrói + reinicia o PM2.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/commit do basededadosagro a publicar"
        required: false
        default: "main"

jobs:
  deploy:
    name: Sincronizar, rebuild e reiniciar basededadosagro-site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout basededadosagro
        uses: actions/checkout@v4
        with:
          repository: SilvaChamo/basededadosagro
          ref: ${{ inputs.ref }}
          path: basededadosagro-checkout

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync files to Hetzner
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.HETZNER_PORT }}" \
            --exclude 'node_modules' --exclude '.next' --exclude '.git' --exclude '*.env*' --exclude '.DS_Store' --exclude '*.bak-*' \
            basededadosagro-checkout/ "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}:/opt/basededadosagro-site/"

      - name: Build and restart on Hetzner
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd /opt/basededadosagro-site
            touch .env.local
            set_env_var() {
              local key="$1" value="$2"
              if grep -q "^${key}=" .env.local; then
                sed -i "s|^${key}=.*|${key}=${value}|" .env.local
              else
                echo "${key}=${value}" >> .env.local
              fi
            }
            # Segredo do robô de notícias (protege /api/cron/news-fetch) —
            # mantido em sincronia a cada deploy.
            set_env_var CRON_SECRET "${{ secrets.BASEDEDADOSAGRO_CRON_SECRET }}"

            echo "--- garantir tabela articles_pending (robô de notícias) ---"
            CONTAINER=$(docker ps --format '{{.Names}}' | grep -iE 'supabase.*db|supabase-db|postgres' | head -n1)
            if [ -z "$CONTAINER" ]; then
              echo "Não encontrei nenhum container de Postgres/Supabase a correr:" >&2
              docker ps --format '{{.Names}}'
              exit 1
            fi
            DB_USER=$(docker exec "$CONTAINER" printenv POSTGRES_USER 2>/dev/null || echo postgres)
            DB_NAME=$(docker exec "$CONTAINER" printenv POSTGRES_DB 2>/dev/null || echo postgres)
            cat <<'SQL' | docker exec -i "$CONTAINER" psql -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1
            CREATE TABLE IF NOT EXISTS basededados.articles_pending (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                title text NOT NULL,
                snippet text,
                source text,
                source_url text UNIQUE,
                image_url text,
                date date,
                category text DEFAULT 'Notícia',
                created_at timestamptz DEFAULT now()
            );
            ALTER TABLE basededados.articles_pending ENABLE ROW LEVEL SECURITY;
            DO $$
            BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_policies WHERE schemaname = 'basededados' AND tablename = 'articles_pending' AND policyname = 'authenticated_read') THEN
                CREATE POLICY authenticated_read ON basededados.articles_pending FOR SELECT TO authenticated USING (true);
              END IF;
              IF NOT EXISTS (SELECT 1 FROM pg_policies WHERE schemaname = 'basededados' AND tablename = 'articles_pending' AND policyname = 'authenticated_delete') THEN
                CREATE POLICY authenticated_delete ON basededados.articles_pending FOR DELETE TO authenticated USING (true);
              END IF;
            END $$;
            SQL

            echo "--- garantir políticas de escrita em articles (publicar/editar notícias do painel) ---"
            cat <<'SQL' | docker exec -i "$CONTAINER" psql -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1
            DO $$
            BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_policies WHERE schemaname = 'basededados' AND tablename = 'articles' AND policyname = 'authenticated_insert') THEN
                CREATE POLICY authenticated_insert ON basededados.articles FOR INSERT TO authenticated WITH CHECK (true);
              END IF;
              IF NOT EXISTS (SELECT 1 FROM pg_policies WHERE schemaname = 'basededados' AND tablename = 'articles' AND policyname = 'authenticated_update') THEN
                CREATE POLICY authenticated_update ON basededados.articles FOR UPDATE TO authenticated USING (true) WITH CHECK (true);
              END IF;
              IF NOT EXISTS (SELECT 1 FROM pg_policies WHERE schemaname = 'basededados' AND tablename = 'articles' AND policyname = 'authenticated_delete') THEN
                CREATE POLICY authenticated_delete ON basededados.articles FOR DELETE TO authenticated USING (true);
              END IF;
            END $$;
            SQL

            docker exec "$CONTAINER" psql -U "$DB_USER" -d "$DB_NAME" -c "NOTIFY pgrst, 'reload schema';"

            npm ci
            npm run build
            pm2 restart basededadosagro-site || pm2 start npm --name "basededadosagro-site" -- start -- -p 3010
            pm2 save

      - name: Verificar ao vivo
        run: |
          sleep 5
          code=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 20 "https://basededadosagro.com/pt")
          echo "GET /pt -> HTTP $code"
