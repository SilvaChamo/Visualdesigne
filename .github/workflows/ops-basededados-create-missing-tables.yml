name: Ops — criar as 14 tabelas em falta no schema basededados

# Execução manual só. Última peça da migração de basededadosagro.com: 14
# tabelas existiam na origem mas nunca foram criadas no destino durante o
# rebuild "por arqueologia de código" de 2026-08-09 (roles, capabilities,
# role_redirects, role_capabilities, role_menu_visibility, news,
# baseagrodata_news, entrecampos_news, plant_collection,
# category_site_mapping, video_ads, plans, stores, produtos). Aplica
# scripts/basededados-create-missing-tables.sql — aditivo/idempotente,
# respeita a ordem de dependências (roles/capabilities antes de quem as
# referencia).
on:
  workflow_dispatch:

jobs:
  create-tables:
    name: Criar tabelas via psql
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copiar o ficheiro SQL para o servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          source: "scripts/basededados-create-missing-tables.sql"
          target: "/root/"
          strip_components: 1

      - name: Aplicar a migração via psql
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            CONTAINER=$(docker ps --format '{{.Names}}' | grep -iE 'supabase.*db|supabase-db|postgres' | head -n1)
            DB_USER=$(docker exec "$CONTAINER" printenv POSTGRES_USER 2>/dev/null || echo postgres)
            DB_NAME=$(docker exec "$CONTAINER" printenv POSTGRES_DB 2>/dev/null || echo postgres)

            cat /root/basededados-create-missing-tables.sql | docker exec -i "$CONTAINER" psql -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1

            echo "--- Confirmação: tabelas do schema basededados agora ---"
            docker exec "$CONTAINER" psql -U "$DB_USER" -d "$DB_NAME" -t -c \
              "select count(*) from pg_tables where schemaname = 'basededados';"

            rm -f /root/basededados-create-missing-tables.sql
