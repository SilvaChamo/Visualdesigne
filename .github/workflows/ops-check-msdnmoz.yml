name: 'ops: verificar msdn-moz.org no Hetzner (so-leitura)'

on:
  workflow_dispatch: {}

jobs:
  hetzner:
    name: Hetzner - localizar site e BD
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            echo "----- pasta do site -----"
            find /home/oshercollective/domains/msdn-moz.org -maxdepth 2 2>/dev/null
            echo "----- wp-config.php -----"
            WPC=$(find /home/oshercollective/domains/msdn-moz.org -maxdepth 3 -iname "wp-config.php" 2>/dev/null | head -1)
            echo "encontrado: $WPC"
            [ -n "$WPC" ] && grep -E "DB_NAME|DB_USER|DB_HOST" "$WPC"
            echo "----- tamanho public_html -----"
            [ -n "$WPC" ] && du -sh "$(dirname "$WPC")"
            echo "----- contas de email do domínio -----"
            find /home/oshercollective/imap/msdn-moz.org -maxdepth 1 2>/dev/null
