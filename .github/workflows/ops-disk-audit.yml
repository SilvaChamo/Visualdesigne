name: ops - disk audit (Hetzner vs Contabo)

on:
  workflow_dispatch:

jobs:
  hetzner:
    name: Hetzner disk usage
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            echo "----- df -h -----"
            df -h /
            echo "----- app dir -----"
            du -sh /opt/visualdesign-site 2>/dev/null
            echo "----- docker system df -----"
            docker system df -v 2>/dev/null | head -60
            echo "----- supabase-storage mount -----"
            SRC=$(docker inspect -f '{{ range .Mounts }}{{ .Source }}{{println}}{{end}}' supabase-storage 2>/dev/null | grep -v '^$' | head -1)
            echo "mount: $SRC"
            [ -n "$SRC" ] && du -sh "$SRC" 2>/dev/null
            echo "----- supabase-db mount -----"
            SRC2=$(docker inspect -f '{{ range .Mounts }}{{ .Source }}{{println}}{{end}}' supabase-db 2>/dev/null | grep -v '^$' | head -1)
            echo "mount: $SRC2"
            [ -n "$SRC2" ] && du -sh "$SRC2" 2>/dev/null
            echo "----- total docker dir -----"
            du -sh /var/lib/docker 2>/dev/null

  contabo:
    name: Contabo disk usage
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          script: |
            echo "----- df -h -----"
            df -h /
            echo "----- free -h -----"
            free -h
            echo "----- app dir -----"
            du -sh /opt/visualdesign-site-teste 2>/dev/null
            echo "----- hestia data dir -----"
            du -sh /home 2>/dev/null
            echo "----- top level du -----"
            du -sh /* 2>/dev/null | sort -rh | head -15
