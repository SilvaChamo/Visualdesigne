name: 'ops: repor password do vdadmin no Hestia (Contabo)'

on:
  workflow_dispatch: {}

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          script: |
            H=/usr/local/hestia/bin
            NEWPASS="VisualDesign-$(date +%Y)-$(openssl rand -hex 3)"
            $H/v-change-user-password vdadmin "$NEWPASS"
            echo "----- login -----"
            echo "utilizador: vdadmin"
            echo "password: $NEWPASS"
            echo "painel: https://${{ secrets.CONTABO_HOST }}:8083"
