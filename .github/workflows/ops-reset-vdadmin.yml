name: 'ops: repor password do vdadmin no Hestia (Contabo) - escolhida pelo utilizador'

on:
  workflow_dispatch: {}

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          script: |
            H=/usr/local/hestia/bin
            $H/v-change-user-password vdadmin 'Administrador-hest2026'
            echo "password do vdadmin alterada com sucesso"
