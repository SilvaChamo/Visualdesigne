name: 'ops: verificar emails reais (Hetzner) + webmail no Hestia (so-leitura)'

on:
  workflow_dispatch: {}

jobs:
  hetzner-emails:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            for D in msdn-moz.org lirandzojewelry.com oshercollective.com; do
              echo "===== $D ====="
              find /home/oshercollective/imap/$D -maxdepth 1 2>/dev/null
              du -sh /home/oshercollective/imap/$D 2>/dev/null
              echo ""
            done

  contabo-webmail:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          script: |
            echo "----- pacotes/addons de webmail instalados -----"
            dpkg -l | grep -i "roundcube\|webmail" || echo "nada via dpkg"
            find / -maxdepth 4 -iname "*roundcube*" 2>/dev/null
            echo "----- config de mail do Hestia -----"
            /usr/local/hestia/bin/v-list-sys-config plain 2>/dev/null | grep -i "webmail\|mail" || true
            cat /usr/local/hestia/conf/hestia.conf 2>/dev/null | grep -i webmail
            echo "----- contas de mail existentes p/ oshercollective -----"
            /usr/local/hestia/bin/v-list-mail-domains oshercollective plain 2>/dev/null || echo "nenhum domínio de email ainda"
