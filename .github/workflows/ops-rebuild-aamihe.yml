name: "Ops - Reconstruir aamihe.com LIMPO no Contabo"

# ============================================================================
# Constroi uma instalacao WordPress LIMPA de aamihe.com no Contabo:
#  - Hetzner: SO LEITURA (exporta BD + uploads + plugin pro-elements). Nunca escrito.
#  - Runner: limpa (remove .php de uploads, verifica pro-elements).
#  - Contabo: guarda a copia infectada em public_html.infected-<ts> (nao apaga),
#    poe WordPress oficial novo + plugins de origem + BD limpa (sem wp_postadmin),
#    .htaccess novo, salts novos.
#  - Verifica com verify-checksums e testa a resposta HTTP local.
# NAO mexe em DNS. NAO mexe no Hetzner. Ver conversa 2026-09-06.
# ============================================================================

on:
  workflow_dispatch:

jobs:
  rebuild:
    name: reconstruir aamihe.com
    runs-on: ubuntu-latest
    steps:
      - name: Ferramentas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rsync sshpass mariadb-client php-cli php-mysql unzip curl
          curl -sS -o /tmp/wp https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp
          /tmp/wp --info --allow-root | head -5

      - name: Acessos
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT }}
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
          CONTABO_ROOT_PASSWORD: ${{ secrets.CONTABO_ROOT_PASSWORD }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$HETZNER_SSH_KEY" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          printf '%s' "$CONTABO_ROOT_PASSWORD" > ~/.copw
          chmod 600 ~/.copw
          ssh-keyscan -p "$HETZNER_PORT" "$HETZNER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh-keyscan "$CONTABO_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: "1) Exportar do Hetzner (so leitura) + limpar no runner"
        shell: bash --noprofile --norc {0}
        env:
          HETZNER_PORT: ${{ secrets.HETZNER_PORT }}
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
        run: |
          set +e
          SRC=/home/admin/domains/aamihe.com/public_html
          HE="ssh -i $HOME/.ssh/hetzner -p $HETZNER_PORT -o StrictHostKeyChecking=accept-new -o BatchMode=yes $HETZNER_USER@$HETZNER_HOST"
          HRS="ssh -i $HOME/.ssh/hetzner -p $HETZNER_PORT -o StrictHostKeyChecking=accept-new -o BatchMode=yes"

          echo "== credenciais BD do Hetzner (so para exportar) =="
          DBN=$($HE "grep -oP \"DB_NAME',\s*'\K[^']+\" $SRC/wp-config.php")
          DBU=$($HE "grep -oP \"DB_USER',\s*'\K[^']+\" $SRC/wp-config.php")
          DBP=$($HE "grep -oP \"DB_PASSWORD',\s*'\K[^']+\" $SRC/wp-config.php")
          echo "db=$DBN user=$DBU"
          [ -z "$DBN" ] && { echo "FALHOU ler wp-config"; exit 1; }

          echo "== dump da BD =="
          $HE "mysqldump --no-tablespaces --single-transaction --default-character-set=utf8 -u'$DBU' -p'$DBP' '$DBN'" > aamihe.sql 2>dump.err
          if [ ! -s aamihe.sql ]; then echo "DUMP VAZIO:"; cat dump.err; exit 1; fi
          echo "  aamihe.sql: $(wc -c < aamihe.sql) bytes, $(grep -c 'CREATE TABLE' aamihe.sql) tabelas"

          echo "== uploads (so media) =="
          mkdir -p uploads
          rsync -a --timeout=300 -e "$HRS" \
            --exclude='*.php' --exclude='*.phtml' --exclude='*.pht' --exclude='*.php5' --exclude='*.suspected' \
            "$HETZNER_USER@$HETZNER_HOST:$SRC/wp-content/uploads/" uploads/
          echo "  uploads: $(du -sh uploads | cut -f1), $(find uploads -type f | wc -l) ficheiros"
          echo "  .php restantes em uploads (deve ser 0): $(find uploads -name '*.php' | wc -l)"

          echo "== pro-elements (plugin fora do repo - vamos verificar) =="
          mkdir -p pe
          rsync -a --timeout=180 -e "$HRS" "$HETZNER_USER@$HETZNER_HOST:$SRC/wp-content/plugins/pro-elements/" pe/
          echo "  ficheiros php: $(find pe -name '*.php' | wc -l)"
          echo "  -- assinaturas suspeitas em pro-elements --"
          SUS=$(grep -rlEi '\b(eval|assert|gzinflate|str_rot13|system|shell_exec|passthru|base64_decode\s*\(\s*\$)|\\\\x[0-9a-f]{2}\\\\x[0-9a-f]{2}|FilesMan|WSO |c99sh|preg_replace\s*\(.*/e' pe/ 2>/dev/null | head -20)
          if [ -n "$SUS" ]; then
            echo "  !!! SUSPEITO em: $SUS"
            echo "PE_OK=no" >> "$GITHUB_ENV"
          else
            echo "  pro-elements limpo (sem assinaturas obvias)"
            echo "PE_OK=yes" >> "$GITHUB_ENV"
          fi

          echo "PE_OK final: $(grep PE_OK "$GITHUB_ENV")"

      - name: "2) Reconstruir no Contabo"
        shell: bash --noprofile --norc {0}
        env:
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
        run: |
          set +e
          IP="$CONTABO_HOST"
          SSHO="-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ControlMaster=auto -o ControlPath=$HOME/.ssh/cm-%C -o ControlPersist=300"
          co() { sshpass -f ~/.copw ssh $SSHO -n "root@$IP" "$@" </dev/null; }
          cors() { sshpass -f ~/.copw rsync -a --timeout=300 -e "ssh $SSHO" "$@"; }
          D=/home/aamihe/web/aamihe.com/public_html
          WP="php /usr/local/bin/wp --path=$D --allow-root"
          TS=$(date +%Y%m%d-%H%M%S)

          echo "== garantir php + wp-cli no Contabo =="
          co "command -v php >/dev/null || ln -sf \$(ls -v /usr/bin/php8* /opt/php*/bin/php 2>/dev/null | tail -1) /usr/local/bin/php; php -v | head -1"
          co "test -s /usr/local/bin/wp || curl -fsSL -o /usr/local/bin/wp https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar; chmod +x /usr/local/bin/wp; php /usr/local/bin/wp --info 2>&1 | head -4"

          echo "== ler password da BD Contabo da copia actual (antes de a arrumar) =="
          CDBP=$(co "grep -oP \"DB_PASSWORD',\s*'\K[^']+\" $D/wp-config.php" | tr -d '\r')
          CDBN=$(co "grep -oP \"DB_NAME',\s*'\K[^']+\" $D/wp-config.php" | tr -d '\r')
          CDBU=$(co "grep -oP \"DB_USER',\s*'\K[^']+\" $D/wp-config.php" | tr -d '\r')
          echo "  contabo db=$CDBN user=$CDBU"
          [ -z "$CDBN" ] && { echo "FALHOU ler wp-config do Contabo"; exit 1; }

          echo "== arrumar a copia infectada (NAO apaga) =="
          co "mv $D ${D}.infected-$TS && mkdir -p $D && chown aamihe:aamihe $D"

          echo "== WordPress oficial novo (tenta 7.1 pt_PT, senao a versao actual) =="
          co "$WP core download --version=7.1 --locale=pt_PT --force" || co "$WP core download --locale=pt_PT --force" || co "$WP core download --force"

          echo "== wp-config novo (prefixo Aimes_, credenciais Contabo) =="
          co "$WP config create --dbname='$CDBN' --dbuser='$CDBU' --dbpass='$CDBP' --dbprefix='Aimes_' --dbcharset=utf8 --locale=pt_PT --force --skip-check"
          co "$WP config set WP_CACHE false --raw --type=constant"
          co "$WP config set DISALLOW_FILE_EDIT true --raw --type=constant"
          co "$WP config set WP_AUTO_UPDATE_CORE minor --type=constant"
          co "$WP config shuffle-salts"

          echo "== BD: importar a BD limpa do Hetzner (o dump traz DROP TABLE IF EXISTS) =="
          co "$WP db tables --all-tables --format=count || true"
          co "$WP db query 'SET FOREIGN_KEY_CHECKS=0' || true"
          cors aamihe.sql "root@$IP:/root/aamihe.sql"
          co "$WP db import /root/aamihe.sql && rm -f /root/aamihe.sql"
          co "$WP core update-db"
          echo "  tabelas depois do import:"; co "$WP db tables --all-tables --format=count"

          echo "== siteurl/home + apagar utilizador falso wp_postadmin =="
          co "$WP option update home 'https://aamihe.com'"
          co "$WP option update siteurl 'https://aamihe.com'"
          co "$WP user list --field=user_login | grep -qx wp_postadmin && $WP user delete wp_postadmin --reassign=1 --yes || echo 'wp_postadmin ja nao existe'"

          echo "== plugins oficiais (do repo WordPress) =="
          for spec in \
            automatic-translate-addon-for-translatepress:2.0.8 \
            auto-image-download-button:2.2.2 \
            drag-and-drop-file-upload-for-elementor-forms:1.6.1 \
            elementor:4.2.4 \
            icon-element:2.0.8 \
            loginpress:6.2.5 \
            ocean-extra:2.5.9 \
            redis-cache:2.8.0 \
            translatepress-multilingual:3.3.4 \
            wp-optimize:4.6.1 \
            honeypot:2.4.02 \
            amazon-s3-and-cloudfront:3.3.1 ; do
            n="${spec%%:*}"; v="${spec##*:}"
            co "$WP plugin install $n --version=$v --force" || co "$WP plugin install $n --force" || echo "  FALHOU $n"
          done

          echo "== tema OceanWP oficial =="
          co "$WP theme install oceanwp --force && $WP theme activate oceanwp"

          echo "== pro-elements: PE_OK=$PE_OK =="
          if [ "$PE_OK" = "yes" ]; then
            co "mkdir -p $D/wp-content/plugins/pro-elements"
            cors pe/ "root@$IP:$D/wp-content/plugins/pro-elements/"
            co "$WP plugin activate pro-elements || echo '  (nao activou pro-elements)'"
          else
            echo "  pro-elements NAO instalado (assinaturas suspeitas). Site fica sem widgets Pro ate decidires."
          fi

          echo "== uploads limpos =="
          co "mkdir -p $D/wp-content/uploads"
          cors uploads/ "root@$IP:$D/wp-content/uploads/"

          echo "== .htaccess novo (padrao WordPress, via base64) =="
          co "echo  | base64 -d > $D/.htaccess"

          echo "== activar plugins + limpar caches + dono =="
          co "$WP plugin activate automatic-translate-addon-for-translatepress auto-image-download-button drag-and-drop-file-upload-for-elementor-forms elementor icon-element loginpress ocean-extra redis-cache translatepress-multilingual wp-optimize honeypot amazon-s3-and-cloudfront || true"
          co "$WP rewrite flush --hard; $WP cache flush || true"
          co "chown -R aamihe:aamihe $D && find $D -type d -exec chmod 755 {} \; && find $D -type f -exec chmod 644 {} \;"

      - name: "3) Verificar que ficou limpo e responde bem"
        shell: bash --noprofile --norc {0}
        env:
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
        run: |
          set +e
          IP="$CONTABO_HOST"
          SSHO="-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ControlMaster=auto -o ControlPath=$HOME/.ssh/cm-%C -o ControlPersist=120"
          co() { sshpass -f ~/.copw ssh $SSHO -n "root@$IP" "$@" </dev/null; }
          D=/home/aamihe/web/aamihe.com/public_html
          WP="php /usr/local/bin/wp --path=$D --allow-root"
          echo "===== verify-checksums do nucleo (deve passar) ====="
          co "$WP core verify-checksums" 2>&1
          echo "===== verify-checksums dos plugins ====="
          co "$WP plugin verify-checksums --all" 2>&1 | tail -20
          echo "===== utilizadores (nao deve ter wp_postadmin) ====="
          co "$WP user list --fields=ID,user_login,user_email,roles" 2>&1
          echo "===== ficheiros suspeitos que sobraram? ====="
          co "find $D -maxdepth 3 -iname 'ms-*.php' -o -iname 'filefuns.php*' -o -iname '.ms_*' -o -iname 'cache.php' 2>/dev/null | head" 2>&1
          co "ls -la $D/wp-content/mu-plugins/ 2>/dev/null" 2>&1
          echo "===== resposta HTTP local (Host: aamihe.com) - NAO deve redireccionar p/ spam ====="
          co "curl -sSI -m 15 -H 'Host: aamihe.com' http://127.0.0.1/ 2>&1 | grep -iE 'HTTP/|location|x-medusa|x-robots' | head"
          co "curl -sSI -m 15 -H 'Host: aamihe.com' http://127.0.0.1/wp-login.php 2>&1 | grep -iE 'HTTP/|location' | head"
          echo "===== a copia infectada ficou guardada em: ====="
          co "ls -d ${D}.infected-* 2>/dev/null"
          echo "FEITO."
