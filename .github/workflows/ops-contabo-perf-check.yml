name: "Ops - Avaliacao de desempenho Contabo vs Hetzner (SO LEITURA)"

# ============================================================================
# SO LEITURA. Nenhum comando altera nada. Objectivo: perceber se o Contabo
# aguenta carga de producao (a carga ~8 vista na auditoria anterior foi medida
# durante os proprios 'du -sh' recursivos dessa auditoria - aqui medimos com o
# servidor em repouso e comparamos com a carga real do Hetzner, que hoje serve
# toda a producao). Ver conversa 2026-09-05.
# ============================================================================

on:
  workflow_dispatch:

jobs:
  contabo:
    name: contabo (repouso - so leitura)
    runs-on: ubuntu-latest
    steps:
      - name: "Desempenho detalhado do Contabo"
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          password: ${{ secrets.CONTABO_ROOT_PASSWORD }}
          command_timeout: 15m
          script: |
            set +e
            echo "############ CONTABO - DESEMPENHO ############"
            echo
            echo "===== CPUs / modelo ====="
            nproc; lscpu 2>/dev/null | grep -E '^CPU\(s\)|Model name|Thread|Core|MHz|Hypervisor|Virtual'
            echo
            echo "===== carga AGORA (servidor em repouso) ====="
            cat /proc/loadavg; uptime
            echo
            echo "===== 25 processos que mais CPU usam ====="
            ps -eo pid,ppid,pcpu,pmem,etimes,rss,user,comm --sort=-pcpu | head -26
            echo
            echo "===== 15 processos que mais RAM usam ====="
            ps -eo pid,pcpu,pmem,rss,user,comm --sort=-pmem | head -16
            echo
            echo "===== memoria / swap ====="
            free -h
            grep -E 'MemTotal|MemAvailable|Committed_AS|SwapTotal|SwapFree|Dirty|Writeback' /proc/meminfo
            echo "-- swap usado por processo (top 12) --"
            for f in /proc/[0-9]*/status; do awk '/^Name:/{n=$2}/^VmSwap:/{if($2+0>0)print $2" kB\t"n}' "$f"; done 2>/dev/null | sort -rn | head -12
            echo
            echo "===== docker stats (stack Supabase) ====="
            docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemPerc}}\t{{.MemUsage}}' 2>&1
            echo
            echo "===== pm2 (cpu / mem / reinicios / estado) ====="
            pm2 jlist 2>/dev/null | python3 -c "import sys,json;
d=json.load(sys.stdin)
for p in d:
    m=p.get('monit',{}); e=p.get('pm2_env',{})
    print(p['name'], '| cpu', m.get('cpu'), '% | mem', round(m.get('memory',0)/1048576), 'MB | reinicios', e.get('restart_time'), '| estado', e.get('status'), '| uptime_s', (e.get('pm_uptime') and 'ver_pm2'))" 2>&1
            pm2 list 2>&1
            echo
            echo "===== vmstat 6x1s  (r=fila CPU  b=bloqueados  wa=espera-disco  si/so=swap) ====="
            vmstat 1 6
            echo
            echo "===== mpstat por core (3x1s) ====="
            mpstat -P ALL 1 3 2>&1 | tail -40
            echo
            echo "===== iostat discos (3x1s) ====="
            iostat -x 1 3 2>&1 | tail -50
            echo
            echo "===== HISTORICO DE HOJE - carga (sar -q) ====="
            sar -q 2>&1 | tail -50
            echo
            echo "===== HISTORICO DE HOJE - CPU %use / %iowait (sar -u) ====="
            sar -u 2>&1 | tail -50
            echo
            echo "===== HISTORICO DE HOJE - RAM (sar -r) ====="
            sar -r 2>&1 | tail -25
            echo "===== HISTORICO DE HOJE - swap in/out (sar -W) ====="
            sar -W 2>&1 | tail -25
            echo
            echo "===== OOM killer / travamentos no kernel (recentes) ====="
            dmesg -T 2>/dev/null | grep -iE 'oom|killed process|out of memory|blocked for more than|hung task|soft lockup' | tail -25
            echo
            echo "===== MariaDB estado + queries a decorrer ====="
            mysqladmin status 2>&1
            mysqladmin processlist 2>&1 | head -25
            echo
            echo "===== ligacoes de rede (resumo) ====="
            ss -s 2>&1
            echo
            echo "===== servicos por consumo (systemd-cgtop) ====="
            systemd-cgtop -n1 --depth=3 2>&1 | head -30
            echo
            echo "===== algum build / npm / next a decorrer agora? ====="
            ps aux | grep -E 'npm |next build|webpack|node .*build' | grep -v grep
            echo
            echo "===== disco: espaco + inodes ====="
            df -h / ; df -i /
            echo
            echo "===== tempo de resposta real do site/painel (local, 3x) ====="
            for i in 1 2 3; do curl -s -o /dev/null -w "  tentativa $i: %{http_code} em %{time_total}s\n" -H "Host: teste.visualdesignmoz.com" http://127.0.0.1:3002/ ; done
            for i in 1 2 3; do curl -s -o /dev/null -w "  basededadosagro tentativa $i: %{http_code} em %{time_total}s\n" http://127.0.0.1:3010/ ; done

  hetzner:
    name: hetzner (baseline de producao real - so leitura)
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: "Baseline: quanta carga a producao real faz hoje no Hetzner"
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 10m
          script: |
            set +e
            echo "############ HETZNER - BASELINE DE PRODUCAO ############"
            echo "===== CPUs / modelo ====="
            nproc; lscpu 2>/dev/null | grep -E '^CPU\(s\)|Model name|Hypervisor|Virtual'
            echo
            echo "===== carga AGORA (isto ja carrega toda a producao) ====="
            cat /proc/loadavg; uptime
            echo
            echo "===== 20 processos que mais CPU usam ====="
            ps -eo pid,pcpu,pmem,rss,user,comm --sort=-pcpu | head -21
            echo
            echo "===== memoria / swap ====="
            free -h
            echo
            echo "===== HISTORICO DE HOJE - carga (sar -q) ====="
            sar -q 2>&1 | tail -50
            echo
            echo "===== HISTORICO DE HOJE - CPU %use / %iowait (sar -u) ====="
            sar -u 2>&1 | tail -50
            echo
            echo "===== HISTORICO DE HOJE - swap in/out (sar -W) ====="
            sar -W 2>&1 | tail -20
            echo
            echo "===== docker stats (stack Supabase original) ====="
            docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemPerc}}\t{{.MemUsage}}' 2>&1
            echo
            echo "===== pico de carga nos ultimos 7 dias (sar -q dos ficheiros diarios) ====="
            for f in /var/log/sysstat/sa[0-9]* /var/log/sa/sa[0-9]*; do [ -f "$f" ] && echo "--- $f ---" && sar -q -f "$f" 2>/dev/null | awk 'NR>3 && $6!="" {print $6}' | sort -rn | head -1; done
