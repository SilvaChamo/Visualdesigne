name: Ops — corrigir links partidos em basededadosagro.com

# Execução manual só. basededadosagro.com é uma app Next.js separada deste
# repositório (PM2 "basededadosagro-site", porta 3010, /opt/basededadosagro-site
# no Hetzner, sem .git no servidor) — auditoria ao vivo em 2026-08-10
# encontrou 3 classes de link partido, corrigidas aqui via sed directo nos
# ficheiros fonte, seguido de rebuild + restart do PM2:
#
# 1) 15 ocorrências de /login (deveria ser /auth/login) em 12 ficheiros —
#    incluindo o redirect de autenticação do admin e do dashboard do
#    utilizador, ou seja, hoje NINGUÉM chega ao login a partir desses sítios.
#    (Nota: a 1ª tentativa desta automação, 2026-08-10, só cobria 13/10 —
#    o próprio passo de confirmação abaixo travou a tempo, sem tocar em nada,
#    ao encontrar mais 2 ficheiros com /login em aspas simples que a
#    auditoria inicial não apanhou. Corrigido, ver lista completa abaixo.)
# 2) /servicos/talentos (não existe) -> /servicos, em 2 ficheiros.
# 3) /mercado/produtores, /mercado/fornecedores, /mercado/consumidores (mega-
#    menu "Mercado", páginas nunca construídas) -> /mercado.
# 4) /sobre-aplicativo (badge flutuante, página nunca construída) -> /sobre-nos.
#
# Cada ficheiro fica com uma cópia .bak-linkfix-YYYYMMDD ao lado antes da
# alteração, para reverter à mão se algo correr mal.
on:
  workflow_dispatch:

jobs:
  fix-and-restart:
    name: Corrigir links, rebuild e reiniciar basededadosagro-site
    runs-on: ubuntu-latest
    steps:
      - name: Aplicar correcções via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /opt/basededadosagro-site
            STAMP=$(date +%Y%m%d-%H%M%S)

            fix_login() {
              local f="$1"
              cp "$f" "$f.bak-linkfix-$STAMP"
              perl -pi -e 's{([("\x27`])/login(["\x27`?])}{$1/auth/login$2}g' "$f"
            }

            fix_login "app/[locale]/admin/layout.tsx"
            fix_login "app/[locale]/design-system/registo-simples/page.tsx"
            fix_login "app/[locale]/usuario/layout.tsx"
            fix_login "app/[locale]/usuario/dashboard/page.tsx"
            fix_login "app/[locale]/usuario/dashboard/meu-perfil/page.tsx"
            fix_login "app/[locale]/inovacao/vantagens-cadastro/page.tsx"
            fix_login "app/[locale]/destaque/page.tsx"
            fix_login "app/[locale]/checkout/registro/page.tsx"
            fix_login "app/[locale]/forum/topic/[topicId]/page.tsx"
            fix_login "app/[locale]/forum/novo-topico/page.tsx"
            fix_login "components/Footer.tsx"
            fix_login "components/admin/AdminShell.tsx"

            F="components/ProfessionalRegistrationForm.tsx"
            cp "$F" "$F.bak-linkfix-$STAMP"
            perl -pi -e 's{/servicos/talentos}{/servicos}g' "$F"

            F="app/[locale]/servicos/registo-talento/page.tsx"
            cp "$F" "$F.bak-linkfix-$STAMP"
            perl -pi -e 's{/servicos/talentos}{/servicos}g' "$F"

            F="components/MarketMegaMenu.tsx"
            cp "$F" "$F.bak-linkfix-$STAMP"
            perl -pi -e 's{/mercado/produtores}{/mercado}g; s{/mercado/fornecedores}{/mercado}g; s{/mercado/consumidores}{/mercado}g;' "$F"

            F="components/MobileAppSection.tsx"
            cp "$F" "$F.bak-linkfix-$STAMP"
            perl -pi -e 's{/sobre-aplicativo}{/sobre-nos}g' "$F"

            echo "--- confirmação: nenhum link por corrigir sobrou ---"
            LEFTOVER=$(find . -path ./node_modules -prune -o -path ./.next -prune -o -name '*.tsx' -print \
              | xargs perl -nle 'print "$ARGV:$.: $_" if /([("\x27`])\/login["\x27`?]/ && !/auth\/login/' 2>/dev/null || true)
            LEFTOVER="$LEFTOVER$(find . -path ./node_modules -prune -o -path ./.next -prune -o -name '*.tsx' -print \
              | xargs grep -n 'servicos/talentos\|mercado/produtores\|mercado/fornecedores\|mercado/consumidores\|href="/sobre-aplicativo"' 2>/dev/null || true)"
            if [ -n "$LEFTOVER" ]; then
              echo "Ficou por corrigir:"
              echo "$LEFTOVER"
              exit 1
            fi
            echo "OK, tudo corrigido."

            echo "--- rebuild ---"
            npm ci
            npm run build

            echo "--- restart ---"
            pm2 restart basededadosagro-site
            pm2 save

      - name: Verificar ao vivo que os links deixaram de dar 404
        run: |
          sleep 5
          for path in "/pt/mercado" "/pt/sobre-nos" "/pt/servicos" "/pt/auth/login"; do
            code=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 20 "https://basededadosagro.com${path}")
            echo "$path -> HTTP $code"
          done
