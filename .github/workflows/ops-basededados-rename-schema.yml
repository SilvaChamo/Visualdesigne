name: Ops — renomear schema baseagrodata para basededados

# Execução manual só. O código do site (e o domínio) passaram de
# "baseagrodata"/"baseagrodata.com" para "basededados"/"basededadosagro.com"
# depois de o schema já ter sido criado (ver ops-baseagrodata-schema-rebuild.yml,
# corrido com sucesso em 2026-08-09, 33 tabelas). Em vez de recriar tudo,
# só renomeia o schema existente e actualiza a exposição do PostgREST.
on:
  workflow_dispatch:

jobs:
  renomear-schema:
    name: ALTER SCHEMA baseagrodata RENAME TO basededados
    runs-on: ubuntu-latest
    steps:
      - name: Renomear via psql
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            CONTAINER=$(docker ps --format '{{.Names}}' | grep -iE 'supabase.*db|supabase-db|postgres' | head -n1)
            DB_USER=$(docker exec "$CONTAINER" printenv POSTGRES_USER 2>/dev/null || echo postgres)
            DB_NAME=$(docker exec "$CONTAINER" printenv POSTGRES_DB 2>/dev/null || echo postgres)

            docker exec "$CONTAINER" psql -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 -c \
              "ALTER SCHEMA baseagrodata RENAME TO basededados;"

            echo "--- Confirmação ---"
            docker exec "$CONTAINER" psql -U "$DB_USER" -d "$DB_NAME" -t -c \
              "select count(*) from pg_tables where schemaname = 'basededados';"

            docker exec "$CONTAINER" psql -U "$DB_USER" -d "$DB_NAME" -c "NOTIFY pgrst, 'reload schema';"

  actualizar-postgrest:
    name: Trocar "baseagrodata" por "basededados" no PostgREST
    runs-on: ubuntu-latest
    needs: renomear-schema
    steps:
      - name: Editar .env e recriar o serviço rest
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            ENV_FILE="/opt/supabase-aamihe/docker/.env"
            cp "$ENV_FILE" "${ENV_FILE}.bak-rename-basededados-$(date +%s)"

            sed -i 's/baseagrodata/basededados/' "$ENV_FILE"
            grep '^PGRST_DB_SCHEMAS=' "$ENV_FILE"

            cd /opt/supabase-aamihe/docker
            docker compose up -d rest

            sleep 5
            echo "--- Confirmar que o painel continua a responder ---"
            curl -sk -o /dev/null -w "supabase.visualdesignmoz.com (auth health) -> HTTP %{http_code}\n" https://supabase.visualdesignmoz.com/auth/v1/health
            curl -sk -o /dev/null -w "visualdesignmoz.com -> HTTP %{http_code}\n" https://visualdesignmoz.com
