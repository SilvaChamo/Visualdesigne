name: Ops — corrigir colunas em falta no schema basededados (parte 2)

# Execução manual só. Continuação de ops-basededados-fix-columns.yml, que
# parou a meio: "integrations" já tem PK em "provider", não "id" — tentar
# adicionar uma segunda PK é inválido. Aplica scripts/basededados-fix-missing-columns-part2.sql
# (id simples sem PK) e repete os 2 passos finais que nunca chegaram a correr.
on:
  workflow_dispatch:

jobs:
  fix-columns-part2:
    name: Aplicar parte 2 via psql
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copiar o ficheiro SQL para o servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          source: "scripts/basededados-fix-missing-columns-part2.sql"
          target: "/root/"
          strip_components: 1

      - name: Aplicar a migração via psql
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            CONTAINER=$(docker ps --format '{{.Names}}' | grep -iE 'supabase.*db|supabase-db|postgres' | head -n1)
            DB_USER=$(docker exec "$CONTAINER" printenv POSTGRES_USER 2>/dev/null || echo postgres)
            DB_NAME=$(docker exec "$CONTAINER" printenv POSTGRES_DB 2>/dev/null || echo postgres)

            cat /root/basededados-fix-missing-columns-part2.sql | docker exec -i "$CONTAINER" psql -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1

            echo "--- Confirmação: integrations.id e limpeza de seeds ---"
            docker exec "$CONTAINER" psql -U "$DB_USER" -d "$DB_NAME" -t -c \
              "select column_name from information_schema.columns where table_schema='basededados' and table_name='integrations' order by column_name;"
            docker exec "$CONTAINER" psql -U "$DB_USER" -d "$DB_NAME" -t -c \
              "select count(*) as forum_categories_restantes from basededados.forum_categories;"
            docker exec "$CONTAINER" psql -U "$DB_USER" -d "$DB_NAME" -t -c \
              "select count(*) as services_restantes from basededados.services;"

            rm -f /root/basededados-fix-missing-columns-part2.sql
