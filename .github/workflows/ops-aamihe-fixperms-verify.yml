name: "Ops - aamihe.com Contabo: permissoes + verificacao final"

# Fecha a reconstruccao: dono aamihe:aamihe, permissoes 755/644, e verifica
# (verify-checksums, utilizadores, ficheiros suspeitos, resposta HTTP local).
# Nao mexe em DNS. Nao mexe no Hetzner.

on:
  workflow_dispatch:

jobs:
  finish:
    name: permissoes + verificar
    runs-on: ubuntu-latest
    steps:
      - name: Acesso Contabo
        env:
          CONTABO_ROOT_PASSWORD: ${{ secrets.CONTABO_ROOT_PASSWORD }}
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          mkdir -p ~/.ssh
          printf '%s' "$CONTABO_ROOT_PASSWORD" > ~/.copw && chmod 600 ~/.copw
          ssh-keyscan "$CONTABO_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: "Permissoes"
        shell: bash --noprofile --norc {0}
        env:
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
        run: |
          set +e
          IP="$CONTABO_HOST"
          co() { sshpass -f ~/.copw ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -n "root@$IP" "$@" </dev/null; }
          D=/home/aamihe/web/aamihe.com/public_html
          echo "== dono aamihe:aamihe =="
          co "chown -R aamihe:aamihe $D"; echo "rc=$?"
          echo "== permissoes dirs 755 =="
          co "find $D -type d -print0 | xargs -0 -r chmod 755"; echo "rc=$?"
          echo "== permissoes ficheiros 644 =="
          co "find $D -type f -print0 | xargs -0 -r chmod 644"; echo "rc=$?"
          echo "== wp-config mais fechado (640) =="
          co "chmod 640 $D/wp-config.php"; echo "rc=$?"

      - name: "Verificacao final"
        shell: bash --noprofile --norc {0}
        env:
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
        run: |
          set +e
          IP="$CONTABO_HOST"
          co() { sshpass -f ~/.copw ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -n "root@$IP" "$@" </dev/null; }
          D=/home/aamihe/web/aamihe.com/public_html
          WP="php /usr/local/bin/wp --path=$D --allow-root"
          echo "===== verify-checksums do NUCLEO (esperado: passa limpo) ====="
          co "$WP core verify-checksums" 2>&1
          echo
          echo "===== verify-checksums dos plugins ====="
          co "$WP plugin verify-checksums --all" 2>&1 | tail -25
          echo
          echo "===== utilizadores (NAO deve haver wp_postadmin) ====="
          co "$WP user list --fields=ID,user_login,user_email,roles" 2>&1
          echo
          echo "===== ficheiros/pastas do virus que possam ter sobrado ====="
          co "find $D -maxdepth 4 \( -iname 'ms-*.php' -o -iname 'filefuns.php*' -o -iname '.ms_*' -o -iname 'cache.php' -o -iname 'gs-pkg' -o -name '.user.ini' \) 2>/dev/null | head -30"
          echo "-- mu-plugins --"
          co "ls -la $D/wp-content/mu-plugins/ 2>/dev/null"
          echo "-- .htaccess actual --"
          co "cat $D/.htaccess 2>/dev/null"
          echo
          echo "===== nº de tabelas na BD + versao WP + plugins activos ====="
          co "$WP db query 'SELECT COUNT(*) AS tabelas FROM information_schema.tables WHERE table_schema=DATABASE();' 2>&1"
          co "$WP core version 2>&1"
          co "$WP plugin list --status=active --field=name 2>&1 | tr '\n' ' '"; echo
          echo
          echo "===== RESPOSTA HTTP LOCAL (Host: aamihe.com) - nao deve redireccionar p/ spam ====="
          co "curl -sS -m 20 -D - -o /dev/null -H 'Host: aamihe.com' http://127.0.0.1/ 2>&1 | head -20"
          echo "-- wp-login --"
          co "curl -sS -m 20 -o /dev/null -w 'HTTP %{http_code}\n' -H 'Host: aamihe.com' http://127.0.0.1/wp-login.php 2>&1"
          echo
          echo "===== copia infectada guardada em: ====="
          co "ls -dl ${D}.infected-* 2>/dev/null"
