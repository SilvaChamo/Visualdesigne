name: 'ops: verificar estabilidade PM2 no Contabo após fix'

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Ver contador de reinícios
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          script: |
            pm2 describe visualdesign-site-teste | grep -iE "uptime|restart|status"
