name: 'ops: verificar hospedagem associada ao elimservicos.com (so-leitura)'

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar panel_sites
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            echo "===== colunas de panel_sites ====="
            docker exec supabase-db psql -U postgres -d postgres -c "\d public.panel_sites" 2>&1
            echo ""
            echo "===== linha para elimservicos.com ====="
            docker exec supabase-db psql -U postgres -d postgres -c "SELECT * FROM public.panel_sites WHERE domain = 'elimservicos.com';" 2>&1
