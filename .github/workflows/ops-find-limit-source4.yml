name: 'ops: consultar system.db pelo limite do oshercollective (so-leitura)'

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar system.db
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            echo "===== Tipo de ficheiro ====="
            file /usr/local/directadmin/data/admin/system.db 2>&1
            echo ""
            echo "===== Se for sqlite: tabelas ====="
            sqlite3 /usr/local/directadmin/data/admin/system.db ".tables" 2>&1
            echo ""
            echo "===== Procurar linhas com send_limit ====="
            sqlite3 /usr/local/directadmin/data/admin/system.db "SELECT name FROM sqlite_master WHERE type='table';" 2>&1
            for t in $(sqlite3 /usr/local/directadmin/data/admin/system.db ".tables" 2>/dev/null); do
              echo "--- tabela: $t ---"
              sqlite3 /usr/local/directadmin/data/admin/system.db "SELECT * FROM $t WHERE $t like '%send_limit%' OR $t like '%oshercollective%';" 2>&1 | head -3
            done
            echo ""
            echo "===== grep bruto no ficheiro (caso nao seja sqlite normal) ====="
            strings /usr/local/directadmin/data/admin/system.db 2>&1 | grep -i "send_limit" | head -20
            echo ""
            echo "===== grep bruto por oshercollective perto de send_limit ====="
            strings /usr/local/directadmin/data/admin/system.db 2>&1 | grep -i "oshercollective" | head -20
