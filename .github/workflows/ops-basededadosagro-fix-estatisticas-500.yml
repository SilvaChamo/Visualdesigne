name: Ops — corrigir erro 500 em basededadosagro.com /estatisticas

# Execução manual só. As 4 páginas /estatisticas/{producao,economia,empresas,
# emprego} davam sempre 500 (auditoria ao vivo 2026-08-10) com o erro
# DYNAMIC_SERVER_USAGE. Causa: era a ÚNICA rota [slug] de todo o site a usar
# generateStaticParams() — força pré-geração estática, mas o layout raiz usa
# next-intl (getMessages()), que precisa de contexto por-pedido, e entra em
# conflito. Como o StatsDashboard já busca os dados inteiramente no browser
# (client-side, useEffect), a pré-geração estática nunca teve necessidade de
# existir aqui — removida, a página passa a renderizar dinamicamente como
# todas as outras rotas [slug] do site (artigos, empresas, etc.), que já
# funcionam bem assim.
on:
  workflow_dispatch:

jobs:
  fix-and-restart:
    name: Remover generateStaticParams, rebuild e reiniciar
    runs-on: ubuntu-latest
    steps:
      - name: Aplicar correcção via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /opt/basededadosagro-site
            STAMP=$(date +%Y%m%d-%H%M%S)
            F="app/[locale]/estatisticas/[slug]/page.tsx"
            cp "$F" "$F.bak-500fix-$STAMP"

            perl -i -0777 -pe 's/export async function generateStaticParams\(\) \{\n    return validSlugs\.map\(\(slug: any\) => \(\{ slug \}\)\);\n\}\n\n//' "$F"

            if grep -q 'generateStaticParams' "$F"; then
              echo "ERRO: generateStaticParams ainda presente, a correcção não apanhou o padrão esperado." >&2
              diff "$F.bak-500fix-$STAMP" "$F" || true
              exit 1
            fi
            echo "--- ficheiro corrigido ---"
            cat "$F"

            echo "--- rebuild ---"
            npm ci
            npm run build

            echo "--- restart ---"
            pm2 restart basededadosagro-site
            pm2 save

      - name: Verificar ao vivo que as 4 páginas deixaram de dar 500
        run: |
          sleep 5
          for slug in producao economia empresas emprego; do
            code=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 20 "https://basededadosagro.com/pt/estatisticas/${slug}")
            echo "/pt/estatisticas/${slug} -> HTTP $code"
          done
