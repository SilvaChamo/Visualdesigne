name: Ops — instalar chave SSH dedicada para deploy do basededadosagro.com

# Execução manual. O pipeline de deploy automático do repo
# SilvaChamo/basededadosagro (.github/workflows/deploy-hetzner.yml) falha
# porque nunca teve o secret HETZNER_SSH_KEY configurado nesse repo — e
# como secrets do GitHub não podem ser lidos/copiados depois de guardados,
# gera-se aqui uma chave nova dedicada só a este propósito e instala-se a
# parte pública no servidor via o acesso SSH que já funciona (HETZNER_*
# secrets deste repo). A parte privada é adicionada como secret no outro
# repo por fora deste workflow (gh secret set).
on:
  workflow_dispatch:

jobs:
  install-key:
    name: Adicionar chave pública a authorized_keys
    runs-on: ubuntu-latest
    steps:
      - name: Instalar via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            PUBKEY="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIbSFxRA/wyCoayHB0+Fm7v4nsUdXG6tpxAYsn0JOXyg deploy-hetzner-basededadosagro"
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            touch ~/.ssh/authorized_keys
            if grep -qF "deploy-hetzner-basededadosagro" ~/.ssh/authorized_keys; then
              echo "Chave já estava instalada, nada a fazer."
            else
              echo "$PUBKEY" >> ~/.ssh/authorized_keys
              chmod 600 ~/.ssh/authorized_keys
              echo "Chave instalada."
            fi
            echo "--- confirmação (não mostra chaves privadas, só a public key nova) ---"
            grep "deploy-hetzner-basededadosagro" ~/.ssh/authorized_keys
            whoami
