name: "Ops - Confirma que o Hetzner continua intacto (só leitura)"

on:
  workflow_dispatch:

jobs:
  hetzner:
    name: hetzner
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HETZNER_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Confirma contas DirectAdmin, tamanhos e base de dados (nada é alterado)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set +e
            echo "=== DirectAdmin a correr? ==="
            systemctl is-active directadmin 2>&1 || service directadmin status 2>&1 | head -5
            echo ""
            echo "=== espaço total em disco ==="
            df -h /
            echo ""
            echo "=== contas DirectAdmin existentes (utilizadores) ==="
            ls /usr/local/directadmin/data/users/ 2>/dev/null
            echo ""
            echo "=== domínios por conta ==="
            for u in $(ls /usr/local/directadmin/data/users/ 2>/dev/null); do
              echo "--- $u ---"
              cat /usr/local/directadmin/data/users/$u/domains.list 2>/dev/null
            done
            echo ""
            echo "=== tamanho total de /home (todos os sites/emails/BDs geridos por DA) ==="
            du -sh /home 2>/dev/null
            echo ""
            echo "=== containers docker a correr (deve incluir a stack Supabase original) ==="
            docker ps --format '{{.Names}}\t{{.Status}}' 2>&1
            echo ""
            echo "=== confirma alguns domínios reais a responder ==="
            for d in oshercollective.com aamihe.com mltmark.com files.visualdesignmoz.com visualdesignmoz.com; do
              echo -n "$d: "
              curl -sSI --max-time 8 "https://$d/" 2>&1 | head -1
            done
