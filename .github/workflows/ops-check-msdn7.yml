name: 'ops: confirmar mailbox e limite real de envio (só-leitura)'

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar mailboxes e limite de envio
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            echo "===== Mailboxes reais existentes para msdn-moz.org ====="
            cat /usr/local/directadmin/data/users/oshercollective/domains/msdn-moz.org.email 2>&1
            ls /home/oshercollective/imap/msdn-moz.org/ 2>&1
            echo ""
            echo "===== Config de limite de envio (directadmin.conf) ====="
            grep -i "email_send_limit\|send_limit" /usr/local/directadmin/conf/directadmin.conf 2>&1
            echo ""
            echo "===== Quantos emails este user já enviou nesta hora (exim) ====="
            grep "U=oshercollective" /var/log/exim/mainlog 2>&1 | grep "<=" | grep "$(date '+%Y-%m-%d %H')" | wc -l
            echo ""
            echo "===== Última rejeição por limite, se houver (hoje) ====="
            grep -i "limit" /var/log/exim/mainlog 2>&1 | grep -i "oshercollective\|msdn" | tail -10
